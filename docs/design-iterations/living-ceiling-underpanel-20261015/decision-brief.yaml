iteration_id: living-ceiling-underpanel-20261015
subject: 修复圆角边吊下方整板缺失
priority:
  user_goal: 客厅中央空调设备边吊呈现完整下方板面，同时保留已声明的圆角轮廓和空调风口。
  ranked:
    - 圆角边吊下方覆盖完整，不再只显示边缘环。
    - 保持 config 中面积、厚度、R100 和 HVAC 风口坐标不变。
    - 不改变混合凹角轮廓、吊顶分区高亮及其他构件职责。
  non_negotiables:
    - 几何继续由 config/ceiling.yaml 声明，代码只按声明生成。
    - 客厅中央空调的底装风口和回风检修格栅保持可见。
    - 不改 HVAC 设计、预算、材料、施工状态或生成数据。
  tradeoffs_accepted:
    - 纯凸圆角下挂区使用完整实体挤出，代替只有 20mm 边缘宽度的空心外圈。
    - 共享 builder 的相同纯圆角分支同时修复 ceiling_master_ac。

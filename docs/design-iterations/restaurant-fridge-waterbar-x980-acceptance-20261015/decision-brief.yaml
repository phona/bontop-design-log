acceptance:
  validation_commands: [npm run gate:visual]
  browser_evidence_required: true
  required_views: [入户门内人眼视角, 西墙冰箱与干水吧, 厨房看向餐厅]
  aesthetic_review: PASS
  functional_review: BLOCKED
  construction_review: BLOCKED
  blocking_issues: [冰箱43mm实体墙后距的厂家散热/防护要求, 冰箱门扇与检修包络, 东侧椅与半高柜门操作, 干吧设备/电气/墙控可达, 六人临时南移后的吊灯/地插和真人操作]
  done_when:
    - 日常四座家具基线按已确认坐标保持；来客六座时桌椅组南移约320mm仍是临时预演；墙体和建筑配置保持不动。
    - 入口、厨房看餐厅和服务墙固定视角审美复审通过；厨房入口静态 AABB 无直接阻挡。
    - 确认实际冰箱型号后，取得准确型号安装图和净空要求；若43mm后距不满足规范则重开冰箱位置。
    - 厂家确认冰箱安装、散热、门扇、抽屉、检修及更换要求。
    - 完成柜门、椅子、冰箱和干吧真人操作包络及西墙电气方案。
    - 若工程核验要求改变已确认的概念布局，先提交具体反转条件和影响，再由业主复核。
  delivery_notes_required: true

  assumptions:
    - 把 600mm 预留深度解释为确定的厂家安装净深。
    - 把 600mm 冰箱门扇扫掠解释为厂家实测。
    - 把视图 PASS 当作功能或施工 PASS。
  out_of_scope_changes:
    - 冰箱新专用电源/线路、干吧正式柜体与预算新增、墙控点迁移、采购和施工放行
open_questions:
  - id: seat-count
    category: function
    question: 验收基线是日常四座，还是现在就必须保证六人同时就坐？
    fact_refs: [current-four-seat-candidate, future-six-seat-clearance-trial]
    options:
      - label: 四座日常使用；多人时临时加座
        benefit: 保留当前通道和视觉纵深；代价是不能把六座视作日常功能。
      - label: 六座必须长期可用
        benefit: 满足多人日常就坐；代价是当前1.40m方案椅间隙约25mm，1.60m方案推拉门余量约55mm，需重新核验。
      - label: 暂不决定
        benefit: 保留现候选为视觉研究，不冻结座位数。
    selected: 日常四人；来客时临时扩座
    user_response: 日常四人。但是希望能扩展多人
    status: answered
  - id: guest-expansion-capacity
    category: function
    question: 来客时希望保证扩展到几人？
    fact_refs: [daily-four-expandable, temporary-five-no-table-move, temporary-six-with-south-shift]
    options:
      - label: 临时5人即可
        benefit: 当前桌位不动，只需在南端临时加一把椅子；代价是不能保证6人同时就坐。
      - label: 临时6人也要能坐
        benefit: 可验证四侧座位加两端椅；代价是现有AABB试排需整组南移约320mm，并核对吊灯、地插和动线。
      - label: 先看5人与6人预演
        benefit: 对照真实固定视角再决定人数；代价是暂不冻结扩座容量。
    selected: 临时6人；桌椅组南移约320mm
    user_response: 那就先这样定稿吧（承接六人临时布局与厨房入口净距说明）
    status: answered
  - id: fridge-model-confirmation
    category: construction
    question: 实际计划/已购冰箱是否为项目配置候选华凌 HR-518WUFIPZ？
    fact_refs: [appliance-install-manual, user-fridge-dimensions]
    options:
      - label: 是 HR-518WUFIPZ
        benefit: 可继续向美的/华凌索取准确型号安装图；代价是用户参数表595mm深度仍需和官方口径核对。
      - label: 不是，按铭牌型号核查
        benefit: 避免用错型号安装净空；需要实际完整型号或铭牌照片。
      - label: 暂未确定
        benefit: 保留冰箱西墙方案为条件性空间预演，不冻结安装尺寸。
    selected: null
    user_response: null
    status: site_pending
  - id: fridge-depth-basis
    category: geometry
    question: 表中的600mm预留深度量尺基准是什么，是否有该精确型号的官方安装图？
    fact_refs: [user-fridge-dimension-table, fridge-runtime-aabb]
    options:
      - label: 完成墙面至冰箱正面总深度
        benefit: 可明确西墙定位；当前到实体墙约43mm、到房间开放边界线约3mm，两个模型尺寸都须由厂家与现场确认，不能视作可安装结论。
      - label: 机身后方另有安装净空
        benefit: 更符合可检修、散热的空间判断；代价是候选西墙深度需重算。
      - label: 暂不决定
        benefit: 等待型号铭牌和安装图，不冻结冰箱位置。
    selected: null
    user_response: null
    status: site_pending

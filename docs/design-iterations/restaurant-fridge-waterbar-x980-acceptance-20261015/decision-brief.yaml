schema: interior-design-decision-brief/v3
project: bontop-design-log
iteration_id: restaurant-fridge-waterbar-x980-acceptance-20261015
subject: 西侧冰箱与南北向餐桌正式日常落位、干水吧临时预演验收
priority:
  user_goal: 将已确认的日常四人家具布局写入当前设计模型，保留六人临时预演，并继续明示冰箱机电、水吧墙控与施工阻塞。
  ranked:
    - 日常四人使用，并保留来客时临时扩座的可能。
    - 保留入户半高柜与吊顶共同形成的压缩—释放节奏。
    - 让冰箱和水吧在餐厅形成清楚、克制的功能界面。
    - 保持厨房通道、餐桌使用和后续家电维护可行。
  non_negotiables:
    - 日常座位数为四人；来客六人时采用临时桌椅组南移约320mm的状态。
    - 墙体、门洞、玻璃推拉门、吊顶和空调位置不动。
    - 半高柜位置不动；其设计基线为 1.42m 上部、北端 700mm 降至 920mm。
    - 不增加冰箱侧板或通顶高柜。
    - 将已确认的日常餐桌、四把餐椅、冰箱位置及餐桌地插/冰箱门向写入正式设计配置；不据此放行施工。
    - 六人临时摆位、水吧柜体和1420/700半高柜外形仍为view-only，直到操作净空、控制点和算量/结构接口收口。
  tradeoffs_accepted:
    - 用户接受四人日常使用；额外来客时希望能临时增加座位。
    - 用户接受临时六人模式下桌椅组南移约320mm；吊灯/地插关系和机电条件仍须核验。
frozen: true
freeze_record:
  alignment_id: ALN-2026-10-15-GUEST6-01
  original_user_response: 日常四人，但是希望能扩展多人；询问六人是否堵厨房入口后，业主回复“那就先这样定稿吧”。
  normalized_decisions:
    - 本轮候选按餐桌中心 x=9.80m、1.40×0.80m、旋转90°、四座进行审查。
    - 日常四人和来客临时六人均已由业主确认。
    - 临时六人状态以日常四座位置为基准，桌椅组整体南移约320mm，南北两端各增加一把椅子；日常桌位不变。
    - 冰箱+干水吧与餐桌布局已冻结为条件性概念基线；准确机型安装净空、电气、开关可达、后部防护、灯具/地插对位及真人并用仍是后续实施核验条件。
    - 冰箱西侧位置已于2026-10-16写入正式日常家具配置；干水吧柜体仍为view-only。家具位置写入不代表厂家安装或施工批准。
    - 半高柜采用已冻结的 1.42m 上部与北端700mm低区视图。
    - 2026-10-16更新：日常四人桌椅、冰箱、餐桌地插及冰箱门向已写入正式家具/电气/防碰撞配置；冰箱新专用电源和干吧柜体没有写入。
  confirmed_by_user: true
  confirmed_at: 2026-10-15
  evidence_refs: [当前会话业主回复, evidence/guest-seat-envelope.json, docs/design-iterations/entry-cabinet-700-20261015/design-datum.yaml]

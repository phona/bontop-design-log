    - 餐桌地插跟随日常桌心移动，并把冰箱开门方向研究包络更新为朝东。
    - 捕获入户、服务墙、厨房看餐厅三个固定人眼视角。
scope_extension_2026_10_16:
  trigger: 业主指出“你没执行修改？”；纠正前一轮只改记录、未把已确认的日常家具布局写入模型。
  interpretation: 不新增设计选择，按已确认的概念基线提交日常四人餐桌/椅、冰箱、餐桌地插与冰箱门向；保留客卫墙体、控制点、吊顶、门洞和半高柜位置。
  applied_files: [config/house.yaml, config/electrical.yaml#sock_living_table, config/electrical-topology.yaml#dedicated_kitchen_fridge.note, config/anti-penetration.yaml#env.fridge.door]
  remains_view_only: [六人临时状态, 西侧干水吧柜体, 1.42m/北端700mm半高柜替代体]
  remains_forbidden: [墙体/门洞/推拉门/吊顶/空调移动, 冰箱新专用电源点位, 三处西墙控制点迁移, 采购或施工放行]
  reason: 水吧当前柜体范围会覆盖 switch_dining、switch_corridor、ac_panel_dining；复用 kitchen_cabinet_run 还会计入厨房柜体算量。冰箱后距和新电源需厂家/电工核准。

          benefit: 保留当前通道和视觉纵深；代价是不能把六座视作日常功能。
        - label: 六座必须长期可用
          benefit: 满足多人日常就坐；代价是当前1.40m方案椅间隙约25mm，1.60m方案推拉门余量约55mm，需重新核验。
        - label: 暂不决定
          benefit: 保留现候选为视觉研究，不冻结座位数。
      selected: 日常四人；来客时临时扩座

schema: interior-design-object-manifest/v3
project: bontop-design-log
iteration_id: living-sculptural-main-light-20261016
subject: 客厅浅吸顶雕塑主灯
object_policy:
  fixed_count_required: true
  split_by: [function, owner, material, collision, maintenance, interface, review]
  visual_relationship_required: true
objects:
  - id: light_living_dome
    type: sculptural_semi_flush_dome
    archetypes: [broad_opal_diffuser, offset_warm_bronze_arc]
    owner: 业主
    function: "客厅宽面基础照明与单一视觉焦点"
    material: "乳白漫射面；低反光暖铜/青铜弧线；具体表面光泽待验证"
    geometry_source: "config/render/lighting.yaml 声明 + shared/render/SculpturalDomeGeometry.ts，浏览器与GLB共用"
    datum_refs: [design-datum.yaml#living-main-fixture]
    fact_refs: [fact-table.yaml#decision-focal-lamp, fact-table.yaml#fact-existing-anchor, fact-table.yaml#fact-light-requirements]
    decision_refs: [docs/decisions/06-electrical.md#DEC-2026-10-13-R1, docs/decisions/06-electrical.md#DEC-2026-10-16-R1]
    dependencies: ["electrical:light_living_dome", "circuit:living_base", "control_living_entrance_corridor"]
    interfaces:
      - id: electrical-anchor
        target_object_id: light_living_dome
        kind: electrical
        requirement: "保留现有坐标/安装高度/回路/墙控成员；renderer只替换fixture geometry。"
        status: confirmed
      - id: hvac-clearance
        target_object_id: ceiling_living
        kind: hvac
        requirement: "主灯位位于边吊南缘以南；实机灯体、梁位、底盒与送风口净距仍需厂家/量房确认。"
        status: open
      - id: replaceable-light-engine
        target_object_id: light_living_dome
        kind: maintenance
        requirement: "后续候选应说明漫射盘、LED板、驱动器的拆换方式；服务由梯具完成且不拆吊顶。"
        status: open
    collision:
      policy: reviewed
      geometry_ref: "Ceiling-only object; no walkable collision requirement, but retain installation envelope/ceiling proximity review."
      review_ref: review-manifest.json#reviewers.functional
    maintenance:
      boundary: "灯具本体由灯具供应商/电工安装维护；业主清洁漫射盘。"
      access_clearance: null
      replaceable_parts: [opal_diffuser, LED_board, driver, bronze_arc_fasteners]
      inspection_requirements:
        - "确认灯罩拆开后可更换驱动与光源，不把可更换性写成事实直至候选说明书核实。"
        - "确认固定底盘与灯体重量、锚固方式；Site pending。"
    parts:
      - id: opal-diffuser
        role: "主照明的宽面乳白漫射发光面"
        independent: true
        owner: 灯具供应商
        material: "乳白扩散材料；实物SKU待选"
        geometry_source: "shared lighting fixture geometry"
        datum_refs: [design-datum.yaml#living-main-fixture]
        dependencies: [light-driver, ceiling-anchor]
        collision: reviewed
        maintenance_boundary: "能从灯具底侧拆卸并清洁/更换；具体结构待SKU"
        validation_refs: []
      - id: offset-bronze-arc
        role: "偏心弧线视觉轮廓，不承担主照度"
        independent: true
        owner: 灯具供应商
        material: "低反光暖铜/青铜饰面；建模为哑光/缎面暖铜，工艺待SKU"
        geometry_source: "shared lighting fixture geometry"
        datum_refs: [design-datum.yaml#living-main-fixture]
        dependencies: [ceiling-anchor]
        collision: reviewed
        maintenance_boundary: "表面清洁与紧固件检查"
        validation_refs: []
    visual_relationships:
      - target_object_id: dining_table
        relation: spaced
        requirement: "主灯锚定客厅起居区；餐桌移动或改向不驱动主灯位置。"
        evidence_refs: [fact-table.yaml#fact-table-offset]
      - target_object_id: sofa_3seat
        relation: adjacent
        requirement: "在起居区形成焦点；弧线视觉尺度不得压过乳白发光面或沙发主体。"
        evidence_refs: [fact-table.yaml#fact-existing-anchor]
    validation_refs:
      - review-manifest.json#reviewers.aesthetic
      - review-manifest.json#reviewers.functional
      - "tmp/screenshots/living-main-light/living_main_light_after_context_view_v010.png"
      - "tmp/screenshots/living-main-light/living_main_light_after_top_down_v008.png"
      - "tmp/screenshots/living-main-light/living_main_light_after_elevation_profile_v002.png"
    status: implemented
notes:
  - "桌面150lx不能由此造型自动保证；仍需独立光度计算或按项目验收口径验证。"
  - "1000×1000×120mm外轮廓已由业主确认并按共享几何实现；该尺寸仍是视觉模型包络，不是SKU或施工尺寸。"
  - "实际承重、梁位、驱动检修和漫射盘维护方式保持现场/候选SKU待核。"

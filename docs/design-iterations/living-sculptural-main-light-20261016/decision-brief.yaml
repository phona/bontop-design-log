subject: 客厅浅吸顶雕塑主灯
priority:
  user_goal: "在现代轻中古胡桃风格中为客厅建立视觉重心，同时保留宽面主光并避免由餐桌决定灯位。"
  ranked:
    - 视觉造型能成为客厅起居区焦点
    - 宽面漫射、3000K、Ra≥90 的功能要求仍可验证
    - 保留现有客厅电气锚点，餐桌摆位独立
    - 灯具低矮、适配原顶2.80m
  non_negotiables:
    - "不恢复集中窄束轨道灯作为客厅唯一基础光"
    - "不新增一圈灯槽来替代功能照明"
    - "不暗中修改餐桌、餐厅吊灯、电气回路、墙控或吊顶几何"

project: bontop-design-log
iteration_id: mep-power-water-freeze-20261003
subject: 水电施工冻结前最后一轮收口（马桶撞点/台面取电/电视高位/网关网口/洗烘检修/燃气报警器/漏保与配电箱/验收扩充）
priority:
  user_goal: 在水电交底前把空间点位以外的工程硬问题收口，使方案从"协调设计很好"进入"可施工冻结"；不重做点位，不改几何。
  ranked:
    - 安全与规范硬合规（30mA RCD、防溅盒、等电位、燃气报警器高度与距离、配电箱进线与安装高度）
    - 家具/设备封死导致不可用或不可修的点位（马桶、冰箱、烟机、洗烘）
    - 真正可用的取电/取网（厨房第二取电区、电视高位、主路由与 AP）
    - 回路与箱体容量（25→19 路，箱体单/双排待确认）
    - 验收能力（9 项新增，4 项 critical）
  non_negotiables:
    - "GB 55038-2025 7.4.3-1：所有电源插座回路 ≤30mA 剩余电流动作保护"
    - "GB 55038-2025 7.4.5：卫生间插座防溅 + 安全型插座"
    - "GB 55038-2025 7.4.7：装有淋浴/浴盆的卫生间等电位联结"
    - "CJJ/T 146-2011：探测器距灶具与排风口 >0.5m、天然气近顶安装 ≤0.3m"
    - "AGENTS.md：玻璃幕墙/suppress 墙不可挂装；配置驱动，禁止在 config 中伪造未冻结的 SKU 坐标"
  tradeoffs_accepted:
    - "马桶/洗烘/冰箱点位本轮只标 pending 不改坐标（坐标依赖 SKU），以「不合理但保留 + 量房清单」换取可追溯"
    - "照明 11 路合为 5 路：牺牲单灯单路可控性换取箱体容量与合规分类"
    - "洗烘拆为两路：多用 1 个回路位换取 7.4.4 对 2kW 以上设备分别设置的合规解读"
    - "台面取电不在本轮定形（升降/侧板/轨道），由橱柜深化决定，本迭代只保证「两个可插取的分区」存在"

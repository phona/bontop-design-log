  - id: j65_manual_front_panel_bag
    claim: 云鲸 JX 超薄上下水版（YJCC034+YJCB034S）尘袋与清洁液均在基站前面板后取放，全册无顶部开盖机构
    source: J65 官方说明书 p7 步骤 7/8（tmp/capture/jx-manual-2.pdf，2026-05-14 版，渲染原图逐页读取）
    evidence: official
    status: verified
  - id: j65_manual_specs
    claim: J65 参数页——基站 410×433×280mm/8.71kg/进水压力 0.08-0.8MPa；机器人 351.2×363.5×95mm/4.97kg/14.4V≥4900mAh；摆放前方≥0.45m+后≥0.3m（水平）
    source: J65 官方说明书 p6/p9（tmp/capture/jx-manual-2.pdf）
    evidence: official
    status: verified
  - id: r3_top_lid_premise_falsified
    claim: DEC-2026-11-04-R3 的推翻理由「换尘袋需打开基站上盖、顶部约需 25cm」对超薄版被官方手册证伪；R3 其余理由与专用仓方案不受影响
    source: J65 p5（部件图无顶盖）/p7（前面板步骤）；docs/decisions/01-control-budget.md R3 证伪标注
    evidence: official
    status: verified
  - id: splash_500_case_unfounded
    claim: 「浴室溅水渗入主板烧机、维修约 ¥500」未找到任何独立案例来源；可查进水损坏均为基站渗水/上下水模块漏水/进水管脆断泡地板，主板维修实际口径 700-1800 元
    source: 工作流独立调研（smzdm 案例汇总全文检索：主板/烧机/浴室/溅水零命中）
    evidence: community
    status: verified
  - id: cross_brand_fit
    claim: 现仓包络（净宽 0.46×深 0.50×高 0.75、前 0.88、底缝 0.15、双取袋路径）对科沃斯 T80S PLUS（410×449×247，装得下但深度贴上限：官方预留 480 vs 仓深 500 仅余 20mm）与石头 Vida（手册不载脚印，条件性可装）通用；硬约束=深度 0.50 与水压未实测
    source: 科沃斯官方说明书（2026-08-31 版，官网下载，p8/p25）；石头 Vida 上下水版说明书（p8/p15，tmp/capture/roborock-doc.pdf）
    evidence: official
    status: verified
  - id: shelf_blocked_by_drain_corridor
    claim: 头顶 0.45m 为台盆排水过管走廊（下水器仓内转 90° 向北穿 w_gbath_south），固定层板不可行；甲案另因堵石头顶盖取袋路径与 JX 无顶部操作需求而否决
    source: DEC-2026-11-05-R5 + 审案人·甲/乙/丙三条独立审案意见

brief:
  schema: interior-design-decision-brief/v3
  project: bontop-design-log
  iteration_id: living-sculptural-main-light-r3-20261016
  subject: 客厅主灯侧架垂吊造型R3
  priority:
    user_goal: 保留客厅视觉焦点，但从仰视和空间视角都明确读成悬挂灯，而不是浅吸顶盘。
    ranked:
      - 解决R2底部仰视仍像吸顶灯的问题，显示清楚的顶盘—吊杆—灯体侧缘关系。
      - 保留约1m平面尺度、250–350mm总下垂范围和客厅原锚点。
      - 乳白宽面漫射仍是主发光面；暖铜弧从盘上方装饰移到灯体外侧，成为可见三维结构。
      - 灯位不按餐桌位置决定。
    non_negotiables:
      - 不改电气锚点、高度、回路、双控、strong-light-living路由、HVAC或吊顶。
      - 不把渲染强度作为真实光度或承重证明。
      - 350mm只作为本轮模型预演值，不是商品或施工尺寸。
    tradeoffs_accepted:
      - R3提案把乳白灯体改为上宽下收、深200mm的钟形罩，并让暖铜侧架更可见；视觉厚度高于R2，但仍在已批准1m×1m与350mm包络内。
  frozen: true
  freeze_record:
    alignment_id: align-r3-continue-build-20261016
    original_user_response: '我发错了，你应该继续处理灯具的模型构建。[Image #1]，看起来还是像吸顶灯。'
    normalized_decisions:
      - 继续重做客厅主灯造型，仰视必须能明确看出垂吊关系。
      - 沿用此前批准的约1m平面尺度、250–350mm总下垂、乳白宽面漫射和现有客厅主灯锚点。
      - R3模型审查提案：下垂取350mm，增加深灯体，将吊杆接到侧壳，并让单条暖铜弧沿外侧露出。
    confirmed_by_user: true
    confirmed_at: '2026-10-16'
    evidence_refs:

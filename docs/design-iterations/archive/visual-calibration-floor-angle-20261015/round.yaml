brief:
  schema: interior-design-decision-brief/v3
  project: bontop-design-log
  iteration_id: visual-calibration-floor-angle-20261015
  subject: 校准4000K夜景预演、增加全屋地砖角度调节并声明主走廊独立涂装范围
  priority:
    user_goal: 让夜间色温/亮度更接近可感知的室内效果、比较全屋地砖铺设角度，并按主走廊实际墙面独立声明涂装。
    ranked:
      - 默认使用肉眼适应显示，避免把未适应的4000K光源色直接呈现成明显橙黄。
      - 保留原始CCT色度视图，用于对照光源色度与人眼适应后的材料观感。
      - 固定渲染输出管线，使不同色温和亮度 A/B 可比较。
      - 临时地砖角度控制覆盖全屋地面，0°保留现状，90°用于比较垂直南窗的铺向。
      - 主走廊只声明现有真实墙脸和对应顶面；开放边不新增墙体或面层。
    non_negotiables:
      - 只改临时预演，不改正式灯温、墙色、地砖SKU/颜色、几何或施工点位。
      - 保留“日照模拟开启”夜景和“夜景手动仅室内灯”语义。
      - 明确亮度控制为相对渲染值，不标称真实 lux。
      - 肉眼适应是面向屏幕观感的色度近似；原始CCT色度模式仍可随时切换查看。
    tradeoffs_accepted:
      - 没有实物灯具 SPD/IES 和实物材料测色时，结果是可复现的显示预演，不是 photometric/光谱认证。
      - 肉眼适应模式对灯光颜色做部分中性白点适应，不应被理解为灯具实际发光色或相机测色结果。
  frozen: true
  freeze_record:
    alignment_id: user-message-visual-calibration-20261015
    original_user_response: 全屋统一
    normalized_decisions:
      - 色温改用 CCT/Planckian 色度近似到 Linear-sRGB，避免旧经验式的强橙色映射。
      - 明确 sRGB 输出并采用固定 tone mapping/exposure，优先进行 NeutralToneMapping 与 AgXToneMapping 视觉对照后选择。
      - 灯光显示方式同时保留“原始CCT色度”和“肉眼适应”；默认使用肉眼适应，原始CCT色度可随时切回。
      - 全屋统一地面铺向滑块仅在临时材料预演中生效；正式 current-scheme 和材料配置不变。
      - 铺向 0° 保持当前方向，90°为南北向长边，A/B 预设保存角度。
    confirmed_by_user: true
    confirmed_at: '2026-10-15'
    evidence_refs:

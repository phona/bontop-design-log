# Decision Brief — 客餐厅双出风口气流与视觉成组候选
schema: interior-design-decision-brief/v1
iteration_id: hvac-airflow-grouping-20261018
frozen: true
frozen_at: 2026-10-18
owner: 业主
priority:
  - 回风避开下出风及侧送射流路径，覆盖对应客厅/餐厅区域。
  - 四个底面功能口形成规律、视觉居中的节奏；不强求回风与机身同轴。
  - 保持两台机组送回风与检修责任独立。
allowed_scope:
  - config/hvac.yaml 中 return_dining、return_living 与对应封闭装饰段的位置/说明。
  - config/mep-hvac-coordination.yaml 中 return-air-dining、return-air-living 局部支路坐标。
  - 本轮直接相关的 HVAC fact/datum/object/review 记录与 DEC。
forbidden:
  - 改两台内机坐标、侧送方向和端子、两处下出风、吊顶几何/标高/梁体、冷媒和冷凝水主路由。
  - 两台机组共用送风或回风。
  - 把 LD-deco-* 装饰段接入风道、滤网或检修功能。
  - 把候选坐标标为厂家确认或施工定位。
  - 直接覆盖 data/project-render-facts.json；更新前先比对已有用户修改。
decisions:
  - id: DEC-2026-10-18-R01
    content: 下出风保留 x=8.00/10.30；回风候选改为餐厅 x=9.10、客厅 x=11.40，均 z=4.45 底装，各相对本机下出风向东 1.10m；施工前须厂家深化。
    status: candidate_site_and_vendor_pending
open_questions:
  - q1: 两台 P-SS 的双出风运行模式、风量分配和机组允许回风接口。
  - q2: 风口自由面积、风量、外静压、噪声、回风箱尺寸及过滤/检修开口尺寸。
  - q3: 现场复尺后的吊顶净空、风道截面和滤网检修路径。
acceptance:
  candidate_geometry:
    supply_centers_x: [8.00, 10.30]
    return_centers_x: [9.10, 11.40]
    shared_row_z: { supply: 4.85, return: 4.45 }
    return_lengths_m: { dining: 0.90, living: 1.00 }
    return_offset_east_from_associated_supply_m: 1.10
  criteria:
    - 下出风保持对应各自内机轴线。
    - 两回风支路独立；回风与对应下出风开口的 x 投影不重叠。
    - 厂家确认回风不截获任一送风射流；人员区无持续直吹或死区。
    - 过滤器、接水盘、提升泵与电控能按厂家要求维护。
    - 风量、自由面积、静压、噪声未核实前，只作设计候选，不作施工定位。
  validation_commands: [npm run gate:visual, npm run verify:all, npm run verify:mep, npm run typecheck]
  evidence_required:
    - 当前版本 HVAC 端子坐标及客餐厅平面对应关系。
    - 同版本客厅/餐厅视角和设备带近景。
    - 厂家安装图、风量/静压校核记录（到手后）。
alignment:
  - id: align1
    channel: 直接指令（2026-10-18）
    answer: 将现有位置视为初版，依业界原则调整；用户指出不居中可能影响观感，因此候选同时校核功能与视觉节奏。

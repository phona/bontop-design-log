schema: interior-design-decision-brief/v3
project: bontop-design-log
iteration_id: dining-semi-flush-20261016
subject: 餐厅吊灯改半吸顶（含灯位移正新桌心）
priority:
  user_goal: "餐厅吊灯换成半吸顶（下垂10~30cm）。"
  ranked:
    - "light_dining_pendant 由 (7.90,3.45) 移至新桌心 (9.80,3.45)——2026-10-16 餐桌东移至 (9.80,3.45) 后灯位未随动，差 1.9m，属既有漂移，本轮一并修正。"
    - "type 由 pendant 改 ceiling_light；外观按半吸顶实现：吸顶盘+短杆+浅穹顶漫射罩，总下垂 0.28m（业主认可的 10~30cm 区间内取值）。"
    - "重画 strong-light-dining 电路由：西侧服务带空腔东行至桌心上方，敞开天花段明装线槽（DEC-2026-10-13-R6 先例）。"
    - "style-guide §十一「餐桌上方细长线性吊灯」显式改判为半吸顶。"
    - "照度代价登记：顶装灯距桌面 1.77m（原吊灯 0.85m），同灯桌面照度约为 1/4，150 lx 需更高输出 SKU 或补光；选型重开，open_question 挂竞品研究。"
  non_negotiables:
    - "不改 dining 回路、switch_dining 墙控、双控关系与点位 id（light_dining_pendant）。"
    - "不移动餐桌；灯位只跟随桌心，不另选位置。"
    - "不把预览亮度/包络当成光度或承重证据。"
    - "SKU 未选前不锁商品、不写施工尺寸。"
  tradeoffs_accepted:
    - "接受照度下降风险（约1/4）与选型重开成本（雷士线性吊灯候选转历史）。"
    - "接受 §十一 线性吊灯风格基准被改判（业主裁定）。"
    - "接受客餐厅开放区出现两盏顶装灯（客厅10头主灯+餐厅半吸顶）——需在两盏同家族/同金属色上控制，避免 §十一「两三个不同风格吊灯同时出现」。"
frozen: true
freeze_record:
  alignment_id: align-dining-semi-flush-20261016
  original_user_response: '餐厅吊灯我想换成吸顶灯，可行吗" → 四选项选择「换半吸顶（下垂10-30cm）」；业主发吊扇灯图（IMG_2665.jpg）澄清「你说的半吸灯我以为是这个」——语义对齐：半吸顶=贴顶无扇叶浅漫射罩，非风扇灯。追加两项裁定：① 风的需求用独立循环扇/台扇解决，不做进天花；② 桌面照度先按 150 lx 建模与询价，同时备 100 lx 口径，SKU 数据回来后再定。'
  normalized_decisions:
    - "方向=半吸顶（无扇叶），下垂取 0.28m（10~30cm 区间内，含 0.12m 漫射罩高度）。"
    - "点位移至新桌心 (9.80,3.45) 与造型改动同轮完成。"
    - "风格基准 §十一 显式改判；选型重开并登记竞品研究。"
    - "不做吊扇灯；餐区「风」由独立循环扇/台扇承担（另案，不占天花、不加风量控制）。"
    - "照度口径：150 lx 维持为目标、100 lx 为备选，SKU 核验时按真实输出二选一（open_question 保持 site_pending）。"
  confirmed_by_user: true
  confirmation_scope: "用户确认方向为半吸顶；0.28m 下垂、漫射罩 Ø520/深120mm、金属收边等具体分解为设计提案，未经逐项确认。"
  confirmed_at: "2026-10-16"

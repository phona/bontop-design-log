schema: interior-design-object-manifest/v3
project: bontop-design-log
iteration_id: dining-semi-flush-20261016
subject: 餐厅半吸顶主灯（桌心上方）
object_policy: {fixed_count_required: true, split_by: [function, owner, material, collision, maintenance, interface, review], visual_relationship_required: true}
objects:
  - id: light_dining_pendant
    type: semi_flush_ceiling_light
    archetypes: [shallow_opal_dome_diffuser, short_stem_mount, ceiling_canopy_semi_flush]
    owner: 业主
    function: "餐桌重点照明（150 lx 目标）与餐区视觉焦点；顶装后半吸顶形态，实际光度待 SKU 核验。"
    material: "镀铬吸顶盘/短杆/收边 + 乳白漫射罩；渲染材质不是商品工艺确认。"
    geometry_source: "config/render/lighting.yaml + shared/render/SemiFlushDomeGeometry.ts；浏览器与 GLB/export 共用。"
    datum_refs: ["design-datum.yaml#dining-semi-flush-fixture"]
    fact_refs: ["fact-table.yaml#fact-anchor-and-table", "fact-table.yaml#inference-r12-proposal", "fact-table.yaml#user-r12-decision"]
    decision_refs: ["docs/decisions/06-electrical.md#DEC-2026-10-16-R12"]
    dependencies: ["electrical:light_dining_pendant", "circuit:dining", "control_dining", "strong-light-dining"]
    interfaces:
      - {id: electrical-anchor, target_object_id: light_dining_pendant, kind: electrical, requirement: "点位移至新桌心 (9.80,3.45)、type pendant→ceiling_light；id/回路/墙控/拓扑关系不变。", status: confirmed}
      - {id: route-raceway, target_object_id: ceiling_dining_north_band, kind: electrical, requirement: "北带空腔东行至 x=9.80 后南行 0.45m 敞开段明装线槽；梁位/板底平整度量房复核。", status: open}
      - {id: photometry, target_object_id: dining_table, kind: function, requirement: "顶装距桌 1.77m，同灯桌面照度约 1/4；150 lx 需 SKU 核验或业主降标。", status: open}
    collision:
      policy: reviewed
      geometry_ref: "吊顶灯具；Ø0.52m×0.28m 包络位于桌心上方平顶 2.80m，最低点 y≈2.52m，距桌面 ≥1.7m；不作为地面碰撞物；与人体/椅背无干涉。"
      review_ref: "review-manifest.json#reviewers.functional"
    maintenance:
      boundary: "供应商/电工负责安装与检修；业主按说明清洁。漫射罩拆装、驱动器/光源更换路径待 SKU 说明书。"
      access_clearance: null
      replaceable_parts: [diffuser, driver, led_module, canopy, stem]
      inspection_requirements:

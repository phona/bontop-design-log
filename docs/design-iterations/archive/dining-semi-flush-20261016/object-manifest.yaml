        - "SKU 冻结前确认漫射罩拆装方式与更换路径。"
    parts:
      - id: ceiling-canopy-and-stem
        role: "镀铬吸顶盘 Ø120×18mm 贴顶 y=2.80m + 短杆 140mm；半吸顶安装形态的来源（总下垂的一部分）。"
        independent: true
        owner: 灯具供应商
        material: "镀铬渲染色；实际表面工艺与承载待核。"
        geometry_source: shared/render/SemiFlushDomeGeometry.ts
        datum_refs: ["design-datum.yaml#dining-semi-flush-fixture"]
        dependencies: []
        collision: reviewed
        maintenance_boundary: "吸顶盘底盒固定与承重待厂家安装图"
        validation_refs: ["evidence/r12/closeup.runtime.json"]
      - id: shallow-opal-dome-diffuser
        role: "浅穹顶乳白漫射罩：上口 Ø520mm/下口 Ø470mm/深 120mm，罩底约 y=2.516m（含收边最低点）；承担桌面宽面漫射主光，配光/眩光待 SKU 资料。"
        independent: true
        owner: 灯具供应商
        material: "乳白扩散材料；透光率/眩光待核。"
        geometry_source: shared/render/SemiFlushDomeGeometry.ts
        datum_refs: ["design-datum.yaml#dining-semi-flush-fixture"]
        dependencies: [ceiling-canopy-and-stem]
        collision: reviewed
        maintenance_boundary: "罩体拆装方式待 SKU 资料"
        validation_refs: ["evidence/r12/closeup.runtime.json", "evidence/r12/dining-context.runtime.json"]
      - id: thin-metal-rim
        role: "漫射罩下口细金属收边，与镀铬盘/杆同色；视觉收口，不代表承载。"
        independent: true
        owner: 灯具供应商
        material: "镀铬渲染色。"
        geometry_source: shared/render/SemiFlushDomeGeometry.ts
        datum_refs: ["design-datum.yaml#dining-semi-flush-fixture"]
        dependencies: [shallow-opal-dome-diffuser]
        collision: reviewed
        maintenance_boundary: "收边为装饰件，无独立维护项"
        validation_refs: ["evidence/r12/closeup.runtime.json"]
    visual_relationships:
      - {target_object_id: dining_table, relation: above, requirement: "灯位锚定桌心 (9.80,3.45)，罩底距桌面 ≥1.7m；六人临时南移 0.32m 时灯相对桌心偏北 0.32m，需业主接受或复核。", evidence_refs: ["evidence/r12/plan.runtime.json"]}
      - {target_object_id: light_living_dome, relation: sibling, requirement: "同家族配色（黑/镀铬/乳白）与不同尺度层级（Ø520 半吸顶 vs Ø1000 十头），避免 §十一「两三个不同风格吊灯同时出现」。", evidence_refs: ["evidence/r12/dining-context.runtime.json"]}
    validation_refs: ["review-manifest.json#reviewers.aesthetic", "review-manifest.json#reviewers.functional"]
    status: implemented
notes:
  - "半吸顶造型只表达视觉关系，不证明桌面照度、承重或可安装性。"
  - "照度缺口、SKU 选型、明装段路由继续由 site_pending 与 open_question 核实。"

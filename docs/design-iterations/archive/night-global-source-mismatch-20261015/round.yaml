brief:
  schema: interior-design-decision-brief/v3
  project: bontop-design-log
  iteration_id: night-global-source-mismatch-20261015
  subject: 夜景模式只保留室内灯并消除静态东南主光
  priority:
    user_goal: 夜间预演中不出现来自静态日间预设的全局方向光或环境补光。
    ranked:
      - 夜景手动模式显式关闭太阳、环境光、辅助补光和 IBL。
      - 关闭日照控制时保留已选夜间状态，避免静态东南日光突然恢复。
      - 保持室内灯色温、亮度、人工总开关和房间开关可用。
    non_negotiables:
      - 太阳高度角小于等于零时只渲染室内灯。
      - 日间静态预设和日间日照模拟保持原有光照。
      - 不改地砖方向、室内灯具位置和正式灯光配置。
    tradeoffs_accepted:
      - 未被室内灯照到的区域会明显变暗。
  frozen: true
  freeze_record:
    alignment_id: user-message-night-only-20261015
    original_user_response: 不能全关掉吗？只留室内照明。
    normalized_decisions:
      - 夜景手动模式的语义是仅由室内配置灯具照明。
      - 在夜间关闭日照模拟后，继续保持夜景和室内灯自动状态。
      - 静态日间光只在当前选定状态为白天且未启用夜景手动时恢复。
    confirmed_by_user: true
    confirmed_at: '2026-10-15'
    evidence_refs:
      - docs/design-iterations/archive/night-only-indoor-lighting-20261015/round.yaml（brief 段）
  allowed_scope:
    files:
      - app/src/render/EnvironmentManager.ts
      - app/src/App.ts
      - app/src/ui/LightingPreviewPanel.ts
      - app/src/render/EnvironmentManager.test.ts
    objects:
      - global_environment_lighting
      - indoor_fixtures
    archetypes:
      - perspective
    views:
      - perspective
    changes:
      - 夜景手动模式通过 EnvironmentManager 关闭全部全局照明。
      - 关闭日照模拟时保留已选夜间状态与室内灯自动联动。
      - UI 明确标注夜景手动仅保留室内灯。
  forbidden:
    files:
      - config/layout/model-geometry.yaml
      - config/layout/overlay.yaml
      - config/materials.yaml
      - config/render/lighting.yaml
    objects:
      - floor_tile_orientation
      - wall_finish
      - fixture_placement
    assumptions:
      - 把用户截图中的方向光直接归因为太阳模拟开关状态，未以运行时证明。
    out_of_scope_changes:
      - 改变日间静态光源坐标、强度或开关语义。
      - 禁用所有室内投影；本轮只移除全局东南方向光。

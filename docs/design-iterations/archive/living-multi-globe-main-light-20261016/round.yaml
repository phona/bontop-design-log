brief:
  schema: interior-design-decision-brief/v3
  project: bontop-design-log
  iteration_id: living-multi-globe-main-light-20261016
  subject: 客厅主灯改10头球泡半吸顶造型R5
  priority:
    user_goal: 把客厅主灯模型改成参考图中的10头G9球泡半吸顶灯。
    ranked:
      - 复刻参考图造型语言：贴顶半吸顶、黑色两叠圆盘灯体、10根镀铬弯臂分双层（上5挑/下5垂）、臂端乳白球泡+镀铬灯头座。
      - 按商品规格包络：直径1000mm、总高450mm；锚点仍用 light_living_dome (10.80,7.15) 贴原顶2.80m，最低球泡底约2.35m。
      - 光度冲突不阻塞本轮：7,100–8,500lm 整厅口径与10×G9（估2,800–4,000lm）的缺口登记为待SKU核验，补光层另算。
      - 灯位不按餐桌位置决定。
    non_negotiables:
      - 不改电气锚点、高度、回路、双控、strong-light-living路由、HVAC、吊顶或家具。
      - 不把渲染强度、球泡数量或模型包络当作真实光度、承重或施工证据。
      - 1000mm/450mm只作为本轮审图模型参数，不是已选SKU或施工尺寸。
    tradeoffs_accepted:
      - 接受超出R4批准的350mm最大总下垂上限：本轮按商品口径取450mm，最低点由2.45m降到约2.35m（仍高于2.1m净高要求），经业主2026-10-16确认。
      - 接受与 style-guide §十『新主灯保持单件、乳白漫射和克制的铜色结构，不做多头点光组合』冲突：该条款由本轮显式改判（见 DEC-2026-10-16-R5）。
      - 接受光度缺口：10×G9结构上难以达到整厅7,100–8,500lm；按业主裁定先定造型，光度与补光层在SKU阶段核验。

retrospective:
  trigger_id: repeated-same-kind-aesthetic-failure
  trigger_text: "R1、R2被业主指出仍像吸顶灯；R3同机位预演也保留大圆盘轮廓，且外置杆配置实际被灯体遮挡，重复的垂吊语义失败触发R4回顾。"
  failure_evidence: [tmp/screenshots/living-main-light/living_main_light_after_r3_underside_v002.png, tmp/screenshots/living-main-light/living_main_light_after_r3_side_view_v002.png, docs/design-iterations/archive/living-sculptural-main-light-r3-20261016/evidence/r9/underside.runtime.json]
  last_change: "R3用Ø900/720mm、深200mm的浅钟形灯体；吊杆端点落在上口半径以内，沿锥面被遮挡。"
  root_cause: "高置信：宽度/深度比例仍像大圆盘；配置/schema和构建器对杆端的语义约束相反，导致吊杆虽然被命名为外置，却进入灯体轮廓。"
  status: rebaselined_for_r4_preview
notes:
  - "R4只作为造型预演，不是SKU或施工尺寸。"
  - "保留R1/R2/R3旧图、DEC、审查和尺寸作为历史，不覆盖失败证据。"

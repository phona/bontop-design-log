subject: 客厅深钟形侧架垂吊主灯
object_policy: {fixed_count_required: true, split_by: [function, owner, material, collision, maintenance, interface, review], visual_relationship_required: true}
objects:
  - id: light_living_dome
    type: suspended_side_arch_opal_lantern
    archetypes: [deep_opal_diffuser, side_attached_bronze_arch, visible_suspension_rods]
    owner: 业主
    function: "客厅宽面主光灯体候选造型和起居区视觉焦点；实际光度待SKU核验。"
    material: "乳白灯体、缎面暖铜侧架与吊杆；渲染材质不是商品工艺确认。"
    geometry_source: "config/render/lighting.yaml + shared/render/SculpturalDomeGeometry.ts；浏览器与GLB/export共用。"
    datum_refs: ["design-datum.yaml#living-main-fixture-r4"]
    fact_refs: ["fact-table.yaml#user-r3-direction", "fact-table.yaml#inference-r4-proposal"]
    decision_refs: ["docs/decisions/06-electrical.md#DEC-2026-10-16-R4"]
    dependencies: ["electrical:light_living_dome", "circuit:living_base", "control_living_entrance_corridor", "strong-light-living"]
    interfaces:
      - {id: electrical-anchor, target_object_id: light_living_dome, kind: electrical, requirement: "保持现有位置/高度/回路/墙控/MEP；只替换渲染外形。", status: confirmed}
      - {id: hvac-airflow, target_object_id: ceiling_living, kind: hvac, requirement: "模型层位不替代现场送风射流、风噪、摆动与积灰核验。", status: open}
      - {id: structure-and-service, target_object_id: ceiling_living, kind: structural, requirement: "实际灯重、梁/顶板固定、侧架连接和检修拆换需厂家安装图。", status: open}
    collision:
      policy: reviewed
      geometry_ref: "吊顶灯具；核对1m×1m×0.35m概念包络与房间/HVAC层位，不作为地面碰撞物。"
      review_ref: "review-manifest.json#reviewers.functional"
    maintenance:
      boundary: "供应商/电工负责安装与检修；业主按说明清洁。灯盘、驱动器和外架拆换方式待SKU说明书。"
      access_clearance: null
      replaceable_parts: [opal_diffuser, driver, led_board, canopy, suspension_rods, side_arch_fasteners]
      inspection_requirements:
        - "现场确认底盘、梁/顶板固定、杆端及铜弧脚的实物连接。"
        - "SKU冻结前确认灯罩、LED板、驱动器更换路径和保修。"
    parts:
      - id: deep-opal-body
        role: "上口Ø0.78m、下口Ø0.52m、深0.28m的乳白深钟形宽面灯体；由宽肩明显向下收口，避免底面继续读成大平盘。"
        independent: true
        owner: 灯具供应商
        material: "乳白扩散材料；光通量/眩光/可更换性待SKU资料。"
        geometry_source: shared/render/SculpturalDomeGeometry.ts
        datum_refs: ["design-datum.yaml#living-main-fixture-r4"]
        dependencies: [driver, led_board]
        collision: reviewed
        maintenance_boundary: "拆装方式待SKU资料"
        validation_refs: ["evidence/r4/closeup.runtime.json"]
      - id: outer-bronze-arch
        role: "单条偏心暖铜3D弧从灯体侧下缘连接并沿南侧外凸；不再停留于盘面上方。"
        independent: true
        owner: 灯具供应商
        material: "低反光暖铜渲染色；实际表面工艺与连接强度待核。"
        geometry_source: shared/render/SculpturalDomeGeometry.ts
        datum_refs: ["design-datum.yaml#living-main-fixture-r4"]
        dependencies: [arch_feet]
        collision: reviewed
        maintenance_boundary: "侧脚紧固与清洁待实物构造"
        validation_refs: ["evidence/r4/closeup.runtime.json", "evidence/r4/underside.runtime.json"]
      - id: side-suspension-rods
        role: "三根暖铜支撑杆从顶盘斜向外折，再保持在灯体外侧下行；每根用短径向连接脚落到距底面0.06m的侧壳，运行几何验证杆体不穿入灯体。"
        independent: true
        owner: 灯具供应商
        material: "缎面暖铜；杆径是模型参数，不是承载选型。"
        geometry_source: shared/render/SculpturalDomeGeometry.ts
        datum_refs: ["design-datum.yaml#living-main-fixture-r4"]
        dependencies: [ceiling_canopy, deep-opal-body]
        collision: reviewed
        maintenance_boundary: "实际杆径、吊点和受力需厂家安装图"
        validation_refs: ["evidence/r4/elevation-profile.runtime.json", "evidence/r4/underside.runtime.json"]
    visual_relationships:
      - {target_object_id: sofa_3seat, relation: adjacent, requirement: "客厅起居区形成焦点；复核电视上缘遮挡和坐姿压迫感。", evidence_refs: ["evidence/r4/context.runtime.json"]}
      - {target_object_id: dining_table, relation: spaced, requirement: "灯位固定于客厅，不随餐桌中心移动。", evidence_refs: ["evidence/r4/topdown.runtime.json"]}
    validation_refs: ["review-manifest.json#reviewers.aesthetic", "review-manifest.json#reviewers.functional"]
    status: implemented
notes:
  - "R4模型侧架和吊杆明确表达视觉悬挂关系，但不是承重证明。"
  - "光度、承重、气流、视线与维修继续由SKU/现场资料核实。"

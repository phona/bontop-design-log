      - 沿用此前批准的约1m平面尺度、250–350mm总下垂、乳白宽面漫射和现有客厅主灯锚点。
      - R3轮廓未通过用户视觉反馈；R4造型提案：下垂取350mm，上口Ø780mm、下口Ø520mm、深280mm，并让支撑杆及连接脚在壳体外显露。

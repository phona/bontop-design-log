      blocking_issues: []
      non_blocking_notes:
        - R4 runtime 全部来自同一版本 ?v=20261016-r10，ready=true、errorBanner为空、visualPreviewActive=false，目标对象均为 electrical:light_living_dome；本次复核未引用R3/R8几何结论。
        - 当前R4实际声明为上口直径0.78m、下口直径0.52m、灯体深度0.28m、总下垂0.35m；这与历史R3的上口0.90m、下口0.72m、深度0.20m不同，应以R4 runtime为准。
        - 运行时AABB为 x[10.3946,11.2054]、y[2.45,2.80]、z[6.7308,7.6245]，实际包络约0.811×0.350×0.894m，处于1.0×1.0×0.35m声明包络内。
        - 三根吊杆的运行时 supportClearance 均为正：扣除杆半径后的实体间隙约8.14–8.63mm，说明吊杆中心线和杆体均位于外壳外侧，没有穿入灯体的几何证据。
        - R4的灯体由上口直径0.78m收至下口0.52m；侧向乳白壳体增加了出光侧面积，但底部正投影发光面相对此前盘面明显减少。真实光通量、配光、眩光、U0、Ra和3000K实际输出仍不能由渲染证明。
        - arc-foot 与弧线使用同一侧向安装位置，runtime parts 中明确存在 arch-foot-west/east；schema 同时检查弧脚能到达壳体周边。近景、仰视和侧视截图未见明显悬空或弧脚脱离壳体。
        - 1m水平包络下，弧线的arcOffset、arcDepthExtension和管径仍受schema限制；当前运行AABB没有触及水平边界。
        - 浏览器与GLB/export继续共用 shared/render/SculpturalDomeGeometry.ts；当前R4部件列表包含同一套 diffuser、housing、canopy、arc、arc-foot和suspension-rod。
        - light_living_dome的电气锚点、living_base回路、双控关系和strong-light-living路由保持不变；造型下沉没有被写成电气点位或MEP路线迁移。

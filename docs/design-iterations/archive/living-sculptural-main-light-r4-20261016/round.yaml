brief:
  schema: interior-design-decision-brief/v3
  project: bontop-design-log
  iteration_id: living-sculptural-main-light-r4-20261016
  subject: 客厅主灯深钟形侧架垂吊造型R4
  priority:
    user_goal: 保留客厅视觉焦点，但从仰视和空间视角都明确读成悬挂灯，而不是浅吸顶盘。
    ranked:
      - 解决R3同机位仍像浅盘灯的问题：收窄底部发光面、加深钟形灯体，并让三根外置支撑完整露出。
      - 保留约1m平面尺度、250–350mm总下垂范围和客厅原锚点。
      - 乳白宽面漫射仍是主发光面；暖铜弧与吊杆必须在灯体外侧成为可见结构，不能藏在灯壳投影内。
      - 灯位不按餐桌位置决定。
    non_negotiables:
      - 不改电气锚点、高度、回路、双控、strong-light-living路由、HVAC或吊顶。
      - 不把渲染强度作为真实光度或承重证明。
      - 350mm只作为本轮模型预演值，不是商品或施工尺寸。
    tradeoffs_accepted:
      - R3的Ø900/720mm、深200mm灯体仍像浅盘，且下端支撑被灯壳遮挡。R4改为上口Ø780mm、下口Ø520mm、深280mm，并加可见径向连接脚；仍在已批准1m×1m与350mm包络内。
  frozen: true
  freeze_record:
    alignment_id: align-r4-correct-pendant-silhouette-20261016
    original_user_response: '我发错了，你应该继续处理灯具的模型构建。[Image #1]，看起来还是像吸顶灯。'
    normalized_decisions:

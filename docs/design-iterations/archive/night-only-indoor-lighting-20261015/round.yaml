  project: bontop-design-log
  iteration_id: night-only-indoor-lighting-20261015
  subject: 夜间只保留室内照明
  priority:
    user_goal: 夜间模拟时隔离室内灯效果，避免全局补光抬高墙地材质亮度。
    ranked:
      - 夜间全局照明为零。
      - 保留已配置且启用的室内灯具及其灯具发光体。
      - 白天静态预设保持现有行为。
    non_negotiables:
      - 室内灯仍由现有日照自动/房间开关控制。
      - 不改墙地材料、房间几何或全局正式灯光配置。
    tradeoffs_accepted:
      - 没有环境补光的夜景会显得更暗，未被室内灯直射的区域可能接近黑色。
  frozen: true
  freeze_record:
    alignment_id: user-message-20261015-night-only
    original_user_response: 不能全关掉吗？只留室内照明。
    normalized_decisions:
      - 日照模拟开启且太阳高度角不大于零时，关闭全局太阳光、环境光、辅助补光和 IBL。
      - 保留室内灯具、灯具发光面、室内灯色温和亮度预演控制。
      - 地砖方向不在本次代码改动范围。
    confirmed_by_user: true
    confirmed_at: '2026-10-15T02:39:08Z'

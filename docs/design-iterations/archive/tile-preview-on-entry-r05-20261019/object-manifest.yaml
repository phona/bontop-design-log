# Object Manifest — 首屏地砖预演状态
schema: interior-design-object-manifest/v1
iteration_id: tile-preview-on-entry-r05-20261019
objects:
  - id: startup-floor-preview
    owner: app-material-preview
    parts: [setupMaterialPreviewPanel, applyMaterialPreviewState, room-floor-meshes, floor-region-meshes]
    function: 首屏应用slider=0的南北向临时地面预览。
    relationships: 所有房间floor及floor_region复用当前正式材料ID与roomOverrides，仅转换贴图方向。
    maintenance: not_applicable
    interfaces: [materialPreviewState, HouseScene.setFloorMaterial, HouseScene.applyFloorRegionMaterials]
    collision: no_geometry_change
    validation_refs: [f_visible_mismatch, f_floor_preview_scope, f_formal_scheme]
  - id: official-materials-and-wall-paint
    owner: official-scheme
    parts: [officialFloorSelection, officialPaintSelection, paint-wall-meshes]
    function: 正式选材与墙面颜色保持原状；首屏仅应用地面预览时不调用setPaintColor。
    relationships: “恢复正式材料与灯光”清除临时floor override并回到正式floor rotation=0。
    maintenance: not_applicable
    interfaces: [data/current-scheme.json, finishVisualPreview]
    collision: no_geometry_change
    validation_refs: [f_formal_scheme]
constraints:
  - 不写入current-scheme、materials.yaml、presentation-state或project-render-facts。
  - 首屏地砖预览不得覆盖paint roomOverrides；R03 curtains open继续有效。

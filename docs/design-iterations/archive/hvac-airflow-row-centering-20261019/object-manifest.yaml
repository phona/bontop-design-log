# Object Manifest — 客餐厅两排风口分别居中
schema: interior-design-object-manifest/v1
iteration_id: hvac-airflow-row-centering-20261019
objects:
  - id: ac_dining_air_group
    owner: HVAC
    unit: ac_dining / MJV-42T2/P-SS
    parts: [supply_dining_bottom, return_dining, supply-air-dining-bottom, return-air-dining]
    function: 餐厅独立服务；底面下出风x=8.60，回风x=9.65。
    relationships: 两排分别居中于边吊中心；该供回风中心距1.05m。餐厅侧送风/回风近邻需重点核气流。
    maintenance: 回风铰接格栅服务滤网与机组，实际检修开口仍待现场/厂家参数核实。
    validation_refs: [f_side_supply_clearance, f_airflow_pending, i_row_centering]
  - id: ac_living_air_group
    owner: HVAC
    unit: ac_living / MJV-71T2/P-SS
    parts: [return_living, supply_living_bottom, return-air-living, supply-air-living-bottom]
    function: 客厅独立服务；回风x=10.95，下出风x=12.00。
    relationships: 两排分别居中于边吊中心；该供回风中心距1.05m。
    maintenance: 回风铰接格栅服务滤网与机组，实际检修开口仍待现场/厂家参数核实。
    validation_refs: [f_airflow_pending, i_row_centering]
  - id: closed_decorative_runs
    owner: interior
    parts: [LD-deco-supply-west, LD-deco-supply-mid, LD-deco-supply-east, LD-deco-return-west, LD-deco-return-mid, LD-deco-return-east]
    function: 封闭装饰延续，仅视觉线条，无有效进/出风。
    relationships: 填补各功能开口之间和两端范围，背板封闭，不接风道。
constraints:
  - 不移动机组、侧送风口或吊顶几何。
  - 两台机组送回风责任独立。
  - 当前是业主要求的预演居中，不能覆盖施工前功能复核。

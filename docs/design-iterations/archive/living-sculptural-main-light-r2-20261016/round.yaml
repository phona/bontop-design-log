brief:
  schema: interior-design-decision-brief/v3
  project: bontop-design-log
  iteration_id: living-sculptural-main-light-r2-20261016
  subject: 客厅主灯由浅吸顶改为悬垂雕塑灯
  priority:
    user_goal: 解决R1仍像普通吸顶灯、客厅缺少视觉重心的问题；用独立于餐桌位置的客厅主灯承接现代轻中古风格。
    ranked:
      - 灯具远景能明确读成悬垂雕塑主灯，而不是贴顶圆盘。
      - 保留乳白宽面漫射作为主发光面；暖铜立体弧只负责造型层次。
      - 保持约1m平面体量并沿用客厅原主灯锚点，不由餐桌位置牵引。
      - 300mm作为已同意250–350mm区间的本轮模型预演值，避免把预演参数写成SKU或施工结论。
    non_negotiables:
      - 不改 light_living_dome 电气点位、回路、墙控和 strong-light-living 路由。
      - 不移动餐桌、不改餐厅吊灯，不以餐桌中心确定客厅主灯位置。
      - 不恢复已因配光均匀度被否决的集中窄束轨道灯作为客厅唯一基础光。
      - 不把渲染发光强度当作实际流明、照度、U0或眩光证据。
    tradeoffs_accepted:
      - 概念模型会在客厅视线中形成可见的约300mm下垂体量；最终是否保留该下垂量仍须结合固定沙发视线和现场净高确认。

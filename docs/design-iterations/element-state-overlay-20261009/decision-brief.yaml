schema: interior-design-decision-brief/v3
project: bontop-design-log
iteration_id: element-state-overlay-20261009
subject: 构件级工程状态 3D 叠加层验收（W3/W4）
priority:
  user_goal: 3D 反映装修目标与状态；人与 agent 围绕同一套工程数据协作完成落地
  ranked:
    - 状态在 3D 可见（6 色 + 标记层 + 面板）
    - 每个构件的依据可追溯（statusSource / 未决问题 / 冲突）
    - 默认关闭不破坏既有视觉
  non_negotiables:
    - 不新建第二份状态真相（只派生）
    - 状态词汇复用 HVAC confirmed/inferred/pending
    - 禁止任何 git 操作
  tradeoffs_accepted:
    - 合批构件（电气/给排水 139 个）用标记层而非逐件上色（SceneBatcher 不支持逐件上色）
frozen: true
freeze_record:

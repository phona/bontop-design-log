  original_user_response: "「3D模型能反应装修目标与状态，人跟AI能围绕这套工程，完成整套装修落地」；「不需要mcp了，其实agent直接读配置跟curl请求接口跟mcp效果差不多的」"
  normalized_decisions:
    - "状态投影经 GET /api/element-state 送进 3D，不建 MCP"
    - "叠加层默认关闭，开启后按 status 上色 + 标记层 + 面板 + solo"
    - "conflicted 与 status 共用同一层（conflicted 本就是 ElementState 的一种状态）"
  confirmed_by_user: true

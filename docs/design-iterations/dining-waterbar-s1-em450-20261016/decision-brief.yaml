  changes:
    - 把米家S1、同一台EM450放在既有水吧带候选低柜台面上，程序化外廓按业主尺寸表达。
    - 把米家1400G净水器机身作为柜内包络对象，放在厨房水槽柜组东侧相邻格。
    - 删除当前餐厅已放置的立式茶吧机与旧390×400×920mm低边柜候选；替换为800×420×850mm水吧柜几何代理。
    - 把EM450的唯一放置实例从厨房移到餐厅，不复制。
    - 按业主“出水口朝东，水箱朝西”将S1几何部件从局部宽轴分排改为沿局部深度前后分层；外廓、位置和rotation不变。
forbidden:
  files:
    - config/layout/model-geometry.yaml
    - config/layout/overlay.yaml
    - config/electrical.yaml
    - config/electrical-topology.yaml
    - config/plumbing.yaml
    - config/ceiling.yaml
    - config/hvac.yaml
  objects:
    - 冰箱、餐桌、餐椅、玄关半高柜、吊顶、墙体、门洞、玻璃门、墙控和既有机电点位
  assumptions:
    - 不将水吧柜代理尺寸解释为业主确认的家具尺寸或施工尺寸
    - 不将RO机身位于简化柜壳AABB内解释为隔板/存水弯/滤芯维护已通过
    - 不将没有建模的独立净水龙头、电源、磨豆机或设备操作空间解释为已经落实
    - 不将静态冰箱与水吧间距解释为冰箱门、抽屉、取水和站人动态净距
  out_of_scope_changes:
    - 新增餐厅专用回路/插座或迁移墙控
    - 新增餐厅供水、排水、管线机或跨房间RO水路
    - 确认水吧定制柜施工尺寸或内部结构
    - 确认RO产品完整SKU、出水龙头型号、滤芯维护空间或采购价格
    - 建模磨豆机、粉锤、压粉区及完整咖啡工作流

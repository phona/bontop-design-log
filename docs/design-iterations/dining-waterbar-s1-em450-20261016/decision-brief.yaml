schema: interior-design-decision-brief/v3
project: bontop-design-log
iteration_id: dining-waterbar-s1-em450-20261016
subject: 餐厅水吧并置米家S1与德龙EM450，厨房水槽柜内放RO机身的真实模型预演
priority:
  user_goal: 按业主给定的设备尺寸，把台式即热饮水机与同一台EM450并置到餐厅水吧，在真实Three.js模型中查看效果；1400G净水器机身预演放在厨房水槽柜下。
  ranked:
    - 遵从业主最新指向表达东侧前出水、西侧后置水箱；保留312×106×280mm外廓、中心、rotationY=90°与台面接触，水箱内部结构仍不作真实性承诺
    - 保留S1高位开放出水仓、圆角主机身/水位标识、柔圆全宽机头和带栅格接水盘等可见细节
    - 保持冰箱、800mm水吧柜候选位、餐桌、玄关半高柜、吊顶、墙体、门洞和玻璃门的现有位置
    - 同一台EM450从厨房移至餐厅，不复制设备
    - 按业主尺寸建模米家S1及RO净水器机身
    - 保持设备、家具与基础设施松耦合，不新增跨房间供水或设备包覆
    - 用真实运行时外包络和固定视角确认空间关系
  non_negotiables:
    - 不移动冰箱、餐桌、玄关半高柜、吊顶、门洞、墙体和玻璃门
    - 不增加冰箱侧板或通顶柜
    - 不新增餐厅给排水、插座、回路或墙控迁改
    - 不把家具柜壳AABB包含关系当成RO机身实际安装通过
    - 不把候选低柜尺寸、设备外观代理或设备SKU写成施工定稿/采购结论
    - 不把V5西侧水箱壳体解释为厂家真实水箱容积、盖板拆取方向或维护结构
  tradeoffs_accepted:
    - 本轮水吧低柜以800W×420D×850H mm作为视觉预演代理，尺寸尚未由业主确认
    - RO图片中独立出水龙头本轮不建模，因缺准确SKU外廓与点位
    - 磨豆机没有SKU/尺寸，不建模；本轮只看EM450机身与S1的并置
frozen: true
freeze_record:
  alignment_id: chat-2026-10-16-waterbar-s1-em450-under-sink-preview
  original_user_response: "那就调整模型吧；S1尺寸312×106×280mm，1400G净水器机身尺寸163×445×379mm。随后确认净水器机身放厨下、同一台EM450移到水吧。"
  normalized_decisions:
    - 餐厅预演放入用户给定尺寸的米家S1，并把既有同一台EM450从厨房移到水吧，不新增第二台。
    - 1400G净水器机身按用户给定尺寸放在厨房水槽地柜内预演。
    - 冰箱、餐桌、水吧柜候选、玄关半高柜及建筑/吊顶对象保持现有位置。
    - 800×420×850mm水吧低柜只作为当前效果图代理，最终柜体尺寸待业主看图确认。
    - 不修改电气、给排水或墙控配置；设备安装和使用条件继续待现场/机电核验。
  confirmed_by_user: true
  confirmed_at: 2026-10-16
  evidence_refs:
    - conversation:2026-10-16-waterbar-appliance-placement
    - docs/design-iterations/dining-waterbar-s1-em450-20261016/fact-table.yaml

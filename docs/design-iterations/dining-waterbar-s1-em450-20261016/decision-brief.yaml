acceptance:
  validation_commands:
    - npm run verify:furniture
    - npm run verify:all
    - npm run test:server
    - npm run typecheck
    - npm run gate:visual
  browser_evidence_required: true
  required_views:
    - 餐厅人眼总览：S1、EM450、低柜和冰箱关系
    - 水吧设备近景：柜体台面、S1与EM450的真实尺度及间距
    - Three.js运行时对象坐标与AABB：含厨房RO机身及受保护对象
  aesthetic_review: PASS required
  functional_review: PASS required
  construction_review: pending
  blocking_issues:
    - 水吧低柜尺寸是视觉代理，尚未由业主冻结
    - 餐厅设备供电、墙控操作、补水与清洁净空未通过工程核验
    - RO机身柜内位置未验证隔板、存水弯和滤芯维护空间
  done_when:
    - 当前Three.js页面ready且配置错误横幅为空。
    - 同一台EM450只存在一个放置实例，位于餐厅水吧。
    - S1与RO机身的运行时外廓分别符合业主给定尺寸。
    - S1近景能读出东侧前置高位出水仓/喷嘴/接水盘与西侧后置机身的前后层级，顶盖分区沿设备深度轴；细部比例仍标记为图像估读。
    - V5近景能读出东侧出水仓/喷嘴/接水盘与西侧后置机身的前后分层；水箱细部仍标记为外观代理推断。
    - 冰箱、餐桌、半高柜和建筑坐标与保护基线一致。
    - 总览、近景截图与当前配置版本一致且非默认总览相机。
    - 工程待核事项明确保留，不误写为施工通过。
  delivery_notes_required: true

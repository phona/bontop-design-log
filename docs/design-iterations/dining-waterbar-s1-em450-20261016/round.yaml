      - config/electrical-topology.yaml:ordinary_power_kitchen,dedicated_kitchen_fridge
      - config/anti-penetration.yaml:kitchen_ro_purifier_inside_sink_base
      - config/house.yaml:living_dining,kitchen
    requested_changes:
      - 补充S1与EM450中国SKU铭牌、功率、插头和说明书。
      - 落实餐厅可及电源、回路、漏保和同时使用负荷。
      - 用真实墙控面板和柜体剖面验证墙控可达性。
      - 取得S1补水/清洁和EM450维护包络，复核94mm设备间隔是否足够。
      - 叠加冰箱厂家门扇/抽屉动态包络。
      - 复尺RO水槽柜有效内腔，确认隔板、存水弯、滤芯更换、进水阀、浓水排放、独立净水龙头和柜内插座。
      - RO浓水不得默认直插密封下水；必须按最终SKU确定水槽三通、防虹吸和水气分离做法。
    assumptions:
      - assumption: 本轮设备尺寸来自业主输入，模型AABB可作为视觉预演尺寸。

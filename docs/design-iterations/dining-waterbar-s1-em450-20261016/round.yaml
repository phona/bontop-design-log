  aesthetic_review_v3:
    verdict: PASS
    blocking_issues: []
    non_blocking_notes:
      - V3近景已经清楚表达左侧偏置的出水凹腔，右侧保留连续主机身，并在右侧正面形成竖向水位窗识别带，形体方向与参考图关键轮廓一致。
      - 跨越312mm宽度的上盖形成统一上部机头。它虽有水平线，但下方被左侧凹腔、出水口和右侧连续机身打断，整体读作立式饮水机，而不是横放的扁盒。
      - V3总览中细部会因距离和白色材质而减弱，但上盖、竖向主体和下部接水盘仍形成可识别的立式轮廓；近景足以审查细部。
      - V3没有改变S1的312×106×280mm外廓、中心(7.50,3.64)、rotationY=90°、台面标高0.85m或正面朝东；与EM450仍保持近齐平设备顶部和同一低柜台面关系。
      - 暖木台面、白色矮柜和白色S1形成连续背景；左凹腔、喷嘴、水位窗与阴影提供识别，EM450深色面板作为旁侧视觉焦点。
      - 本轮替换了V2对称凹腔、居中出水口和对应外壳表达；没有删除S1实例、用户尺寸、既有摆位、低柜、EM450、冰箱、餐桌、半高柜或建筑坐标。
      - V3会在最终SKU左右结构/正面定义不同、真实机头和凹腔比例差异明显、改变旋转/机位仍沿用截图，或灯光和白色材质抹去凹腔/水位窗细节时静默失效。
    evidence_refs:
      - evidence/s1-form-v3-overview.png
      - evidence/s1-form-v3-close.png
      - evidence/runtime-query-s1-form-v3.json
      - s1-shape-correction-v3.md
    requested_changes: []
    assumptions:
      - V3基于用户给定外廓和效果图轮廓做程序化外观代理，不等于厂家CAD或内部结构确认。
      - 本复核只判断产品识别、比例、材质层次和与低柜/EM450的视觉关系，不验收补水、出水、清洁、散热、维修或电气功能。
      - 形体、尺寸、中心、朝向或机位变更时，当前V3审美证据失效，需要重新固定机位评审。
  functional_review_v3:
    verdict: BLOCKED
    blocking_issues:
      - id: dining_power_unresolved
        status: site_pending
        fact: S1和EM450均位于餐厅低柜台面上；本轮没有新增餐厅插座、回路或线缆。现有墙控不是电源点，旧厨房冰箱插座也不服务餐厅水吧。
        issue: 无法确认两台设备的中国SKU功率、同时使用负荷、接地插座、回路容量、漏保和可维护断电位置。项目电气口径对2kW及以上设备要求单独核回路。
        required_change: 取得两台设备铭牌/说明书，落实餐厅可及接地插座和回路方案；不得把墙控点、旧冰箱点或普通插线板当作已解决电源。
      - id: wall_control_access_unresolved
        status: site_pending
        fact: 低柜AABB为x[7.22,7.64]、z[3.47,4.27]、顶高0.85m；既有墙控带约z[3.98,4.10]、安装高1.30m。
        issue: 控制点标高高于台面，但面板外廓、底盒、台面物品和从柜前伸手操作空间未建模。柜体z范围覆盖墙控带，不能仅凭无垂直AABB重叠判定可达。
        required_change: 按实际面板尺寸、柜体剖面和真人操作包络复核；必要时为墙控保留开放后段或调整柜体分段。
      - id: s1_maintenance_unresolved
        status: site_pending
        fact: S1 V3 AABB为x[7.447,7.553]、y[0.85,1.13]、z[3.484,3.796]；中心、朝向、台面支承和EM450之间94mm静态间隔不变。
        issue: 顶部补水、水箱拆取、杯具放置、接水盘清洁、出水操作及侧后维修空间未建模；V3可见外壳不能替代厂家维护尺寸。
        required_change: 取得准确SKU说明书/实机资料，补做补水、取杯、清洁、拆卸和侧后维护包络。
      - id: fridge_dynamic_clearance_unresolved
        status: site_pending
        fact: 冰箱AABB约x[7.2025,7.8025]、z[2.57,3.403]；低柜北缘约z=3.47，柜与冰箱静态间距约67mm，S1到冰箱静态间距约81mm。
        issue: 静态机身不重叠不能证明冰箱门扇、抽屉、拉手、人员站位和整机更换路径不会与水吧操作冲突。
        required_change: 叠加厂家门扇/抽屉包络，核验冰箱开启、S1取水、EM450操作及人员站位。
      - id: ro_cabinet_internal_fit_unresolved
        status: site_pending
        fact: RO机身AABB约x[9.9685,10.1315]、y[0.08,0.459]、z[0.0975,0.5425]，被简化柜体包络包含。
        issue: contained豁免只表达设备收在柜内的预期，不证明隔板、有效内宽、存水弯、下水器、滤芯抽取、进水阀、电源和柜门维修净空通过。
        required_change: 按最终RO SKU复尺水槽柜有效内腔，确认隔板拆改、滤芯/整机抽取路径、存水弯和下水器空间，并做柜门开启与维修演示。
      - id: ro_water_drain_faucet_unresolved
        status: site_pending
        fact: 项目已有水槽/净水器候选点：faucet_kitchen_sink与faucet_kitchen_purifier同位(9.50,0.30)，drain_kitchen_sink同位，sock_kitchen_purifier同位；相关路线和立管仍为inferred/pending。
        issue: 这些点位能支持候选接入方向，不能证明现场已有可直接施工的给水、排水、电源和独立净水龙头。独立出水龙头尺寸、开孔和安装位置在本轮未建模。
        required_change: 复尺水槽柜、给水阀、排水立管和电源；按RO说明书确定净水龙头开孔、浓水三通、防虹吸/水气分离和检修方式。
    non_blocking_notes:
      - id: static_geometry_pass
        status: confirmed
        note: 当前运行时含低柜、S1、EM450、RO、冰箱和餐桌；各设备按业主给定外廓落位，低柜台面高0.85m，S1/EM450底面接触台面，静态AABB未直接穿模。
      - id: v3_shape_only_no_new_functional_collision
        status: confirmed
        note: V3把出水凹腔左移并保留右侧机身/水位窗；S1中心、rotation、AABB、台面支承、与EM450的94mm静态间距均不变，未新增静态碰撞。餐厅电源、墙控、设备维护、冰箱动态净空和RO柜内安装仍为阻断项。
      - id: v3_geometry_scope_audit
        status: confirmed
        note: 独立功能复核基于V3 source digest和V3截图；确认V3只改S1可见外形，不改外廓、朝向、位置、支承或机电对象。
      - id: ro_candidate_route_exists
        status: inferred
        note: 厨房已有水槽到净水器的候选给水支路和水槽排水路线；它们仍是协调级/待量房路线，不能当作施工完成事实。
      - id: cabinet_service_boundary
        status: confirmed_limitation
        note: 低柜为800×420×850mm视觉代理；门扇、抽屉、隔板、背板、承重和防倾倒节点未深化。
      - id: no_new_cross_room_plumbing
        status: confirmed
        note: 本轮没有新增餐厅给排水，也没有把厨房RO水路跨房间接到餐厅。
    evidence_refs:
      - evidence/runtime-query-s1-form-v3.json

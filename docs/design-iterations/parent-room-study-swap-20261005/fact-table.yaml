notes:
  - "本轮为纯讨论轮次：未修改任何配置文件、未生成任何渲染证据、未宣称施工冻结。"
  - "三轮讨论口径：R1 只换功能不换几何 + 删除健身器材；R2 父母要求客房与主人区隔开（支持东南客房方案）+ 书房承担更多储物；R3 不急着开工、持续讨论并建立本工作区。"
  - "历史关联：DEC-2026-08-26-046（书房多功能+杠铃训练）、DEC-2026-09-03-053（轻训练三件套）在本轮整体作废范围由 align-fitness-cancellation 最终裁定；DEC-2026-08-02-013'父母房预留改书房'的弹性设计转写对象改为客房。"
  - "model-geometry.yaml 的 room name 字段（study=父母房 / bedroom_se=书房）与 overlay.yaml 窗帘 reason 注释在实施时需同步改写，但仅限 name/注释文字，禁止任何几何改动。"
  - "所有'约/粗算'数值（起夜距离、面积口径、W/㎡）均为未交房状态下由几何推导，量房后须复核。"

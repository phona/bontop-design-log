    - id: align-night-path-lighting-design
      category: electrical
      question: 起夜地面灯方案：点位（客房内床边/客房门外/客厅过渡段/主走廊/客卫门口与内卫）、是否新增独立照明回路（建议 lighting_night_path，避免与日常灯混回路）、控制策略（独立 PIR 感应保底 vs 智能网关联动 vs 混合），照度/色温/防眩光/延时参数如何定？
      fact_refs:
        - fact-lighting-baseline
        - decision-night-path-lighting
        - pending-night-path-surfaces
        - pending-night-path-illuminance
      options:
        - 混合：路径独立感应保底 + 客房内智能调光小夜灯
        - 全独立感应回路（简单可靠、无网络依赖）
        - 全智能联动（依赖网关与配置）
        - 暂不决定
      selected: R15：保留夜路径低位灯并入既有照明回路；R12：客卫 NP-6/7/8 内置灯删除，进卫使用 light_gbath_panel + switch_gbath 手动照明，入住后如需要再按需增加可插拔感应夜灯。当前保留 5 个建模夜灯点位（NP-2 规划为插电式）；业主决定删除 NP-4b，不新增替代点位。NP-4a→柜体 NP-5 直线约 5.97m，超过 3m 暗区候选上限，覆盖缺口待路径实走与照度复核。

      - facts.yaml 跨文件对账改写后 verify:facts 通过
      - test:server/test:app/verify:all/typecheck 全绿
      - 同版本浏览器证据 valid（含起夜路径视角）
      - 美学/功能双评审 PASS
      - decision_log 新增 DEC 条目并建新旧功能映射表
    delivery_notes_required: true
    freeze_gates:
      - 起夜动线接受度对齐
      - 电梯井噪声实测与床头方位对齐
      - 客房排布方案选定
      - 书房储物内容与柜体形式对齐
      - 书房东墙/电视挂装边界对齐
      - 衣柜选型与预算出处对齐
      - 健身器材处置对齐
      - 命名口径对齐
      - facts 跨文件改写回归
  discussion_log:
    - round: 1
      date: '2026-10-05'
      summary: 业主提出交换父母房与书房并删除健身器材；确认只换功能不换几何。产出：互换零硬成本结论（合同/机电/天花不动）、两房布置草案、三个待解决问题（面积/动线/噪音）、四项待拍板
    - round: 2
      date: '2026-10-05'
      summary: 父母建议客房与主人区隔开 → 支持东南客房方案；书房承担更多储物。产出：隔开的收益与三个新问题（起夜动线、电梯井共墙[新发现]、客厅共墙）、书房四面墙储物盘点、客房两个排布方案
    - round: 3
      date: '2026-10-05'
      summary: 业主确认不急着开工、持续讨论，同意建立本迭代工作区（五件协议）
    - round: 4
      date: '2026-10-05'
      summary: 业主确认接受互换的功能代价（面积收缩/起夜动线/卫浴共用），方案继续；同时立项起夜路径照明——人接近即自动亮起的地面灯（覆盖客房→客厅→主走廊→客卫）；业主补充'不只这套房子'，需确认是否沉淀为可复用标准
    - round: 5
      date: '2026-10-05'
      summary: 业主拍板 A+B：起夜照明同时'本户落地 + 沉淀为可复用标准'。产出 docs/standards/night-path-lighting.md v1（坐标无关标准）+ 本户实例 8–9 个候选点位（NP-1..NP-9）与独立回路 lighting_night_path；发现过渡段暗区超 3m 上限需补 NP-9。剩余 9 项 alignment，转入客房排布议题
    - round: 6
      date: '2026-10-05'
      summary: 业主要求先聊透约束（'不然我觉得你会做偏'）。产出约束台账 constraints-ledger.md v1（A 几何结构/B 合同采购/C 既有决策/D 标准验证/E 自我审计 7 项/F 优先队列），并把待决事项重排为 Tier 0/1/2 一次只问一个
    - round: 7
      date: '2026-10-05'
      summary: Q1 关闭：客房按正常客房设计（偶尔来住），不做无障碍/隔声加码，'有预算再慢慢改'；同时明确该承诺成立的前提是 fact-preprovision-list（水电交底前必须预留电位/回路/底盒/零线/网口/北墙隔声条件），可后补项与必预留项分开列。电梯噪声仍实测，但缓解手段只用免费的（床头靠东外墙+北墙衣柜声屏障）
    - round: 8
      date: '2026-10-05'
      summary: Q2 关闭：书房柜体与起夜照明采购/安装全部推到二期；但预留条件（床头双侧电位、lighting_night_path 回路与底盒、调光零线、网口、北墙隔声条件）必须进一期水电交底清单，否则二期变砸墙。业主同意先做 3D 设计与规划、不急着继续。推进方式改为三阶段：阶段0 纸面预演（零改动）→ 阶段1 候选入配置+3D 评审（可回滚）→ 阶段2 量房实测后定稿并走正式实施+二期采购
    - round: 9
      date: '2026-10-05'
      summary: 业主拍板开始：v0 最小交换按稳健摆法实施完毕（DEC-2026-10-05-R9）。两房家具/名称互换、健身器材全链路删除、facts 对账更新、测试与生成物同步、schedule PKG-150 描述改写；verify:all + test:server 608 + test:app 470 + typecheck 全绿，全部 candidate_not_frozen、可回滚。下一步：量房四项实测（凸窗带/电梯噪声/门洞位置/墙体构造）后定客房排布终版与书房储物
    - round: 10
      date: '2026-10-07'
      summary: DEC-2026-10-07-R12：业主决定删除客卫 NP-6/7/8 三个内置低位夜灯，使用现有客卫主灯手动照明；入住后如确有需要，再按需添置可插拔感应夜灯。

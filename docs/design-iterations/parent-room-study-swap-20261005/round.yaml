        - 暂不决定
      selected: 接受并用照明缓解（2026-10-05 R4 业主拍板），且照明升级为必做项：人接近即自动亮起的起夜地面灯，覆盖客房→客厅→主走廊→客卫全程
      user_response: '''这个没关系，我们还需要做，接近就自动亮起地面灯，提高起夜的体验感'''

    - id: align-fitness-cancellation
      question: 健身器材彻底取消，还是迁移到主卧/客厅保留轻训练？
      blocks:
        - procurement 条目处置
    - id: align-naming-scope
      question: 命名口径确认：room id 一律不改，仅改 model-geometry/house 的 name 与注释，在决策日志建'旧功能→新功能'映射表；HVAC/电气点位 id（ac_parent/ac_study/sock_study_* 等）只改注释不改 id。是否采纳？
      blocks:
        - 实施范围
    - id: align-facts-crossfile-rewrite
      question: config/facts.yaml 跨文件对账当前把'父母房 12.75㎡'与 HVAC 220W/㎡ 口径绑定；互换后须改写为'父母房 8.35㎡ / 书房 12.75㎡'并重算 W/㎡，是否随本轮一并收口？
      blocks:
        - verify:facts 回归
    - id: align-guest-bath-distance-resolved
      question: （2026-10-05 R4 已收口）起夜动线由约 2m 增至约 8–9m 由业主接受；对策升级为必做项——人接近即自动亮起的地面灯，见 decision-night-path-lighting
      blocks: []
    - id: align-night-path-lighting-design
      question: 起夜照明按 R15/R12 形成当前基线：5 个内置路径灯并入既有回路，NP-4b 已删除，客卫用主灯手动控制；NP-4a→NP-5 约 5.97m 覆盖缺口及感应参数待深化
      blocks:
        - 电气点位申报
        - 预算条目
        - decision-brief 冻结
    - id: align-portfolio-scope
      question: 业主表示'不只这套房子'：本方案是按'父母偶尔来住'定位，还是要把起夜照明沉淀成可复用到其他住宅的标准？
      blocks:
        - 是否新增可复用标准文档
        - 方案详细程度
  notes:
    - 本轮为纯讨论轮次：未修改任何配置文件、未生成任何渲染证据、未宣称施工冻结。
    - 三轮讨论口径：R1 只换功能不换几何 + 删除健身器材；R2 父母要求客房与主人区隔开（支持东南客房方案）+ 书房承担更多储物；R3 不急着开工、持续讨论并建立本工作区。
    - 历史关联：DEC-2026-08-26-046（书房多功能+杠铃训练）、DEC-2026-09-03-053（轻训练三件套）在本轮整体作废范围由 align-fitness-cancellation 最终裁定；DEC-2026-08-02-013'父母房预留改书房'的弹性设计转写对象改为客房。
    - model-geometry.yaml 的 room name 字段（study=父母房 / bedroom_se=书房）与 overlay.yaml 窗帘 reason 注释在实施时需同步改写，但仅限 name/注释文字，禁止任何几何改动。
    - 所有'约/粗算'数值（起夜距离、面积口径、W/㎡）均为未交房状态下由几何推导，量房后须复核。

open_questions:
  - { id: align-guest-bath-distance, category: function, question: "起夜动线由约 2m 增至约 8–9m 是否接受？低位感应照明/床头小夜灯/客卫门口扶手防滑做到什么程度？", fact_refs: [fact-night-path-distance, fact-bathrooms-only-west, fact-lighting-baseline], options: [接受并用照明+扶手缓解, 只能接受更短动线（则互换方案需重议）, 暂不决定], selected: "接受并用照明缓解（2026-10-05 R4 业主拍板），且照明升级为必做项：人接近即自动亮起的起夜地面灯，覆盖客房→客厅→主走廊→客卫全程", user_response: "'这个没关系，我们还需要做，接近就自动亮起地面灯，提高起夜的体验感'", status: resolved }
  - { id: align-elevator-noise, category: function, question: "客房北墙与电梯井共墙，是否在量房时实测夜间噪声并预留北墙隔声预算？床头是否因此固定靠东外墙？", fact_refs: [fact-elevator-adjacency, pending-elevator-noise], options: [量房实测后定床头方位与隔声, 先按床头靠东外墙设计、不做隔声, 暂不决定], selected: null, user_response: null, status: open }
  - { id: align-study-storage-content, category: function, question: "书房储物具体装什么（书/文件/设备/行李箱被褥/换季衣物）？决定开架 vs 封闭柜、深度、是否吊柜", fact_refs: [fact-study-storage-walls, decision-study-storage], options: [以书+文件为主（南墙开架+东墙吊柜）, 以换季被褥/行李箱为主（北墙后台柜+床箱思路延续）, 混合（开架+封闭柜都做）, 暂不决定], selected: null, user_response: null, status: open }
  - { id: align-study-east-wall-tv, category: construction, question: "书房东墙即客厅电视墙（客厅侧通顶柜 z[5.55,6.90]、低柜 z[6.95,9.05]、65\" 挂装 z=8.00 已占满），书房侧深柜/吊柜如何避让挂装锚栓与双层墙厚？", fact_refs: [fact-study-storage-walls], options: [东墙只做吊柜（底≥1.60m）+矮柜（≤0.85m），中部留空给挂装区, 东墙整体留空、主力储物改南墙+西墙, 暂不决定], selected: null, user_response: null, status: open }
  - { id: align-guest-room-layout, category: geometry, question: "客房排布：方案一（床靠东外墙 x[14.40,16.40]、1.8m 衣柜北墙边吊下、床尾半进凸窗带）vs 方案二（床靠北墙全避凸窗带、衣柜缩至 1.2–1.5m 放西墙门下）？", fact_refs: [fact-room-geometry-bedroom-se, fact-doors-both-rooms, fact-bay-band-limits, pending-wardrobe-product], options: [方案一（收纳足、床头远离双噪声源、衣柜门前约 0.4m 偏紧）, 方案二（通道宽松、收纳少、床头贴电梯井墙）, 3D 评审后定], selected: null, user_response: null, status: open }
  - { id: align-wardrobe-180-fit, category: budget, question: "1.8m 成品衣柜是否保留（PKG-150 池内、¥19,000 描述改写）还是缩到 1.5m/1.2m？2.4m 高推拉门款何时选型", fact_refs: [fact-phase1-scope, pending-wardrobe-product], options: [保留 1.8m（方案一北墙落位）, 缩 1.5m/1.2m（方案二西墙落位）, 暂不决定], selected: null, user_response: null, status: open }
  - { id: align-study-storage-budget, category: budget, question: "书房柜体增量预算出处：删除健身释放的约 ¥1,800 + QR-2026-10-03-26（¥18,000 固定柜体候选，未下单）扩范围，还是归二期？", fact_refs: [fact-fitness-budget, fact-phase1-scope, fact-preprovision-list], options: [PKG-150/QR-26 范围内调剂, 归二期, 暂不决定], selected: "归二期：书房柜体与起夜照明的采购/安装全部推到二期；但 fact-preprovision-list 预留条件（床头双侧电位、现有路径灯位的供电条件、床头零线、网口、北墙隔声条件）按当前方案留在一期水电交底清单内；客卫不预埋内置夜灯，成本接近零（多走管多留盒），否则二期变成砸墙工程", user_response: "推到二期。但是我们可以先设计3D模型，做好规划", status: resolved }

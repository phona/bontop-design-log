schema: interior-design-decision-brief/v3
project: bontop-design-log
iteration_id: parent-room-study-swap-20261005
subject: 父母房↔书房功能互换（几何不动）+ 客房隔开 + 书房储物扩容 + 删除轻训练器材
priority:
  user_goal: 把客房（供父母/客人）放到东南角 bedroom_se，与主人区（主卧/主卫）完全隔开；西侧中间房 study 改纯书房并扩容储物；删除书房轻训练器材。全程只换功能不换几何，不急着开工，先把方案聊透
  subject_refs: [study, bedroom_se, bed_150, wardrobe_180, study_seasonal_wardrobe_wall, desk, chair, shelf, home_fitness_light_set]
  review_priority: [起夜动线 8–9m 的接受度与照明对策, 电梯井共墙隔声, 客房面积从 12.75㎡ 收缩到 8.35/9.45㎡ 后的家具排布, 书房东墙柜体与客厅 65 寸电视挂装的关系, 书房储物装什么与预算出处]

  ranked: [功能互换零硬成本（合同/机电/天花全部不动）, 客房与主人区隔开（父母诉求）, 老人使用安全（起夜动线、防滑、床边可达）, 家具成品化可逆（不通顶、可搬走）, 书房储物扩容但不塞满（保留一间房改回卧室的可能）, 预算只做平移与等额置换（不新增科目）]
  non_negotiables: ["model-geometry.yaml / overlay.yaml 只允许改 name 与注释文字，禁止任何几何/顶点/墙体/房间边界改动", "两房空调 MJV-28T2/P-SS 机位、风管、冷凝水与 ¥36,000 成交合同不动", "家具不得侵入 d_study 扫掠域 x[6.15,7.05] z[5.55,6.45] 与 d_bese 扫掠域 x[13.40,14.30] z[5.65,6.55]", "bedroom_se 内衣柜/柜体高度 ≤2.40m（北墙边吊与东北角吊底 2.50m）", "电气挂墙点位必须在实体墙上、玻璃幕墙不得挂载", "不新增同义家具类型（复用 bed_150/mattress_150/wardrobe_180/shelf/study_seasonal_wardrobe_wall）"]
  tradeoffs_accepted: [客卫只能共用，东南翼加卫生间须改西侧排水立管、不现实, 起夜动线由约 2m 增至约 8–9m，客房至客卫门口由低位引导灯缓解；客卫内用现有主灯手动照明, 客房面积收缩且北墙贴电梯井、西墙贴客厅电视墙，用床头方位（靠东外墙）与北墙衣柜声屏障缓解, 书房东墙是客厅电视墙，深柜方案受限，可能改用吊柜/矮柜或把主力储物放到南墙/西墙, 删除健身器材释放的预算（约 ¥1,800 未核价）大概率被书房柜体增量吃掉，净值接近零]
frozen: false # 讨论轮次；10 项 alignment 未收口、无浏览器证据、无配置改动

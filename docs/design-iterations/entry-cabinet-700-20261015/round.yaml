  project: bontop-design-log
  iteration_id: entry-cabinet-700-20261015
  subject: 玄关双面半高柜700mm北端落物区结构深化
  priority:
    user_goal: 冻结1420mm上部结构与700mm北端920mm落物区，形成柜商深化输入
    ranked:
      - 920mm落物面承接背包、快递和购物袋
      - 冰箱、柜体、餐桌、吊顶、门洞和玻璃门的位置不变
      - 保留南段约1300mm高位界面及浅橡木入户立面
      - 餐厅侧保留低频北段和南段普通平开门，内部保持可达
      - 结构简单、常规维护，不采用复杂机构
    non_negotiables:
      - 半高柜主体中心(11.50,4.00)、Y旋转90度和2000×350mm主体平面范围不迁移
      - 台面完成面标高920mm；上部最高点1420mm
      - 柜体北端700mm局部降低；南段保留高位木纹界面
      - 入户东侧上部浅抽屉带、下部完整浅橡木面；不设下部入户侧平开门
      - 餐厅西侧北段固定低频收纳，南段普通平开门
      - 不加冰箱侧板，不增通顶高柜
      - 冰箱厂家净空不能用模型侧缝替代
    tradeoffs_accepted:
      - 700mm台面按主体分段名义面积0.245平方米；393mm实体深度对应约0.275平方米
      - 台面本身北端外挑20mm，因此裸露白台面最长约720mm
      - 南段名义高位模块1300mm；扣除两个18mm端板后净木纹背板约1264mm
      - 北段为低频区，只有在连续腔体和层板可拆路径成立时才保留储物功能
      - 餐厅南门面板开启时会暂占用柜体西侧局部通行空间
  frozen: true
  freeze_record:
    alignment_id: user-confirmed-entry-cabinet-700-20261015
    confirmed_at: '2026-10-15'
    original_user_response: |
      冻结玄关方案：不移动冰箱、半高柜、餐桌、吊顶、门洞或玻璃门；保留1.42m上部；北端局部降低700mm形成920mm落物区；入户侧浅橡木立面、上部浅抽屉、下部无入户平开门；餐厅北段低频、南段可开门；不加冰箱侧板或通顶高柜。下一阶段只做结构深化和施工可行性确认，不再开新概念方案。
    normalized_decisions:
      - 现有活跃柜体坐标(11.50,4.00)、方向与主体范围原位冻结
      - 低区按主体北端z=3.00–3.70m；台面顶920mm
      - 高位模块从z=3.70m延至主体南端；最高标高1420mm
      - 北固定/低频、南平开门的餐厅面按vendor-handoff.md尺寸链深化
      - 现有Round7 view-only图作为已选比例/视线参考，不当作正式源模型
    confirmed_by_user: true
    evidence_refs:
      - conversation:user-confirmed-entry-cabinet-freeze
      - tmp/screenshots/entry-round4/round7-preview-manifest.json
  allowed_scope:
    - docs/design-iterations/entry-cabinet-700-20261015

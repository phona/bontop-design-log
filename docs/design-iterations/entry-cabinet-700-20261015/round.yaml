    - docs/decisions/README.md: update index row and count
    - object: furniture:living_dining:entry_half_height_cabinet:7
  forbidden:
    - 移动冰箱、半高柜、餐桌、吊顶、入户门、门洞或玻璃推拉门
    - 恢复100mm浅条、600/800mm落物段、通顶高柜或冰箱侧板
    - 把65/85mm模型几何间距宣称为冰箱厂家安装净空
    - 把柜商深化输入单当作生产下料或施工放线图
    - 未经业主确认改变已展示的两片浅抽面立面为三片
  supersession_review:
    - prior_decision: DEC-2026-08-20-032
      prior_conclusion: entry_half_height_cabinet 2.0×0.35×1.5m，中心(11.50,4.10)，餐厅侧0.9–1.5m开放格。
      superseded_scope: 本轮明确替换1.50m旧上部高度、旧餐厅开口/门板方向与收纳分配；保留落地双面柜概念、主体平面规格及不挂玻璃墙的约束。中心采用当前活动模型(11.50,4.00)，由业主要求现位保留。
      reason: 业主现已冻结1420mm总顶、700mm北段落物区、入户浅橡木与浅抽屉、餐厅北低频/南平开门。旧决议记录中心4.10m而活动源为4.00m，本轮不再移动，旧中心差100mm的历史原因未追溯。

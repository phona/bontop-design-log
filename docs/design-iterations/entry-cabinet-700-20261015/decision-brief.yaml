acceptance:
  - 柜商图明确2000×350主体、台面393mm深、台面顶920mm、总顶1420mm及北端700mm降低段的尺寸语义
  - 入户侧下部整面浅橡木、两片浅抽面、无下部平开门
  - 餐厅固定北段与860mm名义南门尺寸链闭合，北低频腔体可由南门到达
  - 南门和两只抽屉活动包络与冰箱、入户门、走道及开关面板复核
  - 冰箱厂家净空、电源、柜体固定基层和暗管现场核验后，才可生产/安装放行

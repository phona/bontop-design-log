    prior_conclusion: "entry_half_height_cabinet 2.0×0.35×1.5m，中心(11.50,4.10)，餐厅侧0.9–1.5m开放格。"
    superseded_scope: "本轮明确替换1.50m旧上部高度、旧餐厅开口/门板方向与收纳分配；保留落地双面柜概念、主体平面规格及不挂玻璃墙的约束。中心采用当前活动模型(11.50,4.00)，由业主要求现位保留。"
    reason: "业主现已冻结1420mm总顶、700mm北段落物区、入户浅橡木与浅抽屉、餐厅北低频/南平开门。旧决议记录中心4.10m而活动源为4.00m，本轮不再移动，旧中心差100mm的历史原因未追溯。"

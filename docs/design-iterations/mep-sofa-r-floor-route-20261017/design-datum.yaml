        axes: x/z
        direction: 北朝上(-z)，南朝下(+z)
        position: { from: { x: 13.4, z: 3.6 }, offset_to_room_side: { x: 13.2, z: 3.6 }, floor_turn: { x: 13.2, z: 9.35 }, endpoint: { x: 11.0, z: 9.35 } }

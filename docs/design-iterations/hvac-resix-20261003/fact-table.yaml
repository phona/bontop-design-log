    - id: F1-contract
      statement: "2026-10-04 定标成交 36,000 元：外机美的领航者Ⅳ MJV-200W-E01-LHIV 20kW 14,124 + 安装 1,400×6=8,400 + 6 台双出风内机 /P-SS；签约方南宁长旺建材家居市场美的中央空调智慧空气馆长旺家中店；项目邦泰璟和 8-701"
      source_refs: ["evidence/hvac-contract-attachment-p1-20261004.jpg"]
      confidence: high
      impact: material
    - id: F2-capacity-mapping
      statement: "内机容量表为照片判读 71T2 + 42T2 + 56T2 + 28T2×3 = 25.3kW（连接率 1.27），与 R6 设计口径 21.6kW/1.08 不一致；房间映射须以合同正式选型附图为准"
      source_refs: ["evidence/hvac-contract-attachment-p1-20261003.jpg", "docs/decision_log.md DEC-2026-10-04-R1"]
      confidence: medium
      impact: material
      note: "**这是唯一悬而未决的设计输入**；到手前 config 的 indoor_nominal_kw_total 仍为设计口径 21.6，采购值只活在 note 字符串"
    - id: F3-area
      statement: "客餐厅（living_dining）实际面积 44.58㎡（polygon 实测），bbox 45.88㎡ 含 1.3㎡ 凹口；早前 RFQ 把「客厅 45.88㎡ + 餐区 14㎡」并列属重复计量"
      source_refs: ["config/layout/model-geometry.yaml", "config/house.yaml:177"]
      confidence: high
      impact: material
    - id: F4-pipe-lengths
      statement: "冷媒管按 mep 实测：主铜管 ≈9.8m（含 2.05m 立管）在同小区参考报价的「主铜管≤10m」免费额度内；支管餐厅 0.45 / 父母 2.55 / 主卧 3.40 / 儿童 3.45m 均在「支管≤7m」内；仅书房支管 7.70m 超 0.7m（金额可忽略）"
      source_refs: ["config/mep-hvac-coordination.yaml", "evidence/reference-quote-bangtai-110-20260427.xlsx"]
      confidence: high
      impact: minor
    - id: F5-duct-pricing
      statement: "风口加长与复合风管不在 36,000 内：加长按 100 元/米另计；合同备注 5 声明不含税。故 36,000 非最终落地价"
      source_refs: ["evidence/hvac-contract-attachment-p1-20261004.jpg 备注 2/5"]
      confidence: high
      impact: material
    - id: F6-indoor-power
      statement: "多联机内机自身电负荷 = 风机+水泵+控制，单台约 40–90W（22T2 40W / 28T2 50W / 71T2 75W），压缩机在室外机；hvac_power_living/bedrooms 的 ≤0.5–0.6kW 容量口径成立"
      source_refs: ["evidence/midea-indoor-unit-spec-20261003.jpg"]
      confidence: high
      impact: major
  corrected:
    - id: C1-composite-duct
      statement: "曾记录「36,000 含复合风管（前两家排除）」——错误。合同备注 2 明确不含复合风管、不含风口加长"
      corrected_in: ["docs/decision_log.md DEC-2026-10-04-R1", "docs/pending-site-data.md #39", "schedule/procurement.md", "config/hvac.yaml"]
    - id: C2-gas-alarm-distance
      statement: "曾以点到点算出燃气报警位距油烟机/排风口 0.65m 判为合规——错误。按机体最近缘实为 0.18m/0.26m，违反 CJJ/T 146-2011 的 >0.5m；已北移至 (10.80,0.20)，重算 0.53m/0.61m"
      corrected_in: ["config/electrical.yaml sock_kitchen_gas"]
    - id: C3-outdoor-power
      statement: "曾把外机供电遗漏在整个 19 路拓扑之外（20kW 属 2kW 以上设备，GB 55038 7.4.4 要求单独成路）——已补第 20 路 hvac_power_outdoor_a2 + 点位 + 走线，回路总数 19→20，并重算箱体结论（单排出局）"
      corrected_in: ["config/electrical.yaml", "config/electrical-topology.yaml", "config/mep-hvac-coordination.yaml", "config/hvac.yaml"]
    - id: C4-setpoint-dehumidify
      statement: "曾建议餐区设 27℃ 压过冷——与除湿目标冲突（温度越高运行越短、除湿越差）；改为 26℃"
      corrected_in: ["docs/decision_log.md DEC-2026-10-04-R1"]
    - id: C5-swap-savings
      statement: "曾判断「换 28 级应退差价」——不成立。报价单 56T2 2,131 vs 28T2 2,050–2,493，整包含价下换机无金钱动机，且 56T2 机身 900mm 大于 28T2 的 700mm，换机需重做风管；故保留 56T2"
      corrected_in: ["docs/decision_log.md DEC-2026-10-04-R1"]
    - id: C6-3d-panel-free
      statement: "曾把「百叶沿顶」与「风口西移」并列为三招免费手段——误导。前者只拨导叶、不动风管（0 元）；后者要加长风管，风口加长 100 元/米且不含在 36,000 内，已降为条件性措施"
      corrected_in: ["docs/decision_log.md DEC-2026-10-04-R1"]

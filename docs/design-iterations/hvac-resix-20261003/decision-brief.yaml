subject: 中央空调重配：20kW 外机 + 双出风内机，36,000 成交，数据模型收口
priority:
  user_goal: 在 ¥36,000 暖通池内把空调从"销售堆容量"改回"按空间负荷配"，并让仓库对同一问题只有一个当前答案
  ranked: [按负荷配内机, 外机容量留合理余量, 数据一致性, 可施工冻结]
  non_negotiables:
    - "GB 55038-2025 7.4.3-1：电源插座回路 ≤30mA RCD"
    - "GB 55038-2025 7.4.4：2kW 及以上用电设备回路分别设置（外机单独成路）"
    - "CJJ/T 146-2011：燃气探测器距灶具及排风口 >0.5m、天然气近顶 ≤0.3m"
    - "同一问题在仓库所有入口只有一个当前答案"
  tradeoffs_accepted:
    - "接受销售的双出风 /P-SS 系列（升级：全带泵、解决直吹、省 3D 面板）"
    - "接受容量表 25.3kW/1.27 而非设计 21.6kW/1.08（业主决定不返工，以风口与温度管理）"
    - "接受第七台/厨房扩展空间关闭"

open_questions:
  - {id: contract-mapping, question: "合同房间映射与逐台容量表", status: site_pending, selected: 待合同附图, handling: "到手后以 r1_amendment 回写 config"}
  - {id: box-spec, question: "强电箱单排/双排与是否换箱", status: site_pending, selected: 待量房, handling: "20 路下单排出局；单排则换箱或上移至 ≥1.80m", basis_status: "handling 基于已过期的 20 路基数（DEC-2026-10-04-R2 时点），原 question「箱体单/双排与是否换箱」仍未闭环；按 21/22 路的重推见下方 box-spec-21-22"}
  - id: box-spec-21-22
    question: "按现行 21 路（微蒸烤预留激活后 22 路）重推：390mm 箱单排是否仍出局、是否必须换箱？"
    status: site_pending
    selected: "待量房开箱（箱体实际位数/单双排/净深均未实测）"
    supersedes: box-spec
    relation_to_box_spec: "box-spec 的 handling 原文一字未改，仅加 basis_status 标注其 20 路基数已过期；本条是重推，不是新决定——原判据在新基数下逐条复算，结论不变"
    derivation:
      original_criterion:
        what: "位数不够（不是净深不够）：390mm 单排箱约 20 位，扣 2P 进线开关 + 浪涌后约 16 位可用；回路数对约 16 位可用确定装不下 → 单排出局，必须双排或换箱"
        source: "docs/decisions/06-electrical.md:215（DEC-2026-10-04-R2 ②「外机供电四层补齐 + 第 20 路 + 单排箱出局」）；「390mm 箱单排撑死 ~20 位」这一前提出处 docs/decisions/06-electrical.md:186（DEC-2026-10-03-R1 现场待确认①）"
        secondary: "GB 55038-2025 7.4.3-2：单排箱底边 ≥1.80m、双排 ≥1.60m；现 panel_strong_entry_left mount_height 1.65m 仅双排合规。该条与回路数无关，21/22 路下不变"
      cases:
        - base: 21
          arithmetic: "21 路 vs 约 16 位可用 → 缺 5 位（含 2P 进线开关 + 浪涌的总位需求约 25 位，对单排约 20 位超出 5 位）"
          conclusion: "单排仍确定装不下 → 单排出局，结论与 20 路时相同；缺口由 20 路时的 4 位扩大到 5 位"
          verify_at: "config/electrical-topology.yaml:319（现行 21 路箱体口径）与同文件:11（头部注释第 4 条「21 路…结论不变」）；docs/pending-site-data.md:105（#30）"
        - base: 22
          precondition: "仅当 sock_kitchen_oven 激活（业主确认采购 + 橱柜 600 宽高柜冻结，二者缺一不可，config/electrical-topology.yaml:330）"
          arithmetic: "22 路 vs 约 16 位可用 → 缺 6 位（含 2P 进线开关 + 浪涌的总位需求约 26 位，对单排约 20 位超出 6 位）"
          conclusion: "单排仍确定装不下，结论不变；激活只放大缺口，不改变「双排或换箱」的方向"
          verify_at: "config/electrical-topology.yaml:330（激活动作 = 新增 dedicated_kitchen_oven 回路并使 fact.circuit_count 走 21→22）"
      conclusion: "新基数下结论不变：单排出局，必须双排或换箱；且 1.65m 安装高度仅在双排时合规。"
    not_concluded:
      - "「必须换箱」不是事实：390mm / 单排约 20 位 / 约 16 位可用均为 DEC-2026-10-04-R2 的方案推算值，非实测（docs/pending-site-data.md #30 的单/双排与箱体规格仍 pending）。若现场箱体实测为双排或位数 ≥26，则不必换箱"
      - "「外机回路是否占箱位」未定：仍待厂家正式配电图（由强电箱单独放缆，还是接开发商外立面预留插座），会影响箱位需求基数"
    missing_inputs:
      - id: box-actual-spec
        owner: site
        trigger: "量房开箱（docs/pending-site-data.md #30，与 #4 同源，量房后合并口径）"
        need: "现有 panel_strong_entry_left 箱体实测位数、单/双排、净深、本体高度；只有实测位数小于 21 路 + 2P 进线开关 + 浪涌需求（21 路约 25 位）时，「必须换箱」才成立"
      - id: oven-activation
        owner: 业主
        trigger: "业主确认采购微蒸烤 且 橱柜 600 宽高柜冻结（缺一不可，config/electrical-topology.yaml:330）"
        need: "是否激活 sock_kitchen_oven → 新增 dedicated_kitchen_oven 回路；决定箱位按 21 还是 22 路下单"

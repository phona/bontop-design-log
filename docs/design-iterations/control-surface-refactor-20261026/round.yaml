brief:
  schema: interior-design-decision-brief/v1
  iteration_id: control-surface-refactor-20261026
  decision_ref: DEC-2026-10-26-R04
  frozen: true
  frozen_at: '2026-10-26'
  owner: 业主
  priority:
    - 控制面重构：唯一命令源（CommandRegistry）+ 面板管理器（SurfaceManager），桌面与移动端共用一套交互模型。
    - 画布优先：两端启动均为全出血画布，所有面板默认收起、按需呼出。
    - 常驻入口收敛为 5 个（视角/方案/图层/环境/总览）+ 命令面板兜底全部 25 条命令（18 显式 + 7 检视层）。
    - 移动端可用：底部 tab bar + 底部 sheet + 触摸加固 + 第一人称摇杆与拖拽转向。
    - 业主语言命名（水电走向/空调设备/电路归属…），工程全称进 tooltip。
  allowed_scope:
    - app/src/ui/** 与 app/src/scene/**（新增 CommandRegistry/SurfaceManager/MobileTabBar/input-capability/VirtualJoystick/pointer-intent/view-state-store）。
    - app/src/App.ts 仅装配层（命令注册、表面接线、能力订阅、持久化恢复）。
    - app/index.html 只增不改既有 element id；app/style.css 布局与新增组件样式。
    - docs/hvac/hvac-pitfall-audit-20261011.md 与 docs/curtain-design.md 的入口/路径同步。
  forbidden:
    - 改 config/**、server/**、shared/**、data/** 或任何户型几何/机电/预算逻辑。
    - 改检视层平级铁律（set*InspectionVisible 互不引用、inspectionInitial 快照可逆）。
    - 移除 FirstPersonController 的 pitch ±80° clamp 或平滑；改 CameraAnimator.interrupt 语义。
    - PWA/离线、渲染性能分档（明确留待后续轮次）。
  alignment:
    id: owner-alignment-2026-10-26-control-surface
    original_request: “本项目我想支持移动端。看看你的建议”→“桌面端我觉得也挺难用的”→“面板功能键多，而且总是弹出会话栏占用可视面积”→“这一轮我们对交互做重构，对桌面端跟移动端统一做更强的改进，如何？”→“切分支来改，改完走pr合并”
    clarified_answer: “直接改完吧。我统一验收，有问题再改”（跳过原型签字，五步连续实施）
    normalized_decision: >-
      以 CommandRegistry + SurfaceManager 为骨架统一桌面/移动端交互：画布优先、5 入口 + 命令面板、
      单击画布即收 + 钉住豁免 + Esc 全清；移动端 tab bar/sheet + 第一人称摇杆与拖拽转向；
      刷新恢复工作台状态与检视层组合；加载态收敛为禁用样式 + 全局就绪 chip；
      X-ray 改 X、L 只管灯；命名用业主语言。
    affected_refs:
      - app/src/App.ts
      - app/index.html
      - app/style.css
      - docs/hvac/hvac-pitfall-audit-20261011.md
      - docs/curtain-design.md
    site_pending: []
  decisions:
    - id: DEC-2026-10-26-R04
      content: 控制面重构五步实施（命令注册表/面板管理器/响应式呈现/FP 触摸操控/持久化与去陷阱），桌面移动端统一交互模型。

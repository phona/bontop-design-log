# INDEX.yaml 由 scripts/docs/generate-iteration-index.ts 从本文件的 index 段生成，勿手改 INDEX。
# ── 决策来源注释保全 ──
# [alignment] 2026-10-26 业主四轮对齐：①两端画布优先；②常驻 5 入口+命令面板；
#   ③业主语言命名、工程全称进 tooltip；④单击画布全部即收+可钉住；⑤第一人称
#   移动端本轮做（拖拽转向+虚拟摇杆）；⑥视觉风格不动只改结构。
# [plan] 实施计划五步：命令注册表 → 面板管理器 → 响应式呈现 → FP 触摸操控 →

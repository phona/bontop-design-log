datum:
  schema: interior-design-design-datum/v1
  iteration_id: control-surface-refactor-20261026
  coordinate_system: Three.js右手系；+x=东、+z=南、Y向上；单位m。本轮不改几何，坐标口径仅作界面锚定参照。
  datums:
    - id: command-registry-single-source
      object: control-surface-entry-model
      state: 四端同源（桌面顶栏/移动 tab bar/命令面板/快捷键提示全部从 CommandRegistry 渲染）
      meaning: 入口收敛为 5 个常驻入口 + 命令面板兜底；「总览只有 M 键」与「20 个快捷键靠背」两个不可发现问题同源解决。
      basis:
        - f_popover_sticky_pain
        - d_owner_scope
    - id: canvas-first-default
      object: app-boot-layout
      state: 两端启动零面板（方案抽屉/工作台/浮层全部默认收起）
      meaning: 画布可视面积从 ~48% 提到 100%；面板按需呼出、一次只开一个。
      basis:
        - f_panel_realestate
        - d_owner_scope
    - id: transient-dismissal-with-pin
      object: surface-lifecycle
      state: 单击画布（非拖拽）全部即收；钉住豁免画布清场但不豁免 Esc
      meaning: 取代 Popover 旧「粘性」默认（点场景不收起）；连续调图层用钉住按钮。
      basis:
        - f_popover_sticky_pain
        - d_owner_scope
    - id: mobile-first-person-input
      object: first-person-touch-controls
      plan:
        look: 画布拖拽转向，增量汇入 accumX/accumY → tanh 平滑 → yaw/pitch → ±80° clamp（与鼠标共用管线）
        move: 左下 120px 虚拟摇杆，0.22 死区，映射 MovementKeys
        pick: tap 判定（位移 ≤10px 且 ≤400ms）后才 raycast 拾取
      meaning: 不依赖 pointer lock（iOS 不可用）；桌面 WASD + pointer lock 路径不变。
      basis:
        - f_pointer_lock_mobile_gap
        - d_owner_scope
  non_datums:
    - 任何户型几何、墙体、机电、预算数据（本轮零改动）。
    - 检视层平级语义与各自 setter 的就绪钳制。
    - 视觉风格（配色/圆角/模糊背景保持原样）。
fact_table:
  schema: interior-design-fact-table/v1
  iteration_id: control-surface-refactor-20261026
  facts:
    - id: f_popover_sticky_pain
      status: confirmed
      statement: Popover.ts 旧注释明示「面板是粘性的：点场景或其它 UI 不收起」，是「总是弹出占用可视面积」的直接机制；PreviewWorkbench 旧默认 open=true 使 390px 工作台启动即占位。
      source_refs:
        - app/src/ui/Popover.ts
        - app/src/ui/PreviewWorkbench.ts
      impact: 即收/钉住语义与画布优先默认态针对这两个根因。
      affected_objects:
        - layers-panel
        - env-panel
        - right-panel-stack
      owner: 业主（2026-10-26「面板功能键多，而且总是弹出会话栏占用可视面积」）
      verification: git show 96d0235^:app/src/ui/Popover.ts 第 1-3 行注释
    - id: f_panel_realestate
      status: confirmed
      statement: 1440px 宽屏上左 360px 方案面板 + 右 390px 工作台共占 750px，画布仅剩约 690px（48%）。
      source_refs:
        - app/style.css
      impact: 画布优先默认态 + 左抽屉化。
      affected_objects:
        - scheme-panel
      owner: 业主
      verification: '重构前 style.css #scheme-panel/#right-panel-stack 规则'
    - id: f_pointer_lock_mobile_gap
      status: confirmed
      statement: 第一人称旧实现依赖 PointerLockControls + WASD，pointer lock 在 iOS Safari 完全不可用；且 onMouseMove 以 document.pointerLockElement 为门槛，无拖拽转向退化路径。
      source_refs:
        - app/src/scene/FirstPersonController.ts
      impact: 触摸转向路径与摇杆；编辑类命令桌面专属。
      affected_objects:
        - FirstPersonController
      owner: 业主
      verification: git show 96d0235^:app/src/scene/FirstPersonController.ts
    - id: f_keybinding_drift
      status: confirmed
      statement: keybindings.ts 漏登记 KeyT（俯视）——App 处理器有、展示表没有，命令面板快捷键反查必然缺失；同表还登记了 L 的双行为（灯未就绪时切测量）。
      source_refs:
        - app/src/ui/keybindings.ts
        - app/src/App.ts
      impact: Step 1 补 KeyT 并把魔数断言改不变量断言；Step 5 拆 L、X-ray 改 X。
      affected_objects:
        - keybindings.ts
        - CommandPalette
      owner: AI 发现
      verification: 重构前 findBinding('KeyT') 返回 undefined（测试实证）
    - id: f_app_test_baseline_red
      status: confirmed
      statement: App.test.ts 文件级红（mock 缺口：THREE.Color.setRGB、createMockElement.querySelector/replaceChildren/remove、document.querySelectorAll、body.classList、window.dispatchEvent、ResizeObserver、EnvironmentManager.setInteriorOnlyNightPreview）。
      source_refs:
        - app/src/App.test.ts
        - ci/baseline/test-app-failures.txt
      impact: Step 2 修复并删基线行（50→48）。
      affected_objects:
        - App.test.ts
      owner: AI 发现
      verification: ci/baseline/test-app-failures.txt 第 4 行（已删）
objects:
  schema: interior-design-object-manifest/v1
  iteration_id: control-surface-refactor-20261026
  objects:
    - id: CommandRegistry
      owner: app/src/ui/CommandRegistry.ts
      parts:
        - register/registerAll/get/list/grouped/execute/isAvailable/shortcutOf
      function: 唯一命令源；run 委托 App 既有处理器，shortcutOf 从 keybindings.ts 反查展示键位
      relationships: CommandPalette/MobileTabBar/快捷键提示三处消费
      maintenance: 新命令必须带 label（业主语言）与 engineeringNote（tooltip）
      interfaces: execute() 被 available() 拦截时发 command-unavailable 事件
      collision: 与 keybindings.ts 双源风险由 shortcutOf 反查 + 不变量测试封住
      validation_refs:
        - app/src/ui/CommandRegistry.test.ts
    - id: SurfaceManager
      owner: app/src/ui/SurfaceManager.ts
      parts:
        - 同 slot 互斥 / modal 清场 / dismissTransient / dismissAll / 钉住集合
      function: 面板生命周期总管；只编排开合，不拥有 DOM
      relationships: 注册 10 个表面（scheme/workbench/overview/view/layers/env/alerts/settings/palette/furniture/placement）
      maintenance: 新表面必须声明 el/toggleEl（清场判据）与 slot
      interfaces: open/close/toggle/dismissTransient/dismissAll/isPinned/setPinned
      collision: 与 Popover 同组互斥重叠——同组保留，管理器追加跨 slot/modal 语义
      validation_refs:
        - app/src/ui/SurfaceManager.test.ts
    - id: MobileTabBar
      owner: app/src/ui/MobileTabBar.ts
      parts:
        - 5 入口 + 命令面板按钮 + 告警徽章
      function: 移动形态底部入口；与桌面顶栏同一套 surface id
      relationships: input-capability 判定显隐；SurfaceManager.toggle 执行
      maintenance: 入口集合与桌面工具栏保持一致
      interfaces: setVisible/sync
      collision: '与桌面 #toolbar 互斥显隐（body.mobile-chrome）'
      validation_refs:
        - app/src/ui/MobileTabBar.test.ts
    - id: VirtualJoystick
      owner: app/src/scene/VirtualJoystick.ts
      parts:
        - 120px 触控区 + knob + 0.22 死区
      function: 移动端第一人称移动输入
      relationships: 输出进 FirstPersonController.setStickVector；显隐由 FP 模式 + touchPrimary 决定
      maintenance: 死区与触控区尺寸是手感参数，真机验收后可能要调
      interfaces: onChange/setVisible/getVector/dispose
      collision: 与 WASD 共用 MovementKeys 方向，互不干扰
      validation_refs:
        - app/src/scene/VirtualJoystick.test.ts
    - id: PointerIntent
      owner: app/src/scene/pointer-intent.ts
      parts:
        - begin/end/hasDragged/cancel
      function: tap/拖拽判别（≤10px 且 ≤400ms 为 tap）
      relationships: HouseScene 拾取从按下即 raycast 改为 tap 后拾取
      maintenance: 阈值是误触与灵敏的权衡，真机验收后可能要调
      interfaces: end() 返回 'tap'|'drag'|null
      collision: 与 measurement/orbit 拖拽共存：拖拽不拾取不清场
      validation_refs:
        - app/src/scene/pointer-intent.test.ts
  constraints:
    - element id 全稳定（index.html 只增不改）——OverviewMenu.test.ts/LayersPanel/PreviewWorkbench 构造器按 id 寻址。
    - body.workbench-open/closed class 必须继续发射（CSS 布局契约）。
    - #warnings 父元素与 #ceiling-zone-btn 锚点不许移动（SchemePanel 预算条/ElementStateButton 注入依赖）。
    - 关闭态一律 visibility/display 或推出视口，不依赖 overflow 裁剪 transform 元素（原型阶段实测的 Blink 行为）。

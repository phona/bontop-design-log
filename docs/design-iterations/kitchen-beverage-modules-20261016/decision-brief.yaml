schema: interior-design-decision-brief/v3
project: bontop-design-log
iteration_id: kitchen-beverage-modules-20261016
subject: 餐厅独立边柜与落地茶吧机的软耦合组合预演
priority:
  user_goal: 用真实三维模型解释“不定制柜台时，活动边柜如何与落地茶吧机形成水吧组合”，并展示空间效果。
  ranked:
    - 不移动冰箱、茶吧机、餐桌、半高柜、吊顶、门洞、玻璃门和墙体
    - 茶吧机独立落地；边柜独立可移动，不包覆家电
    - 用尺度、背线对齐和相邻关系建立视觉联系
    - 当前EM450仍留在厨房；餐厅只保留未来搬放的可能
  non_negotiables:
    - 不新增通顶柜、冰箱侧板或固定包边
    - 不改既有家具或建筑坐标
    - 不假设插座、回路、给排水和墙控迁移已解决
    - 不把候选尺寸写成成品商品或施工尺寸
  tradeoffs_accepted:
    - 接受边柜与茶吧机留28mm分缝，以保持可拆可移
    - 接受边柜前沿比茶吧机前沿多出约85mm，获得约400mm台面深度
    - 本轮不把EM450复制到餐厅，避免把未来选项误作当前状态
frozen: true
freeze_record:
  alignment_id: chat-2026-10-16-movable-waterbar-module-preview
  original_user_response: "没太听懂，你改一下模型给我看看效果。"
  normalized_decisions:
    - 用一件不固定、可搬动的低边柜紧邻落地茶吧机，做一个真实模型预演例子。
    - 边柜为通用几何代理，尺寸、位置和材质仍可看图后调整，不代表已选成品SKU。
    - 茶吧机、冰箱、餐桌和既有建筑位置保持不变；EM450继续留在厨房。
    - 通过边柜与茶吧机背线对齐、沿墙留28mm分缝，展示“有关联但不固定”的模块关系。
  confirmed_by_user: true
  confirmed_at: 2026-10-16
  evidence_refs:
    - docs/design-iterations/kitchen-beverage-stations-20261016/decision-brief.yaml
    - docs/design-iterations/kitchen-beverage-modules-20261016/evidence/runtime-query.json

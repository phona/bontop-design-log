    - 吊顶、墙体、门洞、玻璃门和既有墙控
  assumptions:
    - 不把62.5mm后墙空气缝解释为检修通道或厂家安装净距
    - 不把机身间距解释成冰箱门扇、抽屉或人员操作净距
    - 不把模型边柜尺寸解释成已选商品、报价或施工图
  out_of_scope_changes:
    - 定制柜、固定台面、连续背板、墙面挂装或封闭茶吧机
    - 新增电源、回路、线缆路径、给排水或墙控迁改
    - 将咖啡机移入餐厅或在餐厅复制第二台

t x="90" y="498" font-size="13" fill="#333" text-anchor="start" font-weight="normal" font-family="sans-serif">v0.4 判读：①S2 3.60m=unsupported_span 实指段（模型三类依托均无：低于板、高于垫层、离墙&gt;0.25m）；②S4 竖管 2.16m 客卫室内明露为 v0.3 未显式的加重项；③S2/S3 与 condensate-dining 共线并管，外包络未定义。</text></svg>
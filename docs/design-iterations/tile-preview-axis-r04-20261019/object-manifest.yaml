# Object Manifest — 地砖预演角度语义
schema: interior-design-object-manifest/v1
iteration_id: tile-preview-axis-r04-20261019
objects:
  - id: floor-direction-slider
    owner: material-preview-ui
    parts: [MaterialPreviewPanel.floorRotation, MaterialPreviewPanel.floorRotationDeg]
    function: 以用户选择的0–90°方向值表示南北至东西铺向；默认南北向。
    relationships: sliderDeg=0对应世界Z，sliderDeg=90对应世界X。
    maintenance: not_applicable
    interfaces: [app/src/App.ts, app/src/ui/MaterialPreviewPanel.ts]
    collision: no_geometry_change
    validation_refs: [f_owner_axis, f_uv_rotation]
  - id: preview-texture-transform
    owner: floor-material-preview
    parts: [TextureManager.map, TextureManager.normalMap, TextureManager.roughnessMap]
    function: 由App转换textureRotationDeg=90-sliderDeg，再经TextureManager应用到预演贴图。
    relationships: 所有floor mesh与floor_region遵循同一临时预演值。
    maintenance: not_applicable
    interfaces: [App.getPreviewFloorAppearance, TextureManager.applyPreviewRotation]
    collision: no_geometry_change
    validation_refs: [f_uv_rotation, f_preview_only]
  - id: formal-floor-selection
    owner: current-scheme
    parts: [floor.default, floor.roomOverrides]
    function: 保持现有正式选材与房间覆盖。
    relationships: 临时预演重置后恢复原正式材质，不读R04 slider方向值。
    maintenance: not_applicable
    interfaces: [data/current-scheme.json, HouseScene floor meshes]
    collision: no_geometry_change
    validation_refs: [f_preview_only]
constraints:
  - 不修改户型几何、贴砖区域、正式材料或R03窗帘展示状态。
  - 不删除R03历史记录；R04只替代其地砖预演角度约定。

<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <rect width="1200" height="700" fill="#f7f8fa"/>
  <text x="60" y="45" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#18212f">客餐厅边吊｜两排功能口南北向居中示意</text>
  <text x="60" y="75" font-family="Arial, sans-serif" font-size="15" fill="#596579">+z 向南；两排中心均值对齐 ceiling_living 南北中心 z=4.925</text>

  <!-- band x[7.20,13.40], z[4.30,5.55] -->
  <rect x="120" y="125" width="960" height="375" rx="12" fill="#e9edf2" stroke="#9aa6b7" stroke-width="2"/>
  <text x="600" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#465164">ceiling_living · x[7.20,13.40] · z[4.30,5.55]</text>
  <line x1="600" y1="120" x2="600" y2="505" stroke="#505b6d" stroke-width="2" stroke-dasharray="8 7"/>
  <line x1="108" y1="312.5" x2="1092" y2="312.5" stroke="#687386" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="505" y="295" width="190" height="29" rx="6" fill="#fff" stroke="#c6ccd5"/>
  <text x="600" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#374151">中心 z=4.925</text>
  <text x="600" y="535" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#465164">西东中心线 x=10.30</text>
  <text x="600" y="560" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#697386">中虚线为边吊南北中心；口位行中心的平均 z 与其对齐</text>

  <!-- Supply row z=5.125 (south), x=8.60 / 12.00 -->
  <text x="145" y="397" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#15518c">下出风行 z=5.125</text>
  <rect x="270" y="365" width="139" height="46" rx="6" fill="#2878c8"/>
  <line x1="339.5" y1="358" x2="339.5" y2="418" stroke="#15518c" stroke-width="2"/>
  <text x="339.5" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#15518c">餐厅 x=8.60 · 0.90m</text>
  <rect x="796" y="365" width="139" height="46" rx="6" fill="#2878c8"/>
  <line x1="865.5" y1="358" x2="865.5" y2="418" stroke="#15518c" stroke-width="2"/>
  <text x="865.5" y="440" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#15518c">客厅 x=12.00 · 0.90m</text>

  <!-- Return row z=4.725 (north), x=9.65 / 10.95 -->
  <text x="145" y="255" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#9c4b12">回风行 z=4.725</text>
  <rect x="432" y="230" width="139" height="46" rx="6" fill="#dc7a2b"/>
  <line x1="501.5" y1="223" x2="501.5" y2="283" stroke="#9c4b12" stroke-width="2"/>
  <text x="501.5" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#9c4b12">餐厅 x=9.65 · 0.90m</text>
  <rect x="625" y="230" width="155" height="46" rx="6" fill="#dc7a2b"/>
  <line x1="702.5" y1="223" x2="702.5" y2="283" stroke="#9c4b12" stroke-width="2"/>
  <text x="702.5" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#9c4b12">客厅 x=10.95 · 1.00m</text>

  <!-- row separation and south shift -->
  <line x1="1000" y1="267.5" x2="1000" y2="387.5" stroke="#596579" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="1020" y="330" font-family="Arial, sans-serif" font-size="14" fill="#465164">0.40m</text>
  <text x="980" y="607" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#596579">两行同向南移 0.275m</text>
  <line x1="1040" y1="115" x2="1040" y2="170" stroke="#596579" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1040" y="105" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#596579">南 +z</text>
  <text x="600" y="650" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#697386">下出风中心 x=8.60/12.00，回风中心 x=9.65/10.95；两排 x 中心均值都为10.30</text>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#596579"/>
    </marker>
  </defs>
</svg>

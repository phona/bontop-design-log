# Design Datum — 客餐厅双出风内机风口三层线语言（DEC-2026-10-07-R03）
schema: interior-design-design-datum/v1
iteration_id: hvac-dual-outlet-threeline-20261007
coordinate_system: Three.js 右手系；+x=东 +z=南；俯视北朝上；单位 m；楼板 2.80

datums:
  - id: datum-strip-ceiling_living
    object: ceiling_living
    plan: { x_range: [7.2, 13.4], z_range: [4.3, 5.2], bottom_y: 2.50, thickness: 0.30 }
    elevation: 完成面 2.50；南立面 z=5.20=客厅侧；北立面 z=4.30=餐厅侧；底面 z 跨度 0.9m
    basis: [d_strip_geometry, dec-2026-10-07-r03]
    unchanged_from: DEC-2026-10-05-R18 / R01（几何、标高、圆角、梁关系本轮未动）

  - id: datum-unit-positions
    plan: ac_living (10.30, 4.75) 71T2 MJV-71T2/P-SS；ac_dining (8.00, 4.75) 42T2 MJV-42T2/P-SS（旋转 180° 朝北）
    elevation: 机身中心 z=4.75；两台反向安装、各自服务客厅/餐厅、独立温控
    basis: [dec-2026-10-05-r18, dec-2026-10-04-r1]

  - id: datum-layer-side-supply
    object: [supply_living, supply_dining, LD-deco-side-south, LD-deco-side-north]
    plan:
      supply_living:        { center_x: 11.45, z: 5.21, face: south, length: 3.5, x_range: [9.70, 13.20] }  # 71T2 功能段
      LD-deco-side-south:   { center_x: 8.45,  z: 5.21, face: south, length: 2.5, x_range: [7.20, 9.70] }   # 封闭装饰段
      supply_dining:        { center_x: 8.70,  z: 4.30, face: north, length: 2.0, x_range: [7.70, 9.70] }   # 42T2 功能段
      LD-deco-side-north:   { center_x: 11.55, z: 4.30, face: north, length: 3.7, x_range: [9.70, 13.40] }  # 封闭装饰段；西端 [7.20,7.70] 保持与 ceiling_dining_west_band 正交交接不贴百叶
    elevation: y=2.65；全部 linear_slot + matte_black；侧立面上出风层
    basis: [dec-2026-10-07-r03]

  - id: datum-layer-bottom-supply
    object: [supply_living_bottom, supply_dining_bottom, LD-deco-supply-west, LD-deco-supply-mid, LD-deco-supply-east]
    plan:
      supply_living_bottom: { center_x: 10.30, z: 4.85, length: 0.9,  x_range: [9.85, 10.75] }   # 71T2 第二出口（下出风）
      supply_dining_bottom: { center_x: 8.00,  z: 4.85, length: 0.9,  x_range: [7.55, 8.45] }    # 42T2 第二出口（下出风）
      LD-deco-supply-west:  { center_x: 7.375, z: 4.85, length: 0.35, x_range: [7.20, 7.55] }
      LD-deco-supply-mid:   { center_x: 9.15,  z: 4.85, length: 1.40, x_range: [8.45, 9.85] }    # 两台机器之间非功能区
      LD-deco-supply-east:  { center_x: 12.075,z: 4.85, length: 2.65, x_range: [10.75, 13.40] }
    elevation: y=2.50（吊顶底面）；linear_slot + matte_black + grille_height 0.15；底面前侧下出风层
    basis: [dec-2026-10-07-r03, dec-2026-10-05-r18]

  - id: datum-layer-bottom-return
    object: [return_living, return_dining, LD-deco-return-west, LD-deco-return-mid, LD-deco-return-east]
    plan:
      return_living:        { center_x: 12.60, z: 4.45, length: 1.0, x_range: [12.10, 13.10] }  # 71T2 回风/检修
      return_dining:        { center_x: 7.90,  z: 4.45, length: 0.9, x_range: [7.45, 8.35] }   # 42T2 回风/检修（R20 收界值）
      LD-deco-return-west:  { center_x: 7.325, z: 4.45, length: 0.25, x_range: [7.20, 7.45] }
      LD-deco-return-mid:   { center_x: 10.225,z: 4.45, length: 3.75, x_range: [8.35, 12.10] } # 两台机器之间非功能区
      LD-deco-return-east:  { center_x: 13.25, z: 4.45, length: 0.30, x_range: [13.10, 13.40] }
    elevation: y=2.49；linear_slot + matte_black + grille_height 0.25；铰接回检一体（仅功能段开滤网/检修口）；底面后侧回风/检修层
    basis: [dec-2026-10-07-r03, dec-2026-10-05-r20]

  - id: datum-render-language
    object: HvacTerminal.render_style / grille_height
    plan: linear_slot=满长连续叶片+端部小压条，无成品外框、无状态方框；功能段保留槽内贴边状态发丝线，装饰段无状态线
    elevation: panel 语言仍用于其余房间（主卧/书房/客房/儿童房）不变
    basis: [dec-2026-10-07-r03]

  - id: datum-size-caliber
    plan: 合同附件（DEC-2026-10-04-R1）出风名义 750×150 / 1000×150、回风名义 1000×300 / 1300×300、通长加长 100 元/米另计
    elevation: 模型示意高度：送风排 0.15 / 回风排 0.25；与名义 300mm 的差异登记 site_pending
    basis: [dec-2026-10-04-r1, q1]

non_datums:
  - 双出风两出口风量分配、42T2 旋转 180° 允许性、下出风有效面积/静压、回风底回/侧回形式：以厂家安装图为约束（q1，本轮不改配置）
  - 风口最终名义尺寸（含合同附件与模型的差）：厂家安装图/现场复核，不得由效果图反推
  - git 提交方式：与 AGENTS.md 提交要求的冲突待业主裁定（沿用上轮 open_question）

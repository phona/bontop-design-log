schema: interior-design-decision-brief/v3
project: bontop-design-log
iteration_id: kitchen-espresso-workstation-20261016
subject: 厨房北侧台面 EM450 咖啡工作站程序化模型预演
priority:
  user_goal: 在厨房现有连续台面上固定表达 EM450 咖啡机，观察咖啡与备菜能否分区而不需要每次清空整段台面。
  ranked:
    - 保留建筑、现有台面、冰箱、餐桌、吊顶与水吧位置
    - 以用户提供的 EM450 机身尺寸进行程序化表达
    - 给咖啡机保留约800mm台面工作区，不虚构磨豆机型号和外形
  non_negotiables:
    - 不改 model-geometry.yaml 或 overlay.yaml
    - 不移动、增删或改尺寸任何既有家具、柜体、台面、电器或建筑构件
    - 不增加插座、回路、给排水、固定背板或吊柜
  tradeoffs_accepted:
    - 仅把本轮作为模型预演；磨豆机、真实电源可及性和燃气表位置未闭合
frozen: true
freeze_record:
  alignment_id: chat-2026-10-16-espresso-kitchen-implementation
  original_user_response: "改正式模型，我看看效果如何。程序化建模尽可能贴紧现实物品。；开始落地。"
  normalized_decisions:
    - "仅新增 EM450 预演对象，落在厨房现有北侧柜台西段；柜体与台面不重做。"
    - "预演工作区按 x[7.22,8.02] 的800mm长度表达，先按用户给出的220×285×305mm机身尺寸。"
    - "模型用于视觉与基本几何核验，不作为施工定位或完整磨豆工作流验证。"
  confirmed_by_user: true
  confirmed_at: 2026-10-16
  evidence_refs:
    - docs/design-iterations/kitchen-espresso-workstation-20261016/fact-table.yaml
allowed_scope:
  files:
    - config/house.yaml
    - shared/types.ts
    - shared/render/FixtureFactory.ts
    - config/spatial-validation.yaml
    - scripts/verify/placement/verify-furniture-placement.ts
    - docs/decisions/02-layout-public.md
    - docs/design-iterations/kitchen-espresso-workstation-20261016/
    - docs/dressing-map.md (generated from declared sources)
  objects:
    - furniture:kitchen:coffee_machine_em450
    - furniture:kitchen:kitchen_cabinet_run:0 (existing support surface; read-only)
  archetypes: [kitchen_appliance, countertop_appliance]
  views: [plan, perspective]
  changes:
    - 在 FixtureFactory 中新增与外形尺寸对应的 EM450 程序化部件
    - 在 house.yaml 将咖啡机放到现有柜台，底面标高由模型部件锁在0.89m
    - 登记家具平面尺寸、空间角色与柜台叠放校验关系
forbidden:
  files:
    - config/layout/model-geometry.yaml
    - config/layout/overlay.yaml
    - config/electrical.yaml
    - config/electrical-topology.yaml
    - config/plumbing.yaml
    - config/ceiling.yaml
  objects:
    - fridge
    - dining_table
    - kitchen_cabinet_run
    - kitchen_countertop_bridge
    - water_heater
    - sink
    - gas_stove
    - range_hood
    - all existing architecture, ceiling and glass objects
  assumptions:
    - 不假设未选定磨豆机的尺寸、功率或具体落位
    - 不把推定燃气表坐标当成实测边界
    - 不把当前预留插座当成已确定可及的成品插座
    - 不把海外 EM450.M 页面尺寸冒充中国销售 SKU 的最终尺寸
  out_of_scope_changes:
    - 柜体分段、台面改造或固定装置
    - 磨豆机、压粉器、咖啡杯、收纳件等未选设备/用品
    - 西墙餐厅水吧及所有冰箱、餐桌、门洞、玻璃门、吊顶位置
    - 采购预算、商品价格和施工图

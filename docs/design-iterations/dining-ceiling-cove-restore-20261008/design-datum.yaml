constraints:
  - id: c_void_east
    statement: 北带东缘外侧为入户花园露天 void（R01 补记四实拍：回转段弧面悬空露天空豁口）——北带不得声明 east cove；R05 镜像凹弧的正确性也依赖此（默认方向会扎进门厅体量，已 fail closed）。
    source: DEC-2026-10-08-R01 补记四 + DEC-2026-10-08-R05
  - id: c_no_vertical_arcs
    statement: 垂面（立面与平顶交线）不得再有任何弧——业主 2026-10-08 明定「垂面应该是垂直平面」，R01/R03 的全部 cove 已由 R05 拆除；如再提"弧面衔接"，先确认说的是平面角部圆弧还是立面交线弧。
    source: DEC-2026-10-08-R05（业主原话）
  - id: c_carpentry
    statement: 落地为标准木工：R150 平面圆弧拐角（石膏板圆弧基层+板，与 SW 拐肘同工艺）；无立面弧面工序；报价按吊顶分区实测量（镜像凹弧使北带 +0.0048㎡）。
    source: 业主确认 + config/ceiling.yaml 实算


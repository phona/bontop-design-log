# docs/design-iterations 导航索引
#
# 用途：把 64 个平铺 iteration 目录变成可检索的结构。只记录事实，不派生结论。
# 建立日：2026-10-20（降噪方案批次 0）。
#
# 本文件是合法 YAML，可被 js-yaml / yaml.load() 直接解析。
# entries 为条目列表；meta 记录口径、硬编码路径与批次历史。

meta:
  established: "2026-10-20"
  dir_count: 64
  stray_file_count: 1
  external_refs_total: 84

  # 字段口径：怎么来的，可否信
  field_provenance:
    topic: "按目录名前缀归类，非按内容判读（命名事实）"
    review_state: "各目录 review-manifest.json 的 state 字段原文；无 manifest 记 none（机器可读）"
    supersedes: "各目录 decision-brief.yaml 的 supersedes 字段原文；无字段记 none（机器可读）"
    external_refs: "grep -rl 排除 node_modules/tmp/.venv 与本目录自身后的命中文件数（实测）"
    note: "仅登记已核实的结构性事实；无 note = 未核查，不等于无问题"

  external_refs_zero_meaning: "该目录在任何 md/yaml/json/ts/py 里都没被按名引用，只能靠 DEC 行号或猜测找到"

  # 被代码或测试硬编码引用的目录（搬迁前必须同步改代码）
  hardcoded_paths:
    - dir: hvac-dual-outlet-threeline-20261007

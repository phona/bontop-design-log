<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">和萃701中央空调冷凝水排水走向初稿</title>
  <desc id="desc">按模型x-z坐标绘制的平面方案线。东南客房红线与客厅、餐厅两支管拟汇入深蓝共用主管到厨房，灰线是东南客房到客卫的备选；当前3D旧线在客房西南侧终止。所有路线只表示平面意图，未确认标高和真实排水接口。</desc>
  <style>
    text { font-family: "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #172033; }
    .room { fill: #f5f7fa; stroke: #bac5d2; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
    .wet { fill: #dbeafe; }
    .unit { fill: #ffffff; stroke: #172033; stroke-width: 2; vector-effect: non-scaling-stroke; }
    .receiver { fill: #ffffff; stroke: #dc2626; stroke-width: 3; vector-effect: non-scaling-stroke; }
    .route { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 8 5; vector-effect: non-scaling-stroke; }
    .backup { fill: none; stroke: #64748b; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 4 6; vector-effect: non-scaling-stroke; }
    .trunk { fill: none; stroke: #1e3a8a; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 9 5; vector-effect: non-scaling-stroke; }
    .old { fill: none; stroke: #94a3b8; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 3 5; vector-effect: non-scaling-stroke; }
    .label { font-size: .24px; font-weight: 700; }
    .sub { font-size: .17px; fill: #475569; }
  </style>
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="42" y="35" font-size="25" font-weight="700">六台内机的排水走向初稿 · 平面示意</text>
  <text x="43" y="56" font-size="13" fill="#475569">北在上；由 config 坐标推演。虚线是研究方向，不表示实际管道或已确认排水接口。</text>

  <g transform="translate(64 74) scale(59)">
    <!-- Room envelopes are simplified for route reading; they are not wall geometry. -->
    <rect class="room wet" x="0" y="1.1" width="2.6" height="1.76"/>
    <rect class="room wet" x="5.6" y="2.2" width="1.5" height="2.1"/>
    <rect class="room wet" x="7.2" y="0" width="3.6" height="2.4"/>
    <rect class="room" x="2.6" y="1.1" width="3" height="3.2"/>
    <rect class="room" x="0" y="2.86" width="4.2" height="6.94"/>
    <rect class="room" x="4.2" y="5.55" width="3" height="4.25"/>
    <rect class="room" x="7.2" y="2.4" width="6.2" height="7.4"/>
    <rect class="room" x="13.4" y="5.55" width="3" height="3.15"/>


    <!-- Proposed plan routes. Elevations and connections remain unresolved. -->
    <polyline class="route" stroke="#2563eb" points="10.3,4.75 10.3,4.6 10.8,4.6"/>
    <polyline class="route" stroke="#3b82f6" points="8,4.75 7.6,4.75 7.6,2.6 10.5,2.6"/>
    <polyline class="route" stroke="#7c3aed" points="3.7,5.1 4.1,5.1 4.1,4.62 2.5,4.62 2.5,3.1 2.3,3.1 2.3,2.5 2,2.5"/>
    <polyline class="route" stroke="#059669" points="4.4,4 5.5,4 5.5,3.87 5.7,3.87 5.7,3.7"/>
    <polyline class="route" stroke="#0d9488" points="5.5,6 5.5,4.5 5.7,4.5 5.7,3.7"/>
    <polyline class="route" stroke="#e11d48" points="15.1,5.85 13.32,5.85 13.32,4.6 10.8,4.6"/>
    <polyline class="trunk" points="10.8,4.6 10.8,3 10.5,3 10.5,.3"/>
    <polyline class="backup" points="15.1,5.85 13.32,5.85 13.32,4.6 7.6,4.6 7.6,3 6.9,3 6.9,3.55"/>
    <polyline class="old" points="15.1,5.85 13.5,5.85 13.5,6.29 13.32,6.29 13.32,7.45 13.4,7.5"/>

    <!-- Model units and inferred receiver directions. -->
    <circle class="unit" cx="10.3" cy="4.75" r=".075"/>
    <circle class="unit" cx="8" cy="4.75" r=".075"/>
    <circle class="unit" cx="3.7" cy="5.1" r=".075"/>
    <circle class="unit" cx="4.4" cy="4" r=".075"/>
    <circle class="unit" cx="5.5" cy="6" r=".075"/>
    <circle class="unit" cx="15.1" cy="5.85" r=".075"/>
    <circle class="receiver" cx="10.5" cy=".3" r=".09"/>
    <circle class="receiver" cx="6.9" cy="3.55" r=".09"/>
    <circle class="receiver" cx="2" cy="2.5" r=".09"/>
    <circle cx="10.8" cy="4.6" r=".105" fill="#1e3a8a" stroke="#ffffff" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <circle cx="10.5" cy="2.6" r=".105" fill="#1e3a8a" stroke="#ffffff" stroke-width="2" vector-effect="non-scaling-stroke"/>
    <path d="M13.31 7.41 L13.49 7.59 M13.49 7.41 L13.31 7.59" stroke="#dc2626" stroke-width="3" vector-effect="non-scaling-stroke"/>

  </g>

  <g font-size="15" font-weight="700" fill="#172033">
    <text x="88" y="177">主卫</text>
    <text x="406" y="235">客卫</text>
    <text x="543" y="125">厨房</text>
    <text x="249" y="198">儿童房</text>
    <text x="99" y="480">主卧</text>
    <text x="365" y="565">书房</text>
    <text x="594" y="513">客餐厅</text>
    <text x="900" y="515">东南客房</text>
    <text x="710" y="338" font-size="12" fill="#1e3a8a">J1</text>
    <text x="697" y="243" font-size="12" fill="#1e3a8a">J2</text>
  </g>

  <!-- Proposed condensate pass-through locations; numbers refer to the legend. -->
  <g font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <circle cx="200" cy="243" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="200" y="247" fill="#ffffff">1</text>
    <circle cx="394" cy="302" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="394" y="306" fill="#ffffff">2</text>
    <circle cx="389" cy="401" r="10" fill="#ea580c" stroke="#ffffff" stroke-width="2"/><text x="389" y="405" fill="#ffffff">3</text>
    <circle cx="855" cy="419" r="10" fill="#475569" stroke="#ffffff" stroke-width="2"/><text x="855" y="423" fill="#ffffff">4</text>
    <circle cx="684" cy="216" r="10" fill="#475569" stroke="#ffffff" stroke-width="2"/><text x="684" y="220" fill="#ffffff">5</text>
  </g>

  <rect x="1064" y="84" width="185" height="510" rx="14" fill="#f8fafc" stroke="#d7e0e9"/>
  <text x="1082" y="112" font-size="16" font-weight="700">读图说明</text>
  <text x="1082" y="145" font-size="13">客厅 → 厨房（蓝）</text>
  <text x="1082" y="172" font-size="13">餐厅 → 厨房（浅蓝）</text>
  <text x="1082" y="199" font-size="13">主卧 → 主卫（紫）</text>
  <text x="1082" y="226" font-size="13">儿童房 → 客卫（绿）</text>
  <text x="1082" y="253" font-size="13">书房 → 客卫（青）</text>
  <text x="1082" y="280" font-size="13">东南客房 → 厨房（红）</text>
  <text x="1082" y="307" font-size="13" fill="#64748b">灰线 → 客卫备选</text>
  <text x="1082" y="334" font-size="13" fill="#64748b">灰短线 → 旧3D终点</text>
  <line x1="1082" y1="361" x2="1229" y2="361" stroke="#d7e0e9"/>
  <text x="1082" y="389" font-size="13">空心点：接收区域</text>
  <text x="1082" y="412" font-size="12" fill="#b91c1c">实际接口仍待核</text>
  <text x="1082" y="440" font-size="13">红叉：旧3D线止点</text>
  <text x="1082" y="463" font-size="12" fill="#b91c1c">尚未连到客卫</text>
  <line x1="1082" y1="484" x2="1229" y2="484" stroke="#d7e0e9"/>
  <text x="1082" y="510" font-size="13">1–3：墙段待核</text>
  <text x="1082" y="535" font-size="13">4：客房门头</text>
  <text x="1082" y="560" font-size="13">5：餐厨门上口</text>
  <text x="1082" y="581" font-size="11" fill="#475569">深蓝：拟共管 J1/J2</text>

  <text x="64" y="688" font-size="13" fill="#475569">仅平面研究：出水口标高、梁底、穿墙、管径、保温后净空和受纳接口未证实。路线需厂家与水电按实机复核后才可施工。</text>
</svg>

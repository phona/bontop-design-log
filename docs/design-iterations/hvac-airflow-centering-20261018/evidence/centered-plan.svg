<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
  <rect width="1200" height="620" fill="#f7f8fa"/>
  <text x="60" y="48" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#18212f">客餐厅边吊｜四个底面功能口居中示意</text>
  <text x="60" y="78" font-family="Arial, sans-serif" font-size="15" fill="#596579">按 ceiling_living 东西中心 x=10.30 对齐；坐标单位 m，非施工图</text>

  <!-- scale: x=7.20 → 140px; x=13.40 → 1060px; 1m=148.387px -->
  <rect x="140" y="125" width="920" height="350" rx="12" fill="#e9edf2" stroke="#9aa6b7" stroke-width="2"/>
  <text x="600" y="112" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#465164">ceiling_living：x[7.20, 13.40] · 中心 x=10.30</text>
  <line x1="600" y1="120" x2="600" y2="482" stroke="#505b6d" stroke-width="2" stroke-dasharray="8 7"/>
  <rect x="505" y="125" width="190" height="29" rx="6" fill="#fff" stroke="#c6ccd5"/>
  <text x="600" y="145" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#374151">边吊中心 x=10.30</text>

  <text x="166" y="210" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#374151">下出风｜z=4.85</text>
  <text x="166" y="365" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#374151">回风｜z=4.45</text>
  <line x1="240" y1="250" x2="1000" y2="250" stroke="#c7ced8" stroke-width="2"/>
  <line x1="240" y1="405" x2="1000" y2="405" stroke="#c7ced8" stroke-width="2"/>

  <!-- lower supplies: 0.90m each -->
  <rect x="281" y="228" width="134" height="44" rx="5" fill="#2878c8"/>
  <line x1="348" y1="222" x2="348" y2="278" stroke="#15518c" stroke-width="2"/>
  <text x="348" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#15518c">supply_dining_bottom</text>
  <text x="348" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#15518c">x=8.60 · 0.90m</text>

  <rect x="622" y="228" width="134" height="44" rx="5" fill="#2878c8"/>
  <line x1="689" y1="222" x2="689" y2="278" stroke="#15518c" stroke-width="2"/>
  <text x="689" y="208" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#15518c">supply_living_bottom</text>
  <text x="689" y="296" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#15518c">x=10.90 · 0.90m</text>

  <!-- returns: dining 0.90m, living 1.00m -->
  <rect x="444" y="383" width="134" height="44" rx="5" fill="#dc7a2b"/>
  <line x1="511" y1="377" x2="511" y2="433" stroke="#9c4b12" stroke-width="2"/>
  <text x="511" y="461" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#9c4b12">return_dining · x=9.70 · 0.90m</text>

  <rect x="780" y="383" width="148" height="44" rx="5" fill="#dc7a2b"/>
  <line x1="854" y1="377" x2="854" y2="433" stroke="#9c4b12" stroke-width="2"/>
  <text x="854" y="461" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#9c4b12">return_living · x=12.00 · 1.00m</text>

  <!-- center spacing -->
  <line x1="348" y1="320" x2="511" y2="320" stroke="#576477" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="429.5" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#465164">1.10m</text>
  <line x1="511" y1="320" x2="689" y2="320" stroke="#576477" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="600" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#465164">1.20m</text>
  <line x1="689" y1="320" x2="854" y2="320" stroke="#576477" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="771.5" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#465164">1.10m</text>

  <!-- end margins from band edge to outer functional opening -->
  <line x1="140" y1="505" x2="281" y2="505" stroke="#8b95a3" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="210.5" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#596579">西余量 0.95m</text>
  <line x1="928" y1="505" x2="1060" y2="505" stroke="#8b95a3" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="994" y="530" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#596579">东余量 0.90m</text>

  <text x="600" y="582" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#697386">四个中心值平均 x=10.30；开口外包络中心 x=10.325（长短差0.025m）</text>
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto-start-reverse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#576477"/>
    </marker>
  </defs>
</svg>

# Object Manifest — 临时展示默认值
schema: interior-design-object-manifest/v1
iteration_id: presentation-defaults-20261019
objects:
  - id: whole-home-curtain-presentation
    owner: presentation-state
    parts: [curtain_living_south, curtain_master_south, curtain_master_strip_fabric, curtain_master_west, curtain_mb_washbasin_blinds, curtain_mbath_corner, curtain_nw_north, curtain_parent_south, curtain_study_south]
    function: 默认open状态下不显示窗帘节点。
    relationships: 全屋统一source.default=open；roomOverrides保持空。
    maintenance: no_change
    interfaces: [data/presentation-state.json, project-render-facts curtain projection, CurtainRegistry]
    collision: no_geometry_change
    validation_refs: [f_curtain_authority, d_owner_scope]
  - id: floor-preview-rotation-control
    owner: material-preview-ui
    parts: [MaterialPreviewPanel.floorRotation, App.materialPreviewState.floorRotationDeg]
    function: 将临时地砖预演的初始纹理方向设置为90°。
    relationships: 仅地面材质预演；不持久化到current-scheme或materials.yaml。
    maintenance: not_applicable
    interfaces: [TextureManager.applyPreviewRotation, app/src/App.ts]
    collision: no_geometry_change
    validation_refs: [f_floor_preview, f_preview_activation, d_owner_scope]
  - id: previewed-floor-surfaces
    owner: floor-material-preview
    parts: [floor:living_dining, floor:master_bedroom, floor:study, floor:master_bath, floor:bedroom_nw, floor:guest_bath, floor:kitchen, floor:balcony, floor:entry_garden, floor:bedroom_se]
    function: 用户触发预演后显示rotation=π/2的纹理；恢复正式材料时回到正式材质。
    relationships: 当前正式材料与房间覆盖照常决定材料ID；rotation仅为本次预演参数。
    maintenance: not_applicable
    interfaces: [materialPreviewState, HouseScene floor meshes, TextureManager]
    collision: no_geometry_change
    validation_refs: [f_official_floor_selection, f_preview_activation]
constraints:
  - 禁止把预演的90°写入正式材料配置或推断为铺贴施工方向。
  - 本轮不删除窗帘模型、地面区域、历史结论或现有证据。

# Design Datum — 展示默认态，不改变户型几何
schema: interior-design-design-datum/v1
iteration_id: presentation-defaults-20261019
coordinate_system: Three.js右手系；+x=东、+z=南、Y向上；单位m。
datums:
  - id: curtain-display-state
    object: all-declared-curtains
    state: open
    meaning: 所有窗帘展示节点隐藏；窗帘几何、轨道、房间归属与材质定义不变。
    basis: [f_curtain_authority, d_owner_scope]
  - id: floor-preview-rotation
    object: material-preview-floor-rotation
    plan:
      applies_to: 临时地砖材质预演中的floor surfaces
      zero_degrees: 木纹砖长边沿世界X（东西向）
      ninety_degrees: 木纹砖长边沿世界Z（南北向）
      preview_texture_rotation_radians: 1.5707963267948966
    elevation: 仅材质UV预览；不改地面几何或标高。
    basis: [f_floor_preview, d_owner_scope]
  - id: living-dining-preview-camera
    object: browser-evidence-camera
    plan:
      room: living_dining
      room_center: {x: 10.3, z: 6.1}
      south_boundary_z: 9.8
      camera_position: {x: 12.6, y: 2.6, z: 6.0}
      target: {x: 10.3, y: 0.4, z: 9.3}
    basis: [config/layout/model-geometry.yaml, runtime-resolved-room-bounds]
non_datums:
  - 正式材料选择、铺贴分缝和施工方向。
  - 墙砖、墙面或垂直面的UV方向。
  - 任何墙体、房间、窗帘轨道或家具几何。

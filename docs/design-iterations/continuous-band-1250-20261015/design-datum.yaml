    views:
      plan:
        required: true
        origin: boundary vertices shared with current ceiling zone
        axes: x-east/west,z-north/south
        direction: north is -z
        position: {x: [4.20, 7.20], z: [4.30, 5.55]}
        rotation: null
        dimensions: {width_x: 3.00, depth_z: 1.25, area_m2: 3.75}
        dimension_semantics: semantic room footprint, exactly coincident with the current main corridor ceiling zone
      elevation:
        required: true
        viewing_side: open east edge to living_dining
        vertical_axis: y
        height: 2.80
        dimensions: {room_height: 2.80, ceiling_underside_y: 2.50}

        dimension_semantics: room boundary does not create a physical partition
    geometry: {x: 5.70, y: 0, z: 4.925, width: 3.00, depth: 1.25, height: 2.80, rotation: 0}
    constraints:
      - boundary vertices use v_strip_ne, v_kit_s, v_st_ne, v_mb_ne
      - boundary exactly follows x[4.20,7.20] and z[4.30,5.55]
      - do not add physical walls or close the east connection to living_dining
      - room mirror fields in house.yaml are width=3.00, length=1.25, area=3.75

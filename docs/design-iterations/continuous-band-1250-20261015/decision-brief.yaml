supersession_review:
  - prior_decision: DEC-2026-10-05-R18及ceiling_living原0.90m深度配置
    prior_conclusion: 客厅设备带范围x[7.20,13.40]、z[4.30,5.20]；两台内机、三层风口关系和R100外露圆角已有声明。
    proposed_supersession: 仅将南边界z=5.20改至z=5.55；保留内机、底面送回风轴线和外露转角语言；x=7.20共边两角改直角以避免分区退缩。
    reason: 业主要求与已知主走廊同宽1.25m并同饰面连续。
    status: superseded_only_for_band_depth_and_shared_edge_corner_treatment
  - prior_decision: living-ceiling-underpanel-20261015
    prior_conclusion: 修复纯圆角边吊下方面板缺失；该迭代冻结时禁止改吊顶/HVAC几何。
    proposed_supersession: 保留实体下方面板渲染修复；仅对本轮批准的带深、南侧百叶和走廊照明开放配置修改。
    reason: 业主本轮明确批准1.25m连续带、风口随边界外移及筒灯迁入走廊中段。
    status: geometry_scope_superseded_for_this_iteration; renderer_fix_preserved
  - prior_decision: light_corridor_1旧位置决定
    prior_conclusion: 现点位(7.90,5.00)作为客厅边吊上的走廊口筒灯。
    proposed_supersession: 移至主走廊中段(5.70,4.90)，安装面随主走廊吊底取2.50m，并调整照明线路。
    reason: 原位距空调下出风槽投影边约75mm；业主明确批准迁入走廊中段。
    status: user_decision_supersedes_placement
  - prior_decision: DEC-2026-10-08-C05 / DEC-2026-10-09-P02 及 finish-scope F05 的墙顶涂装房间集合耦合
    prior_conclusion: 有墙面 paint_region 的房间必须同时有 paint_ceiling_region；paint_ceiling_region 房间集合必须与 paint_region 一致。
    proposed_supersession: 墙面范围继续由 paint_region 与 wall_finish 校验；吊顶范围仅由 paint_ceiling_region 选择并独立按房间 footprint 扣除铝扣板。未声明的墙或顶不纳入该类涂装面积。
    reason: 业主明确要求墙面与吊顶涂面可以独立选择；现有实现已独立计算两类面积，只需解除两者的集合校验与 F05 漏顶推断。
    status: superseded_only_for_wall_ceiling_selection_coupling

schema: interior-design-decision-brief/v3
project: bontop-design-log
iteration_id: continuous-band-1250-20261015
subject: 走廊与客餐厅设备带1.25m同宽、同饰面连续带预演
priority:
  user_goal: 深化并预览客厅空调边吊扩至与走廊同宽1.25m、同饰面的连续带；墙面与吊顶涂装范围独立选择
  ranked:
    - 涂装范围以各自显式面层声明选择；paint_region 与 paint_ceiling_region 分开计算、分开纳入范围
    - 从走廊进入客餐厅时，吊顶读作同一条1.25m深的连续带
    - 南侧送风百叶随新边界外移，功能段与装饰段保持一条线
    - 两段下出风、两段回风/检修与两台内机保持现位
    - 消除现有走廊口筒灯与空调下出风槽的近距冲突
  non_negotiables:
    - 主走廊和客厅设备带吊底均为y=2.50m、厚度0.30m
    - 连续范围x[4.20,13.40]、z[4.30,5.55]；保留两个职责独立的吊顶分区
    - ceiling_living南边界由z=5.20延至z=5.55，客厅中央原顶2.80m不变
    - 南侧功能送风与同面装饰延续段中心移至z=5.56，原长度、x范围、朝向不变
    - 两台内机、下出风z=4.85、回风/检修z=4.45不动
    - light_corridor_1移至(5.70,4.90)，安装面与主走廊吊底y=2.50m一致，线路同步调整
    - 将主走廊按现有ceiling_main_corridor边界x[4.20,7.20]、z[4.30,5.55]补为semantic_only开放语义区域；不新增实体隔墙，不生成默认房间地/顶面
    - 不在客餐厅设备带底面风口/检修线区域新增筒灯
    - 冰箱、柜体与家具不属于本轮范围
    - 当前只做真实三维模型预演，不作为施工定稿
    - 当前三段走廊墙面 paint_region 与 paint_ceiling_main_corridor 的声明先保留；这次只解除二者的房间集合耦合
  tradeoffs_accepted:
    - 客厅区净面积比原0.90m方案增加2.1743㎡，吊顶全房石膏板净面积更新为25.4055㎡
    - 两区继续以独立功能分区表达，共边正交相接、同色同饰面
    - 送风有效面积、风量、静压、梁底与安装净空待厂家/现场核验
    - 2026-10-08施工方单价口径尚未按1.25m深度重新询价；本轮不冻结造价
frozen: true
freeze_record:
  alignment_id: user-confirmed-independent-wall-ceiling-paint-20261015
  original_user_responses:
    - 帮我深化“1.25m 同宽、同饰面”的连续带方案给我看看
    - 随新边界移到 z=5.56（推荐）
    - 移到走廊中段（推荐）
    - 不用管冰箱，之前是我发错了
    - 补主走廊语义区域（推荐）
    - 独立选择。架构上应该是支持的吧？
  normalized_decisions:
    - 客厅设备带南边界由z=5.20扩至z=5.55，深度与主走廊统一为1.25m
    - 两吊顶分区保持同标高与相同石膏板面层，形成连续可视面
    - 南侧功能百叶与装饰延续段随边界由z=5.21移至z=5.56
    - 走廊筒灯移至主走廊中段(5.70,4.90)，灯具标高随吊底取2.50m，线路同步调整
    - 客厅南地插A的供电分叉沿用原插座位置；导线从新南边界外1cm离开吊顶投影后再下引
    - 主走廊语义区边界与现有吊顶区一致，不新增实体墙，house.yaml同步3.00m×1.25m×3.75㎡镜像
    - 语义区只负责点位归属与邻接校验；现有main_corridor_floor是唯一地面渲染/算量来源，ceiling_main_corridor是唯一吊顶实体来源
    - 内机、下出风、回风/检修口保持现位；冰箱柜体排除
    - 本轮是视觉/机电协调预演，不是施工定稿
    - 墙面涂装由 overlay.paint_region 逐墙段选择；吊顶涂装由 overlay.paint_ceiling_region 单独选择。没有顶面声明表示该房间顶面不纳入涂装范围。
    - 当前走廊三段墙面与吊顶涂装声明均保留；移除“涂装墙房间集合必须等于涂装顶房间集合”校验。
  confirmed_by_user: true
  confirmed_at: "2026-10-15T17:00:00+08:00"
  evidence_refs: [docs/design-iterations/continuous-band-1250-20261015/fact-table.yaml, docs/decisions/17-paint-scope-extension.md, conversation:user-confirmed-band-louver-light-scope]

      access_clearance: {front: null, rear: 0.0625, top: null}
      replaceable_parts: [water tank, touchscreen module, outlets, drip tray, tea pot, sterilizer compartment]
      inspection_requirements:
        - Verify actual China-market SKU, plug, nameplate power and manual.
        - Confirm switch plates and AC controller remain operable while the device is in place.
        - Confirm product top filling, tea-pot removal and rear/side service clearances.
        - The current object is north of the formal fridge body; verify both fridge doors and drawers on site.
    parts:
      - id: tea-bar-body
        role: white vertical case, top cap, upper touchscreen, dual outlets and cup tray

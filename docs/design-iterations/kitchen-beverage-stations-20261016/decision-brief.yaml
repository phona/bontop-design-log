  non_negotiables:
    - 不移动冰箱、餐桌、餐椅、半高柜、厨房柜体、门洞、墙体、玻璃或吊顶
    - 不新增墙控迁移、插座、回路、给排水或固定柜体
    - 将设备位置标为预演候选，不当作施工定位
  tradeoffs_accepted:
    - 饮水机先作为独立落地设备；水吧收纳柜和插座还要另外深化

facts:
  confirmed:
    - id: existing-anchor
      category: confirmed
      statement: 客厅主灯沿用 light_living_dome 原电气锚点 x=10.8m、z=7.15m、顶面 y=2.80m；回路、开关和机电路由由原配置控制。

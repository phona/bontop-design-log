schema: interior-design-decision-brief/v3
project: bontop-design-log
iteration_id: living-antique-eight-globe-light-20261017
subject: 客厅主灯换8头古铜木色吊灯R6预演
priority:
  user_goal: 用业主提供的8头复古吊灯参考图替换当前客厅主灯模型，先查看3D效果。
  ranked:
    - 参考图的8头球罩与古铜/木色外观关系
    - 总高445mm，使用单根100mm长杆
    - 客厅主灯锚点保持现状，以便直接比较造型
    - 配光只作渲染预演，不作为实物照度结论
  non_negotiables:
    - 不改 electrical light_living_dome 的位置、高度、电气回路、控制关系或HVAC/MEP路径。
    - 当前10头灯完整保存在 living-main-light-archive-20261017 归档中；此轮只替换活动预览配置。
    - 图片未标注的臂弯、水平3D方位、中心支撑结构和表面工艺均标为预演推断，不冒充商品尺寸/材质规格。
tradeoffs_accepted:
  - 首版R2/R3曾按两个4头垂直层级、层间45°错位构造；该垂直球罩高差被R4业主澄清推翻，历史R2/R3证据仍保留。
  - R4当前按两个水平4头组、平面45°错位构造，8个球罩中心统一在y=2.425m；实际商品俯视结构仍未知。
  - R5按业主进一步澄清将8根弧臂根部统一至上盘同一台面，并使用相同向上拱起的曲线；灯臂末端再下降接入同高灯座。
  - R6按业主进一步指定，统一臂根台面改为下方下杯，8根仍同向rise至同高灯座；R5上盘起弧保留为历史。
  - 用程序化纯色材质表示木色与古铜色；未制作商品级木纹或金属工艺贴图。
  - 当前照明强度仍是视觉近似值，不以亮斑/亮度判断产品实测光度。
frozen: true
allowed_scope:
  - config/render/lighting.yaml 中 light_living_dome 外观条目
  - shared/types.ts 与 shared/project-render-facts-schema.ts 中多球泡外观声明的必要兼容
  - shared/render/MultiGlobeChandelierGeometry.ts 的木色/古铜 finish 和球罩比例表现
  - 更新生成的 data/project-render-facts.json 与受影响灯具导出/渲染断言
  - 本目录的事实、设计基准、证据、评审和工作记录
forbidden:
  - 移动/重定向 light_living_dome 或改 electrical/topology/MEP/ceiling/furnishings
  - 购买、施工、承重或光度结论
  - 覆盖、删除旧10头灯归档或历史决策证据
open_questions: []
acceptance:
  - R6浏览器中 electrical:light_living_dome 有8个球罩与8根单头弧臂；8个球罩中心同高y=2.425m，只在水平方向分组错位；8根弧臂根部共用下杯y=2.4405m平面并上拱。
  - 外包络约Ø0.88m；顶面锚点y=2.80m；最低点约y=2.355m（445mm预演总高）。
  - R4中心车削尾饰最低点约y=2.3555m，不超出445mm总高包络；R2尾饰球体低点保留在历史runtime-r2。
  - 球罩横向150mm、纵向140mm；吸顶盘Ø130×35mm；木棕、古铜棕、乳白色调接近参考图。
  - 灯位、电气回路、控制与MEP不变；浏览器与GLB构造保持同源。
  - 提供非总览 context、closeup、elevation 的同版浏览器截图与运行时数据。
  - 实质审计记录旧模型切换掉什么、哪些旧结论被推翻、哪些新假设会静默失效。
alignment:
  aligned_at: 2026-10-17
  responses:
    - question: 试模使用哪档总高
      original_answer: 445 mm（推荐，接近当前450mm）
      normalized_decision: 只装100mm长杆，总高445mm
    - question: 正视图中8个灯罩的支臂结构如何建模
      original_answer: 8根单头弧臂，分两层错高（推荐，按图可见端头建模）
      normalized_decision: 8根单头弧臂，两个4头水平组；此处首轮对“两层错高”的垂直解释后来被R4澄清覆盖
    - question: 8个球罩的垂直平面如何布置
      original_answer: 是的，8个球罩同高，只在水平方向错开
      normalized_decision: 8个球罩中心统一y=2.425m；两个4头组仅在平面方位上错45°
      aligned_at: 2026-10-17 R4
    - question: 8根弧臂从哪个高度起弧
      original_answer: 所有灯珠应该是从同一个台面往上曲的呀
      normalized_decision: 8根臂根共用上盘台面y=2.585m，半径0.07m，同向rise拱线，随后下降接入同高灯座
      aligned_at: 2026-10-17 R5
    - question: 共同起弧台面具体是哪一个中心台
      original_answer: 是从下面那个台子往上曲的，而不是上面那个台子
      normalized_decision: 8根臂根统一连接下杯台面y=2.4405m，径向半径0.058m，统一rise弧线
      aligned_at: 2026-10-17 R6

        independent: true
        owner: 灯具供应商
        material: 木色程序材质与古铜杆仅为屏幕近似。
        geometry_source: shared/render/MultiGlobeChandelierGeometry.ts
        datum_refs: [design-datum.yaml#living-main-fixture-antique-8]

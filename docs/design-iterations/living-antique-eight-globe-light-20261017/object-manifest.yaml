        dependencies: [canopy-and-stem]
        collision: reviewed
        maintenance_boundary: 中心件内部接线/拆装路径待核。
        validation_refs: [evidence/closeup-r6-v001.png, evidence/elevation-r6-v001.png]
      - id: eight-single-head-arms
        role: 8根单头古铜色弧臂，八根臂根共用下杯台面y=2.4405m/半径0.058m，同一向上拱曲线；两个4头组只在水平面错45°并接至同高灯座；径向半径按Ø880mm外包络拟合。
        independent: true
        owner: 灯具供应商
        material: 古铜棕金属色为视觉近似；杆径、弧长和角度未由图纸标注。

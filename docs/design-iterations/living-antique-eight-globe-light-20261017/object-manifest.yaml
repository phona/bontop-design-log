        datum_refs: [design-datum.yaml#living-main-fixture-antique-8]
        dependencies: [center-hub-and-drop]
        collision: reviewed
        maintenance_boundary: 臂座连接、受力、变形与可拆性待厂家资料。
        validation_refs: [evidence/underside-r6-v001.png, evidence/elevation-r6-v001.png, evidence/topdown-envelope-r6-v001.png, evidence/closeup-r6-v001.png]
      - id: eight-ellipsoid-globes
        role: 8个乳白玻璃球罩，横向150mm、垂直140mm；每只球罩顶部有古铜阶纹灯座并与弧臂相接。
        independent: true
        owner: 灯具供应商
        material: 乳白球罩屏幕近似；实际透光率、眩光和色温未知。
        geometry_source: shared/render/MultiGlobeChandelierGeometry.ts
        datum_refs: [design-datum.yaml#living-main-fixture-antique-8]
        dependencies: [eight-single-head-arms]
        collision: reviewed
        maintenance_boundary: 球罩固定、灯泡规格和更换路径待SKU说明书。
        validation_refs: [evidence/closeup-r6-v001.png, evidence/context-r6-v001.png, evidence/underside-r6-v001.png]
    visual_relationships:
      - {target_object_id: sofa_3seat, relation: adjacent, requirement: 客厅主灯作为起居区视觉焦点，复核坐姿视线与压迫感。, evidence_refs: [evidence/context-r6-v001.png]}
      - {target_object_id: light_dining_pendant, relation: sibling, requirement: 与餐厅灯形成协调的复古/金属色关系，不误改餐厅灯。, evidence_refs: [evidence/context-r6-v001.png]}
    validation_refs: [review-manifest.json#reviewers.aesthetic, review-manifest.json#reviewers.functional]
    status: implemented_preview
notes:
  - R6确认八个球罩同高、八根弧臂共用下杯台面起弧并同向上拱；水平角度组仍按45°错位预演。
  - R5曾从上盘起弧，R4曾将根部分接上盘和下杯，R3曾将球罩建成垂直两层，均保留为历史版本；当前活动模型以R6为准。
  - 供应商真实连接结构、承重、换泡和配光未核实。

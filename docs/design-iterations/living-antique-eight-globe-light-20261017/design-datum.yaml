    constraints:
      - 商品图标注外径Ø880mm；预演采用横向球罩直径150mm，球心半径0.365m，使 0.365+0.075=0.440m，符合Ø880mm概念外包络。
      - 商品图标注球罩150×140mm；渲染使用椭球近似，垂直方向140mm。
      - 商品图吸顶盘Ø130×35mm；杆长只装100mm长杆；用户选择总高445mm。
      - R4按业主澄清：8个球罩中心统一在y=2.425m，两个4头组只在平面中错45°；不再做垂直灯罩层差。
      - R5历史：8根弧臂曾共用上盘台面y=2.585m、半径0.07m。
      - R6按业主进一步澄清：8根弧臂根部共用下杯台面y=2.4405m、半径0.058m，均以`rise`和0.10m拱高起弧；t=0.25处中心线y=2.492625m（高于根平面52mm），再连接球罩顶部灯座底部。
      - R4的上下分层臂根及R5的上盘臂根均留作历史版本，当前R6全部从下杯台起弧。
      - 单张正视图没有厂家俯视结构；45°平面方位与0.365m球心半径仍是满足外包络的预演拟合值。
      - 最低点按天花锚点至球罩下缘解释：y≈2.355m；商品图未明示精确测量基准，视为模型假设。
      - R3中心车削尾饰最低点y=2.3555m，与低层球罩y=2.355m相差0.5mm，均在445mm活动包络内；schema按尾饰轮廓声明总高校验。历史R2球形尾饰最低点同为y=2.3555m，详见runtime-r2与work-record。
      - R4八个同高球罩下缘均为y=2.355m；尾饰底y=2.3555m，与原445mm总高包络保持一致。
      - R3球罩顶部阶纹灯座竖直放置（Ø40×50mm），8根弧臂终点接灯座底部；两层臂根分别位于上盘/下杯，均向外上扬。该连接形式是根据厂家正视图对R2“侧插灯座”错误的修正，不代表厂商结构图。
      - 木纹棕、古铜棕、乳白玻璃为图片视觉取色，不是材质或商品工艺确认。
      - 灯体、球罩、灯臂仅表示造型关系，不代表实际承重、安装、换泡或配光。
    interfaces:

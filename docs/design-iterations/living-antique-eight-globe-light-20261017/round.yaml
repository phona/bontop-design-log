        findings:
          - R3中球罩顶部出现竖直灯座，弧臂在灯座底部收口，上下两层分别连接中心层级，中心尾饰也保持在总高包络内；R2不再出现横向插球或悬空端点读法。
          - 非阻塞：程序材质仍缺真实木纹、灯座螺纹和古铜层次；俯视为规则八辐形，45°臂位仍只是参考正视图无法核验的预演推断。
          - 非阻塞：客厅远景仍受吊顶梁和远景尺度影响；closeup、underside和elevation足以判断本轮形态。渲染光晕和球罩亮度不代表实际配光。
        blocking_issues: []
        assumptions:
          - 两层各4头、45°错位及0.365m球心半径是满足外包络的视觉拟合值，不代表厂家实际三维结构。

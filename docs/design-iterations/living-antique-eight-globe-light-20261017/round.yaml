    - 覆盖、删除旧10头灯归档或历史决策证据
  open_questions: []
  acceptance:
    - R6浏览器中 electrical:light_living_dome 有8个球罩与8根单头弧臂；8个球罩中心同高y=2.425m，只在水平方向分组错位；8根弧臂根部共用下杯y=2.4405m平面并上拱。
    - 外包络约Ø0.88m；顶面锚点y=2.80m；最低点约y=2.355m（445mm预演总高）。
    - R4中心车削尾饰最低点约y=2.3555m，不超出445mm总高包络；R2尾饰球体低点保留在历史runtime-r2。
    - 球罩横向150mm、纵向140mm；吸顶盘Ø130×35mm；木棕、古铜棕、乳白色调接近参考图。
    - 灯位、电气回路、控制与MEP不变；浏览器与GLB构造保持同源。
    - 提供非总览 context、closeup、elevation 的同版浏览器截图与运行时数据。
    - 实质审计记录旧模型切换掉什么、哪些旧结论被推翻、哪些新假设会静默失效。
  alignment:
    aligned_at: '2026-10-17'
    responses:
      - question: 试模使用哪档总高
        original_answer: 445 mm（推荐，接近当前450mm）
        normalized_decision: 只装100mm长杆，总高445mm
      - question: 正视图中8个灯罩的支臂结构如何建模
        original_answer: 8根单头弧臂，分两层错高（推荐，按图可见端头建模）
        normalized_decision: 8根单头弧臂，两个4头水平组；此处首轮对“两层错高”的垂直解释后来被R4澄清覆盖

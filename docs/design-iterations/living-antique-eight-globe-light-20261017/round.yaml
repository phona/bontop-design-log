        findings:
          - 非阻塞：程序材质没有木纹、螺纹灯座和细致古铜表面，铜色略亮橙；当前是视觉预演近似。
          - 非阻塞：俯视图读成规则八辐轮形。参考商品图只有正视图，三维臂位和两层错45°属于预演推断。

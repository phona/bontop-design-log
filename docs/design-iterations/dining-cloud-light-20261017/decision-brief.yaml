schema: interior-design-decision-brief/v3
project: bontop-design-log
iteration_id: dining-cloud-light-20261017
subject: 餐厅灯替换为中古风奶油云团灯（视觉预演）
priority:
  user_goal: "按业主提供的奶油云团灯商品主图与尺寸图，替换当前餐厅灯的 3D 造型。"
  ranked:
    - "按业主最新选择，把 light_dining_pendant 放到餐厅平顶范围 x[7.70,10.80]×z[3.00,4.30] 的中心 (9.25,3.65)，不要求在餐桌几何中心上方；保留2.80m顶面安装高度、3000K与dining回路/墙控。"
    - "主体按业主尺寸：Φ500mm 木色底盘厚26mm，Φ500mm 云罩深110mm。"
    - "三颗不同垂长的深木色球体与云朵 PE 泡罩按主图比例作可修改视觉代理。"
    - "浏览器与 GLB/export 使用同一声明式几何。"
  non_negotiables:
    - "电气点位 id、type、安装高度、temp、circuit、拓扑和 switch_dining 不变；x/z 按业主明确选择改至 (9.25,3.65)，strong-light-dining 路由末段同步调整。餐桌、吊顶和客厅灯不动。"
    - "不把按主图比例推定的总下垂/木球尺寸写成 SKU 或施工尺寸。"
    - "不以模型自发光、商品标称3200lm或5–10㎡面积宣传证明桌面照度达标。"
    - "图片/用户提供参数没有独立商品页核验；本轮不作购买推荐、承重或维修结论。"
  tradeoffs_accepted:
    - "业主明确接受吊球总高和吊线长度按主图比例预演；当前约486mm总下垂，实际 SKU 总高待核。"
    - "R12 旧版 284mm 半吸顶高度与镀铬浅穹顶造型被本轮业主参考图替换；旧配置、截图和决策记录保留为历史。"
    - "外观主色改为深木色+乳白 PE，和客厅木色/乳白多球灯形成共同材质线索；不伪造真实木纹或 PE 透光率。"
    - "R9 以用户明确选择的餐厅平顶范围中心 (9.25,3.65) 定灯位，较桌心 (9.80,3.45) 偏移约0.585m；桌面照度分布因此必须按真实 SKU 配光复核。"
    - "R10业主接受该偏心构图作为餐厅空间中心氛围灯；不要求这盏灯单独承担桌面150lx，整体餐桌照度仍作为采购前组合验证目标。"
frozen: true

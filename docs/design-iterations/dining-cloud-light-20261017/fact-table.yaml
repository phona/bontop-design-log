retrospective:
  trigger_id: owner-repositions-dining-light-off-table-center
  trigger_text: "业主补充灯具应放在餐厅平顶范围中心，不必位于餐桌几何中心上方；随后明确选择 (9.25,3.65)。这次更新推翻 R8 保留桌心的点位关系，不改变其灯具造型结论。"
  failure_evidence: []
  last_change: "DEC-2026-10-17-R8 将奶油云团灯模型锚在桌心 (9.80,3.45)；R9 后灯具中心为 (9.25,3.65)，桌位不变。"
  root_cause: "业主明确要求灯具居于餐厅平顶范围中心，而不是桌心。"
  status: ambience_role_accepted_aesthetic_review_pass
notes:
  - "本轮更新电气点位 x/z 与 strong-light-dining 路由末段；保留点位 id、安装高度、餐桌位置、3000K、dining 回路、switch_dining 控制绑定。"
  - "灯中心与餐桌中心相差约0.585m；业主接受空间中心氛围灯语义，整体桌面照度须按SKU与最终照明组合核验。"
  - "R9功能复核与DEC-2026-10-17-R10后审美复核均PASS；首轮审美FAIL已保留为历史，原因是当时采用桌面重点灯语义。复审按业主确认的空间中心氛围灯目标，不改灯位。"
  - "0.486m 总下垂、云朵泡数、吊线长度和木球尺寸只为比例预演；不得写成 SKU 或施工事实。"

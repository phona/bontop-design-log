  - 现场接口未闭环：默认窗帘帘面偏移0.12m，低反坎暂估出檐0.15m，平面存在约0.03m交叠；六处需由窗帘商/设计在量房后确认轨道偏移或反坎出檐，未确认前功能评审BLOCKED。窗框由门窗方确认top坡向、泄水孔与连续打胶，瓷砖胶/密封胶不得封堵泄水孔。

# 复制到 ~/.config/autodl-manager/config.toml
# Token 不要写在这里，请使用：export AUTODL_TOKEN="你的开发者Token"
[autodl]
host = "https://api.autodl.com"
timeout = 15
page_size = 100

# 所有 create profile 的公共默认值。
[defaults]
regions = ["westDC2"]
gpu_names = ["RTX 4090"]
gpu_num = 1
cuda_from = 118
cuda_to = 128
cpu_from = 4
cpu_to = 8
memory_from = 16
memory_to = 32
price_from = 0
price_to = 3000
image_uuid = "base-image-l2t43iu6uk"
cmd = "python launch.py"
reuse_container = true

# profile 会覆盖 [defaults] 中同名字段。
# 默认 Pro profile：已实测可创建、开机、SSH、上传、下载和释放。
[profiles.pro]
gpu_spec_uuid = "v-48g-350w"
gpu_num = 1
image_uuid = "image-ff88133a27"
cuda_from = 121
system_disk_gb = 0
data_center_list = []
instance_name = "Blender临时实例"
start_command = "sleep 1"
blender_bin = "/root/blender/blender"
remote_root = "/root/bontop-acceptance"
upload_paths = ["config", "scripts/blender", "hdri", "assets/textures", "tmp/final-render-bundle"]
engine = "CYCLES"
out_dir = "tmp/cycles"
render_version = "cycles-final"
resolution = 35
bundle = "tmp/final-render-bundle"

[profiles.blender]
gpu_spec_uuid = "v-48g-350w"
gpu_num = 1
image_uuid = "image-ff88133a27"
cuda_from = 121
system_disk_gb = 0
data_center_list = []
instance_name = "Blender临时实例"
start_command = "sleep 1"
blender_bin = "/root/blender/blender"
remote_root = "/root/bontop-acceptance"
upload_paths = ["config", "scripts/blender", "hdri", "assets/textures", "tmp/final-render-bundle"]
engine = "CYCLES"
out_dir = "tmp/cycles"
render_version = "cycles-final"
resolution = 35

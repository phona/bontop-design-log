# 复制到 ~/.config/autodl-manager/config.toml
# Token 不要写在这里，请使用：export AUTODL_TOKEN="你的开发者Token"
[autodl]
host = "https://api.autodl.com"
timeout = 15
page_size = 100

# 所有 create profile 的公共默认值。
[defaults]
regions = ["westDC2"]
gpu_names = ["RTX 4090"]
gpu_num = 1
cuda_from = 118
cuda_to = 128
cpu_from = 4
cpu_to = 8
memory_from = 16
memory_to = 32
price_from = 0
price_to = 3000
image_uuid = "base-image-l2t43iu6uk"
cmd = "python launch.py"
reuse_container = true

# profile 会覆盖 [defaults] 中同名字段。
[profiles.sd]
type = "Container"
cmd = "python launch.py"

[profiles.llm]
type = "Container"
regions = ["westDC2", "westDC3"]
gpu_names = ["A100", "A800"]
gpu_num = 1
cpu_from = 8
cpu_to = 32
memory_from = 32
memory_to = 128
price_to = 8000
image_uuid = "image-your-private-uuid"
cmd = "bash start.sh"

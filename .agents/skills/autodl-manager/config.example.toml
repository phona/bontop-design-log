# 复制到项目 .agents/skills/autodl-manager/config.toml
# 真实 token 放 .agents/skills/autodl-manager/.env 的 AUTODL_TOKEN，不要提交配置文件

[auth]
# 填入 AutoDL 控制台 -> 账号 -> 设置 -> 开发者Token
# 环境变量 AUTODL_TOKEN 会优先于此处配置
# token = "仅供本地备用；不要提交真实 token"

[api]
host = "https://api.autodl.com"
timeout = 15
page_size = 100

# AutoDL 容器实例 Pro profile。命令行参数会覆盖 profile 值。
# 默认使用已验证的 Blender 私有镜像与 3090 规格。
[profiles.pro]
gpu_spec_uuid = "v-48g-350w"
gpu_num = 1
image_uuid = "image-ff88133a27"
cuda_from = 121
system_disk_gb = 0
data_center_list = []
instance_name = "Blender临时实例"
start_command = "sleep 1"
blender_bin = "/root/blender/blender"
remote_root = "/root/bontop-acceptance"
upload_paths = ["config", "scripts/blender", "hdri", "assets/textures", "tmp/final-render-bundle"]
engine = "CYCLES"
out_dir = "tmp/cycles"
render_version = "cycles-final"
resolution = 35
bundle = "tmp/final-render-bundle"

[profiles.blender]
gpu_spec_uuid = "v-48g-350w"
gpu_num = 1
image_uuid = "image-ff88133a27"
cuda_from = 121
system_disk_gb = 0
data_center_list = []
instance_name = "Blender临时实例"
start_command = "sleep 1"
blender_bin = "/root/blender/blender"
remote_root = "/root/bontop-acceptance"
upload_paths = ["config", "scripts/blender", "hdri", "assets/textures", "tmp/final-render-bundle"]
engine = "CYCLES"
out_dir = "tmp/cycles"
render_version = "cycles-final"
resolution = 35

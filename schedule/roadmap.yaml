schema: schedule.roadmap/v1
project_id: bontop-design-log
updated_at: 2026-09-12
currency: CNY
policy:
  - 后一阶段不得自动侵占前一阶段预备金或未分配额度
  - 跨阶段提前采购必须记录批准并避免重复计费
  - proposed阶段只用于规划，不代表采购授权
phases:
  - id: phase_1_basic_occupancy
    directory: schedule/phase-1
    name: 一期基本入住
    status: planning
    depends_on: []
    budget: {ceiling_cny: 203000, allocated_cny: 203000, unallocated_cny: 0}
    scope: 基础硬装、中央空调、三卧室手动窗帘、冻结的一期必需家具和必需家电；家电新增云鲸J6上下水版扫地机器人（预算3,000元，客卫台盆下主位）；家具含主卧床/床垫/两床头柜/过渡斗柜/待选成品衣架、父母房床/床垫/成品衣柜、客餐厅沙发/餐桌椅/玄关收纳组合；主卧定制衣柜、客厅低柜/电视/咖啡桌/地灯/绿植、主卧梳妆桌凳、东南书房和西北次卧家具后移二期
    activation_gate: 交房量房、图纸会审、同口径报价及物业手续完成
  - id: phase_2_function_upgrade
    directory: schedule/phase-2
    name: 二期功能升级
    status: proposed
    depends_on: [phase_1_basic_occupancy]
    budget: {estimate_min_cny: 42100, estimate_max_cny: 67200, ceiling_cny: null}
    scope: 电视系统、补充家电、窗帘电机、小件家具及健身设备，以及一期后移的主卧定制衣柜、壁床柜、客厅低柜/大收纳柜/展示柜、咖啡桌/地灯/绿植、复杂灯光、客厅书房窗帘和东南书房/西北次卧家具
    activation_gate: 一期竣工结算完成，业主重新确认范围和预算上限
  - id: phase_3_styling
    directory: schedule/phase-3
    name: 三期入住后软装优化
    status: proposed
    depends_on: [phase_1_basic_occupancy]
    budget: {estimate_min_cny: 5000, estimate_max_cny: 10000, ceiling_cny: null}
    scope: 入住后基于真实使用反馈补充装饰、织物和氛围物件
    activation_gate: 入住观察期结束，业主确认实际缺口

  execution_authority: schedule/phase-1/control.yaml
  phase_1_ceiling_cny: 210000
  historical_baseline:
    source: config/budget/base.json
    total_budget_cny: 208000
    project_ceiling_cny: 190000
    status: historical_reference_only
  explanation: 原20.8万元/19万元基线和24万元上限均为历史口径。2026-09-12先将一期压缩至20万元上限；随后业主确认云鲸J6上下水版按3,000元追加进入一期，故一期执行上限及已分配额同步调整为20.3万元，必需家电预算由9,000元增至12,000元，未分配仍为0。2026-10-03业主定标中央空调为美的领航者四代一拖六200外机，**2026-10-04 定标成交 36,000 元**（原 33,000 元询价口径），沿用2026-09-12-R3"追加即抬上限"的先例，一期执行上限及已分配额由20.3万元调整为20.6万元，中央空调由33,000元增至36,000元，未分配仍为0。同日登记业主提供的全硬装询价轮次（hard_finish_quote_rounds），PKG-060/070/100/110的轮次目标已超过父包计划额，缺口按funding_status：owner_review_pending_20261003显形，未取得业主批准前不得视为已解决，也不得自动挪用硬装预备金。主卧定制衣柜、壁床柜、客厅大收纳柜、展示柜、复杂灯光、客厅/书房窗帘、书房次卧家具以及洗碗机、干衣机、净水设备仍后移二期。旧文件仅用于追溯，不再决定一期可承诺金额。2026-10-05（DEC-2026-10-05-R4）业主定标美的 GC5 微蒸烤一体机（目标 4,000 元）进入一期，沿用"追加即抬上限"先例，必需家电预算由 12,000 元增至 16,000 元，一期执行上限及已分配额由 20.6 万元调整为 21 万元，未分配仍为 0。


global_blockers:
  - id: BLK-HANDOVER
    status: site_pending
    item: 尚未交房，无法完成现场量房及房屋查验
    clears_when: 交房查验完成并归档现场记录
  - id: BLK-STRUCTURE
    status: site_pending
    item: 墙体结构、梁底及允许打孔或穿墙条件未确认
    clears_when: 结构资料与现场复核结果完成会签
  - id: BLK-HVAC-DEEPENING
    status: site_pending
    item: 中央空调管线、冷凝水、风口和检修口尚未完成厂家深化及三方会审
    clears_when: 空调、设计和施工三方签认深化图
  - id: BLK-SOUTH-BALCONY
    status: alignment_required
    item: 南阳台使用方式、地面和预算边界未冻结
    clears_when: 业主确认范围并同步预算及施工图
  - id: BLK-GAS-DOOR
    status: site_pending
    item: 燃气厨房门的现场验收要求未确认
    clears_when: 燃气单位或物业书面确认厨房分隔要求
  - id: BLK-MASTER-WARDROBE
    status: alignment_required
    item: 主卧北墙通顶定制衣柜（藏空调冷凝水管槽，必须定制）随2026-09-12压缩决策整体后移至二期，一期用成品衣架和斗柜过渡；门扇、位置、高度及空调检修关系仍未关闭
    clears_when: 二期启动前深化图经业主、设计和厂家共同确认
  - id: BLK-CURTAIN-SCOPE
    status: alignment_required
    item: 一期窗帘范围按2026-09-12压缩决策收窄为三个卧室（主卧/父母房/西北次卧）的遮光帘+纱帘，客厅和书房后移二期；各房遮光要求、布纱组合及轨道形式仍需逐房确认
    clears_when: 形成逐房窗帘清单并确认一期采购范围和报价
  - id: BLK-PHASE1-APPLIANCES
    status: alignment_required
    item: 一期家电额度在原9,000元下探组合基础上追加云鲸J6上下水版3,000元，现按12,000元控制；J6型号和金额已由业主确认，客卫台盆下安装条件仍待现场复核；冰箱、洗衣机、燃气灶、吸油烟机及燃气热水器的具体型号和含安装报价仍未冻结
    clears_when: 形成逐台设备清单、型号尺寸和含安装报价，并确认总额不超过一期额度或另行批准资金
  - id: BLK-WATER-HEATER-SITE
    status: site_pending
    item: 已确认一期采用燃气热水器；模型虽有厨房西侧实体墙的暂定协调点，但交房前仍未确认是否已有开发商设备、实际安装墙面、燃气表位置、排烟路径、冷凝水排放和物业审批条件
    clears_when: 现场核对现有设备和燃气条件，形成最终安装位置、排烟、给排水、专用电路及物业审批记录
  - id: BLK-FRIDGE-FIT
    status: site_pending
    item: 设计模型把冰箱位暂记为约700毫米宽×700毫米深，当前收集到的501升候选有宽约833毫米者，冰箱型号不能在净开口复测前下单
    clears_when: 现场复测完成面净宽、净深、净高、开门余量和散热缝，并筛选出尺寸满足的型号

glossary:
  - term: 工作包
    plain_description: 为了方便报价、排工期和验收，把整个装修拆成的一项独立工作。例如水电改造就是一个工作包，有自己的预算、前置条件和验收结果。
  - term: 预算池
    plain_description: 把性质相近的费用放在一起控制的金额范围。例如基础硬装预算池包含拆改、水电、防水、铺砖、吊顶等费用。
  - term: 阻塞项
    plain_description: 当前尚未解决、会导致某项工作不能开始或不能完成的事情，例如未交房、墙体性质不明或厂家图纸未确认。
  - term: 付款门槛
    plain_description: 付款前必须完成的检查条件。对应验收和证据未通过时，即使施工方提出申请也不应支付该节点款。
  - term: 拆改
    plain_description: 拆除允许拆除的墙体或构件，并按图新建墙体、调整门洞或空间边界。承重墙、梁柱和楼板不能凭经验拆除。
  - term: 水电改造
    plain_description: 根据最终家具和设备位置重新布置电线、网线、给水管和排水管，并安装对应的开关、插座和接口。
  - term: 强电与弱电
    plain_description: 强电是照明、插座和空调等供电线路；弱电是网络、电视和其他低电压信号线路。两类线路需按施工要求分开布置，减少干扰并保证安全。
  - term: 专用电路
    plain_description: 只给某台或某类大功率设备供电的独立线路，例如中央空调、厨房设备或热水器，通常在配电箱中有独立开关。
  - term: 热水回水管
    plain_description: 为缩短等待热水时间而增加的循环管路，需要在水电阶段预先铺设，并与热水器方案配套。
  - term: 物业装修报批
    plain_description: 开工前向小区物业提交装修资料、人员信息和施工内容，取得允许进场施工的手续。
  - term: 进场保护
    plain_description: 用保护膜、保护板或护角覆盖电梯、公区、入户门、窗户和已有地面，防止搬运及施工造成磕碰、划伤和污染。
  - term: 放线
    plain_description: 按设计图把新墙、门洞、柜体、插座、空调风口和吊顶边界等位置，用墨线、胶带或记号笔标到现场，供各工种共同复核后施工。
  - term: 深化图
    plain_description: 厂家或专业施工方根据现场尺寸，把设计意图细化成可以生产和安装的尺寸图、节点图及接口图。
  - term: 图纸会审
    plain_description: 业主、设计师、施工方和设备厂家把各自图纸放在一起核对，提前找出尺寸、管线、柜门、灯具和设备之间的冲突。
  - term: 隐蔽工程
    plain_description: 完工后会被墙面、地面或吊顶遮住，无法直接检查的管线、防水、龙骨和设备安装内容。
  - term: 保压试验
    plain_description: 给水管或空调冷媒管加到规定压力并保持一段时间，通过压力变化判断是否可能漏水或漏冷媒。
  - term: 闭水试验
    plain_description: 封住排水口并在防水区域蓄水，在规定时间后检查本层和楼下是否渗漏。
  - term: 复尺
    plain_description: 在墙地砖、墙面或吊顶等完成面确定后再次测量真实尺寸，定制门柜必须按复尺结果生产。
  - term: 完成面
    plain_description: 地砖、墙漆、吊顶、木饰面等全部施工完成后最终看得到、摸得到的表面位置。
  - term: 找平
    plain_description: 用水泥砂浆、石膏或其他材料修正墙地面的高低差，为后续铺砖、刷漆或安装提供平整基层。
  - term: 收口
    plain_description: 两种材料或两个构件交接处的边缘处理，例如柜体贴墙、门套接地面、台面接墙和风口接吊顶。
  - term: 空鼓
    plain_description: 瓷砖或抹灰层没有和基层充分粘牢，敲击时会发出空响，严重时可能松动或脱落。
  - term: 冷凝水
    plain_description: 空调运行时产生的水，必须通过有坡度的排水管顺利排走，不能倒流、积水或渗漏。
  - term: 送风口与回风口
    plain_description: 送风口把处理后的空气吹入房间；回风口把房间空气吸回空调内机。两者位置不当会影响效果，也必须留出清洁和检修条件。
  - term: 检修口
    plain_description: 吊顶或柜体上可打开的检查入口，用于日后维修空调、水电接头、阀门或驱动设备。
  - term: 冷媒管
    plain_description: 连接中央空调室内机和室外机、输送制冷介质的铜管，焊接、保温和压力测试会直接影响空调可靠性。
  - term: 抽真空
    plain_description: 空调连接完成后，用真空泵排出冷媒管内的空气和水分，再按设备要求进入调试；记录应由空调安装方提供。
  - term: 泥瓦施工
    plain_description: 主要包括墙地面找平、砌墙、铺地砖、贴墙砖、处理门槛和排水坡度等使用水泥砂浆的工作。
  - term: 排版与起铺点
    plain_description: 排版是提前规划每块砖如何排列；起铺点是第一块砖开始铺的位置。两者会决定门口、墙边是否出现难看的窄砖条。
  - term: 通缝
    plain_description: 不同区域或相邻墙地面的砖缝保持连续对齐，使整体更整齐；是否通缝应在铺砖前确认。
  - term: 龙骨
    plain_description: 吊顶内部用于承重和固定面板的金属或木质骨架，封板以后看不到，因此必须在隐蔽验收时检查。
  - term: 腻子、底漆和面漆
    plain_description: 腻子用于修平墙面；底漆用于封闭基层并提高附着力；面漆是最终看到的颜色和表面层。
  - term: 地柜与吊柜
    plain_description: 地柜是落地安装、支撑厨房台面的柜体；吊柜是固定在墙面较高位置的储物柜。
  - term: 五金
    plain_description: 柜门铰链、抽屉轨道、拉手、门锁、角阀、挂件等金属或功能配件的统称，需在报价中写明品牌、型号和数量。
  - term: 美缝
    plain_description: 在瓷砖缝内填入专用材料，使砖缝更易清洁并减少发黑；颜色、材料类型和计价方式应在施工前确认。
  - term: 踢脚线
    plain_description: 安装在墙面最下方与地面交界处的长条材料，用于保护墙脚并遮盖交接缝。
  - term: 开关插座面板
    plain_description: 墙面最终看得到并直接操作的开关、插座外壳和内部功能模块，不等同于水电阶段埋在墙里的底盒、电线和线管。
  - term: 窗帘盒
    plain_description: 吊顶或墙顶处用于隐藏窗帘轨道的凹槽，需要在吊顶施工前确认尺寸；窗帘布和轨道通常在墙面完成后复尺安装。
  - term: 辅材
    plain_description: 配合主要材料施工、完工后通常不显眼的材料，例如水泥砂浆、瓷砖胶、线管、接头、螺钉和密封材料；报价仍应写明种类、品牌、用量和价格，不能只写“辅材一项”。
  - term: 包干报价
    plain_description: 在事先写清的施工范围内按一个总价结算。范围之外是否加价、按什么单价加价必须在合同中说明，否则“包干”不能证明没有增项。
  - term: 集成吊顶
    plain_description: 厨房或卫生间常用的模块化吊顶，通常由金属扣板、边条和内部骨架组成，照明和取暖换气设备会安装在对应模块或开孔中。
  - term: 阴阳角
    plain_description: 墙面转角的两种形态：向房间内凹的是阴角，向外凸的是阳角。施工时需要保证线条顺直，并保护外凸边角不易磕坏。
  - term: 色温和显色参数
    plain_description: 色温描述灯光偏暖黄还是偏冷白；显色参数描述灯光还原物体真实颜色的能力。灯具不能只看瓦数，还应统一或按房间明确这两项。
  - term: 接线极性
    plain_description: 检查插座的火线、零线和保护接地线是否接到正确位置，避免错误接线带来触电或设备故障风险。
  - term: 窗帘褶皱倍数
    plain_description: 窗帘布展开宽度与轨道宽度的比例，会影响褶皱丰满程度、用布量和价格，必须与面料和窗宽一起写进报价。
  - term: 马桶坑距
    plain_description: 墙面完成位置到马桶排污口中心的水平距离，它决定可选马桶型号；购买前必须按完成面复核。
  - term: 止回阀
    plain_description: 安装在厨房排烟通道接口处、用于减少公共烟道气味和油烟倒灌的部件，需要与烟管和烟道接口匹配并密封。
  - term: 角阀、软管和混水阀
    plain_description: 角阀用于单独关闭某个洁具的供水；软管连接固定水口和洁具；混水阀把冷热水混合到所需温度。三者都要明确品牌、数量和安装责任。


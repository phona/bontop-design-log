    segments:
      - { wall: "w_mbath_east（主卫东墙）", x: 2.90, note: "旧 2.60" }
      - { wall: "w_gbath_west / w_vrv_east（西北次卧东/平台西）", x: 5.69, note: "旧 5.60" }
      - { wall: "w_kit_west / w_ent_west（厨房西/入户西）", x: 7.50, note: "厨房西旧 7.20" }
      - { wall: "w_ent_west（入户西墙）", x: 11.11, note: "旧 10.80" }
  - id: bedroom_se_shift
    note: "东南客房整体北移约 1m；南边是墙 + 2050 窗，不是玻璃幕墙（R04 的 9.88 幕墙读法作废）。"
    segments:
      - { wall: "w_be_north（北墙）", z: 4.035, note: "旧 4.82" }
      - { wall: "w_be_south（南内墙）", z: 8.47, note: "旧 9.88" }
      - { wall: "w_be_south 玻璃线（CW 2050 窗）", z: "8.65/8.73", note: "窗，非通高幕墙" }
      - { wall: "w_east_upper / w_be_s_e（东内墙）", x: 16.33, note: "旧 16.40；外皮 x=16.57" }
  - id: south_glass_runs
    note: "南边三跑玻璃（幕墙，CW/CH 2420，LD 115）。"
    segments:
      - { run: "living_south_curtain（客厅）", width_m: 5.895, x_range: [7.48, 13.37], z: 9.80, note: "模型旧 4.50m" }
      - { run: "study south（书房）", width_m: 2.78, x_range: [4.37, 7.15], note: "模型旧 1.50m" }
      - { run: "master south（主卧，含飘窗）", width_m: 3.90, x_range: [0.71, 4.16], note: "模型旧 2.40m + 飘窗" }
  - id: west_wall_and_corners
    note: "西墙整条 x=0.00（z 0.06..9.35）；外墙圆角 r450 外线切弧（模型旧 r1000 太大；并列 r530/r610 是向室内偏 80/160mm 的内线）。"
    segments:
      - { wall: "w_west_*（西墙，玻璃幕墙）", x: 0.0, z_range: [0.06, 9.35] }
      - { corner: "西北角 v_bath_nw", radius_m: 0.45, center: [0.45, 0.06] }
      - { corner: "西南角 v_sw", radius_m: 0.45, center: [0.45, 9.35] }
  - id: kitchen_north_protrusion
    note: "厨房北侧外凸至 z=−1.51（x 6.13..11.11）是管线区（里面燃气管道、外面排水），不是房间边界；厨房北墙仍按 z=−0.15。"
    segments:
      - { wall: "w_kit_north（厨房北墙）", z: -0.15, x_range: [7.50, 11.11] }
      - { wall: "CW 2575 玻璃线（幕墙）", z: "-1.31/-1.39", x_range: [7.50, 10.08] }


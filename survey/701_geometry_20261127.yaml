# 701 几何快照（8栋701）—— 模型几何状态 2026-11-27
#
# 本文件是 8栋701 三维模型在 2026-11-27 量房回填后的几何快照。
# 来源：config/layout/model-geometry.yaml（几何唯一权威源）+
# config/model/envelope/openings.yaml（飘窗/幕墙）+ config/house.yaml（房间镜像字段），
# 取自 PR #270 分支 feat/survey-model-backfill @ 2be4d3ef。
# 数值底本是 2026-11-27 业主激光实测（见 survey/701_survey_corrected.yaml，权威量房数据）；
# 与任何 DWG/PDF 值冲突处，一律以业主实测与本文件为准，DWG 原件只作参考。
# 本文件是快照（只读归档），不驱动模型：改几何只改 model-geometry.yaml，
# 改完重新生成本文件，不得反向手改本文件去“修正”模型。
#
# 单位：米（m），除非另有注明。坐标系：x 东 / z 南（+ z = 南，− z = 北），与 model-geometry.yaml 一致。
# 模型线 = 墙中心线（line_datum: centerline 的墙）；完成面 = 线 ± 半墙厚（0.06m）。
#
# 快照日期：2026-11-27。状态：snapshot（PR #270 未合入前为分支快照，合入后即为 master 几何）。

snapshot_date: "2026-11-27"
branch: "feat/survey-model-backfill"
commit: "2be4d3ef"
source_files:
  - "config/layout/model-geometry.yaml"
  - "config/model/envelope/openings.yaml"
  - "config/house.yaml"
authority: "model-geometry.yaml 是几何唯一权威源；本文件是它的只读快照。业主实测数优先于 DWG。"


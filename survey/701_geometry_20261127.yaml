  - id: north_wall_straight
    note: "北墙整条拉直在 z≈0；模型旧 z=1.10 凹进不存在。"
    segments:
      - { wall: "w_bath_north（主卫北外线）", z: -0.39, x_range: [0.0, 2.90] }
      - { wall: "w_nw_north（西北次卧北墙）", z: -0.04, x_range: [2.90, 5.69] }
      - { wall: "w_vrv_north / w_kit_north（平台/厨房北墙）", z: -0.15, x_range: [5.69, 11.11] }
  - id: north_zone_east_walls

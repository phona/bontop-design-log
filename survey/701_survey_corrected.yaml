  original: "survey/701_survey_20261126.dwg（md5 7d88d693e6d4439f0535e97b84caa1ee，1,630,869 字节；标题“原始户型图”，S:127㎡，1:100，裸墙体量房图，无房间名无家具）"
  corrected: "survey/701_survey_20261127_corrected.dwg（md5 2574f022c3a852b7b4ee706133e289e9，1,629,909 字节；量房方 2026-11-27 返修版，就用这版，不再向测量方要改动）"
  corrected_diff: "全部尺寸值、门窗标注、注释、标题文字未变；改动有三：① 墙体层旋转 180°（DWG 点 293442, −59053 为中心，24 条旧墙线 22 条精确对应、24/24 在 10mm 内）——修正南北颠倒，修正后墙线与模型现有墙位一致，无墙位改动；② 新增 2 条墙线（模型 x 0.24–2.45、z 0.86 与 1.06，主卫双沉箱分隔坎）；③ 对象净 +9（+2 LINE、+2 LWPOLYLINE、+4 MLEADERSTYLE、+1 LEADER）"
  sheet_pdf_note: "2026-11-26 出图纸（7m3n）比 DWG 多主卫标注（主卫下沉 350、部分已回填），DWG 仅客卫一处下沉 350；主卫深度以出图纸为准，但沉箱实测以本文件（约 370/约 330）为准"


# PR 验证 CI：四套件并行跑，判红条件只有一个——出现 ci/baseline/ 之外的新失败。
# 基线内失败完整呈现在日志里；基线维护纪律见 AGENTS.md「CI 基线纪律」。
# 本 workflow 不设分支保护：红不禁止合并，合并仍由业主决定。
name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 基线 delta 门禁的对照基点：PR 取 base 分支头，push 取上一个提交。
# 全零（新分支首推）或缺失时 check.mjs 自动跳过。
env:
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 —— delta 门禁要 git show 读 base 提交的 ci/baseline，浅克隆取不到 base 对象
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: node ci/check.mjs baseline-delta
      - run: npm ci
      - run: npm ci
        working-directory: app
      - run: node ci/check.mjs typecheck

  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 —— delta 门禁要 git show 读 base 提交的 ci/baseline，浅克隆取不到 base 对象
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: node ci/check.mjs baseline-delta
      - run: npm ci
      - run: npm ci
        working-directory: app
      - run: node ci/check.mjs test-server

  test-app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # fetch-depth: 0 —— delta 门禁要 git show 读 base 提交的 ci/baseline，浅克隆取不到 base 对象
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: node ci/check.mjs baseline-delta
      - run: npm ci
      - run: npm ci
        working-directory: app
      - run: node ci/check.mjs test-app

  verify-all:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # fetch-depth: 0 —— delta 门禁要 git show 读 base 提交的 ci/baseline，浅克隆取不到 base 对象
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: node ci/check.mjs baseline-delta
      - run: npm ci
      - run: npm ci
        working-directory: app
      - run: node ci/check.mjs verify-all

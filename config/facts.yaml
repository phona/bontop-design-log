      - path: README.md
        pattern: '四房两厅两卫'
        reason: 户型表的「四房两厅两卫」是卧室/厅/卫计数口径，不是房间总数；权威房间数见 fact.rooms_count（model-geometry 11 间）
      - path: docs/designer_brief.md
        pattern: '四房两厅两卫'
        reason: 对外的户型叙述用卧室口径（四房），与几何房间总数 11 间不同量纲，权威值见 fact.rooms_count

  # 材料条目数：清单每加/减一条，n 处叙述与采购台账就可能不同步。
  # 电脑侧权威 = materials 数组长度；手写声明在 config/materials.yaml 头部 notes
  # （2026-10-04 补登，作为「必须同步」的显式契约，见 c.materials_count_matches_note）。
  - id: fact.materials_count
    kind: derived
    value: "@config/materials.yaml:materials#length"
    unit: 条
    mirrors:
      - path: config/materials.yaml
        extract: '本清单共\s*(\d+)\s*条材料项'
        severity: error
        expect_matches: 1

  # 电气点位总数：水电交底单就是这份清单。点位增删不同步会让
  # 「回路够不够」「箱体位数够不够」的结论全部失据，且底盒预埋后不可返工。
  - id: fact.electrical_points_count
    kind: derived
    value: "@config/electrical.yaml:#length"
    unit: 个
    mirrors:
      - path: config/electrical-topology.yaml
        extract: 'config/electrical\.yaml 共\s*(\d+)\s*个点位'
        severity: error
        expect_matches: 1

  # 给排水点位 / 吊顶分区：分别决定防水范围与吊顶工程量。
  - id: fact.plumbing_points_count
    kind: derived
    value: "@config/plumbing.yaml:#length"
    unit: 个
    mirrors:
      - path: docs/mep-construction-guidance.md
        extract: 'plumbing\.yaml[^0-9]{0,12}共\s*(\d+)\s*个点位'
        severity: error
        expect_matches: 1
      # 2026-10-04 A7：#44 逐条登记 22 个点位里 11 处无 MEP 走线引用的事实，
      # 首捕（22）与机器条目数对账；「11 处」是补登记前的基数，登记后由契约
      # c.plumbing_point_route_or_marked 改成盯「未标记点数必须为 0」。
      # 2026-10-05 给排水 v1：点位 22→27（新增 drain_riser×3 / gas_meter / duct），
      # 其中 6 处补了 v1 路线（5 条排水 + water-kitchen-requirement 的 to 改指点位），
      # 显式 deferred 标记 11→7（gas_meter / duct 是非管路锚点，按契约登记 deferred）。
      - path: docs/pending-site-data.md
        extract: '(\d+)\s*个点位中\s*(\d+)\s*处既不是任何 route'
        severity: error
        expect_matches: 1

  - id: fact.ceiling_zones_count
    kind: derived
    value: "@config/ceiling.yaml:#length"
    unit: 个
    mirrors:
      - path: docs/mep-construction-guidance.md
        extract: 'ceiling\.yaml[^0-9]{0,12}共\s*(\d+)\s*个吊顶分区'
        severity: error
        expect_matches: 1

  # 家具条目数：92 件分布 11 个房间，是碰撞/净空门禁的输入规模。
  - id: fact.furnishings_count
    kind: derived
    value: "@config/house.yaml:furnishings#count_all"
    unit: 件
    mirrors:
      - path: docs/dressing-map.md
        extract: 'furnishings 共\s*(\d+)\s*件'
        severity: warning
        expect_matches: 1

  # 赠送面积区块数：3 处（北开敞外廊 / 南大阳台 / 西设备平台），
  # 直接决定「哪些面积不计地面预算」。
  - id: fact.gift_areas_count
    kind: derived
    value: "@config/house.yaml:gift_areas#length"
    unit: 处
    exempt:
      - path: config/house.yaml
        pattern: 'gift_areas'
        reason: 权威源自身字段声明；3 处赠送面积的逐项叙述在北开敞外廊/南大阳台/西设备平台三行 notes，面积口径另由 fact.west_platform_area 对账

  # 量房待确认项条数：39 条是「还有什么没量」的账面。新增/关闭条目必须同步。
  - id: fact.pending_site_data_count
    kind: derived
    value: "@docs/pending-site-data.md:量表共 48 条"
    unit: 条
    mirrors:
      - path: docs/pending-site-data.md
        extract: '量表共\s*(\d+)\s*条'
        severity: error
        expect_matches: 1

  # MEP 协同分层数：8 层（强电/弱电/给水/排水/冷媒/冷凝水/送风/回风），决定走线表的层口径。
  - id: fact.mep_layers_count
    kind: derived
    value: "@config/mep-hvac-coordination.yaml:layers#keys"
    unit: 层
    mirrors:
      - path: docs/mep-construction-guidance.md
        extract: 'mep-hvac-coordination\.yaml[^0-9]{0,12}共\s*(\d+)\s*层'
        severity: error
        expect_matches: 1

# ─── T3 契约层 ───────────────────────────────────────────────────────────────

contracts:

  - id: c.dec_unique
    kind: unique
    source: docs/decision_log.md
    pattern: '^#+\s*(DEC-\d{4}-\d{2}-\d{2}-[A-Za-z0-9.]+)'
    allow_suffix: ['-补', '-补2', '-补3', '.1', '.2', '.3']
    # 注意：`-补` 等含 CJK 的后缀不在 pattern 的字符类里，引擎会再看匹配之后的正文；
    # 因此 `DEC-...-051-补` 与 `DEC-...-051` 不被判为重号，但两个**无后缀**的同号
    # 标题会立刻报 duplicate_id。

  - id: c.dec_ref_resolvable
    kind: fk
    # 两级解析：全引直接命中；短引（DEC-nnn）按序号在全引里反查，唯一命中视为已解析
    # （本项目约定 config/prose 用短引、decision_log 只登记全引，全报 dangling 会是
    # 220 处噪声）。因此真正要抓的是两类：
    #   ① 反查不到 → dangling_reference
    #   ② 反查到了、但标题主题与引用语境不符 → reference_subject_mismatch
    ref_pattern: '(DEC-(?:\d{4}-\d{2}-\d{2}-)?\d{3})\b'
    ref_scope: [config/, shared/, docs/, server/]
    target: docs/decision_log.md
    target_pattern: '^#+\s*(DEC-\d{4}-\d{2}-\d{2}-\d{3})\b.*'
    # 已知错配：DEC-045 序号反查到 DEC-2026-08-26-045「主卧空调檐口」，
    # 但全仓把 DEC-045 当「主卫东墙底柜+下板+主板+PVC 盒四件同轴」引用，该决策从未入账。
    # 2026-10-04：该条 subject_assertion 已移至 c.dec045_subject_pending_adjudication
    # （warning 级，待业主/设计裁决后回迁或消除）。本契约的 severity 保持 error 不变，
    # dangling_reference 仍为 error——不因为豁免一条待决项而削弱整层外键门禁。
    subject_assertions: []

  # C5（2026-10-04 挂豁免，待业主/设计裁决）
  # ──────────────────────────────────────────────────────────────────────────
  # 为什么不能自动修：DEC-045 序号唯一反查到 DEC-2026-08-26-045「主卧空调檐口定案 +
  # 条带东北角通顶储物柜（冷凝水柜内走管）」，但全仓 66 处引用把 DEC-045 当
  # 「主卫东墙底柜+下板+主板+PVC 盒四件同轴」用——该决策从未入账。两种修法都是治理决策：
  #   ① 补录正式条目并重编号（项目已有 DEC-052/053 改号先例）；
  #   ② 把 66 处引用改指向正确编号。
  # 待谁裁决：业主 + 设计侧（选①还是②，以及补录条目的正文）。
  # 跟踪入口：docs/decision_log.md（新增/改编号条目）；本契约即显式待决登记。
  # 实现方式：从 c.dec_ref_resolvable 摘出该条 assertion，单独置为 warning 级契约，
  # 其余外键检查（dangling_reference 仍为 error）完全不受影响。
  - id: c.dec045_subject_pending_adjudication
    kind: fk
    severity: warning
    ref_pattern: '(DEC-045)\b'
    ref_scope: [config/, shared/, docs/, server/]
    target: docs/decision_log.md
    target_pattern: '^#+\s*(DEC-\d{4}-\d{2}-\d{2}-\d{3})\b.*'
    subject_assertions:
      - ref: 'DEC-045'
        expect: '主卫|悬浮板|vanity|PVC|四件|台盆'
        note: 'DEC-045 序号反查到 DEC-2026-08-26-045（主卧空调檐口），但全仓 66 处引用意指主卫四件套；需裁决：补录正式条目并重编号，或改引用指向正确编号；跟踪：docs/decision_log.md'

  - id: c.procurement_subset_of_materials
    kind: fk
    severity: warning
    ref_pattern: |-
      - id:\s*["']?([A-Za-z0-9_.\-]+)["']?
    ref_scope: [config/procurement.yaml]
    target: config/materials.yaml
    target_pattern: |-
      - id:\s*["']?([A-Za-z0-9_.\-]+)["']?

  - id: c.referenced_material_exists
    kind: fk
    ref_pattern: |-
      \b([a-z][a-z0-9]*(?:_[a-z0-9]+)*_\d{2})\b
    ref_scope: [schedule/procurement.md]
    target: config/materials.yaml
    target_pattern: |-
      - id:\s*["']?([A-Za-z0-9_.\-]+)["']?

  # ─── 2026-10-04 新增：从「一致性检查器」升级为「腐化预防器」 ─────────────────
  # 覆盖这次暴露的四类结构盲区：
  #   ① 口径被旧值取代   → c.base_json_superseded / c.hvac_model_refs_resolvable
  #   ② 型号规格串漂移   → c.hvac_model_refs_resolvable / c.gas_water_heater_model_resolvable
  #   ③ 条目增删不同步   → count 类契约（routes/materials/electrical/acceptance）
  #   ④ prose 引用不存在 → pointer 类契约 / type_ref 类契约

  # ① 作废口径必须自证退场。config/budget/base.json 的 total_budget / project_ceiling
  # 曾是活字段，2026-09-12 起被 schedule/phase-1/control.yaml 的
  # budget_reconciliation.historical_baseline 标为 historical_reference_only，但**文件自己
  # 什么都没说**，server 也就继续把它当活值读（budget API / MCP 输出 190,000）。
  # 本契约要求作废文件自己声明 status / superseded_by / note，且被指名的现行权威
  # 必须存在并真的带着活字段。谁把这三个声明删掉，谁就在重新激活作废口径 → error。
  - id: c.base_json_superseded
    kind: supersede
    source: config/budget/base.json
    fields: [total_budget, project_ceiling]
    superseded_by: schedule/phase-1/control.yaml
    live_field: control.phase_ceiling_cny
    must_declare: [status, superseded_by, note]

  # ② 型号串外键：所有 config / schedule 里引用的 MJV-* 内机与外机型号，
  # 必须存在于 config/hvac.yaml 的型号词汇表。上一轮手修的三类漂移
  # （ceiling.yaml ac_living 的「风管机 10.0kW」→ MJV-71T2、procurement.yaml hvac_01 的
  # 「美的理想家III一拖五」→ 领航者Ⅳ一拖六） hereby 固化为契约，不再依赖人记得。
  # 历史轮次参照型号（三代 180W MJV-180W-E01-LX/LH）只出现在 schedule/procurement.md
  # 的时间序叙述里，文档自述「不是本项目已选系列」，故该文件不进 ref_scope。
  - id: c.hvac_model_refs_resolvable
    kind: fk
    ref_pattern: '(MJV-[0-9A-Za-z\-]+)'
    ref_scope: [config/ceiling.yaml, config/electrical.yaml, config/house.yaml, config/procurement.yaml, schedule/phase-1/control.yaml]
    target: config/hvac.yaml
    target_pattern: '(MJV-[0-9A-Za-z\-]+)'

  # ② 燃气热水器候选型号：control.yaml 的 hot_water_decision 是唯一候选源
  # （JSQ30-MK6 主选 / JSQ30-HWF Pro 备选）。checklist.md 是其渲染产物。
  - id: c.gas_water_heater_model_resolvable
    kind: fk
    ref_pattern: '(JSQ[0-9A-Za-z\-]+)'
    ref_scope: [schedule/phase-1/checklist.md, docs/]
    exclude: [docs/decision_log.md, docs/design-iterations/]
    target: schedule/phase-1/control.yaml
    target_pattern: '(JSQ[0-9A-Za-z\-]+)'

  # ③ 条目增删不同步：机器条目数 vs prose 声明计数。数组加一条、删一条，
  # 手写声明没人改 → count_mismatch（error）。prose 命中数不符 → count_mirror_unresolvable。
  - id: c.mep_routes_count_matches_note
    kind: count
    source: config/mep-hvac-coordination.yaml
    items_path: routes
    prose:
      - path: config/mep-hvac-coordination.yaml
        extract: '本表 routes 共\s*(\d+)\s*条'
        expect_matches: 1
      - path: docs/mep-construction-guidance.md
        extract: '共\s*(\d+)\s*条路由'
        expect_matches: 1

  - id: c.materials_count_matches_note
    kind: count
    source: config/materials.yaml
    items_path: materials
    prose:
      - path: config/materials.yaml
        extract: '本清单共\s*(\d+)\s*条材料项'
        expect_matches: 1

  - id: c.electrical_points_count_matches_note
    kind: count
    source: config/electrical.yaml
    prose:
      - path: config/electrical-topology.yaml
        extract: 'config/electrical\.yaml 共\s*(\d+)\s*个点位'
        expect_matches: 1

  # 验收项实计数 ↔ rendered checklist 里的项数。注意必须按**去重后的 check id** 计：
  # 同一条验收项会被多个工作包引用（check_elec_switch 出现在 PKG-100/120/125），
  # 直接数行数会得到 46 而真实条目是 39。
  - id: c.acceptance_items_count_matches_checklist
    kind: count
    source: config/acceptance.yaml
    items_path: phases
    count_field: items
    prose:
      - path: schedule/phase-1/checklist.md
        extract: '^\| \[ \] \| (check_[a-z_0-9]+)'
        expect_matches: 39
        distinct: true

  # ④ prose 引用的仓库内路径必须真实存在。治「引用腐烂」：README / 文档 / 控制文件里写
  # `config/xxx.yaml`、`docs/xxx.md`、`tests/server/xxx.test.ts`，文件被改名、搬归档、
  # 或从没存在过，链接静默失效。时间序档案（decision_log / design-iterations）按既有约定豁免。
  - id: c.prose_paths_exist
    kind: pointer
    ref_scope: [README.md, docs/, schedule/, config/, shared/, server/]
    exclude: [docs/decision_log.md, docs/design-iterations/, docs/superpowers/, tmp/, node_modules/, config/facts.yaml]
    path_pattern: '((?:config|docs|schedule|shared|server|scripts|app|tests|assets|cad|survey|renders)/[A-Za-z0-9_\-./]+\.(?:yaml|json|md|ts|tsx|py))'

  # ④ 规则引用的家具 type 必须存在于 house.yaml furnishings。固化上一轮手修成果
  # （tv_stand / wardrobe_240 / master_freestanding_wardrobe_062 三类已补齐），
  # 并把 design-rules 一并纳入——verify-rules 已由 c.rule_targets_exist 覆盖，
  # 这里用**同一套 type 集合**反查两个规则文件，防止只有一边被改。
  - id: c.furniture_type_refs_exist
    kind: type_ref
    sources: [config/verify-rules.yaml, config/design-rules.yaml]
    under: [match, furniture, furniture_types]
    target: config/house.yaml
    target_path: furnishings
    key_field: type
    # 唯一的非家具 type：ac_indoor 是空调内机，其 match.type 由
    # c.rule_targets_exist 的 `rule_file_field: b.file` + `file_map.ceiling: config/ceiling.yaml`
    # 对账（目标集合改从 ceiling.yaml 取），不属于 furnishings 的家具词汇。
    allow:
      - type: ac_indoor
        reason: 空调内机不是家具 type；其 match.type 由 c.rule_targets_exist 的 b.file=ceiling 文件映射对账（目标集合为 config/ceiling.yaml 的 ac_* 条目）

  # ④ 泛化后的 requires_when：状态机必须自洽。
  # `pattern` 而不是 `equals`：control.yaml 的实际词汇是 budget_pool_locked 而不是 locked，
  # 用 equals 会让这条契约**一条都不匹配却照样显示为已登记**（比没有检查更糟）。
  # `min_matches: 1` 把「契约空转」本身变成 error。
  - id: c.control_lock_requires_contract_evidence
    kind: requires_when
    path: schedule/phase-1/control.yaml
    when: { field: status, pattern: 'locked$' }
    then: [locked_cny, contract_ref, evidence_path]
    # 0 命中本身是个**待裁决的治理缺口**：control.yaml 的 status_note 定义了 locked
    # 必须带 locked_cny + contract_ref，但 46 条报价轮次记录没有一条落到该状态——
    # 中央空调 2026-10-04 已定标成交 ¥36,000（DEC-2026-10-04-R1），报价轮次表里却
    # 没有对应的 locked 记录（2026-10-04 已先把唯一误烙 locked 的 QR-2026-10-03-05
    # 改回 budget_pool_confirmed_quote_pending，它只是业主预算池封顶、不是合同锁定）。
    # 因此本契约当前登记为「已武装、0 命中」：词汇一旦有人启用就开始强制，
    # 而 0 命中这件事通过下面的 pending 在报告 INFO 里露面，不会悄悄腐烂。
    min_matches: 0
    pending: "业主/控制台维护者裁决报价轮次是否引入 locked 状态：空调已成交 ¥36,000（DEC-2026-10-04-R1）但 46 条记录无一落到 locked；若引入，必须同时补 locked_cny + contract_ref + evidence_path"

  # 合同已决状态必须带成交金额与证据路径。当前 control.yaml 的 quote-round 词汇表里
  # 还没有条目落到 contract_decided（空调成交记在 hvac 预算池 + procurement.md），
  # 因此 min_matches: 0 是**有意登记的前置契约**：词汇一旦启用就开始强制，
  # 不需要有人记得回来补契约。
  - id: c.control_contract_decided_requires_evidence
    kind: requires_when
    path: schedule/phase-1/control.yaml
    when: { field: status, equals: contract_decided }
    then: [contracted_cny, evidence_path]
    min_matches: 0
    pending: "control.yaml 的报价轮次词汇表目前没有 contract_decided 状态（空调成交记在 hvac 预算池 planned_cny 36,000 与 schedule/procurement.md §01）；业主裁决是否给报价轮次增加该状态，启用后本契约立即强制 contracted_cny + evidence_path"

  - id: c.rule_targets_exist
    kind: non_empty
    source: config/verify-rules.yaml
    sections: [proximity, clearance]
    rule_fields: ['b.match.type', 'furniture_types']
    # 规则若自带 `b.file`（如 ac_socket_to_unit 指向 ceiling），目标集合改从该文件取，
    # 否则一律用下面的 target（house.yaml furnishings）。这样 ac_indoor 不会被误判。
    rule_file_field: 'b.file'
    file_map:
      electrical: config/electrical.yaml
      plumbing: config/plumbing.yaml
      ceiling: config/ceiling.yaml
      furniture: config/house.yaml
      house: config/house.yaml
    target: config/house.yaml
    target_path: furnishings
    key_field: type

  # ⑤ 材料条目 id 在全表内必须唯一。2026-10-04 A5 之前，materials.yaml 有 71 条却只有
  # 70 个唯一 id：R7 首版 950 衣柜（950×580×2450，superseded）与 R8 active 版
  # （950×580×2800）用了同一个 id `wardrobe_north_950_custom_01`，按 id 索引时
  # 后者静默覆盖前者（覆盖方向取决于读取顺序，行为不可预测）。
  # 已把历史版改成 `wardrobe_north_950_custom_01_r7_superseded`；本契约把这类
  # 「同号不同物」钉死：再造一个重复 id → duplicate_id（error）。
  - id: c.materials_id_unique
    kind: unique
    source: config/materials.yaml
    pattern: '^\s*-\s*id:\s*["'']?([a-z0-9_]+)["'']?'

  # ⑦ LEB 局部等电位：GB 55038-2025 7.4.7。2026-10-04 A6。
  # ──────────────────────────────────────────────────────────────────────────
  # 现状：shared/types.ts 与 shared/project-render-facts-schema.ts 的 PlumbingPointType
  # 已补 `leb` 枚举值，但 config/plumbing.yaml 里**一个 leb 点位都没有**——端子箱位置
  # 未知（pending #43），位置未知时不许造点位。
  # 因此本契约登记为「已武装、0 命中」的前置契约：词汇一旦有人启用就开始强制
  # 「每个 leb 点位必须带坐标/高度 + note（note 里写联结金属构件清单与规范关系）」，
  # 而 0 命中这件事通过 pending 在报告 INFO 里露面，不会悄悄腐烂。
  - id: c.leb_point_requires_bond_schedule
    kind: requires_when
    path: config/plumbing.yaml
    when: { field: type, equals: leb }
    then: [x, z, height, note]
    min_matches: 0
    pending: "LEB 局部等电位端子箱：GB 55038-2025 7.4.7 要求设局部等电位联结的场所（本项目主卫/客卫）应做 LEB；端子箱位置、需联结金属构件清单（花洒/龙头/毛巾架/排水口/采暖管）与联结截面均未知，位置未知前不得在 config/plumbing.yaml 造点位。枚举值已在 shared/types.ts 与 shared/project-render-facts-schema.ts 补齐；待位置与构件清单回来后落点，本契约立即强制 note 写明联结清单与规范关系。跟踪 docs/pending-site-data.md #43"

  # ⑧ 给排水点位要么被 route 引用，要么显式登记 deferred。2026-10-04 A7。
  # ──────────────────────────────────────────────────────────────────────────
  # config/plumbing.yaml 22 个点位里曾有 11 个既不是任何 route 的 to/via，note 里也没说
  # 为什么——「静默缺席」。既有正确先例是 drain_mbath_toilet：note 明写
  # 「本轮不画 MEP route，待 SKU + 量房后单独深化」。
  # 2026-10-05 给排水 v1：22→27 个点位（+drain_riser×3 / gas_meter / drain_riser_kitchen 同源的
  # 排烟道与燃气表），显式 deferred 标记由 11 降到 7；本契约把「必须表态」继续钉死。
  - id: c.plumbing_point_route_or_marked
    kind: covered_or_marked
    severity: error
    source: config/plumbing.yaml
    key_field: id
    note_field: note
    marker: '本轮不画 MEP route'
    ref_source: config/mep-hvac-coordination.yaml
    ref_items_path: routes
    ref_fields: [from, to, via]


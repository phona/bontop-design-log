    - path: config/materials.yaml
      scalars: [dimension]
      pattern: '[×x]'
      reason: 材料条目的家具/设备尺寸权威就是该条目自身的 spec/dims 字段（71 条各管各的），不存在跨文件第二副本；单件尺寸漂移由 verify-spatial 的 clearance 门禁承接
    - path: config/house.yaml
      scalars: [dimension]
      pattern: '[×x]'
      reason: house.yaml 的尺寸串分两类：① rooms 边界的人工标注（如厨房 3.6×2.4），权威面积由 fact.kitchen_area 多边形实测对账；② constraints/design_rationale 里的设备机身尺寸（如云鲸基站 410×433.5×198mm），权威在对应设备记录；跨文件唯一有平台适配后果的外机尺寸已单列 fact.outdoor_unit_dim
    - path: config/acceptance.yaml

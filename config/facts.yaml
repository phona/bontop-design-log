      #   ② server/phase-control.ts 成为 control.yaml control.phase_ceiling_cny 的唯一读取入口，
      #      budget-calculator / project-catalog / phase-scope 全部改读它；
      #   ③ 作废值只经 control.yaml budget_reconciliation.historical_baseline 段露出
      #      （BudgetSnapshot.historicalBaseline），并成为读取 base.json 的唯一入口；
      #   ④ 于是本条 mirror 被**移除**：base.json 不再是权威也不是镜像，是档案。
      #      档案身份由契约 c.base_json_superseded 强制自证。
      # A4（2026-10-04 挂豁免，待业主裁决）——designer_brief.md 第 23 行的
      # 「ceiling 190k / 四池 192k」是旧四池口径（config/budget/base.json v0.5-four-pool
      # 快照），与现行权威 control.yaml 206,000 不一致。
      # 为什么不能自动修：该文件是对**外交付件**（设计师简报），预算口径更新需业主裁决
      # （是否已外发、改哪一版）；未裁决前改它可能让对外文件与业主手上的版本单向漂移。
      # 待谁裁决：业主（是否已把新版预算口径发给外部设计师；若要改，改哪一版）。
      # 跟踪入口：docs/designer_brief.md 第 7 条 + config/budget/base.json notes。
      # 落地方式：**只挂 exempt，不保留 mirror**。保留一条注定失败的 mirror 只是让 warning
      # 每轮刷存在感（比没有检查更糟）；exempt 带 pending 后由引擎在 INFO 里单列露面，
      # 业主一旦裁决即删 exempt、改数据、补回 mirror。
      - path: schedule/phase-1/control.yaml
        extract: '最终预测不超过\s*¥?([\d,]+)'
        severity: error
        expect_matches: 1
    exempt:
      # 与上面 mirror 的 warning 是同一件事：这里把它显式登记为**待决豁免**，
      # 让「挂着等裁决」在报告的 INFO 里露面，而不是混在 warning 里刷存在感。
      # 业主一旦裁决（改 designer_brief 或确认外发版本），删掉本条与上面的 mirror 即可。
      - path: docs/designer_brief.md

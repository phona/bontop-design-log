    # --- dimension：A×B(/C) 尺寸串 ---
    # 这类串的权威**就是物品记录自身**的 dims/width×depth×height 字段（每件家具/设备一条），
    # 不是跨文件共享事实。真正有跨文件后果的三个尺寸已单列 fact：
    #   fact.outdoor_unit_dim（外机 0.99×0.40×0.81，决定西平台能否容纳）
    #   fact.kitchen_area / fact.kitchen_south_boundary（厨房 3.6×2.4）

      scalars: [dimension]
      pattern: '[×x]'
      reason: 量房清单的尺寸是设计图标注口径，权威面积/坐标以 config/house.yaml 与 model-geometry 多边形为准
    - path: schedule/phase-1/control.yaml
      scalars: [dimension]
      pattern: '[×x]'
      reason: control.yaml 的尺寸（平台 1.6×1.55m、风口 1000×300 等）是叙述口径；平台面积权威由 fact.west_platform_area 对账，风口尺寸以合同附件为准
    - path: schedule/procurement.md
      scalars: [dimension]
      pattern: '[×x]'
      reason: 采购决议书的尺寸为询价与合同附件叙述口径（外廓/风口/机身），权威在 config/hvac.yaml 与合同附图
    - path: docs/render-tech-debt.md

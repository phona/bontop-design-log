    - path: docs/renders/pipeline-acceptance.md
      scalars: [dimension]
      pattern: '[×x]'
      reason: 渲染管线验收留档，尺寸为渲染场景规模口径

    # --- item_count：共 N 条 / N 个点位 / N 项验收 ---
    # 计数声明的权威值全部来自机器条目数，由 fact.*_count 与 contracts 的 count 类单列对账；
    # 这里只登记**渲染产物与目录导读**里的复述。
    - path: docs/mep-construction-guidance.md
      scalars: [item_count]
      pattern: '共\s*\d+\s*(条路由|个点位|个吊顶分区|层)'
      reason: 施工指导第 0 节规模表的全部计数，逐项与机器条目数对账——fact.mep_routes_count / fact.electrical_points_count / fact.plumbing_points_count / fact.ceiling_zones_count / fact.mep_layers_count，并由 contracts 的 count 类契约（c.mep_routes_count_matches_note 等）强制

    # --- money：config/procurement.yaml 的成交金额 ---
    - path: config/procurement.yaml
      scalars: [money]
      pattern: '36,000'
      reason: 采购台账 hvac_01 复述 DEC-2026-10-04-R1 定标成交 36,000 元；权威金额由 fact.hvac_contract_cny 的三方镜像（config/hvac.yaml / schedule/procurement.md / control.yaml）对账

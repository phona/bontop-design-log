      # 2026-10-04 之前抽 `层高[^0-9]{0,20}([\d.]+)`，README 写的是「结构 3.0m / 室内净高 2.8m」，
      # 于是抽到结构层高 3.0 而权威值是净高 2.8 —— 这曾以 warning 常驻。
      # 现在的正确解法不是豁免，而是把镜像对「口径免疫」：正则强制 README 必须写出
      # 「室内净高」四个字。哪一天 README 只剩一个「层高 3.0m」而漏写净高口径，
      # 立刻 mirror_unresolvable（error）——比豁免更强。
      # severity 保持 error：净高是吊顶/柜体/空调贯流风管的设计基准，写错会传导到不可返工的分项。
      - path: README.md
        extract: '室内净高\s*([\d.]+)\s*m'
        severity: error
        expect_matches: 1
      # 对外的设计师简报同样写双口径，用同一具名口径抽法对账。
      - path: docs/designer_brief.md
        extract: '室内净高\s*([\d.]+)\s*m'
        severity: error
        expect_matches: 1


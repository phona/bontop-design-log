  - id: fact.rooms_area_caliber
    kind: derived
    value: "@config/house.yaml:rooms#field_sum:area"
    unit: ㎡
    # rooms 求和是「多边形毛口径」，project.usable_area 是「合同净口径」，
    # gift_areas 的 bbox 又是第三套口径，project.building_area 是第四套（预测建面）。
    # 2026-10-04 A2：已把 house.yaml 汇总行 notes 的两个错加数改成模型 bbox 口径
    #（入户花园 11.06→12.90、西设备平台 2.48→1.60），并删掉「≈ 预测建面 119.38㎡」
    # 这个伪等式（94.76 + 28.45 = 123.21 ≠ 119.38）。**剩余的是口径闭合性问题，不是
    # 算术问题**：净口径 / 毛口径 / 赠送计入规则三者的对齐需合同分户图裁定，
    # 见 docs/pending-site-data.md #40。因此本处豁免是为「四套口径并存」留的显式登记，
    # 不是为某个错值开脱。
    exempt:
      - path: config/house.yaml
        pattern: 'usable_area'
        reason: "rooms=多边形毛口径 / usable=合同净口径 / gift_areas=bbox 毛口径 / building_area=预测建面，四套口径并存；已修正汇总行错加数，剩余口径闭合性由 docs/pending-site-data.md #40 跟踪（需合同分户图裁定后才可对账）"
        pending: "套内 94.76㎡（合同净）+ 赠送 28.45㎡（模型 bbox 毛）= 123.21㎡ ≠ 预测建面 119.38㎡；需合同分户图裁定净/毛/赠送计入规则三者关系，跟踪 docs/pending-site-data.md #40"
      # #40 把三个口径的数值原样复述在量房清单里（94.76 合同净 / 123.21 模型毛+赠送 /
      # 119.38 预测建面）。它们不是新的独立事实，权威值分别在上面的
      # project.usable_area / rooms#field_sum:area + gift_areas bbox / project.building_area；
      # 等式不闭合是口径问题，由 #40 的待决跟踪。用「94.76㎡（合同净）」这个具名措辞锁定，
      # 哪一天该行被改写成本措辞不再命中，立刻 unregistered_fact_occurrence 提醒回来补登记。
      - path: docs/pending-site-data.md
        pattern: '94\.76㎡（合同净）'
        reason: "docs/pending-site-data.md #40 复述三个面积口径（94.76㎡ 合同净 / 123.21㎡ 模型 bbox 毛+赠送 / 119.38㎡ 预测建面）；权威值分别在 config/house.yaml 的 project.usable_area / rooms 多边形+gift_areas bbox / project.building_area，三者不可直接相加这一结论由 #40 跟踪"
      # ─── 2026-10-04 A3：house.yaml notes 的面积行级登记 ────────────────────
      # 文件级豁免撤掉后，notes 里每个面积数字都要单独表态。分类原则：
      #   ① 模型可导出 → 建 mirror（fact.usable_area / fact.building_area /
      #      fact.entry_garden_area / fact.living_dining_bbox_area /
      #      fact.master_bath_area / fact.west_platform_area / fact.kitchen_area）
      #   ② 设计图人工标注 / 开发商净标注 / corrections 时间序留档 / 推导和 → 本处 exempt
      - path: config/house.yaml
        pattern: '确认\s*94\.76㎡'
        reason: "project.corrections 第 38 行是 2026-07-02 的面积裁定留档（估算 95㎡ → 确认 94.76㎡），时间序记录；现行权威值在 project.usable_area，已由 fact.usable_area 的 house.yaml mirror 对账（expect_matches: 2 覆盖第 46/569 两行）"
      - path: config/house.yaml
        pattern: '设计图'
        reason: "house.yaml rooms/gift_areas 的 notes 里凡写「设计图标注 / 净标注 / 合并标注 / 净面积标注」的面积是点石设计图的人工标注口径（净口径），权威面积以 model-geometry 多边形与 fact.*_area 的机器推导为准；同一 note 里的模型口径数字（17.9/18.16/8.39/8.35/2.42 等）与净标注不同量纲，故整行豁免而不逐值对账"
      - path: config/house.yaml
        pattern: '开发商 6\.09㎡'
        reason: "厨房 6.09㎡ 是开发商标注的净面积口径，与本 fact 的多边形毛口径（fact.kitchen_area，3.6×2.4=8.64㎡）不同量纲；同 note 已自证「净尺寸待量房」，净/毛关系随 #40 一并裁定"
      - path: config/house.yaml
        pattern: '南向大阳台\s*[\d.]+\s*㎡'
        reason: "south_balcony status: not_modeled——模型未按室内地面建模、无几何权威源，13.95㎡ 是合同图标注口径；待量房/合同图确认地面通铺与计入规则后再建 mirror（docs/pending-site-data.md #40）"
      - path: config/house.yaml
        pattern: '赠送约\s*28\.45㎡'
        reason: "28.45㎡ = 12.90（entry_garden bbox）+ 13.95（south_balcony 合同标注）+ 1.60（platform bbox），是 #40 口径裁定用的推导和，不是独立事实；两个 bbox 加数分别由 fact.entry_garden_area / fact.west_platform_area 对账，第三个无几何权威源"
      - path: config/house.yaml
        pattern: '123\.21\s*≠\s*119\.38'
        reason: "123.21㎡ = 94.76（合同净）+ 28.45（模型 bbox 毛+赠送）的推导和，与预测建面 119.38㎡ 的差就是 #40 要裁定的口径缺口；推导和被显式登记为不可对账项，避免再出现「≈」伪等式"


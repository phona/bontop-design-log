  # c.light_height_parity（2026-10-04 重构：从「两个绝对值碰巧相等」升级为「偏移量有据且在合理区间」）
  # ──────────────────────────────────────────────────────────────────────────
  # 重构前的病根：config/electrical.yaml 的 height（施工安装完成面高度）与
  # config/render/overrides.yaml 的 anchorY（渲染锚点）是同一事实的两份绝对值，
  # 8 处不一致（2.8 vs 2.55/2.3/2.5）。这是 AGENTS.md 明令禁止的双写。
  #
  # 目标形态：electrical.height 是唯一事实源；overrides.yaml 只存**相对偏移**
  # anchorY_offset，渲染锚点在 shared/project-render-facts-projection.ts 一处派生为
  # height + anchorY_offset。重构硬验收：data/project-render-facts.json 零变化。
  #
  # 本契约的含义随之从「两个绝对值碰巧相等」变成：
  #   ① 声明了 anchorY_offset 的点位必须同时写 basis（偏移依据）；
  #   ② |anchorY_offset| <= 0.5 —— 渲染挂点不许离谱地偏离安装完成面。
  # severity 保持 error：这不是渲染审美问题，是反双写结构是否被守住的问题。
  # 每条 override 的完整性（每个灯具必须有 override）由 verify:project-render-facts
  # 的投影强校验承担，缺一条即抛错。
  - id: c.light_height_parity
    kind: requires
    path: config/render/overrides.yaml
    when: { field: anchorY_offset, exists: true }
    then: [basis]
    max_abs: 0.5

  # ⑤ 单源化之后 height 本身就是权威，但它仍有一条硬边界：**安装高度不得超出室内净高**。
  # 净高权威是 config/house.yaml project.floor_height（2.8m，见 fact.floor_height_net），
  # 这里以常量上限表达该边界（bound 不是第二份数值事实：2.9、3.0 之类一律报错）。
  # 它同时兜住「offset 契约管不到的那一半」——overrides.yaml 的偏移没变、
  # 但 electrical.height 被改动时，投影出来的渲染锚点会整体漂移。
  - id: c.light_install_height_within_net_height
    kind: requires_when
    path: config/electrical.yaml
    when: { field: type, pattern: '^(ceiling_light|pendant|dome|wall_lamp|downlight|led_strip|track_light)$' }
    then: [height]
    max_abs: 2.8
    max_abs_field: height

  # ⑥ MEP 路线标高不得低于它所经过的吊顶完成面。2026-10-04 A1 新增。
  # ──────────────────────────────────────────────────────────────────────────
  # 病根：mep-hvac-coordination.yaml 的 layers.height（强电 2.45 / 弱电 2.50 / 冷媒 2.55 /
  # 冷凝水 2.35 / 送风 2.68 / 回风 2.72）与 ceiling.yaml 的降板完成面（2.80 − thickness
  # = 2.50 / 2.65）是两套从未对齐的口径，而 shared/mep-hvac-lint.ts 的吊顶净空规则
  # 要求 `zone.area && zone.height !== undefined` 才跑——ceiling.yaml 23 条里 17 条有 area
  # 无 height、6 条有 height 无 area，交集为 0，**那条规则对本项目永远不触发**。
  # 现在：mep-lint 改为按 thickness 反算完成面（与 CeilingZoneBuilder 同口径，见
  # ceilingSurfaceY 注释）；本契约在 facts 层把同一判据固化为 error 级门禁。
  #
  # severity: error——任何**未登记的新增冲突**都是 error，不许静默过关。
  # 既有 144 处是系统性口径未对齐，根因是设计侧决策，故登记基数 registered_conflicts
  # 并强制「登记数 == 机器实算数 == docs/mep-construction-guidance.md §0 的 prose 数」：
  # 三个数任一不相等都报错，变多变少都不允许悄悄发生。
  - id: c.mep_layer_below_drop_bottom
    kind: ceiling_clearance
    severity: error
    source: config/mep-hvac-coordination.yaml
    items_path: routes
    ceiling_source: config/ceiling.yaml
    endpoints_key: mep.endpoints
    room_heights_key: mep.room_heights
    default_room_height: 2.8
    tolerance: 0.005
    registered_conflicts: 153
    prose:
      - path: docs/mep-construction-guidance.md
        extract: '低于降板完成面的既有冲突\s*(\d+)\s*处'
        expect_matches: 1
    pending: "MEP 吊顶内分层标高整层低于降板完成面（强电 2.45 < 2.50、冷凝水 2.35 < 2.50、弱电 2.50 < 0.15m 降板的 2.65 等），实算 153 处（2026-10-05 给排水 v1 新增 5 条排水路线，144→149；DEC-2026-10-05-R11 客餐厅冷凝水改线 149→154 合计 +5；DEC-2026-10-05-R19 厨房铝扣板收回 z=2.4、餐厅改两条服务带后，refrigerant-trunk 原在厨房铝扣板（完成面 2.65）内的线段改在西侧服务带（完成面 2.50）空腔内，其 2.55 标高由低于改为高于完成面，该 hit 合法消失，154→153）；需设计侧裁定：分层标高升入降板空腔（2.50–3.00m）或调整降板厚度/范围。跟踪 docs/pending-site-data.md #41；裁定后同步更新 docs/mep-construction-guidance.md §0 的登记数与本契约的 registered_conflicts"

  - id: c.layout_region_room_overlap
    kind: overlap
    datasets: ['layout.floor_regions', 'layout.rooms']


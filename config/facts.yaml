# ============================================================================
# config/facts.yaml —— 非几何数据对账登记表（`npm run verify:facts`）
#
# 本表是 verify:facts 门禁唯一的输入。它把「同一个事实被散写在 config / docs /
# schedule 多处」这件事变成一份**可评审的登记表**：每个事实声明权威值来自哪里、
# 哪些位置是它的镜像（必须对账）、哪些位置是豁免（必须写理由）。
#
# 四层结构与各自语义
# ──────────────────────────────────────────────────────────────────────────
# T1 `scan`（发现层）
#    在 include 目录范围内，对每个 scalar 正则做全文扫描，得到「值 → [位置...]」。
#    凡是**没有任何 fact 的 mirror/exempt 或 scan.exempt_occurrences 覆盖**的出现，
#    报 `unregistered_fact_occurrence`（warning）。
#    目的：把「没人认领的数字」变成显式债务，数字新增时立刻可见。
#    最小示例：
#      scan:
#        scalars:
#          - { id: money, pattern: '[¥￥]\s?([\d,]{4,})' }
#
# T2 `facts`（对账层）
#    - kind: derived   权威值从机器源推导，value 写 `@<file>:<点分路径>`。
#      点分路径支持派生算子（写在单独一段里，前缀 `#`）：
#        `#length`            数组长度
#        `#shoelace`          多边形（顶点 id 数组或 {x,z} 数组）鞋带面积
#        `#bbox_area`         多边形外接矩形面积（顶点 id 会查同文件的 vertices 表）
#        `#field_sum:<f>`     数组里每个对象的 <f> 求和
#        `#find:<k>=<v>`      在数组里找 <k> 等于 <v> 的元素，后续路径段继续深入
#      最小示例：`value: "@config/electrical-topology.yaml:circuits.length"`
#    - kind: narrative 权威值是一句人写的话，value 写 `@<file>:<字面定位串>`。
#      引擎用后半段**逐字**在文件里定位，取其中第一个数字作为权威值。
#      定位不到 → `authoritative_unresolvable`（error）。
#      最小示例：`value: "@schedule/phase-1/control.yaml:phase_ceiling_cny: 206000"`
#    - `mirrors[]` 每个镜像：{ path, extract, severity, expect_matches, group, scale, tolerance }
#        extract       在 path 全文做多行匹配（引擎统一加 g+m）
#        expect_matches 期望命中数，默认 1。**命中数不符一律报 mirror_unresolvable
#                       （error）——禁止静默跳过**，这是本门禁反漂移的核心。
#        group         取第几个捕获组，默认 1；无捕获组时退化为整个匹配
#        scale         数值缩放（如 `ceiling 190k` 写 190、scale: 1000）
#        severity      不一致时的级别，默认 error
#      最小示例：`{ path: config/acceptance.yaml, extract: '本户\s*(\d+)\s*条回路' }`
#    - `exempt[]`  { path, pattern, reason }：该文件里命中 pattern 的**行**不再参与
#      T1 出现登记。reason 必填。
#
# T3 `contracts`（契约层，8 种内置 kind，均声明式、无表达式/eval）
#    unique    对 source 全文 grep，pattern 首捕为 id；重复即 error。
#              `allow_suffix` 列出的后缀视为补充条目（如 `-补`/`.1`），不与正牌判重。
#              最小示例：{ id: c.x, kind: unique, source: docs/decision_log.md,
#                          pattern: '^#+\s*(DEC-\d{4}-\d{2}-\d{2}-[A-Za-z0-9.]+)' }
#    fk        ref_scope 各文件里 grep ref_pattern 拿引用 id 集合；target 文件里 grep
#              target_pattern 拿目标 id 集合；引用∖目标 = dangling。
#              最小示例：{ id: c.y, kind: fk, ref_scope: [config/],
#                          ref_pattern: '- id:\s*"?([a-z0-9_]+)"?',
#                          target: config/materials.yaml,
#                          target_pattern: '- id:\s*"?([a-z0-9_]+)"?' }
#    requires  path 的 yaml 里递归找所有 `when.field == when.equals` 的对象，
#              同级缺少 `then[]` 中任一字段 → error。
#              最小示例：{ id: c.z, kind: requires, path: schedule/phase-1/control.yaml,
#                          when: { field: status, equals: locked },
#                          then: [locked_cny, contract_ref, evidence_path] }
#    non_empty source 的 rule 里 `rule_fields` 取出的值必须存在于 target 的
#              `key_field` 集合，否则该规则空转 → error/warning。
#              `sections` 指定从哪些顶层段取 rule（数组逐项 / 映射整体视为一条 rule）。
#              若 rule 自带文件指向（`rule_file_field` + `file_map`，如 `b.file: ceiling`），
#              目标集合改从该文件取，避免跨文件的 type 误判。
#              最小示例：{ id: c.w, kind: non_empty, source: config/verify-rules.yaml,
#                          sections: [proximity, clearance],
#                          rule_fields: ['b.match.type', 'furniture_types'],
#                          target: config/house.yaml, target_path: furnishings,
#                          key_field: type }
#    mutex     同一文件内 `patterns[]` 中两类互相矛盾的表述同时出现 → error。
#              最小示例：{ id: c.v, kind: mutex, scope: [config/hvac.yaml],
#                          patterns: ['(?<![不])含.{0,4}复合风管', '不含复合风管'] }
#              ⚠️ 若一个 pattern 是另一个的子串（「含复合风管」⊂「不含复合风管」），
#              必须给前者加否定环视 `(?<不)`，否则永远同时命中。
#    sum       items_path 指向的数组/映射按 `field` 求和，与 total 比较。
#              两种模式：`total_path`（整体对比）或 `field`+`total`（逐项对比）。
#              最小示例：{ id: c.u, kind: sum, source: config/budget/base.json,
#                          items_path: categories, field: budget,
#                          total_path: total_budget }
#    parity    left/right 两个文件按 key join，比较 field；`filter_field`/`filter_values`
#              可先过滤条目。缺失或不等 → error。
#              最小示例：{ id: c.t, kind: parity,
#                          left: { path: config/electrical.yaml, key: id, field: height,
#                                  filter_field: type, filter_values: [ceiling_light] },
#                          right: { path: config/render/overrides.yaml, key: id, field: anchorY } }
#    overlap   datasets 里的两个多边形集合两两求交（分离轴 + Sutherland–Hodgman），
#              有交叠 → error，message 给出两个 id 与交叠面积。
#              最小示例：{ id: c.s, kind: overlap,
#                          datasets: ['layout.floor_regions', 'layout.rooms'] }
#
# T4 `coverage`（覆盖层）
#    1. 对 `config/*.yaml`、`config/layout/*.yaml`、`config/render/*.yaml`、`data/*.json`
#       的**每个顶层字段**，凡未在本表登记 → `field_uncovered`（warning）。
#       数组根文件没有命名字段，用伪字段 `*` 登记一次。
#    2. 每条 coverage 的 `readers` 会被真的 grep：字段名一次都没出现 →
#       `declared_reader_does_not_read`（error）。**覆盖矩阵不许说谎。**
#       最小示例：{ file: config/ceiling.yaml, field: height,
#                  readers: [shared/mep-hvac-lint.ts] }
#       `fields` 是 `field` 的多字段简写；`readers: []` 表示「纯数据，无声称读者」。
#
# 维护铁律（下一个会话请先读这三条）
# ──────────────────────────────────────────────────────────────────────────
#  1. 新增镜像必须写 extract + expect_matches；命中数不符即失败，**不许静默跳过**。
#  2. 新增豁免（fact.exempt / scan.exempt_occurrences）必须写 reason，并说明属于
#     「历史留档 / 渲染产物 / 双口径未收敛」中的哪一种。没有 reason 的豁免视为谎言。
#  3. 权威值只允许 derived（机器源）或 narrative（显式锚点），不许手抄数字。
#  4. 本门禁**只报告问题，不修数据**。发现问题后改 config/docs/schedule 的对应条目，
#     再回来重跑；不要为了让门禁变绿而删镜像或加无条件豁免。
# ============================================================================

version: 1

# ─── T1 发现层 ───────────────────────────────────────────────────────────────

scan:
  include: [config/, docs/, schedule/]
  exclude: [docs/design-iterations/, tmp/, node_modules/, config/facts.yaml]
  scalars:
    - { id: circuit_count, pattern: '(\d{1,2})\s*路' }
    - { id: money, pattern: '[¥￥]\s?([\d,]{4,})' }
    - { id: kw, pattern: '(\d{1,2}\.\d)\s?kW' }
    - { id: area_sqm, pattern: '(\d{1,3}\.\d{1,2})\s*㎡' }
    # 2026-10-04 新增三类「结构盲区」标量。它们不是数值事实，而是**分布发现器**：
    # 第一次跑必然大量未登记，逐条处置（登记 mirror / exempt+reason）之后，
    # 全库的型号串与尺寸串就从「散写无人对账」变成「每次新增都可见」。
    - { id: model_string, pattern: 'MJV-[0-9A-Za-z\-]+|JSQ[0-9\-]+|领航者[ⅣIV]+|理想家[IV]+|大金|日立|风管机\s*\d+(?:\.\d)?kW' }
    - { id: dimension, pattern: '\d\.\d+\s*[×x]\s*\d\.\d+(?:\s*[×x]\s*\d\.\d+)?' }
    - { id: item_count, pattern: '共\s*\d+\s*条|\d+\s*个点位|\d+\s*项验收' }

  # 文件/目录级噪声登记。不属于任何 fact 的域，但必须显式登记并写 reason，
  # 否则 T1 会把它们全报成 unregistered_fact_occurrence。
  exempt_occurrences:

    # --- 时间序档案：全仓 DEC 历史，数值都是「当时快照」---
    - path: docs/decision_log.md
      pattern: '.'
      reason: 时间序决策档案：金额/回路数/功率/面积均为当轮快照，权威值以当轮 DEC 引用的 config 字段为准；本文件只做追溯，不做对账

    - path: docs/design-iterations/
      pattern: '.'
      reason: 迭代过程留档（fact-table / decision-brief / evidence），非现行事实源

    # --- control.yaml 的渲染产物：不是事实源，改了 control.yaml 会重新生成 ---
    - path: schedule/phase-1/budget.md
      pattern: '.'
      reason: control.yaml generated_views 渲染产物，金额与回路数由 schedule/phase-1/control.yaml 生成，非事实源
    - path: schedule/phase-1/schedule.md
      pattern: '.'
      reason: control.yaml generated_views 渲染产物，金额由 schedule/phase-1/control.yaml 生成，非事实源
    - path: schedule/phase-1/checklist.md
      pattern: '¥'
      reason: control.yaml generated_views 渲染产物；其中「本户 20 路」已由 fact.circuit_count 镜像单列校验

    # --- 采购/预算叙述：权威金额在 control.yaml 的 planned_cny/contracted_cny ---
    - path: schedule/procurement.md
      scalars: [money]
      pattern: '¥'
      reason: 采购决议书里的金额是阶段叙述与历史询价轮次留档，权威金额以 schedule/phase-1/control.yaml 的 planned_cny/contracted_cny 为准；§01 定标成交 36,000 已由 fact.hvac_contract_cny 镜像单列
    - path: schedule/procurement.md
      scalars: [kw]
      pattern: 'kW'
      reason: 暖通功率双口径（设计 21.6kW / 成交判读 25.3kW）与历史轮次叙述，无单一权威值，由 docs/pending-site-data.md #39 跟踪收敛
    - path: schedule/procurement.md
      scalars: [area_sqm]
      pattern: '㎡'
      reason: 房间面积为气流覆盖分区口径（31㎡+14㎡=44.58㎡），权威以 config/house.yaml rooms 与 model-geometry 多边形为准
    - path: schedule/phase-1/control.yaml
      scalars: [kw]
      pattern: 'kW'
      reason: control.yaml 只在 gate 判据里复述暖通功率，权威值在 config/hvac.yaml load_design
    - path: schedule/README.md
      pattern: '.'
      reason: 目录导读，金额为概览叙述
    - path: schedule/phase-1/README.md
      pattern: '.'
      reason: 目录导读，金额为概览叙述
    - path: schedule/phase-2/
      pattern: '.'
      reason: 二期范围，不进入一期事实对账
    - path: schedule/phase-3/
      pattern: '.'
      reason: 三期范围，不进入一期事实对账

    # --- 研究与选型留档：功率/面积都是询价当时的估计 ---
    - path: docs/hvac-deepening-20260907.md
      pattern: '.'
      reason: 2026-09-07 空调深化研究留档（已被 DEC-2026-10-04-R1 成交结论取代），功率/面积/回路数均为当时估计
    - path: docs/hvac-rfq-brief-20261003.md
      pattern: '.'
      reason: RFQ 询价简报，功率与面积为询价口径，非成交事实
    - path: docs/hvac_options_analysis.md
      pattern: '.'
      reason: 方案比选研究留档，面积为负荷估算口径
    - path: docs/material_selection_log.md
      pattern: '.'
      reason: 选材过程日志，金额/功率为到店询价记录
    - path: docs/dressing-map.md
      pattern: '.'
      reason: 软装摆位图说明，功率为灯具标注口径
    - path: docs/designer_brief.md
      scalars: [area_sqm]
      pattern: '㎡'
      reason: 设计师简报的面积为设计基准叙述，权威面积以 config/house.yaml 与 model-geometry 多边形为准

    # --- config 是机器源，但标量散写在 notes/注释里，逐条对账由专项 fact 承载 ---
    - path: config/
      scalars: [kw]
      pattern: 'kW'
      reason: 暖通/电气功率双口径（设计 21.6kW vs 成交判读 25.3kW）无法用单一 regex 抽出权威值，已在 fact.hvac_indoor_kw_total 显式豁免；其余散写于 notes 的功率不建 fact
    # 2026-10-04 A3：原来的**文件级** area_sqm 豁免（pattern: '㎡'）已撤掉。
    # 它把 house.yaml 整份文件的面积数字一起盖住，569 汇总行的「94.76 + 11.06 + 13.95
    # + 2.48 ≈ 119.38」就在这张毯子底下裸奔了三年——A2 修出的两个错加数就是这么漏掉的。
    # 现在改为**行级**处置：rooms/gift_areas 的面积字段由 verify-data-consistency A/B 项
    # 与 fact.usable_area / fact.parent_room_area / fact.west_platform_area 专项对账；
    # notes 里的每个数字要么建 mirror（模型可导出的），要么逐条 exempt + reason。
    # 新的验收：见 fact.rooms_area_caliber 之后新增的
    # c.house_area_notes_registered 契约与各 fact 的 mirrors/exempt。
    - path: config/hvac.yaml
      scalars: [area_sqm]
      pattern: '㎡'
      reason: 负荷设计的热区面积与外廓尺寸为协调值，权威面积以 config/house.yaml 与 model-geometry 为准
    - path: config/budget-pitfalls.yaml
      scalars: [area_sqm]
      pattern: '㎡'
      reason: 预算模板的估算基数（套内 94.76㎡），非面积权威源
    - path: config/budget/base.json
      scalars: [area_sqm]
      pattern: '㎡'
      reason: 旧四池口径的估算基数，面积权威在 config/house.yaml
    - path: config/layout/model-geometry.yaml
      scalars: [area_sqm]
      pattern: '㎡'
      reason: 几何模型注释里的面积为人工标注口径，机器口径以多边形求值为准
    - path: docs/pending-site-data.md
      scalars: [kw]
      pattern: 'kW'
      reason: 量房清单 #39 复述成交判读容量（25.3kW）与厂家待核项；#39 已于 2026-10-05 重写，不再含设计口径 21.6kW，本豁免随该重写一并收窄
    # 2026-10-05 DEC-2026-10-05-R2 新增 #47：#47 引用 CAD 标注的次卧面积值作为
    # 「标签数/面积口径未裁决」这一冲突本身的证据。这些值是待裁决对象，不是现行面积口径，
    # 权威面积由 model-geometry 多边形实测与 fact.rooms_area_caliber / #40 承载。
    - path: docs/pending-site-data.md
      scalars: [area_sqm]
      pattern: '㎡'
      reason: 量房清单 #47 引用 CAD 标注面积（8.39㎡/8.35㎡）作为未裁决冲突的证据，不是现行面积口径；权威以 model-geometry 多边形与 fact.rooms_area_caliber 为准，收敛由 #47 与 #40 跟踪

    # ─── 2026-10-04 新增标量的登记（T1 发现层的噪声归属） ─────────────────────
    # 原则：**不是把新标量一律关掉**，而是把每一处出现归到「谁是这个数的权威」。
    # 型号串的跨文件一致性由契约 c.hvac_model_refs_resolvable 强制（见 contracts），
    # 尺寸串的权威就是物品记录自身的 dims 字段，跨文件复述由对应 fact 单列对账。

    # --- model_string：空调型号串 ---
    # config/hvac.yaml 是全屋型号词汇的**权威源**（outdoor.model + rooms 表 basis），
    # 它自身不是任何 fact 的镜像；下游引用由 c.hvac_model_refs_resolvable 强制
    # 「引用的型号必须存在于 config/hvac.yaml」，因此这里登记为词汇源头。
    - path: config/hvac.yaml
      scalars: [model_string]
      pattern: 'MJV-|领航者|理想家|大金|日立'
      reason: config/hvac.yaml 是空调型号串的权威源（plans[0].outdoor.model + plans[0].rooms 表 + load_design.basis），不是任何 fact 的镜像；下游引用由 c.hvac_model_refs_resolvable 强制必须可在本文件反查到
    # config/materials.yaml 的 hvac_01 于 2026-10-05 由预研候选改为成交口径，带进了
    # MJV-200W-E01-LHIV 型号串；权威仍在 config/hvac.yaml，一致性由
    # c.hvac_model_refs_resolvable 对账，此处登记为复述。
    - path: config/materials.yaml
      scalars: [model_string]
      pattern: 'MJV-|领航者|理想家'
      reason: 材料清单 hvac_01 复述 DEC-2026-10-04-R1 成交配置（MJV-200W-E01-LHIV 20kW 一拖六，2026-10-05 由预研候选改写为成交口径）；型号一致性由 c.hvac_model_refs_resolvable 对账
    # config/ceiling.yaml 的 ac_* 与 config/electrical.yaml 的 sock_*_ac 是**同一台内机**
    # 在吊顶几何与电气取电两个子系统里的两份记录，型号串本身由 config/hvac.yaml 授权；
    # 两处的漂移由 c.hvac_model_refs_resolvable 抓（型号必须存在于 hvac.yaml）。
    # 吊顶里的 ac_* 内机型号必须**全部**是 config/hvac.yaml 词汇表里的 MJV-* 串。
    # 2026-10-04 已把 5 条旧「风管机 NkW（DEC-2026-09-07-055）」口径改为现行 MJV-*，
    # 2026-10-05 DEC-2026-10-05-R1 再改为成交逐房映射 MJV-71T2/42T2/56T2/28T2×3；
    # 哪一条被改回旧串（或新条目漏写型号），立刻 unregistered_fact_occurrence
    # + c.hvac_model_refs_resolvable 双报。
    - path: config/ceiling.yaml
      scalars: [model_string]
      pattern: 'MJV-'
      reason: 吊顶里的 ac_* 内机型号抄自 config/hvac.yaml rooms 表（现行：71T2/42T2/56T2/28T2×3）；旧口径「风管机 NkW（DEC-2026-09-07-055）」与 R6 的 45T2/22T2 分级均已被 DEC-2026-10-05-R1 取代，因此本文件只允许出现 MJV- 串——出现别的型号写法即视为漂移，由 unregistered_fact_occurrence 与 c.hvac_model_refs_resolvable 双报
    - path: config/electrical.yaml
      scalars: [model_string]
      pattern: 'MJV-'
      reason: 电气取电点位 note 复述 config/hvac.yaml rooms 表的内机型号，用于说明供电容量与回路归属；型号一致性由 c.hvac_model_refs_resolvable 对账
    - path: config/house.yaml
      scalars: [model_string]
      pattern: 'MJV-|领航者|理想家'

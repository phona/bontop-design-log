  - { id: water-balcony, layer: water_supply, status: pending, source_status: plan_supported, construction_status: pending, method: wall_branch, diameter: 0.025, from_height: 0.80, to_height: 0.80, from: {x: 7.3, z: 1.08, y: 0.80}, via: [{x: 6.0, z: 1.08, y: 0.80}, {x: 6.0, z: 1.5, y: 0.80}], to: faucet_balcony_washer, penetration: [{ wall: w_balc_east, at: {x: 7.2, z: 1.08}, height: 0.80, note: '厨房侧给水正交穿阳台门墙 w_balc_east 实体段（门洞 d_kit_balc z[1.2,2.0] 以北 z[1.0,1.2]，余量 0.10m 量房复核），沿阳台墙面正交折线至洗衣机龙头；真实水源/立管待现场复核。' }], label: '生活阳台洗衣机给水（plan_supported，自厨房方向引入）', reason: '2026-09-01 v1：修复原 from==to 退化占位；给水提议自厨房西侧正交穿 w_balc_east 实体段，沿阳台墙面正交折线至 faucet_balcony_washer；真实给水立管和墙面条件待现场复核。' }

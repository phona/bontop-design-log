version: '1'
status: preliminary
note: "综合水电+中央空调协调 proposal；2026-09-01 v1 走线重写：路径贴吊顶网络（走廊/门厅/客厅北缘边吊+各房间边吊）与墙面，平面走向一律正交（曼哈顿式）折线，穿墙处显式声明 penetration 且穿墙线段与墙正交，重力管带 flow_direction/slope；路线仍为 preliminary/proposed，不是施工图或施工放线依据。"
layers:
  strong_power: { label: '强电', color: '#ef4444', height: 2.45 }
  weak_power: { label: '弱电', color: '#8b5cf6', height: 2.50 }
  water_supply: { label: '给水', color: '#0ea5e9', height: 0.18 }
  drainage: { label: '排水', color: '#16a34a', height: 0.10 }
  refrigerant: { label: '冷媒', color: '#f97316', height: 2.55 }
  condensate: { label: '冷凝水', color: '#06b6d4', height: 2.35 }
  supply_air: { label: '送风', color: '#facc15', height: 2.68 }
  return_air: { label: '回风', color: '#a16207', height: 2.72 }
# endpoint: point id from electrical/plumbing/hvac, or explicit local coordinate.
# via points use local x/z coordinates; y is the coordination elevation in metres.
# 吊顶网络基准（config/ceiling.yaml）：走廊吊顶 x[4.2,7.2] z[4.3,5.55]、门厅吊顶 x[10.8,13.4] z[2.9,4.3]、
# 客厅北缘边吊 x[7.2,13.4] z[4.3,5.2]、厨房铝扣板 x[7.2,10.8] z[0,4.3]（注：厨房房间南界 DEC-014 z=2.4 与吊顶范围存在既有漂移，待核）、
# 主卧檐口 x[0.05,4.2] z[4.3,4.95]、父母房北缘边吊 x[4.2,7.2] z[5.55,6.45]、儿童房南墙边吊 x[2.6,5.6] z[3.7,4.3]、书房北墙边吊 x[13.4,15.8] z[5.55,6.15]。
# 走廊/客厅边吊主干轴线：z=4.6；门厅段轴线：x=13.3 / z=4.2；厨房段轴线：x=7.45。
routes:
  # ================= 强电（空调专用回路主干 + 分支，走顶 2.45–2.50） =================
  - { id: strong-main, layer: strong_power, status: inferred, source_status: proposed, construction_status: pending, method: cable_tray, diameter: 0.06, from_height: 2.45, to_height: 2.45, from: panel_strong_entry_left, via: [{x: 13.3, z: 3.7, y: 2.45}, {x: 13.3, z: 4.2, y: 2.45}, {x: 10.9, z: 4.2, y: 2.45}, {x: 10.9, z: 4.6, y: 2.45}, {x: 7.35, z: 4.6, y: 2.45}, {x: 7.2, z: 4.6, y: 2.45}], to: bend_corridor, label: '强电主干：配电箱→门厅吊顶→客厅北缘边吊→走廊枢纽', reason: '配电箱上方起升至 2.45m，沿门厅吊顶（x=13.3 轴线南行→z=4.2 轴线西行），北转入客厅北缘边吊 z=4.6 轴线西行至走廊枢纽 bend_corridor；全程正交折线、在吊顶空腔内，不穿墙。回路、桥架规格待现场确认。' }
  - { id: strong-ac-living, layer: strong_power, status: inferred, source_status: proposed, construction_status: pending, method: conduit, diameter: 0.025, from_height: 2.45, to_height: 2.50, from: bend_corridor, via: [{x: 7.2, z: 4.6, y: 2.45}, {x: 10.0, z: 4.6, y: 2.50}], to: sock_living_ac, label: '客厅空调电源（客厅北缘边吊内东行）', reason: '走廊枢纽北折入边吊 z=4.6 轴线，东行至 sock_living_ac 上方北转到位；不穿墙。回路容量待确认。' }
  - { id: strong-ac-master, layer: strong_power, status: inferred, source_status: proposed, construction_status: pending, method: conduit, diameter: 0.025, from_height: 2.45, to_height: 2.60, from: bend_corridor, via: [{x: 7.2, z: 4.6, y: 2.45}, {x: 4.6, z: 4.6, y: 2.50}, {x: 4.05, z: 4.6, y: 2.50}], to: sock_master_ac, penetration: [{ wall: w_strip_east, at: {x: 4.2, z: 4.6}, height: 2.50, note: '走廊吊顶穿孔进主卧空调檐口；穿点位于门洞 d_mb（z[4.65,5.55]）以北实体段（净距仅 0.05m，量房重点复核），与冷媒主管同孔区，套管待深化。' }], label: '主卧空调电源（穿孔 z≈4.6 直线向西，零拐弯）', reason: '按 ceiling_master_ac 既定意图：走廊 z=4.6 轴线西行、正交穿孔（z≈4.6）后沿主卧空调檐口直线向西至 sock_master_ac，零拐弯。回路容量和套管待确认。' }
  - { id: strong-ac-parent, layer: strong_power, status: inferred, source_status: proposed, construction_status: pending, method: conduit, diameter: 0.025, from_height: 2.45, to_height: 2.50, from: bend_corridor, via: [{x: 7.2, z: 4.6, y: 2.45}, {x: 5.5, z: 4.6, y: 2.45}, {x: 5.5, z: 5.45, y: 2.45}], to: sock_parent_ac, penetration: [{ wall: w_st_north, at: {x: 5.5, z: 5.55}, height: 2.50, note: '走廊吊顶南缘正交穿孔进父母房北缘边吊；穿点 x=5.5 位于门洞 d_study（x[6.15,7.05]）以西实体段。' }], label: '父母房空调电源（穿 w_st_north 进北缘边吊）', reason: '走廊 z=4.6 轴线西行至 x=5.5 南折，正交穿 w_st_north 实体段进父母房北缘边吊至 sock_parent_ac。回路容量和套管待确认。' }
  - { id: strong-ac-child, layer: strong_power, status: inferred, source_status: proposed, construction_status: pending, method: conduit, diameter: 0.025, from_height: 2.45, to_height: 2.50, from: bend_corridor, via: [{x: 7.2, z: 4.6, y: 2.45}, {x: 4.35, z: 4.6, y: 2.45}, {x: 4.35, z: 4.35, y: 2.50}, {x: 4.35, z: 4.0, y: 2.50}], to: sock_child_ac, penetration: [{ wall: w_nw_south, at: {x: 4.35, z: 4.3}, height: 2.50, note: '走廊吊顶北缘正交穿孔进儿童房南墙边吊；穿点 x=4.35 位于门洞 d_bnw（x[4.55,5.45]）以西实体段，且 x≥4.2 保持在走廊侧（不穿 w_strip_east）。' }], label: '儿童房空调电源（穿 w_nw_south 进南墙边吊）', reason: '走廊 z=4.6 轴线西行至 x=4.35 北折，正交穿 w_nw_south 实体段进儿童房南墙边吊，沿边吊 x=4.35 南下 z=4.0 后正交东行至 sock_child_ac；2026-09-01 功能评审修正：穿点东移至 4.35，全程不穿 w_strip_east；复审修正：中段 jog 正交化。回路容量和套管待确认。' }
  - { id: strong-ac-study, layer: strong_power, status: inferred, source_status: proposed, construction_status: pending, method: conduit, diameter: 0.025, from_height: 2.45, to_height: 2.50, from: bend_corridor, via: [{x: 7.2, z: 4.6, y: 2.45}, {x: 13.15, z: 4.6, y: 2.45}, {x: 13.15, z: 5.9, y: 2.45}, {x: 13.6, z: 5.9, y: 2.50}, {x: 14.8, z: 5.9, y: 2.50}], to: sock_study_ac, penetration: [{ wall: w_be_west, at: {x: 13.4, z: 5.9}, height: 2.50, note: '书房西门洞 d_bese（z[5.65,6.55]，高 2.1m）上方过门头正交穿墙进北墙边吊；2.50m 高于门洞顶、低于参考梁底 2.65m（窗口 0.15m，量房复核），套管待深化。' }], label: '书房空调电源（客厅边吊东行→贴墙南下→过门头穿 w_be_west）', reason: '走廊枢纽沿客厅北缘边吊 z=4.6 轴线东行至 x=13.15，贴东墙面正交南下（z5.2 以南约 0.7m 无吊顶，局部包管/管窿待深化），于门洞上方正交穿 w_be_west 进书房北墙边吊，沿边吊至 sock_study_ac。回路容量待确认。' }
  # ================= 弱电（走顶至房间上方，沿墙下引至 0.30m） =================
  - { id: weak-main-living, layer: weak_power, status: inferred, source_status: proposed, construction_status: pending, method: low_voltage_conduit, diameter: 0.02, from_height: 2.50, to_height: 0.30, from: panel_weak_entry_left, via: [{x: 13.3, z: 3.75, y: 2.50}, {x: 13.3, z: 4.2, y: 2.50}, {x: 10.9, z: 4.2, y: 2.50}, {x: 10.9, z: 4.6, y: 2.50}, {x: 7.3, z: 4.6, y: 2.50}, {x: 7.3, z: 7.6, y: 2.50}], to: net_living, label: '客厅弱电（走顶至 w_st_east 沿线，沿墙下引）', reason: '弱电箱上方起升，沿门厅吊顶+客厅北缘边吊正交折线至 x=7.3，正交南折贴 w_st_east 墙面（无吊顶段沿墙敷管/开槽，待深化），下引至 net_living。管路待确认。' }
  - { id: weak-master, layer: weak_power, status: pending, source_status: proposed, construction_status: pending, method: low_voltage_conduit, diameter: 0.02, from_height: 2.50, to_height: 0.30, from: panel_weak_entry_left, via: [{x: 13.3, z: 3.75, y: 2.50}, {x: 13.3, z: 4.2, y: 2.50}, {x: 10.9, z: 4.2, y: 2.50}, {x: 10.9, z: 4.6, y: 2.50}, {x: 7.2, z: 4.6, y: 2.50}, {x: 4.6, z: 4.6, y: 2.50}, {x: 4.05, z: 4.6, y: 2.50}, {x: 4.1, z: 4.6, y: 2.40}, {x: 4.1, z: 6.3, y: 2.40}], to: {x: 4.2, z: 6.5, y: 0.30}, penetration: [{ wall: w_strip_east, at: {x: 4.2, z: 4.6}, height: 2.50, note: '与主卧冷媒/空调电源同穿孔区（z≈4.6 实体段），进主卧套间条带。' }], label: '主卧弱电预留（穿孔进套间条带，沿 w_mb_east 西侧下引）', reason: '主卧未设权威网口点位，仅表达设计预留需求：走廊 z=4.6 轴线西行正交穿孔进套间条带后，贴 w_mb_east 西侧墙面正交南下并下引至 (4.2,6.5,0.30) 预留位；端点与检修条件待确认。' }
  - { id: weak-parent, layer: weak_power, status: inferred, source_status: proposed, construction_status: pending, method: low_voltage_conduit, diameter: 0.02, from_height: 2.50, to_height: 0.30, from: panel_weak_entry_left, via: [{x: 13.3, z: 3.75, y: 2.50}, {x: 13.3, z: 4.2, y: 2.50}, {x: 10.9, z: 4.2, y: 2.50}, {x: 10.9, z: 4.6, y: 2.50}, {x: 5.5, z: 4.6, y: 2.50}, {x: 5.5, z: 5.7, y: 2.50}, {x: 4.3, z: 5.7, y: 2.50}, {x: 4.3, z: 8.9, y: 2.40}], to: net_parent, penetration: [{ wall: w_st_north, at: {x: 5.5, z: 5.55}, height: 2.50, note: '与父母房空调电源同穿孔区（x=5.5 实体段），正交穿孔进北缘边吊。' }], label: '父母房弱电（穿 w_st_north 进边吊，沿 w_mb_east 东侧下引）', reason: '沿强电同一走廊路径至 x=5.5 南折正交穿孔进父母房北缘边吊，边吊内西行至 x=4.3，贴 w_mb_east 东侧墙面（父母房侧）正交南下并下引至 net_parent。无吊顶段沿墙敷管/开槽待深化。' }
  - { id: weak-study, layer: weak_power, status: inferred, source_status: proposed, construction_status: pending, method: low_voltage_conduit, diameter: 0.02, from_height: 2.50, to_height: 0.30, from: panel_weak_entry_left, via: [{x: 13.3, z: 3.75, y: 2.50}, {x: 13.3, z: 4.6, y: 2.50}, {x: 13.2, z: 4.6, y: 2.50}, {x: 13.2, z: 7.8, y: 2.45}], to: net_study, label: '书房弱电（门厅/客厅边吊东缘贴墙南下，沿 w_be_west 下引）', reason: '弱电箱起升后正交折线至东侧墙带（x≈13.2）南向敷管至书房西墙沿线，下引至 net_study；z5.2 以南无吊顶段沿墙敷管/开槽待深化，不进入电梯厅。管路待确认。' }

  - { id: water-guest-bath, layer: water_supply, status: pending, source_status: plan_supported, construction_status: pending, method: floor_branch, diameter: 0.025, from_height: 0.18, to_height: 0.80, from: faucet_gbath_vanity, via: [{x: 7.1, z: 3.9, y: 0.18}, {x: 7.1, z: 3.55, y: 0.18}, {x: 5.6, z: 3.55, y: 0.18}, {x: 5.6, z: 3.2, y: 0.18}], to: toilet_gbath, penetration: [{ wall: w_gbath_south, at: {x: 5.9, z: 3.55}, height: 0.18, note: '给水沿开放洗漱区南墙线低位经门洞 d_gbath（x[5.6,6.3]）区间通过进内卫；门洞处地面/门槛做法待现场复核。' }], label: '客卫给水支路（plan_supported）', reason: '外置开放洗漱区位于东侧延伸墙西侧 z=3.55..4.30，给水从南墙外开放区经南墙门洞区间低位接入内卫南段马桶；真实立管、套管和墙体条件待现场复核。' }

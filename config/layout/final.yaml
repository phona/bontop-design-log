circulation:
  main_entry: "入户花园 → 客餐厅"
  kitchen_to_dining: "厨房直接连接客餐厅"
  master_suite_path: "客餐厅 → 过道 → 主卧 → 主卫"
  public_bath_path: "客餐厅 → 过道 → 客卫"
  fire_access: "入户花园内保留消防通道，不得封闭"

design_rationale:
  - "四房两厅两卫满足家庭长期居住需求"
  - "客餐厅合并，南向采光面大"
  - "入户花园作为玄关过渡区，兼顾消防通道"
  - "主卧带独立卫生间，形成主卧套房"
  - "东北次卧可灵活用作书房 / 客房 / 儿童房"

pending_verification:
  - "所有房间净尺寸需现场量房复核"
  - "承重墙、梁位需物业竣工图确认"
  - "东设备平台权属需物业确认"
  - "玻璃幕墙分格及门窗口位置需设计院图纸确认"

  # ── 厨房上飘窗贴砖（2026-10-09 业主终裁：先刷漆 → 改贴砖，DEC-2026-10-09-P09）──
  # 依据与「按现实使用的合理度为准」：厨房三面可贴墙已贴砖（walltile_kitchen_*）、
  # 北墙 w_kit_north 是 suppress_kitchen_north 玻璃幕墙（不可贴）、全厨房无 paint_region，
  # 这处上飘窗是全厨房唯一需要定面层的面。给一间接了墙砖工艺的房间单独开一套刷漆
  # 工序（找平+阳角条+厨卫漆）不经济；贴砖只是瓦工顺手带一段，且与墙砖连续、收口最简、
  # 耐油污。竖面与底面都贴——底面朝下、标高 2.12m 抬头可见，只贴竖面会留一片没人管的面。
  # 标准侧依据：GB/T 11228-2008《住宅厨房》管厨房墙砖高度（溅水区覆盖），
  # 但**没有国标条文直接规定厨房窗台必须贴砖**——本条是工序经济性+现状一致性判断，
  # 不是规范强制，已如实登记。
  - id: silltile_kitchen_north_bay_front

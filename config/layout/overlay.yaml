# overlay.yaml: 渲染意图声明（intent-only），严格 schema。
# 2026-07-15：overlay.yaml 与 model-geometry.yaml 共用同一坐标系，z 字段不再单独偏移。
version: 1

suppress:
  - id: suppress_north_wall
    region: { x1: -0.5, z1: -0.5, x2: 11.3, z2: 0.5 }
    reason: "北外墙改玻璃幕墙"
  - id: suppress_west_wall
    region: { x1: -0.5, z1: -0.5, x2: 0.5, z2: 10.3 }
    reason: "西外墙改玻璃幕墙"
  - id: suppress_south_wall
    region: { x1: -0.5, z1: 9.3, x2: 13.9, z2: 10.3 }
    reason: "南外墙改玻璃幕墙"
  - id: suppress_bedroom_se_corner
    region: { x1: 15.9, z1: 9.7, x2: 16.9, z2: 10.0 }
    reason: "东南次卧南向凸窗（仅右下角 1.1m 那段，剩余东墙保留实墙）"
  - id: suppress_entry_garden_east
    region: { x1: 14.75, z1: -3.4, x2: 15.75, z2: 0.5 }
    reason: "入户花园东墙改玻璃护栏"
  - id: suppress_entry_garden_north
    region: { x1: 10.3, z1: -3.4, x2: 15.75, z2: -2.4 }
    reason: "入户花园北墙改玻璃护栏"

elements:
  - id: glass_facade
    type: curtain_run
    closed: true
    points:
      - { x: 0.0, z: 0.0, radius: 0.8 }
      - { x: 10.8, z: 0.0 }
      - { x: 10.8, z: 2.0 }
      - { x: 13.4, z: 2.0 }
      - { x: 13.4, z: 5.4 }
      - { x: 16.4, z: 5.4 }
      - { x: 16.4, z: 9.8 }
      - { x: 0.0, z: 9.8, radius: 0.8 }
    height: 3.0

  - id: entry_garden_glass
    type: curtain_run
    closed: true
    points:
      - { x: 10.8, z: 0.0 }
      - { x: 15.25, z: 0.0 }
      - { x: 15.25, z: -2.9 }
      - { x: 10.8, z: -2.9 }
    height: 1.1

  - id: master_bedroom_west_bay
    type: bay_sill
    points:
      - { x: 0.0, z: 5.55 }
      - { x: 0.0, z: 9.8 }
    depth: 0.3
    sill: 0.45
    height: 2.55
    reason: "主卧西墙环幕飘窗"

  - id: master_bedroom_south_bay
    type: bay_sill
    points:
      - { x: 0.0, z: 9.8 }
      - { x: 4.2, z: 9.8 }
    depth: 0.3
    sill: 0.45
    height: 2.55
    reason: "主卧南墙环幕飘窗"

  - id: bedroom_se_south_bay
    type: bay_sill
    points:
      - { x: 13.4, z: 9.8 }
      - { x: 16.4, z: 9.8 }
    depth: 0.3
    sill: 0.45
    height: 2.55
    reason: "东南次卧南向凸窗"

  - id: corridor_floor
    type: floor_region
    points:
      - { x: 4.2, z: 5.55 }
      - { x: 7.2, z: 5.55 }
      - { x: 7.2, z: 7.8 }
      - { x: 4.2, z: 7.8 }
    reason: "主卧与客卫之间的过道"

# 场景覆盖层：DXF 表达不了/画错的信息在此声明。
# 铁律：这里声明什么就渲染什么；不声明的 DXF 墙永远是实墙。
# schema 见 server/overlay-merge.ts（zod strict，未知字段/类型直接报错）。
version: 1

suppress:
  - id: suppress_south_wall
    region: {x1: -1.2, z1: -4.5, x2: 3.9, z2: -4.1}
    reason: "南外墙改玻璃幕墙"
  - id: suppress_sw_corner
    region: {x1: -6.0, z1: -3.5, x2: -5.0, z2: -2.9}
    reason: "SW 圆角改玻璃幕墙"
  - id: suppress_west_wall
    region: {x1: -6.0, z1: -3.0, x2: -5.7, z2: 4.9}
    reason: "西外墙改玻璃幕墙"
  - id: suppress_nw_corner
    region: {x1: -6.0, z1: 4.8, x2: -5.0, z2: 5.5}
    reason: "NW 圆角改玻璃幕墙"
  - id: suppress_north_wall
    region: {x1: -5.5, z1: 5.2, x2: 3.9, z2: 5.5}
    reason: "北外墙改玻璃幕墙（入户花园以西）"

elements:
  # 玻璃幕墙立面：南 → S拐角 → SW斜面 → 西 → NW斜面 → 北（至入户花园西边界）。
  - id: glass_facade
    type: curtain_run
    points:
      - {x: 3.745, z: -4.323}
      - {x: -0.578, z: -4.323}
      - {x: -5.75, z: -3.17}
      - {x: -5.88, z: -2.99}
      - {x: -5.88, z: 4.872}
      - {x: -5.363, z: 5.39}
      - {x: 3.745, z: 5.39}
    height: 3.0

  # 窗洞玻璃填充（源自 house.yaml rooms[].openings 中 type=window 的条目）
  - id: living_south_glass
    type: glass_infill
    room: living_dining
    wall: south
    center_offset: 0
    width: 3.5
    height: 1.6
    sill: 0.9

  # 地板补区：覆盖房间矩形之间的缝隙/过渡区
  - id: corridor_floor
    type: floor_region
    points:
      - {x: 0.63, z: -1.96}
      - {x: 3.08, z: -1.96}
      - {x: 3.08, z: -1.08}
      - {x: 0.63, z: -1.08}
    reason: "客餐厅与走廊过渡区，房间矩形未覆盖"

  # 上飘窗：沿 curtain_run 向内凹陷
  - id: master_left_bay
    type: bay_sill
    points:
      - {x: -5.88, z: -0.93}
      - {x: -5.88, z: 4.39}
    depth: 1.10
    sill: 0.45
    height: 2.55
    reason: "主卧西墙上飘窗"

  - id: bedroom_nw_bay
    type: bay_sill
    points:
      - {x: -5.88, z: -2.99}
      - {x: -5.88, z: -0.93}
    depth: 1.10
    sill: 0.45
    height: 2.55
    reason: "西北次卧西墙上飘窗"

  - id: master_top_bay
    type: bay_sill
    points:
      - {x: -5.363, z: 5.39}
      - {x: -2.23, z: 5.39}
    depth: 1.10
    sill: 0.45
    height: 2.55
    reason: "主卧北墙上飘窗"

  - id: bedroom_se_bay
    type: bay_sill
    points:
      - {x: -2.23, z: 5.39}
      - {x: 0.39, z: 5.39}
    depth: 1.10
    sill: 0.45
    height: 2.55
    reason: "东南次卧北墙上飘窗"

  - id: master_bottom_bay
    type: bay_sill
    points:
      - {x: -0.578, z: -4.323}
      - {x: -5.75, z: -3.17}
    depth: 1.10
    sill: 0.45
    height: 2.55
    reason: "主卧 SW 对角线上飘窗"

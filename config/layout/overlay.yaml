# overlay.yaml: 渲染意图声明（intent-only），严格 schema。
# 2026-07-15：overlay.yaml 与 model-geometry.yaml 共用同一坐标系，z 字段不再单独偏移。
# 2026-07-16：按新外墙轮廓重写：西/南玻璃幕墙，西南/东南圆弧，飘窗，门洞补区。
# 2026-07-17：大修——删除南阳台（客厅落地玻璃齐平 z=9.95），新增书房南飘窗，
#   新增客厅南墙玻璃幕，东南次卧凸窗 base 移至 z=9.95，生活阳台移至 VRV 南侧，
#   西南/东南圆弧压缩到角部 1m，suppress 加宽防 Z-fighting。
version: 1

suppress:
  - id: suppress_west_wall
    walls: [w_west_top, w_west_ap, w_west_lower, w_west_mid, w_west_upper]
    reason: "西墙实体删除，改玻璃幕墙"
  - id: suppress_south_west
    walls: [w_mb_south, w_st_south]
    reason: "主卧+书房南墙实体删除，为飘窗让路"
  - id: suppress_living_south
    wall: w_liv_south
    reason: "客厅南墙落地玻璃幕"
  - id: suppress_south_east
    wall: w_be_south
    reason: "东南次卧凸窗+东南圆角实体墙删除"
  - id: suppress_kitchen_north
    wall: w_kit_north
    reason: "厨房北墙实体删除，改玻璃幕墙"
  - id: suppress_vrv_railing
    walls: [w_vrv_nw_gap, w_vrv_north]
    reason: "VRV西北角实墙删除，改栏杆"
  - id: suppress_north_recess
    walls: [w_bath_north, w_nw_north]
    reason: "主卫/西北次卧北墙实体删除，改玻璃幕墙"
  - id: suppress_entry_north_railing
    wall: w_ent_north_railing
    reason: "入户花园北边实墙删除，改栏杆"

elements:
  # 西墙 + 西南圆角 + 南墙西段 (w_mb_south + w_st_south)
  - id: west_curtain
    type: curtain_run
    closed: false
    walls: [w_west_lower, w_west_mid, w_west_upper, w_mb_south, w_st_south]
    height: 3.0

  # VRV 西北角 + 西墙栏杆 (弧 r=1.0)
  - id: vrv_nw_railing
    type: railing_run
    walls: [w_vrv_nw_gap, w_vrv_north]
    height: 1.0

  # 入户花园北边栏杆（z=0 开放边）
  - id: entry_garden_north_railing
    type: railing_run
    wall: w_ent_north_railing
    height: 1.0

  # 厨房北墙玻璃幕墙
  - id: kitchen_north_curtain
    type: curtain_run
    closed: false
    wall: w_kit_north
    height: 3.0

  # 主卫西北角玻璃幕墙弧 (w_west_ap 进路从室内侧 + w_bath_north 弧段)
  - id: north_recess_curtain
    type: curtain_run
    closed: false
    walls: [w_west_ap, w_bath_north, w_nw_north]
    height: 3.0

  # 客厅南墙落地玻璃幕 (z=9.80)
  - id: living_south_curtain
    type: curtain_run
    closed: false
    wall: w_liv_south
    height: 3.0

  # 南墙东段（东南次卧南侧幕墙）
  - id: south_east_curtain
    type: curtain_run
    closed: false
    wall: w_be_south
    height: 3.0

  # 飘窗
  - id: master_bedroom_west_bay
    type: bay_sill
    wall: w_west_upper
    depth: 1.1
    sill: 2.55
    height: 0.45
    reason: "主卧西墙飘窗（z=5.55~8.80 直墙段）"

  - id: master_bedroom_south_bay
    type: bay_sill
    wall: w_mb_south
    depth: 1.1
    sill: 2.55
    height: 0.45
    reason: "主卧南墙环幕飘窗（南缘 z=10.90）"

  - id: study_south_bay
    type: bay_sill
    wall: w_st_south
    depth: 1.1
    sill: 2.55
    height: 0.45
    reason: "书房南墙飘窗（南缘 z=10.90，与主卧齐平）"

  - id: bedroom_se_south_bay
    type: bay_sill
    wall: w_be_south
    depth: 1.1
    sill: 2.55
    height: 0.45
    reason: "东南次卧南向凸窗（南缘 z=11.05）"

  - id: bedroom_nw_west_bay
    type: bay_sill
    wall: w_west_lower
    depth: 1.1
    sill: 2.55
    height: 0.45
    reason: "西北次卧西墙飘窗"

  - id: corridor_west_bay
    type: bay_sill
    wall: w_west_mid
    depth: 1.1
    sill: 2.55
    height: 0.45
    reason: "走廊西墙飘窗"

  - id: master_bath_west_bay
    type: bay_sill
    walls: [w_west_ap, w_bath_north]
    depth: 1.1
    sill: 2.55
    height: 0.45
    reason: "主卫西北角飘窗"

  - id: bedroom_nw_north_bay
    type: bay_sill
    wall: w_nw_north
    depth: 1.1
    sill: 2.55
    height: 0.45
    reason: "西北次卧北墙飘窗（z=1.10 凹进段）"

  - id: kitchen_north_bay
    type: bay_sill
    wall: w_kit_north
    depth: 1.1
    sill: 2.55
    height: 0.45
    reason: "厨房北墙飘窗（z=0 北缘）"

  # 地板补区
  - id: entry_garden_floor
    type: floor_region
    points:
      - { x: 10.8, z: 0.00 }
      - { x: 15.25, z: 0.00 }
      - { x: 15.25, z: 2.90 }
      - { x: 10.8, z: 2.90 }
    reason: "入户花园地板"

  - id: entry_foyer_floor
    type: floor_region
    points:
      - { x: 10.80, z: 2.90 }
      - { x: 13.40, z: 2.90 }
      - { x: 13.40, z: 4.30 }
      - { x: 10.80, z: 4.30 }
    reason: "入户到客厅的过渡地面"

  - id: corridor_floor
    type: floor_region
    points:
      - { x: 4.2, z: 5.55 }
      - { x: 7.2, z: 5.55 }
      - { x: 7.2, z: 7.8 }
      - { x: 4.2, z: 7.8 }
    reason: "主卧与书房之间的走廊"

  - id: main_corridor_floor
    type: floor_region
    points:
      - { x: 0.0, z: 4.30 }
      - { x: 7.2, z: 4.30 }
      - { x: 7.2, z: 5.55 }
      - { x: 0.0, z: 5.55 }
    reason: "主走廊连接左翼和右翼"

  - id: north_platform_floor
    type: floor_region
    points:
      - { x: 5.6, z: 0.0 }
      - { x: 7.2, z: 0.0 }
      - { x: 7.2, z: 1.0 }
      - { x: 5.6, z: 1.0 }
    reason: "VRV 设备平台地板"

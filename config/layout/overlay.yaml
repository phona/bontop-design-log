# overlay.yaml: 渲染意图声明（intent-only），严格 schema。
# 2026-07-15：overlay.yaml 与 model-geometry.yaml 共用同一坐标系，z 字段不再单独偏移。
# 2026-07-16：按新外墙轮廓重写：西/南玻璃幕墙，西南/东南圆弧，飘窗，门洞补区。
# 2026-07-17：大修——删除南阳台（客厅落地玻璃齐平 z=9.95），新增书房南飘窗，
#   新增客厅南墙玻璃幕，东南次卧凸窗 base 移至 z=9.95，生活阳台移至 VRV 南侧，
#   西南/东南圆弧压缩到角部 1m，suppress 加宽防 Z-fighting。
version: 1

suppress:
  - id: suppress_west_wall
    walls: [w_west_top, w_west_lower]
    reason: "西墙实体删除，改玻璃幕墙"
  - id: suppress_south_west
    wall: w_mb_south
    reason: "主卧+书房南墙实体删除，为飘窗让路"
  - id: suppress_living_south
    wall: w_liv_south
    reason: "客厅南墙落地玻璃幕（z=9.95）"
  - id: suppress_south_east
    wall: w_be_south
    reason: "东南次卧凸窗+东南圆角实体墙删除"
  - id: suppress_vrv_nw
    walls: [w_vrv_nw_gap, w_vrv_north, w_kit_north]
    reason: "VRV西北角+厨房北墙实体删除，改玻璃幕墙"
  - id: suppress_north_recess
    walls: [w_bath_north, w_nw_north]
    reason: "主卫/西北次卧北墙实体删除，改玻璃幕墙"

elements:
  # 西墙 + 西南小圆角（含 w_mb_south 弧段，16段平滑过渡）
  - id: west_curtain
    type: curtain_run
    closed: false
    walls: [w_west_top, w_west_lower, w_west_mid, w_west_upper, w_mb_south]
    height: 3.0

  # VRV 西北角 + 厨房北墙玻璃幕墙（弧 r=1.0 + 直段）
  - id: vrv_nw_curtain
    type: curtain_run
    closed: false
    walls: [w_vrv_nw_gap, w_vrv_north, w_kit_north]
    height: 3.0

  # 主卫/西北次卧北墙凹进玻璃幕墙 (z=1.10, 含 w_west_top 竖段衔接)
  - id: north_recess_curtain
    type: curtain_run
    closed: false
    walls: [w_west_top, w_bath_north, w_nw_north]
    height: 3.0

  # 客厅南墙落地玻璃幕（z=9.95）
  - id: living_south_curtain
    type: curtain_run
    closed: false
    wall: w_liv_south
    height: 3.0

  # 南墙东段（东南次卧南侧到东南小圆角）
  - id: south_east_curtain
    type: curtain_run
    closed: false
    wall: w_be_south
    height: 3.0

  # 飘窗
  - id: master_bedroom_west_bay
    type: bay_sill
    wall: w_west_upper
    depth: 0.5
    sill: 0.45
    height: 2.55
    reason: "主卧西墙飘窗（z=5.55~8.80 直墙段，圆角段由 west_curtain 处理）"

  - id: master_bedroom_south_bay
    type: bay_sill
    wall: w_mb_south
    depth: 1.1
    sill: 0.45
    height: 2.55
    reason: "主卧南墙环幕飘窗（南缘 z=10.90）"

  - id: study_south_bay
    type: bay_sill
    wall: w_st_south
    depth: 1.1
    sill: 0.45
    height: 2.55
    reason: "书房南墙飘窗（南缘 z=10.90，与主卧齐平）"

  - id: bedroom_se_south_bay
    type: bay_sill
    wall: w_be_south
    depth: 1.1
    sill: 0.45
    height: 2.55
    reason: "东南次卧南向凸窗（南缘 z=11.05）"

  - id: bedroom_nw_west_bay
    type: bay_sill
    wall: w_west_lower
    depth: 0.5
    sill: 0.45
    height: 2.55
    reason: "西北次卧西墙飘窗"

  # 地板补区
  - id: entry_garden_floor
    type: floor_region
    points:
      - { x: 10.8, z: 0.65 }
      - { x: 15.25, z: 0.65 }
      - { x: 15.25, z: 3.55 }
      - { x: 10.8, z: 3.55 }
    reason: "入户花园地板"

  - id: corridor_floor
    type: floor_region
    points:
      - { x: 4.2, z: 5.55 }
      - { x: 7.2, z: 5.55 }
      - { x: 7.2, z: 7.8 }
      - { x: 4.2, z: 7.8 }
    reason: "主卧与书房之间的走廊"

  - id: north_platform_floor
    type: floor_region
    points:
      - { x: 5.6, z: 0.0 }
      - { x: 7.2, z: 0.0 }
      - { x: 7.2, z: 1.0 }
      - { x: 5.6, z: 1.0 }
    reason: "VRV 设备平台地板"

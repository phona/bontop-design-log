# overlay.yaml: 渲染意图声明（intent-only），严格 schema。
# 2026-07-15：overlay.yaml 与 model-geometry.yaml 共用同一坐标系，z 字段不再单独偏移。
# 2026-07-15b：入户花园恢复为实墙；主楼仅西、南两面做玻璃幕墙。
version: 1

suppress:
  - id: suppress_west_wall
    region: { x1: -0.5, z1: -0.5, x2: 0.5, z2: 10.3 }
    reason: "西外墙改玻璃幕墙"
  - id: suppress_south_wall
    region: { x1: -0.5, z1: 9.3, x2: 13.9, z2: 10.3 }
    reason: "南外墙改玻璃幕墙"
  - id: suppress_bedroom_se_corner
    region: { x1: 15.9, z1: 9.7, x2: 16.9, z2: 10.0 }
    reason: "东南次卧南向凸窗（仅右下角 1.1m 那段，剩余东墙保留实墙）"

elements:
  - id: west_south_curtain
    type: curtain_run
    closed: false
    points:
      - { x: 0.0, z: 0.0 }
      - { x: 0.0, z: 9.8 }
      - { x: 16.4, z: 9.8 }
    height: 3.0

  - id: master_bedroom_west_bay
    type: bay_sill
    points:
      - { x: 0.0, z: 5.55 }
      - { x: 0.0, z: 9.8 }
    depth: 0.3
    sill: 0.45
    height: 2.55
    reason: "主卧西墙环幕飘窗"

  - id: master_bedroom_south_bay
    type: bay_sill
    points:
      - { x: 0.0, z: 9.8 }
      - { x: 4.2, z: 9.8 }
    depth: 0.3
    sill: 0.45
    height: 2.55
    reason: "主卧南墙环幕飘窗"

  - id: bedroom_se_south_bay
    type: bay_sill
    points:
      - { x: 13.4, z: 9.8 }
      - { x: 16.4, z: 9.8 }
    depth: 0.3
    sill: 0.45
    height: 2.55
    reason: "东南次卧南向凸窗"

  - id: corridor_floor
    type: floor_region
    points:
      - { x: 4.2, z: 5.55 }
      - { x: 7.2, z: 5.55 }
      - { x: 7.2, z: 7.8 }
      - { x: 4.2, z: 7.8 }
    reason: "主卧与客卫之间的过道"

# overlay.yaml: 渲染意图声明（intent-only），严格 schema。
# 2026-07-15：overlay.yaml 与 model-geometry.yaml 共用同一坐标系，z 字段不再单独偏移。
# 2026-07-16：按新外墙轮廓重写：西/南玻璃幕墙，西南/东南圆弧，飘窗，门洞补区。
# 2026-07-17：大修——删除南阳台（客厅落地玻璃齐平 z=9.95），新增书房南飘窗，
#   新增客厅南墙玻璃幕，东南次卧凸窗 base 移至 z=9.95，生活阳台移至 VRV 南侧，
#   西南/东南圆弧压缩到角部 1m，suppress 加宽防 Z-fighting。
version: 1

suppress:
  - id: suppress_west_wall
    walls: [w_west_ap, w_west_lower, w_west_mid, w_west_upper]
    reason: "西墙实体删除，改玻璃幕墙（2026-09-17 业主确认：西北角即圆角，w_west_top 段外轮廓不存在，已从 model-geometry 删除；玻璃从弧切点 z=2.10 无缝接往西墙幕墙，不长于圆角区域）"
  - id: suppress_south_west
    walls: [w_mb_south, w_st_south]
    reason: "主卧+书房南墙实体删除，为飘窗让路（2026-10-05 功能互换后功能名，墙体不变）"
  - id: suppress_living_south
    wall: w_liv_south
    reason: "客厅南墙落地玻璃幕"
  - id: suppress_south_east
    wall: w_be_south
    reason: "东南次卧凸窗+东南圆角实体墙删除"
  - id: suppress_kitchen_north
    wall: w_kit_north
    reason: "厨房北墙实体删除，改玻璃幕墙"
  - id: suppress_vrv_railing
    walls: [w_vrv_nw_gap, w_vrv_north]
    reason: "VRV西北角实墙删除，改栏杆"
  - id: suppress_north_recess
    walls: [w_bath_north, w_nw_north]
    reason: "主卫/西北次卧北墙实体删除，改玻璃幕墙"
  - id: suppress_entry_north_railing
    wall: w_ent_north_railing
    reason: "入户花园北边实墙删除，改栏杆"

elements:
  # 西墙 + 西南圆角 + 南墙西段 (w_mb_south + w_st_south)。
  # 2026-09-17：西北角即圆角（w_west_top 已从 model-geometry 删除，外轮廓不存在），
  # 本 run 从弧切点 (0,2.10) 起无缝接 north_recess_curtain 的圆角弧；
  # w_west_ap 解析后为零长度退化段，仅保留占位以维持 spatial-validation 的替代绑定。
  - id: west_curtain
    type: curtain_run
    closed: false
    walls: [w_west_ap, w_west_lower, w_west_mid, w_west_upper, w_mb_south, w_st_south]
    parts:
      - { id: w_west_ap, wall: w_west_ap }
      - { id: w_west_lower, wall: w_west_lower }
      - { id: w_west_mid, wall: w_west_mid }
      - { id: w_west_upper, wall: w_west_upper }
      - { id: w_mb_south, wall: w_mb_south }
      - { id: w_st_south, wall: w_st_south }
    height: 2.8

  # VRV 西北角 + 西墙栏杆 (弧 r=1.0)
  - id: vrv_nw_railing
    type: railing_run
    walls: [w_vrv_nw_gap, w_vrv_north]
    height: 1.0

  # 入户花园北边栏杆（z=0 开放边）
  - id: entry_garden_north_railing
    type: railing_run
    wall: w_ent_north_railing
    height: 1.0

  # 厨房北墙玻璃幕墙
  - id: kitchen_north_curtain
    type: curtain_run
    closed: false
    wall: w_kit_north
    height: 2.8

  # 西北连续玻璃幕墙：主卫圆角弧（w_bath_north 弧段）+ 西北次卧北墙凹进段。
  # 2026-09-17：西北角即圆角（w_west_top 已删），弧起点 (0,2.10) 即外轮廓最西北点，
  # 与 west_curtain 西墙玻璃 T 接成一条连续玻璃带；CurtainGeometry 折返走链修复作为防护保留。
  - id: north_recess_curtain
    type: curtain_run
    closed: false
    walls: [w_bath_north, w_nw_north]
    height: 2.8

  # 客厅南墙落地玻璃幕 (z=9.80)
  - id: living_south_curtain
    type: curtain_run
    closed: false
    wall: w_liv_south
    height: 2.8

  # 南墙东段（东南次卧南侧幕墙）
  - id: south_east_curtain
    type: curtain_run
    closed: false
    wall: w_be_south
    height: 2.8

  # 飘窗
  # sill 口径 2026-08-21 修正：旧全屋 2.55 系客厅值误推广（2.55+0.45=3.0 穿楼板，无效）。
  # 邻户原始结构图读法（业主样板间视频佐证）：卧室系 sill≈2.07/窗带高0.76，厨房≈2.12/0.71，
  # 客厅系上光带 sill≈2.57/0.26；2070+760=2830 与结构板标高自洽。量房终核（pending #20）。
  - id: master_bedroom_west_bay
    type: bay_sill
    wall: w_west_upper
    depth: 1.1
    sill: 2.07
    height: 0.76
    reason: "主卧西墙飘窗（z=5.55~8.80 直墙段）"

  - id: master_bedroom_south_bay
    type: bay_sill
    wall: w_mb_south
    depth: 1.1
    sill: 2.07
    height: 0.76
    reason: "主卧南墙环幕飘窗（南缘 z=10.90）"

  - id: study_south_bay
    type: bay_sill
    wall: w_st_south
    depth: 1.1
    sill: 2.07
    height: 0.76
    reason: "书房南墙飘窗（南缘 z=10.90，与主卧齐平）"

  - id: bedroom_se_south_bay
    type: bay_sill
    wall: w_be_south
    depth: 1.1
    sill: 2.07
    height: 0.76
    reason: "客房南向凸窗（南缘 z=11.05）"

  - id: master_bath_west_lower_bay
    type: bay_sill
    wall: w_west_lower
    depth: 1.1
    sill: 2.07
    height: 0.76
    reason: "主卫西墙南段飘窗（2026-10-09 由 bedroom_nw_west_bay 改名，DEC-2026-10-09-P10：原名「西北次卧西墙」与几何不符——outline x[0,1.1]×z[2.10,2.86] 整块在 master_bath 矩形内，bedroom_nw 西界是 x=2.6。只改 id 不动几何/面积/room）"

  - id: master_bedroom_west_mid_bay
    type: bay_sill
    wall: w_west_mid
    depth: 1.1
    sill: 2.07
    height: 0.76
    reason: "主卧西墙中段飘窗（2026-10-09 由 corridor_west_bay 改名，DEC-2026-10-09-P10：原名「走廊西墙」与几何不符——outline x[0,1.1]×z[2.86,5.55] 整块在 master_bedroom 矩形内，且模型里根本没有 corridor 这个 room，走廊本体在 x[4.2,7.2]×z[4.3,6.45]，离这扇窗 4 米。只改 id 不动几何/面积/room）"

  - id: master_bath_west_bay
    type: bay_sill
    walls: [w_west_ap, w_bath_north]
    depth: 1.1
    sill: 2.07
    height: 0.76
    reason: "主卫西北角飘窗"

  - id: bedroom_nw_north_bay
    type: bay_sill
    wall: w_nw_north
    depth: 1.1
    sill: 2.07
    height: 0.76
    reason: "西北次卧北墙飘窗（z=1.10 凹进段）"

  - id: kitchen_north_bay
    type: bay_sill
    wall: w_kit_north
    depth: 1.1
    sill: 2.12
    height: 0.71
    reason: "厨房北墙飘窗（z=0 北缘）"

  # 客厅南墙落地幕墙根部防水台（R11/D4=L 型终裁的构件；本模型此前按"玻璃齐地"建，缺此构件）。
  # 尺寸为业界常规口径的估算（业主 2026-10-07 指示"开发商已做、按标准估"）：搜索口径——
  # 落地窗窗台常规留 100–200mm 高出地面（防外力撞击玻璃、做内侧防水收口），取中值 150，
  # 且与 300×600 墙砖模数合；出檐（向室内伸进）同取 150。**量级待量房核实**。
  # 范围历史：R11/C17 当时把干区防水台排除在贴砖范围外。DEC-2026-10-16-TILE-01
  # 已推翻卧室/书房「有台但不贴」这一范围结论：新增低反坎构件与 front/top 声明，
  # 统一沿用150×150mm估算并待量房。既有 sill≈2.07m 的 bay_sill 仍是独立 site-pending 模型，
  # 不可拿来代替低反坎尺寸，详见 docs/pending-site-data.md #20。
  - id: living_south_waterproof_ledge
    type: bay_sill
    wall: w_liv_south
    depth: 0.15
    sill: 0.00
    height: 0.15
    reason: "客厅落地幕墙根部防水台（150 高 × 150 出檐常规口径，量级待量房核实）；竖面与水平台面由 sill_region 挂贴砖"

  # ── 主卫湿区防水台（2026-10-07 C17：业主断言幕墙玻璃均为落地窗、根部都有防水台；
  #    主卫为淋浴湿区，按 D4=L 同款建模+贴砖，存在性/尺寸量房 #54 终核）。
  #    西墙北段 w_west_ap（z[1.10,2.10]，端点 v_bath_nw 带圆角）合并器不产弧段线，
  #    该 1.00m 防水台不入声明、留现场收口（量房 #54）。──
  - id: mbath_west_lower_waterproof_ledge
    type: bay_sill
    wall: w_west_lower
    depth: 0.15
    sill: 0.00
    height: 0.15
    reason: "主卫西墙淋浴段（z[2.10,2.86] 直段）根部防水台，D4=L 同款 150×150"
  - id: mbath_north_waterproof_ledge
    type: bay_sill
    wall: w_bath_north
    depth: 0.15
    sill: 0.00
    height: 0.15
    reason: "主卫北墙（x[0,2.60]，西段在淋浴湿区内）根部防水台，D4=L 同款"

  # ── 卧室/书房落地窗根部低反坎（DEC-2026-10-16-TILE-01）──
  # 用户裁定统一按150高×150出檐先建模；量房后按实际完成尺寸更新。
  - id: master_bedroom_west_upper_waterproof_ledge
    type: bay_sill
    wall: w_west_upper
    depth: 0.15
    sill: 0.00
    height: 0.15
    reason: "主卧西墙上段落地幕墙根部低反坎；150×150mm估算，front+top贴砖，量房后复核（DEC-2026-10-16-TILE-01）"
  - id: master_bedroom_west_mid_waterproof_ledge
    type: bay_sill
    wall: w_west_mid
    depth: 0.15
    sill: 0.00
    height: 0.15
    reason: "主卧西墙中段落地幕墙根部低反坎；150×150mm估算，front+top贴砖，量房后复核（DEC-2026-10-16-TILE-01）"
  - id: master_bedroom_south_waterproof_ledge
    type: bay_sill
    wall: w_mb_south
    depth: 0.15
    sill: 0.00
    height: 0.15
    reason: "主卧南墙落地幕墙根部低反坎；150×150mm估算，front+top贴砖，量房后复核（DEC-2026-10-16-TILE-01）"
  - id: study_south_waterproof_ledge
    type: bay_sill
    wall: w_st_south
    depth: 0.15
    sill: 0.00
    height: 0.15
    reason: "书房南墙落地幕墙根部低反坎；150×150mm估算，front+top贴砖，量房后复核（DEC-2026-10-16-TILE-01）"
  - id: bedroom_nw_north_waterproof_ledge
    type: bay_sill
    wall: w_nw_north
    depth: 0.15
    sill: 0.00
    height: 0.15
    reason: "西北次卧北墙落地幕墙根部低反坎；150×150mm估算，front+top贴砖，量房后复核（DEC-2026-10-16-TILE-01）"
  - id: bedroom_se_south_waterproof_ledge
    type: bay_sill
    wall: w_be_south
    depth: 0.15
    sill: 0.00
    height: 0.15
    reason: "东南客房南墙落地幕墙根部低反坎；150×150mm估算，front+top贴砖，量房后复核（DEC-2026-10-16-TILE-01）"

  # 地板补区
  - id: entry_garden_floor
    type: floor_region
    points:
      - { x: 10.8, z: 0.00 }
      - { x: 15.25, z: 0.00 }
      - { x: 15.25, z: 2.90 }
      - { x: 13.40, z: 2.90 }
      - { x: 13.40, z: 3.00 }
      - { x: 10.8, z: 3.00 }
    follow: entry_garden
    excluded: true
    reason: "入户花园地板（跟随入户花园房间地材，避免与房间地面重叠时材质分裂）。excluded: true —— DEC-041 开发商已铺，业主已裁定移出算量（该房间也不在 floor applyRooms 内，几何判定同样不会计入，这里显式排除是为了让「为什么不算」在声明处可读，而非靠读者推断）；渲染仍可视化但不计费"

  - id: entry_foyer_floor
    type: floor_region
    points:
      - { x: 10.80, z: 3.00 }
      - { x: 12.77, z: 3.00 }
      - { x: 12.77, z: 4.30 }
      - { x: 10.80, z: 4.30 }
    follow: living_dining
    reason: "入户到客厅的过渡地面（DEC-041：跟随客厅有效地材，避免分房换材时断层）"

  - id: corridor_floor
    type: floor_region
    points:
      - { x: 4.2, z: 5.55 }
      - { x: 7.2, z: 5.55 }
      - { x: 7.2, z: 7.8 }
      - { x: 4.2, z: 7.8 }
    follow: study
    reason: "书房（study，x[4.20,7.20] z[5.55,9.80]） footprint 南侧的通道性地面条带 z[5.55,7.8]（3.0m×2.25m），整块落在 study 多边形内，故声明 follow: study 跟随书房地材（DEC-041 过渡地面约定的同一机制）。2026-10-04 更正：原 reason「主卧与父母房之间的走廊」不成立——主卧 master_bedroom 占 x[0,4.20]、与该房在 x=4.20 直接相邻，两者之间不存在独立走廊；本条带实为该房内部的过道区。2026-10-05 功能互换：该房由父母房改为书房，注释随功能改写，几何与地材归属不变。几何与地材归属维持不变（删该 element 会破坏 GLB 导出的既有断言 tests/server/cli-glb-export.test.ts），仅更正描述并显式声明子区域归属"

  - id: main_corridor_floor
    type: floor_region
    points:
      - { x: 4.2, z: 4.30 }
      - { x: 7.2, z: 4.30 }
      - { x: 7.2, z: 5.55 }
      - { x: 4.2, z: 5.55 }
    follow: living_dining
    reason: "主走廊连接左翼和右翼（x[0,4.2] 段已并入主卫套间）。2026-10-09 业主裁定「走廊需要铺砖」：补 follow: living_dining（DEC-040 走廊与客餐厅通铺同材，600×1200 木纹砖 75 元/㎡）。DEC-2026-10-09-P16 起不再需要任何手工标志——本区域 3.75㎡ 不在任何 applyRooms 房间内，新口径（默认计入、整块落在已计费房间内才跳过）自动把它算进 floor 算量，原 costed: true 已删"

  - id: guest_bath_open_vanity_floor
    type: floor_region
    points:
      - { x: 5.60, z: 3.55 }
      - { x: 7.10, z: 3.55 }
      - { x: 7.10, z: 4.30 }
      - { x: 5.60, z: 4.30 }
    room: guest_bath
    follow: living_dining
    reason: "客卫南侧门外开放洗漱区，1.125㎡；地面跟随客餐厅当前有效木纹砖。该内部分区从 guest_bath 小花砖范围中扣出，门内余区继续小花砖（DEC-2026-10-18-TILE-02）。门洞线z=3.55为材质转换边界；交房后按完成面复尺。"

  - id: north_platform_floor
    type: floor_region
    points:
      # 西北角随平台边界圆角（v_vrv_n r=1.0，弧心 (6.6,1.0)），与 vrv_nw_railing 弧线一致，不再凸出直角
      - { x: 5.6, z: 0.0, radius: 1.0, cx: 6.6, cz: 1.0 }
      - { x: 7.2, z: 0.0 }
      - { x: 7.2, z: 1.0 }
      - { x: 5.6, z: 1.0 }
    follow: balcony
    excluded: true
    reason: "VRV 设备平台地板（跟随生活阳台地材）。2026-10-09 业主裁定「设备平台不需要铺砖」→ excluded: true，约 1.385㎡（NW 角 r=1.0 圆角后的真实面积，非 1.60㎡ 外接矩形）不进预算 floor 算量（DEC-2026-10-09-P16 取代 P12 的「不设 costed」隐式排除：显式排除才能让例外在声明处显形）；渲染仍跟随阳台地材以保持室外灰砖面的视觉连贯，如需改为裸混凝土面请另议"

  # === 窗帘（2026-08-02）：引用墙 id 保持 vertices 联动；kind 显式指定（湿区百叶，其余纱帘+遮光） ===
  # 客餐厅（南向落地玻璃幕）
  - { id: curtain_living_south, type: curtain, wall: w_liv_south, room: living_dining, kind: sheer_blackout, height: 2.8 }
  # 主卧（西墙飘窗段 + 南墙；w_west_mid 条带段 2026-09-02 拆分为盆区百叶格 + 布帘段，见下两行）
  - { id: curtain_master_west, type: curtain, walls: [w_west_upper], room: master_bedroom, kind: sheer_blackout, height: 2.8 }
  - { id: curtain_master_south, type: curtain, wall: w_mb_south, room: master_bedroom, kind: sheer_blackout, height: 2.8 }
  # 2026-09-02 初版（迭代 mb-washbasin-curtain-20260901，假定玻璃通高，待量房终核）：
  # 盆区+站位段（z[2.86,4.00]）改百叶独立成段、无织物（同日业主追加：百叶南延过台面南缘 0.6m，罩住站位溅水区）；
  # 增加同范围浅色磨砂隐私层；布帘从 z=4.06 起挂，z[4.00,4.06] 保留为无构件收口空隙。
  # 两处用显式 points，暂失 vertices 联动；量房定竖梃后在 model-geometry 切分 w_west_mid 并改回墙引用。
  # 百叶 room 归 master_bath（湿区百叶同组控制；master_bedroom 已有 sheer_blackout，projection 禁止同房间混 kind）。
  # 百叶 offset 0.03 贴框安装位，避免与洗手柜西脸（x=0.05）干涉。
  - { id: curtain_master_strip_fabric, type: curtain, points: [{ x: 0, z: 4.06 }, { x: 0, z: 5.55 }], room: master_bedroom, kind: sheer_blackout, height: 2.8 }
  - { id: curtain_mb_washbasin_blinds, type: curtain, points: [{ x: 0, z: 2.86 }, { x: 0, z: 4.00 }], room: master_bath, kind: blinds, height: 2.8, offset: 0.03 }
  - { id: frosted_mb_washbasin_privacy, type: frosted_privacy, points: [{ x: 0, z: 2.86 }, { x: 0, z: 4.00 }], height: 2.8, sill: 0.0, finish: frosted_privacy }
  # 书房（南墙）

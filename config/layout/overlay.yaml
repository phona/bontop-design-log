# overlay.yaml: 渲染意图声明（intent-only），严格 schema。
# 所有"这是什么/怎么渲染"的分类由本文件声明，代码只读、只执行。
version: 1

suppress:
  - id: suppress_south_wall
    region: { x1: -8.5, z1: 5.5, x2: 8.5, z2: 4.8 }
    reason: "南外墙改玻璃幕墙"
  - id: suppress_west_wall
    region: { x1: -8.5, z1: 5.5, x2: -7.8, z2: -5.5 }
    reason: "西外墙改玻璃幕墙"
  - id: suppress_north_wall
    region: { x1: -8.5, z1: -4.8, x2: 5.6, z2: -5.5 }
    reason: "北外墙改玻璃幕墙（入户花园以西）"

elements:
  - id: glass_facade
    type: curtain_run
    points:
      - { x: 8.2, z: 5.2 }
      - { x: -8.2, z: 5.2, radius: 0.8 }
      - { x: -8.2, z: -5.2, radius: 0.8 }
      - { x: 5.6, z: -5.2 }
    height: 3.0

  - id: living_south_glass
    type: glass_infill
    room: living_dining
    wall: south
    center_offset: 0
    width: 3.5
    height: 1.6
    sill: 0.9

  - id: corridor_floor
    type: floor_region
    points:
      - { x: -1.0, z: 3.2 }
      - { x: 3.45, z: 3.2 }
      - { x: 3.45, z: 4.1 }
      - { x: -1.0, z: 4.1 }
    reason: "客餐厅与走廊过渡区"

  - id: master_left_bay
    type: bay_sill
    points:
      - { x: -8.2, z: 0.9 }
      - { x: -8.2, z: 5.2 }
    depth: 0.3
    sill: 0.45
    height: 2.55
    reason: "主卧西墙上飘窗"

  - id: bedroom_nw_bay
    type: bay_sill
    points:
      - { x: -8.2, z: -3.35 }
      - { x: -8.2, z: 0.9 }
    depth: 0.3
    sill: 0.45
    height: 2.55
    reason: "西北次卧西墙上飘窗"

  - id: northwest_bay
    type: bay_sill
    points:
      - { x: -8.2, z: -5.2 }
      - { x: -4.0, z: -5.2 }
    depth: 0.3
    sill: 0.45
    height: 2.55
    reason: "北侧书房/次卧北墙飘窗"

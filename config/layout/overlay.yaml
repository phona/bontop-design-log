# overlay.yaml: 渲染意图声明（intent-only），严格 schema。
# 2026-07-15：overlay.yaml 与 model-geometry.yaml 共用同一坐标系，z 字段不再单独偏移。
# 2026-07-16：按新外墙轮廓重写：西/南玻璃幕墙，西南/东南圆弧，飘窗，门洞补区。
# 2026-07-17：大修——删除南阳台（客厅落地玻璃齐平 z=9.95），新增书房南飘窗，
#   新增客厅南墙玻璃幕，东南次卧凸窗 base 移至 z=9.95，生活阳台移至 VRV 南侧，
#   西南/东南圆弧压缩到角部 1m，suppress 加宽防 Z-fighting。
version: 1

suppress:
  - id: suppress_west_wall
    walls: [w_west_top, w_west_ap, w_west_lower, w_west_mid, w_west_upper]
    reason: "西墙实体删除，改玻璃幕墙"
  - id: suppress_south_west
    walls: [w_mb_south, w_st_south]
    reason: "主卧+父母房南墙实体删除，为飘窗让路"
  - id: suppress_living_south
    wall: w_liv_south
    reason: "客厅南墙落地玻璃幕"
  - id: suppress_south_east
    wall: w_be_south
    reason: "东南次卧凸窗+东南圆角实体墙删除"
  - id: suppress_kitchen_north
    wall: w_kit_north
    reason: "厨房北墙实体删除，改玻璃幕墙"
  - id: suppress_vrv_railing
    walls: [w_vrv_nw_gap, w_vrv_north]
    reason: "VRV西北角实墙删除，改栏杆"
  - id: suppress_north_recess
    walls: [w_bath_north, w_nw_north]
    reason: "主卫/西北次卧北墙实体删除，改玻璃幕墙"
  - id: suppress_entry_north_railing
    wall: w_ent_north_railing
    reason: "入户花园北边实墙删除，改栏杆"

elements:
  # 西墙 + 西南圆角 + 南墙西段 (w_mb_south + w_st_south)
  - id: west_curtain
    type: curtain_run
    closed: false
    walls: [w_west_lower, w_west_mid, w_west_upper, w_mb_south, w_st_south]
    height: 2.8

  # VRV 西北角 + 西墙栏杆 (弧 r=1.0)
  - id: vrv_nw_railing
    type: railing_run
    walls: [w_vrv_nw_gap, w_vrv_north]
    height: 1.0

  # 入户花园北边栏杆（z=0 开放边）
  - id: entry_garden_north_railing
    type: railing_run
    wall: w_ent_north_railing
    height: 1.0

  # 厨房北墙玻璃幕墙
  - id: kitchen_north_curtain
    type: curtain_run
    closed: false
    wall: w_kit_north
    height: 2.8

  # 主卫西北角玻璃幕墙弧 (w_west_ap 进路从室内侧 + w_bath_north 弧段)
  - id: north_recess_curtain
    type: curtain_run
    closed: false
    walls: [w_west_ap, w_bath_north, w_nw_north]
    height: 2.8

  # 客厅南墙落地玻璃幕 (z=9.80)
  - id: living_south_curtain
    type: curtain_run
    closed: false
    wall: w_liv_south
    height: 2.8

  # 南墙东段（东南次卧南侧幕墙）
  - id: south_east_curtain
    type: curtain_run
    closed: false
    wall: w_be_south
    height: 2.8

  # 飘窗
  # sill 口径 2026-08-21 修正：旧全屋 2.55 系客厅值误推广（2.55+0.45=3.0 穿楼板，无效）。
  # 邻户原始结构图读法（业主样板间视频佐证）：卧室系 sill≈2.07/窗带高0.76，厨房≈2.12/0.71，
  # 客厅系上光带 sill≈2.57/0.26；2070+760=2830 与结构板标高自洽。量房终核（pending #20）。
  - id: master_bedroom_west_bay
    type: bay_sill
    wall: w_west_upper
    depth: 1.1
    sill: 2.07
    height: 0.76
    reason: "主卧西墙飘窗（z=5.55~8.80 直墙段）"

  - id: master_bedroom_south_bay
    type: bay_sill
    wall: w_mb_south
    depth: 1.1
    sill: 2.07
    height: 0.76
    reason: "主卧南墙环幕飘窗（南缘 z=10.90）"

  - id: study_south_bay
    type: bay_sill
    wall: w_st_south
    depth: 1.1
    sill: 2.07
    height: 0.76
    reason: "父母房南墙飘窗（南缘 z=10.90，与主卧齐平）"

  - id: bedroom_se_south_bay
    type: bay_sill
    wall: w_be_south
    depth: 1.1
    sill: 2.07
    height: 0.76
    reason: "书房南向凸窗（南缘 z=11.05）"

  - id: bedroom_nw_west_bay
    type: bay_sill
    wall: w_west_lower
    depth: 1.1
    sill: 2.07
    height: 0.76
    reason: "西北次卧西墙飘窗"

  - id: corridor_west_bay
    type: bay_sill
    wall: w_west_mid
    depth: 1.1
    sill: 2.07
    height: 0.76
    reason: "走廊西墙飘窗"

  - id: master_bath_west_bay
    type: bay_sill
    walls: [w_west_ap, w_bath_north]
    depth: 1.1
    sill: 2.07
    height: 0.76
    reason: "主卫西北角飘窗"

  - id: bedroom_nw_north_bay
    type: bay_sill
    wall: w_nw_north
    depth: 1.1
    sill: 2.07
    height: 0.76
    reason: "西北次卧北墙飘窗（z=1.10 凹进段）"

  - id: kitchen_north_bay
    type: bay_sill
    wall: w_kit_north
    depth: 1.1
    sill: 2.12
    height: 0.71
    reason: "厨房北墙飘窗（z=0 北缘）"

  # 地板补区
  - id: entry_garden_floor
    type: floor_region
    points:
      - { x: 10.8, z: 0.00 }
      - { x: 15.25, z: 0.00 }
      - { x: 15.25, z: 2.90 }
      - { x: 10.8, z: 2.90 }
    follow: entry_garden
    reason: "入户花园地板（跟随入户花园房间地材，避免与房间地面重叠时材质分裂）"

  - id: entry_foyer_floor
    type: floor_region
    points:
      - { x: 10.80, z: 2.90 }
      - { x: 13.40, z: 2.90 }
      - { x: 13.40, z: 4.30 }
      - { x: 10.80, z: 4.30 }
    follow: living_dining
    reason: "入户到客厅的过渡地面（DEC-041：跟随客厅有效地材，避免分房换材时断层）"

  - id: corridor_floor
    type: floor_region
    points:
      - { x: 4.2, z: 5.55 }
      - { x: 7.2, z: 5.55 }
      - { x: 7.2, z: 7.8 }
      - { x: 4.2, z: 7.8 }
    reason: "主卧与父母房之间的走廊"

  - id: main_corridor_floor
    type: floor_region
    points:
      - { x: 4.2, z: 4.30 }
      - { x: 7.2, z: 4.30 }
      - { x: 7.2, z: 5.55 }
      - { x: 4.2, z: 5.55 }
    reason: "主走廊连接左翼和右翼（x[0,4.2] 段已并入主卫套间）"

  - id: north_platform_floor
    type: floor_region
    points:
      # 西北角随平台边界圆角（v_vrv_n r=1.0，弧心 (6.6,1.0)），与 vrv_nw_railing 弧线一致，不再凸出直角
      - { x: 5.6, z: 0.0, radius: 1.0, cx: 6.6, cz: 1.0 }
      - { x: 7.2, z: 0.0 }
      - { x: 7.2, z: 1.0 }
      - { x: 5.6, z: 1.0 }
    follow: balcony
    reason: "VRV 设备平台地板（跟随生活阳台地材，设备平台与阳台同为室外灰砖面）"

  # === 窗帘（2026-08-02）：引用墙 id 保持 vertices 联动；kind 显式指定（湿区百叶，其余纱帘+遮光） ===
  # 客餐厅（南向落地玻璃幕）
  - { id: curtain_living_south, type: curtain, wall: w_liv_south, room: living_dining, kind: sheer_blackout, height: 2.8 }
  # 主卧（西墙存储条带 + 飘窗段 + 南墙）
  - { id: curtain_master_west, type: curtain, walls: [w_west_mid, w_west_upper], room: master_bedroom, kind: sheer_blackout, height: 2.8 }
  - { id: curtain_master_south, type: curtain, wall: w_mb_south, room: master_bedroom, kind: sheer_blackout, height: 2.8 }
  # 父母房（南墙）
  - { id: curtain_parent_south, type: curtain, wall: w_st_south, room: study, kind: sheer_blackout, height: 2.8 }
  # 书房（东南次卧南墙）
  - { id: curtain_study_south, type: curtain, wall: w_be_south, room: bedroom_se, kind: sheer_blackout, height: 2.8 }
  # 西北次卧只保留北墙凹进段
  - { id: curtain_nw_north, type: curtain, wall: w_nw_north, room: bedroom_nw, kind: sheer_blackout, height: 2.8 }
  # 湿区（主卫西北角）→ 防水百叶；厨房北墙不设窗帘（2026-08-13 业主决定）
  - { id: curtain_mbath_corner, type: curtain, walls: [w_west_lower, w_west_ap, w_bath_north], room: master_bath, kind: blinds, height: 2.8 }

  # 主卫淋浴干湿分离玻璃隔断（x=1.2，南端留 0.6m 入口；2026-08-25 隔墙北移 z=2.86 后南端收至 2.26，待量房确认）
  - id: shower_screen_mbath
    type: shower_screen
    points: [{ x: 1.20, z: 1.10 }, { x: 1.20, z: 2.26 }]
    height: 2.0

  # 2026-08-25 条带洗漱区东侧收口（小红书式半墙+长虹玻璃屏风，DEC-043）：
  # 位于一体台东缘(x=1.07)与 d_mbath 门洞[1.15,1.95]西侧之间，自新隔墙南脸(z=2.91)向南伸 0.5m 与台深齐平；
  # 半墙 h1.05（wall_run，需碰撞）+ 上部长虹玻璃 sill 1.05→2.10（shower_screen 复用，无碰撞玻璃）；
  # d_mbath 内开扫掠在卫内 z<2.86，不冲突；待量房确认
  - id: vanity_screen_halfwall
    type: wall_run
    points: [{ x: 1.11, z: 2.91 }, { x: 1.11, z: 3.41 }]
    height: 1.05
  - id: vanity_screen_glass
    type: shower_screen
    points: [{ x: 1.11, z: 2.91 }, { x: 1.11, z: 3.41 }]
    height: 1.05
    sill: 1.05

  # === DEC-022：餐厨推拉门（常开；点击门扇开闭，碰撞随状态） ===
  # 2026-08-26 改版（DEC-044）：到顶极窄边长虹玻璃，高 2.55 顶厨房铝扣板吊顶（餐厅侧高差 0.25m 封板未建模）；
  # 一固三活单向叠收：东固 0.9 正对冰箱南侧板（x∈[10.1,10.8]，死段不损通行），
  # 三活扇平时全部叠收东端贴固定扇与冰箱并排，西侧让出 2.7m 完整通道（顺餐桌西侧进出动线）
  - id: kitchen_dining_sliding_door
    type: sliding_door_run
    points:
      - { x: 7.20, z: 2.40 }
      - { x: 10.80, z: 2.40 }
    height: 2.55
    panels: 4
    open: true

# DXF → 场景坐标系锚点声明。
# 铁律：坐标换算不做任何推断，只用本文件声明的值。
# 本文件缺失或字段不全时，parse_cad.py 必须报错退出，禁止静默输出未平移的几何。
version: 1

# 场景原点在 DXF 图纸上的位置（DXF 毫米坐标）。
# 2026-07-15 更新：撤销之前错误的 +3.0 z 偏移，dxf_origin.y 回到 DXF 原始值。
dxf_origin:
  x: 31642.04
  y: -12484.34

# 有效图框（DXF 毫米坐标）：只提取中点在该矩形内的墙线。
# 用于排除同一 modelspace 里的重复图纸副本（墙体定位图 等）。
dxf_frame:
  min_x: 25500
  min_y: -18200
  max_x: 40500
  max_y: -7900

walls:
  # ── 面层配方（2026-11-07 issue #98 第三阶段 S4 下沉）────────────────────────────
  # wall_region(18)/paint_region(31) 不再是 overlay 平级元素，而是墙对象自己的特征：
  #   finish.tile_bands[] = 该墙某一侧脸上的贴砖带（检视态，层标签 wall-tile）；
  #   finish.paint_bands[] = 同一侧脸的涂装带（检视态，层标签 wall-paint）。
  # 定位口径（与原 overlay 声明逐字一致，未改语义）：
  #   along 自该墙 from 端沿墙折线累计（shared/wall-segments.ts 的 pointAlongPolyline/
  #     clipAlongSpan 是唯一插值实现，3D / DXF / 算量 / 面层核查共用）；
  #   height 是带【顶标高】（不是带高），bottom 缺省 0；同一墙脸可上下堆叠多段，
  #     二维不重叠即可（如灶台挡水条叠在东墙砖带之上）；
  #   room 声明该面归属房间——共墙两侧各贴各的脸，预算与审计按 (wall, room) 去重；
  #   渲染上贴砖带走墙中心线（检视态 depthTest=false 真透视），涂漆带朝房间侧完成面
  #   外偏移（偏移量由 wallFace 解析器按 line_datum 统一算，见 shared/wall-segments.ts，
  #   不再有 SceneBuilder 私有常量）。
  # 砖漆互斥机器化（原 DEC-2026-10-09-P07 的 7 处人工对齐）：同一墙脸的 tile_bands 与
  #   paint_bands 同住一个对象，parseOverlayFiles() 直接校验「paint.bottom ≥ 同脸 tile
  #   带顶」，违反即抛错——人工留 0.30m/0.77m/1.10m 对齐的时代结束。
  # zone：covered=橱柜后遮蔽面 / visible=可见面（缺省 visible；杂砖概念已废止，C18）。
  # line_datum：承载完成面语义的墙（有 paint_bands，或被 skirting_region 引用）自 S4 起
  #   显式声明 centerline——完成面偏移由 shared/wall-segments.ts 的 wallFaceOffset(wall, room)
  #   按它解算（半墙厚 0.06 + 8mm 间隙）。**不给未声明的墙设默认值**（pending #76 量房未裁）：
  #   #76 若裁定脸/心翻转，只改本字段与解析器，18 条贴砖带 / 31 条涂装带的 along 一个都不用动。
  # === 贴砖检视态（DEC-2026-10-07-R05/R06/R11；D1=A 档：厨房 0.90m / 湿区淋浴 1.80m / 其余 0.30m）===
  # 独立子系统：inspection-only 叠加层，仅在 HouseScene.setWallTileInspectionVisible(true) 时显示，
  # 与 HVAC 协调态 / 管井检视态 / MEP 总览完全隔离（层标签 'wall-tile'，互不遍历）。
  # 可贴实体墙长由 tmp/verify-wall-tile.ts 的 L2 交叉层从 model-geometry 独立复算校验：
  #   - 引用的墙必须存在且未被 suppress（主卫北墙 suppress_north_recess、西墙 suppress_west_wall
  #     均为玻璃幕墙，故主卫仅 4.36m 而非 6.12m）
  #   - along 区间必须落在该墙长度内；同一墙段不得重叠声明（防双计）
  # along 自该墙 from 端沿墙累计。zone 字段保留 schema 兼容（缺省 visible）；**杂砖概念已废止
  # （2026-10-08 C18，业主裁定）**：全库无杂砖单价、遮蔽面省钱为 0，且"东墙整段记杂砖"会让
  # 吊柜以上可见面被标杂砖——原 zone=covered 声明全部改回 visible，所有贴砖按正砖采购。
  # height 为贴砖带【顶标高】（不是带高），bottom 缺省 0；同一面墙可上下堆叠多段（如灶台挡水条
  # 叠在东墙 0.90m 杂砖带之上），二维不重叠即可。
  # room（2026-10-07 R11 补，对齐 paint_region）：声明贴砖面归属房间——共墙（w_balc_south 客卫/阳台、
  # w_balc_east 厨房/阳台）两侧各贴各的，预算与审计按 (wall, room) 脸去重，不再按 id 前缀猜房间。
  # 渲染仍走墙中心线 + 检视态 depthTest=false 真透视，不加侧向偏移（D5 只补账面/审计语义）。
  # 高度与 zone 均为 D1/D7 裁定前的建议基线，业主终裁后只改 height/zone 数值并重跑脚本。
  # === 涂漆检视态（墙顶面涂装 PKG-080；与贴砖检视态平级且互不引用）===
  # 独立子系统：inspection-only 叠加层，仅在 HouseScene.setPaintInspectionVisible(true) 时显示，
  # 与 HVAC 协调态 / 管井检视态 / MEP 总览 / 贴砖检视态完全隔离（层标签 'wall-paint'，互不遍历）。
  # room 声明漆面归属房间：平面沿墙法线朝该房间侧外偏移，避免与同墙的贴砖面、或共墙另一侧
  #   涂漆面共面 z-fighting（w_mb_east / w_st_east / w_be_west / w_nw_south / w_mbath_east /
  #   w_ent_west / w_ent_south_w 均为双面涂漆，两个房间各声明一段）。

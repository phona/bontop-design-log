  - id: study
    name: 书房
    boundary: [v_mb_ne, v_st_ne, v_step_b, v_mb_se]
    height: 3.0
    type: public
  - id: living_dining
    name: 客餐厅
    boundary: [v_kit_s, v_liv_se, v_be_se_s, v_step_t]
    height: 3.0
    type: public
  - id: master_bath
    name: 主卫
    boundary: [v_nw, v_bath_n, v_bath_s, v_mb_sw]
    height: 3.0
    type: service
  - id: bedroom_nw
    name: 西北次卧
    boundary: [v_bath_n, v_vrv_n, v_nw_s, v_bath_s]
    height: 3.0
    type: private
  - id: guest_bath
    name: 客卫
    boundary: [v_balc_sw, v_balc_se, v_gbath_se, v_nw_s]

version: '2.0'
unit: m
scale: 0.001
origin: { x: 31.64204, z: -12.48434 }
export_date: '2026-07-17'

vertices:
  - { id: v_nw,      x: 0.00,  z: 0.00 }
  - { id: v_mb_sw,   x: 0.00,  z: 4.30 }
  - { id: v_mb_nw,   x: 0.00,  z: 5.55 }
  - { id: v_sw,      x: 0.00,  z: 9.80, radius: 1.00 }
  - { id: v_step_b,  x: 7.20,  z: 9.80 }
  - { id: v_step_t,   x: 7.20,  z: 9.80 }
  - { id: v_be_se_s,  x: 13.40, z: 9.80 }
  - { id: v_se_r,     x: 16.40, z: 9.80 }
  - { id: v_be_ne,   x: 16.40, z: 5.55 }
  - { id: v_ent_ne,  x: 15.25, z: 0.00 }
  - { id: v_foyer_se, x: 13.40, z: 2.90 }
  - { id: v_foyer_ne, x: 15.25, z: 5.55 }
  - { id: v_ent_se,  x: 15.25, z: 2.90 }
  - { id: v_ent_sw,  x: 10.80, z: 2.90 }
  - { id: v_ent_nw,  x: 10.80, z: 0.00 }
  - { id: v_bath_n,  x: 2.60,  z: 0.00 }
  - { id: v_bath_s,  x: 2.60,  z: 4.30 }
  - { id: v_vrv_n,   x: 5.60,  z: 0.00, radius: 1.00 }
  - { id: v_vrv_sw,  x: 5.60,  z: 1.00 }
  - { id: v_balc_sw, x: 5.60,  z: 2.20 }
  - { id: v_nw_s,    x: 5.60,  z: 4.30 }
  - { id: v_vrv_se,  x: 7.20,  z: 1.00 }
  - { id: v_balc_ne, x: 7.20,  z: 2.20 }
  - { id: v_balc_se, x: 7.10,  z: 2.20 }
  - { id: v_gbath_se,x: 7.10,  z: 4.30 }
  - { id: v_kit_w,   x: 7.20,  z: 0.00 }
  - { id: v_kit_s,   x: 7.20,  z: 4.30 }
  - { id: v_ent_kit, x: 10.80, z: 4.30 }
  # DEC-014 厨房新南界（创想图核对：与入户花园南墙 z=2.90 齐平）
  - { id: v_kit_s2,  x: 7.20,  z: 2.40 }
  - { id: v_ent_kit2, x: 10.80, z: 2.40 }
  - { id: v_liv_se,  x: 13.40, z: 4.30 }
  - { id: v_be_sw,   x: 13.40, z: 5.55 }
  - { id: v_mb_ne,   x: 4.20,  z: 5.55 }
  - { id: v_mb_se,   x: 4.20,  z: 9.80 }
  - { id: v_st_ne,   x: 7.20,  z: 5.55 }
  - { id: v_suite_se, x: 2.60, z: 5.55 }
  - { id: v_strip_ne, x: 4.20, z: 4.30 }
  # 左翼北墙凹进顶点（主卫/西北次卧北墙 z=1.10，相比于 VRV/厨房 z=0 凹进 1.10m）
  - { id: v_bath_nw,  x: 0.00,  z: 1.10, radius: 1.00 }
  - { id: v_bath_ap,  x: 0.00,  z: 2.10 }
  - { id: v_bath_ne,  x: 2.60,  z: 1.10 }
  - { id: v_nw_ne,    x: 5.60,  z: 1.10 }

rooms:
  - id: master_bedroom
    name: 主卧
    boundary: [v_mb_nw, v_mb_ne, v_mb_se, v_sw]
    height: 2.8
    type: private
  - id: study
    name: 父母房
    boundary: [v_mb_ne, v_st_ne, v_step_b, v_mb_se]
    height: 2.8
    type: public
  - id: living_dining
    name: 客餐厅
    boundary: [v_kit_s2, v_ent_kit2, v_ent_sw, v_foyer_se, v_be_se_s, v_step_t]
    height: 2.8
    type: public
  - id: master_bath
    name: 主卫
    boundary: [v_bath_nw, v_bath_ne, v_bath_s, v_strip_ne, v_mb_ne, v_mb_nw]
    height: 2.8
    type: service
  - id: bedroom_nw
    name: 西北次卧
    boundary: [v_bath_ne, v_nw_ne, v_nw_s, v_bath_s]
    height: 2.8
    type: private
  - id: guest_bath
    name: 客卫
    boundary: [v_balc_sw, v_balc_se, v_gbath_se, v_nw_s]
    height: 2.8
    type: service
  - id: kitchen
    name: 厨房
    boundary: [v_kit_w, v_vrv_se, v_balc_ne, v_kit_s2, v_ent_kit2, v_ent_nw]
    height: 2.8
    type: service
  - id: balcony
    name: 生活阳台
    boundary: [v_vrv_sw, v_vrv_se, v_balc_ne, v_balc_se, v_balc_sw]
    height: 2.8
    type: service
  - id: entry_garden
    name: 入户花园
    boundary: [v_ent_nw, v_ent_sw, v_ent_se, v_ent_ne]
    height: 2.8
    type: public
  - id: bedroom_se
    name: 书房
    boundary: [v_be_sw, v_be_ne, v_se_r, v_be_se_s]
    height: 2.8
    type: private
  - id: elevator_shaft
    name: 电梯井
    boundary: [v_foyer_se, v_ent_se, v_foyer_ne, v_be_sw]
    height: 2.8
    type: service

platform:
  id: west_platform
  name: VRV设备平台
  boundary: [v_vrv_n, v_kit_w, v_vrv_se, v_vrv_sw]
  height: 0.05

walls:
  # 外框 — 西墙（v_nw→v_bath_ap 幕墙竖段，v_bath_ap→v_bath_nw 弧进路，v_bath_nw→v_mb_sw 主卫西墙）
  - { id: w_west_top,  from: v_nw,      to: v_bath_ap, height: 2.8 }
  - { id: w_west_ap,   from: v_bath_ap, to: v_bath_nw, height: 2.8 }
  - { id: w_west_lower, from: v_bath_ap,  to: v_mb_sw,  height: 2.8 }
  - { id: w_west_mid,   from: v_mb_sw,   to: v_mb_nw,  height: 2.8 }
  - { id: w_west_upper, from: v_mb_nw,   to: v_sw,     height: 2.8 }
  # 外框 — 南墙（在 v_mb_se, v_step_b, v_step_t, v_be_se_s 处切开）
  - { id: w_mb_south,   from: v_sw,      to: v_mb_se,  height: 2.8 }
  - { id: w_st_south,   from: v_mb_se,   to: v_step_b, height: 2.8 }
  - { id: w_liv_south,  from: v_step_t,  to: v_be_se_s,height: 2.8 }
  - { id: w_be_south,   from: v_be_se_s, to: v_se_r,   height: 2.8 }
  # 外框 — 东墙（在 v_be_ne 处切开）
  - { id: w_east_upper, from: v_se_r,    to: v_be_ne,  height: 2.8 }
  - { id: w_foyer_outer_east, from: v_ent_se, to: v_foyer_ne, height: 2.8 }
  - { id: w_foyer_north_east, from: v_foyer_ne, to: v_be_ne, height: 2.8 }
  - { id: w_elev_south, from: v_be_sw, to: v_foyer_ne, height: 2.8 }
  # 入户花园围墙（北墙为栏杆开放边）
  - { id: w_ent_east,   from: v_ent_ne,  to: v_ent_se, height: 2.8 }
  - id: w_ent_south_w
    from: v_ent_sw
    to: v_foyer_se
    height: 2.8
    openings:
      - { id: d_ent, type: door, anchor: v_ent_sw, offset: 1.5, width: 1.0, height: 2.1, room: entry_garden }
  - id: w_ent_south_e
    from: v_foyer_se
    to: v_ent_se
    height: 2.8
    openings:
      - { id: d_elev, type: door, anchor: v_foyer_se, offset: 0.925, width: 1.0, height: 2.1, room: elevator_shaft }
  - { id: w_ent_west,  from: v_ent_sw,   to: v_ent_nw, height: 2.8 }
  - { id: w_ent_north_railing, from: v_ent_ne, to: v_ent_nw, height: 1.0 }
  # 入户过渡区东墙（承重墙）
  - { id: w_foyer_east, from: v_foyer_se, to: v_liv_se, height: 2.8 }
  # 外框 — 北墙（左翼凹进 z=1.10，v_nw→v_bath_nw→v_bath_ne 为幕墙；VRV/厨房北墙 z=0）
  - { id: w_bath_north, from: v_bath_nw,  to: v_bath_ne, height: 2.8 }
  - { id: w_nw_north,   from: v_bath_ne,  to: v_nw_ne,  height: 2.8 }
  - { id: w_vrv_north,  from: v_vrv_n,   to: v_kit_w,  height: 2.8 }
  - { id: w_kit_north,  from: v_kit_w,   to: v_ent_nw, height: 2.8 }
  # 内墙 — 左侧卧室区（走廊条带 x[0,4.2] z[4.30,5.55] 已并入主卫作套间过道；
  # w_mbath_south 恢复为套内干湿分区隔断，d_mbath 与 d_mb_bath 对称——过道尽头左主卧右主卫）
  - { id: w_mbath_east, from: v_bath_ne,   to: v_bath_s, height: 2.8 }
  - id: w_mbath_south
    from: v_mb_sw
    to: v_bath_s
    height: 2.8
    openings:
      - { id: d_mbath, type: door, anchor: v_mb_sw, offset: 0.9, width: 0.8, height: 2.1, room: master_bath }
  - id: w_nw_south
    from: v_bath_s
    to: v_nw_s
    height: 2.8
    openings:
      - { id: d_bnw, type: door, anchor: v_nw_s, offset: 0.6, width: 0.9, height: 2.1, room: bedroom_nw }
  # 套间条带东延墙（x=4.2，旧条带东墙 x=2.6 已拆除）
  - id: w_strip_east
    from: v_strip_ne
    to: v_mb_ne
    height: 2.8
    openings:
      - { id: d_mb, type: door, anchor: v_mb_ne, offset: 0.45, width: 0.9, height: 2.1, room: master_bath }
  - id: w_st_north
    from: v_mb_ne
    to: v_st_ne
    height: 2.8
    openings:
      - { id: d_study, type: door, anchor: v_mb_ne, offset: 2.4, width: 0.9, height: 2.1, room: study }
  - { id: w_st_east,    from: v_st_ne,   to: v_step_b, height: 2.8 }
  # 主卧北墙开放（w_mb_north_w 已删除；w_mb_north_e 已删，由柜体作隔断）
  # 内墙 — 主卧东墙（共享墙，按主卧命名）
  - id: w_mb_east
    from: v_mb_ne
    to: v_mb_se
    height: 2.8
    openings:
      - { id: w_mb_win, type: window, anchor: v_mb_se, offset: 1.5, width: 2.4, height: 1.5, sill: 0.9, room: master_bedroom }
  # 内墙 — VRV 平台 / 生活阳台 / 客卫
  - { id: w_vrv_nw_gap, from: v_nw_ne,   to: v_vrv_n,  height: 2.8 }
  - { id: w_balc_west,  from: v_vrv_sw,  to: v_balc_sw,height: 2.8 }
  - { id: w_gbath_west, from: v_balc_sw, to: v_nw_s,   height: 2.8 }
  # w_vrv_south 已删除——VRV 与阳台间为栏杆（开放边）
  - { id: w_balc_south, from: v_balc_sw, to: v_balc_se,height: 2.8 }
  - id: w_gbath_south
    from: v_nw_s
    to: v_gbath_se
    height: 2.8
    openings:
      - { id: d_gbath, type: door, anchor: v_nw_s, offset: 0.75, width: 0.7, height: 2.1, room: guest_bath }
  - { id: w_gbath_east, from: v_balc_se, to: v_gbath_se,height: 2.8 }
  # 内墙 — x=7.20 纵向墙（厨房西墙，在 v_vrv_se, v_balc_ne 处切开；DEC-014 南界缩至 z=2.90，z[2.9,4.3] 段由 w_gbath_east@x=7.1 覆盖）
  - { id: w_vrv_east,   from: v_kit_w,   to: v_vrv_se, height: 2.8 }
  - id: w_balc_east
    from: v_vrv_se
    to: v_balc_ne
    height: 2.8
    openings:
      - { id: d_kit_balc, type: door, anchor: v_vrv_se, offset: 0.6, width: 0.8, height: 2.1, room: kitchen }
  - { id: w_kit_west,   from: v_balc_ne, to: v_kit_s2, height: 2.8 }
  # w_liv_west 已删除——主走廊与客厅开放贯通
  # 内墙 — 厨房 / 客餐厅 / 书房
  - { id: w_kit_east,   from: v_ent_nw,  to: v_ent_kit2, height: 2.8 }
  - { id: w_liv_east,   from: v_liv_se,  to: v_be_sw,  height: 2.8 }
  - id: w_be_west
    from: v_be_sw
    to: v_be_se_s
    height: 2.8
    openings:
      - { id: d_bese, type: door, anchor: v_be_se_s, offset: 3.7, width: 0.9, height: 2.1, room: bedroom_se }
  - { id: w_be_north,   from: v_be_sw,   to: v_be_ne,  height: 2.8 }

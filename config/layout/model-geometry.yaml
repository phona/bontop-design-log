  id: west_platform
  name: VRV设备平台
  boundary: [v_vrv_n, v_kit_w, v_vrv_se, v_vrv_sw]
  height: 0.05

walls:
  # 外框 — 西墙（在 T 接点 v_mb_sw, v_mb_nw 处切开）
  - { id: w_west_lower, from: v_nw,      to: v_mb_sw,  height: 3.0 }
  - { id: w_west_mid,   from: v_mb_sw,   to: v_mb_nw,  height: 3.0 }
  - { id: w_west_upper, from: v_mb_nw,   to: v_sw,     height: 3.0 }
  # 外框 — 南墙（在 v_mb_se, v_step_b, v_step_t, v_be_se_s 处切开）
  - { id: w_mb_south,   from: v_sw,      to: v_mb_se,  height: 3.0 }
  - { id: w_st_south,   from: v_mb_se,   to: v_step_b, height: 3.0 }
  - { id: w_step,       from: v_step_b,  to: v_step_t, height: 3.0 }
  - { id: w_liv_south,  from: v_step_t,  to: v_be_se_s,height: 3.0 }
  - { id: w_be_south,   from: v_be_se_s, to: v_se_r,   height: 3.0 }
  # 外框 — 东墙（在 v_be_ne 处切开）
  - { id: w_east_upper, from: v_se_r,    to: v_be_ne,  height: 3.0 }
  - { id: w_east_lower, from: v_be_ne,   to: v_e_bot,  height: 3.0 }
  # 入户花园围墙
  - { id: w_ent_north,  from: v_e_bot,   to: v_ent_ne, height: 3.0 }
  - { id: w_ent_east,   from: v_ent_ne,  to: v_ent_se, height: 3.0 }
  - { id: w_ent_south,  from: v_ent_se,  to: v_ent_sw, height: 3.0 }
  - { id: w_ent_west,   from: v_ent_sw,  to: v_ent_nw, height: 3.0 }
  # 外框 — 北墙（在 v_bath_n, v_vrv_n, v_kit_w 处切开）
  - { id: w_mbath_north,from: v_nw,      to: v_bath_n, height: 3.0 }
  - { id: w_nw_north,   from: v_bath_n,  to: v_vrv_n,  height: 3.0 }
  - { id: w_vrv_north,  from: v_vrv_n,   to: v_kit_w,  height: 3.0 }
  - { id: w_kit_north,  from: v_kit_w,   to: v_ent_nw, height: 3.0 }
  # 内墙 — 左侧卧室区
  - { id: w_mbath_south,from: v_mb_sw,   to: v_bath_s, height: 3.0 }
  - { id: w_mbath_east, from: v_bath_n,  to: v_bath_s, height: 3.0 }
  - { id: w_nw_south,   from: v_bath_s,  to: v_nw_s,   height: 3.0 }
  - { id: w_st_north,   from: v_mb_ne,   to: v_st_ne,  height: 3.0 }
  - { id: w_st_east,    from: v_st_ne,   to: v_step_b, height: 3.0 }
  # 内墙 — 主卧东墙（共享墙，按主卧命名）
  - id: w_mb_east
    from: v_mb_ne
    to: v_mb_se
    height: 3.0
    openings:
      - { id: d_mb, type: door, anchor: v_mb_ne, offset: 0.9, width: 0.9, height: 2.1, room: master_bedroom }
      - { id: w_mb_win, type: window, anchor: v_mb_se, offset: 1.5, width: 2.4, height: 1.5, sill: 0.9 }
  # 内墙 — VRV 平台 / 生活阳台 / 客卫
  - { id: w_vrv_west,   from: v_vrv_n,   to: v_vrv_sw, height: 3.0 }
  - { id: w_balc_west,  from: v_vrv_sw,  to: v_balc_sw,height: 3.0 }
  - { id: w_gbath_west, from: v_balc_sw, to: v_nw_s,   height: 3.0 }
  - { id: w_vrv_south,  from: v_vrv_sw,  to: v_vrv_se, height: 3.0 }
  - { id: w_balc_south, from: v_balc_sw, to: v_balc_se,height: 3.0 }
  - { id: w_gbath_south,from: v_nw_s,    to: v_gbath_se,height: 3.0 }
  - { id: w_gbath_east, from: v_balc_se, to: v_gbath_se,height: 3.0 }
  # 内墙 — x=7.20 纵向墙（厨房西墙，在 v_vrv_se, v_balc_ne, v_kit_s 处切开）
  - { id: w_vrv_east,   from: v_kit_w,   to: v_vrv_se, height: 3.0 }
  - { id: w_balc_east,  from: v_vrv_se,  to: v_balc_ne,height: 3.0 }
  - { id: w_kit_west,   from: v_balc_ne, to: v_kit_s,  height: 3.0 }
  - { id: w_liv_west,   from: v_kit_s,   to: v_st_ne,  height: 3.0 }
  # 内墙 — 厨房 / 客餐厅 / 东南次卧
  - { id: w_kit_south,  from: v_kit_s,   to: v_ent_kit,height: 3.0 }
  - { id: w_kit_east,   from: v_ent_sw,  to: v_ent_kit,height: 3.0 }
  - { id: w_liv_east,   from: v_liv_se,  to: v_be_sw,  height: 3.0 }
  - { id: w_be_west,    from: v_be_sw,   to: v_be_se_s,height: 3.0 }
  - { id: w_be_north,   from: v_be_sw,   to: v_be_ne,  height: 3.0 }

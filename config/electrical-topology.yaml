    wire_size: "2.5mm²(φ20)"
    breaker: "C16A+漏保"
    note: "客厅/餐厅空调电源专用回路（客厅 71T2、餐厅 42T2；餐厅点位 DEC-2026-10-03-R6 并入本路）。6 台内机暂并为 2 路（本路 + hvac_power_bedrooms），回路 status 仍 pending；厂家正式配电图确认前不冻结供电分组、额定负荷、泵供电及端子接法。各内机成交型号为 71T2、42T2、56T2、28T2×3，均为 P-SS 泵型；内机/泵电气参数按厂家资料待核，压缩机在室外机。DEC-2026-10-04-R2 插座线径方案值 2.5mm²(φ20)，breaker C16A+漏保仍待正式配电图终核；若厂家要求硬接线或集中供电，按厂家图重定义点位 type 与回路口径。"
  # DEC-2026-10-03-R1：原 hvac_power_master / hvac_power_child / hvac_power_study / hvac_power_parent 四路合并。
  - id: hvac_power_bedrooms
    panel_id: panel_strong

version: '1.0'

panels:
  # id 是 topology 内部 panel 标识；source_point_id 指向 electrical.yaml 的真实箱体点位。
  - id: panel_strong
    kind: strong
    status: confirmed
    source_point_id: panel_strong_entry_left
  - id: panel_weak
    kind: weak
    status: proposed
    source_point_id: panel_weak_entry_left

circuits:
  - id: lighting_dining
    panel_id: panel_strong
    purpose: lighting
    status: confirmed
    member_point_ids: [light_dining_pendant]
    source_circuit_id: dining
    note: "沿用 electrical.yaml 已声明 circuit: dining"
  - id: lighting_living_base
    panel_id: panel_strong
    purpose: lighting
    status: confirmed
    member_point_ids: [living_track_main]
    source_circuit_id: living_base
    note: "沿用 electrical.yaml 已声明 circuit: living_base"
  - id: lighting_tv_ambient
    panel_id: panel_strong
    purpose: lighting
    status: confirmed
    member_point_ids: [light_tv_strip]
    source_circuit_id: tv_ambient
    note: "沿用 electrical.yaml 已声明 circuit: tv_ambient"
  - id: lighting_entry_base
    panel_id: panel_strong
    purpose: lighting
    status: confirmed
    member_point_ids: [light_corridor_1, light_entry_down, light_entry_foyer]
    source_circuit_id: entry_base
    note: "沿用 electrical.yaml 已声明 circuit: entry_base"
  - id: lighting_master_dome
    panel_id: panel_strong
    purpose: lighting
    status: proposed
    member_point_ids: [light_master_dome]
    note: "主卧吸顶灯，具体开关控制关系待确认（预期关联 switch_master_bed_l / switch_master_door 双控）；容量、线径、断路器等施工参数待确认"
  - id: lighting_parent_dome
    panel_id: panel_strong
    purpose: lighting
    status: proposed
    member_point_ids: [light_parent_dome]
    note: "父母房吸顶灯，具体开关控制关系待确认（预期关联 switch_parent_bed / switch_parent_door 双控）；容量、线径、断路器等施工参数待确认"
  - id: lighting_child_dome
    panel_id: panel_strong
    purpose: lighting
    status: proposed
    member_point_ids: [light_child_dome]
    note: "西北次卧吸顶灯，具体开关控制关系待确认（预期关联 switch_child）；容量、线径、断路器等施工参数待确认"
  - id: lighting_study_dome
    panel_id: panel_strong
    purpose: lighting

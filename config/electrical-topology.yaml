  - "空调当前暂并为 2 路（客厅+餐厅 / 主卧+书房+儿童房+客房），回路均 pending；室内机成交映射为客厅71T2、餐厅42T2、主卧56T2、书房/儿童房/客房28T2×3，全部 P-SS 泵型。厂家正式配电图需核额定负荷、内机/泵供电、端子及集中或逐台供电方式，再确认线径、断路器与回路拆并。"
  - "强电箱规格未确认（DEC-2026-10-04-R2 按 20 路重算，DEC-2026-10-05-R3 浴霸拆每卫一路后为 21 路）：390mm 箱体单/双排未知。单排约 20 位、扣 2P 进线开关 + 浪涌后约 16 位可用，**21 路确定装不下 → 单排箱（约 16 位可用）出局，必须双排或换箱**；GB 55038 7.4.3-2 规定单排箱底边 ≥1.80m、双排 ≥1.60m，现 panel_strong_entry_left mount_height 1.65m 仅双排合规（若现场为单排箱，须换箱或把箱底边上移至 ≥1.80m）。进线截面须 ≥10mm² 铜芯（7.4.3-3）。见 pending-site-data #30"
  - "拓扑未建模进线开关：GB 55038 7.4.3-1 要求设能同时断开相线与中性线且具隔离功能的进线开关，并设短路与过负荷保护；量房开箱确认"
  - "回路 capacity/wire_size/breaker 为方案 proposed 值（合并后仍按 docs/mep-construction-guidance.md §3.1 口径：照明 1.5mm²、插座 ≥2.5mm²、大功率/厨房 4mm²），施工前按设备铭牌与交底终核"

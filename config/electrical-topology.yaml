    member_point_ids: [sock_master_bed_l, sock_master_bed_r, sock_master_bed_r_head, sock_master_projector, sock_master_curtain, sock_parent_bed_l, sock_parent_bed_r, sock_parent_desk, sock_parent_curtain, sock_study_desk, sock_study_curtain, sock_child_bed, sock_child_desk]

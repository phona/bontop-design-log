version: '1.0'

# 2026-10-03（DEC-2026-10-03-R1）施工冻结前收口：25 路 → 19 路（R1）；2026-10-04（DEC-2026-10-04-R2）外机供电补齐第 20 路（20kW 外机按 GB 55038 7.4.4 单独成路）。
# 1) 所有电源插座回路补齐 ≤30mA 剩余电流动作保护（GB 55038-2025 7.4.3-1）：冰箱 + 空调 5 路原写 C16A 无漏保，全部改 C16A+漏保。
#    若中央空调厂家正式配电图要求硬接线不设漏保，则按厂家图重新定义点位 type，不得沿用 type: socket 逻辑。
# 2) 回路合并依据 GB 55038-2025 7.4.4：照明回路、空调电源插座回路、2kW 及以上用电设备回路、厨房内电源插座回路、
#    其他功能用房电源插座回路"应分别设置"是类型级要求，不要求每房每灯独立 → 合并不违规，箱体容量优先。
# 3) 洗烘按 7.4.4 拆为两条专用回路（洗衣机 2.0kW、热泵烘干 0.9kW）。
# 4) 20 路 + 2P 进线开关 + 浪涌对 390mm 箱体需双排（DEC-2026-10-04-R2：由 19 路重算为 20 路后，单排约 16 位可用确定装不下）；GB 55038 7.4.3-2：单排箱底边 ≥1.80m、双排 ≥1.60m，
#    现 mount_height 1.65m 仅在双排时合规——箱体单/双排与容量列入 pending-site-data #30。
# 口径：开关点位经 controls 绑定灯具、网络点位（含 DEC-2026-10-03-R1 新增 net_gateway / net_ap_corridor）
# 归弱电箱系统，均不进入强电供电回路成员（Phase 1 口径）。

panels:
  # id 是 topology 内部 panel 标识；source_point_id 指向 electrical.yaml 的真实箱体点位。
  - id: panel_strong
    kind: strong
    status: confirmed
    source_point_id: panel_strong_entry_left
  - id: panel_weak
    kind: weak
    status: proposed
    source_point_id: panel_weak_entry_left

circuits:
  - id: lighting_dining
    panel_id: panel_strong
    purpose: lighting
    status: confirmed
    member_point_ids: [light_dining_pendant]
    source_circuit_id: dining
    capacity: "≤0.5kW"
    wire_size: "1.5mm²(φ16)"
    breaker: "C16A"
    note: "沿用 electrical.yaml 已声明 circuit: dining"
  - id: lighting_living_base
    panel_id: panel_strong
    purpose: lighting
    status: confirmed
    member_point_ids: [living_track_main]
    source_circuit_id: living_base
    capacity: "≤0.5kW"
    wire_size: "1.5mm²(φ16)"
    breaker: "C16A"
    note: "沿用 electrical.yaml 已声明 circuit: living_base"
  - id: lighting_tv_ambient
    panel_id: panel_strong
    purpose: lighting
    status: confirmed
    member_point_ids: [light_tv_strip]
    source_circuit_id: tv_ambient
    capacity: "≤0.2kW"
    wire_size: "1.5mm²(φ16)"
    breaker: "C16A"
    note: "沿用 electrical.yaml 已声明 circuit: tv_ambient"
  - id: lighting_entry_base
    panel_id: panel_strong
    purpose: lighting
    status: confirmed
    member_point_ids: [light_corridor_1, light_entry_down, light_entry_foyer]
    source_circuit_id: entry_base
    capacity: "≤0.3kW"
    wire_size: "1.5mm²(φ16)"
    breaker: "C16A"
    note: "沿用 electrical.yaml 已声明 circuit: entry_base（走廊/入户筒灯）"
  # DEC-2026-10-03-R1：原 lighting_master_dome / lighting_parent_dome / lighting_child_dome / lighting_study_dome /
  # lighting_kitchen_panel / lighting_mbath_panel / lighting_gbath_panel 七路合并为本路（GB 55038 7.4.4 类型级要求，
  # 不强制每房独立）。受控关系仍由 controls 逐开关绑定，合并不改变任何开关功能。
  - id: lighting_bedrooms_bath
    panel_id: panel_strong
    purpose: lighting
    status: proposed
    member_point_ids: [light_master_dome, light_master_wall_l, light_master_wall_r, light_parent_dome, light_child_dome, light_study_dome, light_kitchen_panel, light_mbath_panel, light_gbath_panel]
    capacity: "≤0.8kW（9 点位合计估算）"
    wire_size: "1.5mm²(φ16)"
    breaker: "C16A"
    note: "卧室/厨卫照明合并回路（DEC-2026-10-03-R1）：主卧吸顶灯与床头壁灯、父母房/儿童房/书房吸顶灯、厨房/两卫平板灯；控制绑定见 control_master_bed_door / control_parent_bed_door / control_child_light / control_study_light / control_kitchen_light / control_mbath_light / control_gbath_light"
  - id: hvac_power_living
    panel_id: panel_strong
    purpose: hvac_power
    status: pending
    member_point_ids: [sock_living_ac, sock_dining_ac]
    dedicated_load: true
    capacity: "≤0.6kW（6 台内机自身电负荷合计约 0.35kW；压缩机在室外机不计入）"
    wire_size: "2.5mm²(φ20)"
    breaker: "C16A+漏保"
    note: "客厅空调电源专用回路（DEC-2026-10-03-R1 补 ≤30mA 漏保，GB 55038 7.4.3-1）；DEC-2026-10-03-R6：新增第 6 台内机 sock_dining_ac 并入本路，6 台内机暂并为 2 路（本路 + hvac_power_bedrooms），待厂家正式配电图确认；定标后按厂商供电方案（室内机是否统一供电/集中箱位）终核——若厂家要求硬接线不设漏保，须重新定义点位 type；DEC-2026-10-04-R2：按 docs/mep-construction-guidance.md §3.1『插座 ≥2.5mm²』口径修正（原 1.5mm² 与本项目自订规范矛盾）；多联机内机自身电负荷 = 风机+水泵+控制，单台约 40–90W（71T2 75W/28T2 50W），压缩机在室外机，故本回路容量远小于其制冷量"
  # DEC-2026-10-03-R1：原 hvac_power_master / hvac_power_child / hvac_power_study / hvac_power_parent 四路合并。
  - id: hvac_power_bedrooms
    panel_id: panel_strong
    purpose: hvac_power
    status: pending
    member_point_ids: [sock_master_ac, sock_parent_ac, sock_child_ac, sock_study_ac]
    dedicated_load: true
    capacity: "≤0.5kW（主卧 ≤0.2 + 三房 ≤0.1 各自）"
    wire_size: "2.5mm²(φ20)"
    breaker: "C16A+漏保"
    note: "卧室/书房空调电源合并回路（DEC-2026-10-03-R1）：4 路并为 1 路，含 ≤30mA 漏保；厂商配电图若要求逐台独立回路或集中供电箱，按厂家正式图纸回退拆分并重新定义 type；DEC-2026-10-04-R2：按 docs/mep-construction-guidance.md §3.1『插座 ≥2.5mm²』口径修正（原 1.5mm² 与本项目自订规范矛盾）；多联机内机自身电负荷 = 风机+水泵+控制，单台约 40–90W（71T2 75W/28T2 50W），压缩机在室外机，故本回路容量远小于其制冷量"
  # DEC-2026-10-04-R2：外机供电补齐为第 20 路。本回路是 R1「19 路」遗漏的最大单体负载——20kW 外机。
  # GB 55038-2025 7.4.4：2kW 及以上用电设备回路应分别设置 → 外机必须单独成路，回路总数 19→20。
  - id: hvac_power_outdoor_a2
    panel_id: panel_strong
    purpose: hvac_power
    status: pending
    member_point_ids: [sock_vrf_outdoor_a2]
    dedicated_load: true
    capacity: "≈6kW 输入（20kW 制冷量 / 估 EER≈3.5）"
    wire_size: "4.0mm²(φ20)（proposed，按 docs/mep-construction-guidance.md §3.1 大功率单独回路口径；厂家端子与线长确认后可能升 6mm²）"
    breaker: "C32A+漏保（proposed，待厂家配电图）"
    note: "DEC-2026-10-04-R2：本条补齐外机供电四层数据缺口的最后一块（electrical 点位 + topology 回路 + mep 走线 + hvac 电力参数）。本回路是 R1「19 路」拓扑遗漏的最大单体负载——美的领航者Ⅳ MJV-200W-E01-LHIV 20kW 外机；GB 55038-2025 7.4.4 要求 2kW 及以上用电设备回路分别设置，故外机单独成路，**回路总数因此由 19 变 20**。breaker/wire_size 为 proposed；是否由强电箱单独放缆、或接开发商外立面预留插座，待厂家正式配电图与量房终核——若厂家要求硬接线不设漏保，须重新定义 sock_vrf_outdoor_a2 的 type 与回路口径（同头部注释 1 口径）。sock_vrf_outdoor_a2 为 position_status: pending。走线见 config/mep-hvac-coordination.yaml strong-ac-outdoor。"
  - id: dedicated_kitchen_fridge
    panel_id: panel_strong
    purpose: dedicated_load
    status: proposed
    member_point_ids: [sock_kitchen_fridge]
    dedicated_load: true
    capacity: "≤0.3kW"
    wire_size: "2.5mm²(φ16)"
    breaker: "C16A+漏保"
    note: "冰箱独立回路（外出不断电）；DEC-2026-10-03-R1 按 GB 55038 7.4.3-1 补 ≤30mA 漏保；点位在高柜内，取电可及性随橱柜深化（不得靠拉冰箱取电）"
  - id: dedicated_kitchen_dishwasher
    panel_id: panel_strong
    purpose: dedicated_load
    status: pending
    member_point_ids: [sock_kitchen_dishwasher]
    dedicated_load: true
    capacity: "≈2.2kW"
    wire_size: "2.5mm²(φ16)"
    breaker: "C20A+漏保"
    note: "洗碗机单独回路；容量/线径/断路器待确认（2kW 以上设备单独成路，GB 55038 7.4.4）"
  # DEC-2026-10-03-R1：原 dedicated_balcony_washer_dryer 一回路拆为两条（洗衣机 2.0kW 属 2kW 以上设备，GB 55038 7.4.4）。
  - id: dedicated_balcony_washer
    panel_id: panel_strong
    purpose: dedicated_load
    status: proposed
    member_point_ids: [sock_balcony_washer]
    dedicated_load: true
    capacity: "≈2.0kW（洗衣机）"
    wire_size: "2.5mm²(φ16)"
    breaker: "C20A+漏保"
    note: "洗衣机专用回路（DEC-2026-10-03-R1 从洗烘合路拆出）；点位 position_status pending，检修位随家电 SKU 冻结后改位"
  - id: dedicated_balcony_dryer
    panel_id: panel_strong
    purpose: dedicated_load
    status: proposed
    member_point_ids: [sock_balcony_dryer]
    dedicated_load: true
    capacity: "≈0.9kW（热泵烘干）"
    wire_size: "2.5mm²(φ16)"
    breaker: "C16A+漏保"
    note: "烘干机专用回路（DEC-2026-10-03-R1 拆出）；与 washer 同带平行敷设（见 strong-ded-washer-dryer 路径），点位 position_status pending"
  - id: dedicated_bath_heaters
    panel_id: panel_strong
    purpose: dedicated_load
    status: pending
    member_point_ids: [sock_gbath_towel, sock_mbath_exhaust, sock_gbath_exhaust]
    dedicated_load: true
    capacity: "≈2.5kW（浴霸风暖为主）"
    wire_size: "2.5mm²(φ16)"
    breaker: "C20A+漏保"
    note: "卫浴设备电源（浴霸/排气/电热毛巾架）；两卫同回路的分组与漏保级联待设备清单及交底确认"
  - id: ordinary_power_living
    panel_id: panel_strong
    purpose: ordinary_power
    status: proposed
    member_point_ids: [sock_living_tv, sock_living_sofa_l, sock_living_sofa_r, sock_living_table, sock_living_water, sock_living_curtain, sock_living_drying, sock_gateway, sock_living_tv_led, sock_living_robot, sock_living_tv_high]
    capacity: "≈2.0kW"
    wire_size: "2.5mm²(φ16)"
    breaker: "C20A+漏保"
    note: "客餐厅普通电源（含网关与电视氛围灯带，2026-09-07-056 补入；DEC-2026-09-09-R1 补扫地机基站柜内位；DEC-2026-10-03-R1 补 sock_living_tv_high 电视/音响高位取电）；现场分组待交底"
  # DEC-2026-10-03-R1：原 ordinary_power_bedrooms（14 点位共一个 C20 支路）拆为三段，
  # 书房电脑/显示器单独成路，其余按房分路（GB 55038 7.4.4 按其他功能用房分路）。
  - id: ordinary_power_master
    panel_id: panel_strong
    purpose: ordinary_power
    status: proposed
    member_point_ids: [sock_master_bed_l, sock_master_bed_r, sock_master_bed_r_head, sock_master_projector, sock_master_curtain]
    capacity: "≈0.8kW"
    wire_size: "2.5mm²(φ16)"
    breaker: "C20A+漏保"
    note: "主卧普通电源（DEC-2026-10-03-R1 拆出）；sock_master_projector 为候选未冻结地插（西墙幕墙不可挂装，仅在西侧家具位保留时有效）"
  - id: ordinary_power_parent_child
    panel_id: panel_strong
    purpose: ordinary_power
    status: proposed
    member_point_ids: [sock_parent_bed_l, sock_parent_bed_r, sock_parent_desk, sock_parent_curtain, sock_child_bed, sock_child_desk]
    capacity: "≈0.8kW"
    wire_size: "2.5mm²(φ16)"
    breaker: "C20A+漏保"
    note: "父母房 + 儿童房普通电源（DEC-2026-10-03-R1 拆出）"
  - id: ordinary_power_study
    panel_id: panel_strong
    purpose: ordinary_power
    status: proposed
    member_point_ids: [sock_study_desk, sock_study_curtain, sock_study_extra]
    capacity: "≈1.0kW（电脑 + 显示器 + 外设）"
    wire_size: "2.5mm²(φ16)"
    breaker: "C20A+漏保"
    note: "书房普通电源单独成路（DEC-2026-10-03-R1 拆出，电脑负载不与他人混路）"
  - id: ordinary_power_service
    panel_id: panel_strong
    purpose: ordinary_power
    status: proposed
    member_point_ids: [sock_balcony_drying, sock_mbath_vanity, sock_mbath_toilet, sock_gbath_vanity, sock_gbath_vanity_2, sock_gbath_toilet, sock_gbath_robot]
    capacity: "≈1.5kW"
    wire_size: "2.5mm²(φ16)"
    breaker: "C20A+漏保"
    note: "功能电源（智能马桶/台盆位/阳台晾衣/扫地机基站，DEC-2026-09-09-R1；DEC-2026-10-03-R1 移出 sock_kitchen_gas 并归入厨房回路，客卫毛巾架 sock_gbath_towel 归 dedicated_bath_heaters）；两个智能马桶位 position_status pending，交底前与给水错位并加防溅盒（GB 55038 7.4.5）"
  - id: ordinary_power_kitchen
    panel_id: panel_strong
    purpose: ordinary_power
    status: proposed
    member_point_ids: [sock_kitchen_counter, sock_kitchen_counter_east, sock_kitchen_purifier, sock_kitchen_hood, sock_kitchen_gas, sock_balcony_waterheater]
    capacity: "≈3.5kW（台面小电器峰值；烟机≈0.3、净水≈0.05、热水器控制器≈0.05、燃气报警≈0.05）"
    wire_size: "4.0mm²(φ20)"
    breaker: "C20A+漏保"
    note: "厨房插座回路（2026-09-07-056 新增）：台面/净水/烟机/燃气报警/燃气热水器控制器；4mm² 为嵌入式烤箱等后续升级预留；燃气热水器为燃气设备，仅取电。DEC-2026-10-03-R1：sock_kitchen_gas 自 ordinary_power_service 并入本回路（缩短同墙路径），sock_kitchen_counter_east 为灶台段第二取电区（position_status pending）"
  - id: ordinary_power_garden
    panel_id: panel_strong
    purpose: ordinary_power
    status: proposed
    member_point_ids: [sock_garden]
    capacity: "≈1.0kW"
    wire_size: "2.5mm²(φ16)"
    breaker: "C16A+漏保"
    note: "入户花园插座回路（2026-09-07-056 新增）；户外侧注意防水面板"

controls:
  - id: control_living_entrance_corridor
    kind: switch_2way
    status: proposed
    switch_point_ids: [switch_living_entrance, switch_living_corridor]
    target_point_ids: [living_track_main, light_entry_foyer]
    note: "客厅入户侧/走廊侧双控：受控为客厅基础照明（track 主灯）+ 入户门厅筒灯（2026-09-07-056 方案绑定，待交底确认）"
  - id: control_master_bed_door
    kind: switch_multiway
    status: confirmed
    switch_point_ids: [switch_master_bed_l, switch_master_bed_north, switch_master_door]
    target_point_ids: [light_master_dome]
    note: "主卧门口/南床头/北床头三控，受控灯具为主卧吸顶灯 light_master_dome（2026-09-02 确认双控绑定；DEC-2026-09-08-R1 增北床头开关升三控 switch_multiway，中途开关按接线序定，交底确认）；床头壁灯不走多控"
  - id: control_parent_bed_door
    kind: switch_2way
    status: proposed
    switch_point_ids: [switch_parent_bed, switch_parent_door]
    target_point_ids: [light_parent_dome]
    note: "父母房床头/门口双控：受控为父母房吸顶灯（2026-09-07-056 方案绑定，待交底确认）"
  - id: control_dining
    kind: switch
    status: proposed
    switch_point_ids: [switch_dining]
    target_point_ids: [light_dining_pendant]
    note: "餐桌吊灯墙控单控（DEC-2026-09-08-R1 落实原'餐桌旁墙上开关'口径，待交底确认）"
  - id: control_corridor_downlight
    kind: switch
    status: proposed
    switch_point_ids: [switch_corridor]
    target_point_ids: [light_corridor_1]
    note: "走廊东端筒灯单控（2026-09-07-056 补）"
  - id: control_study_light
    kind: switch
    status: proposed
    switch_point_ids: [switch_study]
    target_point_ids: [light_study_dome]
    note: "书房吸顶灯单控（2026-09-07-056 补）"
  - id: control_child_light
    kind: switch_2way
    status: proposed
    switch_point_ids: [switch_child, switch_child_bed]
    target_point_ids: [light_child_dome]
    note: "西北次卧吸顶灯门口/床头双控（2026-09-07-056 门口单控；DEC-2026-09-08-R1 增床头 switch_child_bed 升双控，待交底确认）"
  - id: control_kitchen_light
    kind: switch
    status: proposed
    switch_point_ids: [switch_kitchen]
    target_point_ids: [light_kitchen_panel]
    note: "厨房平板灯单控（2026-09-07-056 补）"
  - id: control_mbath_light
    kind: switch
    status: proposed
    switch_point_ids: [switch_mbath]
    target_point_ids: [light_mbath_panel]
    note: "主卫平板灯单控；开关位于门外（套间条带），符合湿区开关外置（2026-09-07-056 补）"
  - id: control_gbath_light
    kind: switch
    status: proposed
    switch_point_ids: [switch_gbath]
    target_point_ids: [light_gbath_panel]
    note: "客卫平板灯单控（2026-09-07-056 补）"
  - id: control_garden_light
    kind: switch
    status: proposed
    switch_point_ids: [switch_garden]
    target_point_ids: [light_entry_down]
    note: "入户花园筒灯单控（2026-09-07-056 补）"

pending_parameters:

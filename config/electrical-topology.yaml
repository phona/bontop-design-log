controls:
  - id: control_living_entrance_corridor
    kind: switch_2way
    status: confirmed
    switch_point_ids: [switch_living_entrance, switch_living_corridor]
    target_point_ids: []
    note: "现有客厅入户侧/走廊侧双控意图；具体受控灯具未在事实中明确"
  - id: control_master_bed_door
    kind: switch_2way
    status: confirmed
    switch_point_ids: [switch_master_bed_l, switch_master_door]
    target_point_ids: []
    note: "现有主卧床头/门口双控意图；具体受控灯具未在事实中明确"
  - id: control_parent_bed_door
    kind: switch_2way
    status: confirmed
    switch_point_ids: [switch_parent_bed, switch_parent_door]
    target_point_ids: []
    note: "现有父母房床头/门口双控意图；具体受控灯具未在事实中明确"

pending_parameters:
  - "强弱电箱之间的实际分隔与进线关系待现场确认"
  - "所有非照明回路的容量、线径、断路器规格待设备铭牌与设计复核"
  - "空调五路的设备功率、专用回路策略与保护参数待 HVAC 设备确认"
  - "厨房/卫浴/阳台 dedicated load 的最终负载清单与回路分组待深化"
  - "双控关系的具体受控灯具待电气交底确认"

# 2026-10-05 功能互换（iteration parent-room-study-swap-20261005）：本文件中"父母房"已整体改写为"书房"（room id=study），"书房"改写为"客房"（room id=bedroom_se）。仅改功能叙述文字；回路、点位 id 一律未动。
version: '1.0'

# 2026-10-03（DEC-2026-10-03-R1）施工冻结前收口：25 路 → 19 路（R1）；2026-10-04（DEC-2026-10-04-R2）外机供电补齐第 20 路（20kW 外机按 GB 55038 7.4.4 单独成路）。
# 2026-10-05（DEC-2026-10-05-R3）浴霸按设备锚点（奥普 S2-Air 风暖 2750W）拆每卫一路 → 21 路；两台风暖同开 ≈5.6kW 不可共路。
# 1) 所有电源插座回路补齐 ≤30mA 剩余电流动作保护（GB 55038-2025 7.4.3-1）：冰箱 + 空调 5 路原写 C16A 无漏保，全部改 C16A+漏保。
#    若中央空调厂家正式配电图要求硬接线不设漏保，则按厂家图重新定义点位 type，不得沿用 type: socket 逻辑。
# 2) 回路合并依据 GB 55038-2025 7.4.4：照明回路、空调电源插座回路、2kW 及以上用电设备回路、厨房内电源插座回路、
#    其他功能用房电源插座回路"应分别设置"是类型级要求，不要求每房每灯独立 → 合并不违规，箱体容量优先。
# 3) 洗烘按 7.4.4 拆为两条专用回路（洗衣机 2.0kW、热泵烘干 0.9kW）。
# 4) 21 路 + 2P 进线开关 + 浪涌对 390mm 箱体需双排（DEC-2026-10-04-R2：由 19 路重算为 20 路后，单排约 16 位可用确定装不下；DEC-2026-10-05-R3 浴霸拆每卫一路 → 21 路，结论不变）；GB 55038 7.4.3-2：单排箱底边 ≥1.80m、双排 ≥1.60m，
#    现 mount_height 1.65m 仅在双排时合规——箱体单/双排与容量列入 pending-site-data #30。
# 口径：开关点位经 controls 绑定灯具、网络点位（含 DEC-2026-10-03-R1 新增 net_gateway / net_ap_corridor）
# 归弱电箱系统，均不进入强电供电回路成员（Phase 1 口径）。
# 点位口径：config/electrical.yaml 共 110 个点位（2026-10-05 R15 起夜照明 + 客房床头组后由 98 增至 110；登记日 2026-10-04 首登，与 fact.electrical_points_count 对账：点位增删必须同步此数）。

panels:

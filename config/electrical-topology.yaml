    capacity: "≤0.9kW（14 点位合计估算：9 日常灯 + 5 起夜低位灯，各约 3–5W）"
    wire_size: "1.5mm²(φ16)"
    breaker: "C16A"
    note: "卧室/厨卫照明合并回路（DEC-2026-10-03-R1）：主卧吸顶灯与床头壁灯、书房/儿童房/客房吸顶灯、厨房/两卫平板灯；控制绑定见 control_master_bed_door / control_parent_bed_door / control_child_light / control_study_light / control_kitchen_light / control_mbath_light / control_gbath_light"
  - id: hvac_power_living

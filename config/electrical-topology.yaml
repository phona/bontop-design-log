    dedicated_load: true
    capacity: "待厂家铭牌核验（当前≤0.5kW仅为方案预留值，非已核定内机/泵负荷）"
    wire_size: "2.5mm²(φ20)"
    breaker: "C16A+漏保"
    note: "主卧/书房/儿童房/客房空调电源合并回路（型号依次为 56T2、28T2、28T2、28T2；DEC-2026-10-03-R1 四点合并为一路）。status 仍 pending；厂家正式配电图确认前不冻结供电分组、额定负荷、P-SS 泵供电及端子接法；若要求逐台独立回路或集中供电，按厂家图重新定义点位 type 与回路口径。DEC-2026-10-04-R2 插座线径方案值 2.5mm²(φ20)，breaker C16A+漏保待正式配电图终核；内机/泵电气参数待厂家资料确认，压缩机在室外机。"

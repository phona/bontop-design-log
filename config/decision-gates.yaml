    options:
      - 膜面第 2 面（南方两玻一腔遮阳型，现行口径）
      - 膜面第 3 面（北方保温为主）
      - 并列保留不合并
    status: open
    blocks:
      - check_window_lowe_doc
    blocked_effect: 该项标准含「膜面在第 2 面」，属报告并列旗标；细节未核实、措辞未拍板前不得判 passed（其方法里「不得记为已证实」同此口径）。

  # ---- 不阻塞验收项的决策（scope: tracked，必须写 tracking_note）----

  - id: D1

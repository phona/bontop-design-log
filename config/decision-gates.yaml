    options:
      - 单独存水弯（现行已定 1% 找坡加独立支管）
      - 共用淋浴存水弯
      - 带存水弯专用二排器
      - 干区改「水封加机械辅助」并补写水封位置
    status: open
    blocks:
      - check_plumb_master_bath_secondary_drain
      - check_plumb_guest_bath_secondary_drain
      - check_plumb_drain
    blocked_effect: 接法与干区写法未书面拍板前，两卫二次排水项与排水存水弯项不得判 passed；水电交底前拍板，贴砖后改是返工。


    scope: tracked
    question: 是否批准「本轮证据下不换品牌」这个结论；是否继续比大金，继续比须先拿到经销商书面确认清单（P+ 20kW 档选型与一拖六上限、寰域容量段、各机型泵高与管径存水弯、分贝标称值、保修映射与细则、铜管与保温规格、通用检修口尺寸、价格）；外机实测尺寸与西平台散热核算是否先做
    options:
      - 维持已定标品牌（合同已签）
      - 继续比大金，先补经销商书面确认清单
      - 先做外机实测与西平台散热核算再定
    status: open
    tracking_note: 品牌合同已签、逐房映射已定，没有任何验收项以「换不换品牌」为通过条件；外机尺寸与平台散热的缺口由 BLK-HVAC-DEEPENING 跟踪，不阻塞本表任何验收项。叙事侧详见 docs/pending-site-data.md 决策点登记节。


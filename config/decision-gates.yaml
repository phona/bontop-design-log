# ============================================================================
# config/decision-gates.yaml —— 决策门禁登记表（npm run verify:decision-gates）
#
# 铁律来源（2026-10-30 重构报告 → 2026-10-31 落成机制）：
#   「很多口径还没有唯一值：打压、闭水、强弱电间距、龙骨间距、石膏板厚度、
#     铝扣板厚度、厨房线径、油漆遍数、美缝天数……全部只能并列旗标，
#     不能直接写进验收合格线。」
#   在此之前，这类「待拍板」只以散文形式写在 acceptance.yaml 的 knowledge 里
#   （如「档位待 D5 拍板」），没有任何机器强制：check_carp_keel 写死 ≤400mm、
#   D9 说 300/400 未拍板，两边互不知情，门禁全绿。
#
# 本表把每个未拍板决策登记成机器可判的门禁，两种范围：
#   scope: acceptance —— 阻塞具体验收项。未拍板（status: open）期间，被阻塞
#     验收项不得出现 passed 审计记录；没有 passed 就没有「全部检查通过」，
#     付款门槛（computeGateStatus）自然回到 pending——宁可多 pending，
#     不可错放款。拍板后必须补 decided_value / decided_by / decided_at /
#     decision_evidence，缺一项 verify:facts 的 requires 契约与本校验器都报错。
#   scope: tracked —— 不阻塞验收项的决策（采购、范围、流程类）。必须写
#     tracking_note 说明为什么不阻塞、缺口由谁跟踪；防止「以为有门禁、
#     其实没有」。
#
# 反向防线：acceptance.yaml 与 control.yaml 散文里出现的「待 Dx 拍板」必须能在
# 本表找到对应决策，且散文点名的 check 必须登记在该决策的 blocks 里——
# 门禁不许只活在注释里。
#
# 双登记对照：docs/pending-site-data.md「决策点登记 D1–D18」节是本表的叙事侧
# （待拍板内容与缺的证据，人读版），两侧必须同步移动——只登记一侧，另一侧就
# 静默失效。校验器对两侧编号集合做双向对照，缺一侧即报错。
#
# 档位数字（400mm、24h、0.8MPa 等）在本文件中是待拍板选项，不是权威值；
# 权威值落在 DEC 与 acceptance.yaml 的 standard。故本表在 facts.yaml 的
# T1 scan 里整表豁免，不参与数值对账。
# ============================================================================

version: 1

decisions:
  # ---- 阻塞验收项的决策（scope: acceptance）----

  - id: D2
    topic: 二次排水接法与干区地漏水封写法
    scope: acceptance

    options:
      - 打压 0.6–0.8MPa 加 1 小时压降 ≤0.05MPa 再 2 小时 ≤0.03MPa
      - 打压 0.8–1.0MPa 加 30 分钟以上压降 ≤0.05MPa
      - GB 50242 转述档
      - 闭水 24 小时
      - 闭水 48 小时（现行 check_wp_flood 口径）
    status: open
    blocks:
      - check_plumb_pressure
      - check_plumb_pressure_gate
      - check_wp_flood
      - check_wp_finish_flood
    blocked_effect: 档位写进合同前四项不得判 passed；check_wp_dry_gate 不锁时长与深度，不受本门禁阻塞（其 knowledge 已明示）。

  - id: D6
    topic: 强弱电间距对象划分
    scope: acceptance
    question: 平行管线间距、交叉屏蔽、强弱电箱距离三个对象是否分开建项、分开量测；30cm、20cm、50cm 各对应哪一个对象
    options:
      - 平行管线间距 30cm
      - 平行管线间距 20cm
      - 交叉处包锡纸屏蔽
      - 强弱电箱距离 50cm
    status: open
    blocks:
      - check_elec_strong_weak_separation
    blocked_effect: 该项标准现为「按交底口径执行」，分对象取值未定前不得判 passed；封槽前量距，30/20/50 三个数字分属不同对象，不得合并成一条。

  - id: D9
    topic: 龙骨间距档位
    scope: acceptance
    question: 副龙骨取不超过 300mm 还是小于等于 40cm；主龙骨取 1000mm 以内还是小于等于 1.2m；吊杆与端头距离取哪档；是否按较严一档写进合同
    options:
      - 副龙骨 ≤300mm
      - 副龙骨 ≤400mm（现行 check_carp_keel 口径）
      - 主龙骨 ≤1000mm
      - 主龙骨 ≤1200mm（现行口径）
    status: open
    blocks:
      - check_carp_keel
    blocked_effect: 报告口径为「按较严一档核对并写进合同后才升级为判据」；档位未写进合同前，check_carp_keel 的 400mm 不得判 passed。

  - id: D11
    topic: 空鼓分档与美缝天数
    scope: acceptance
    question: 空鼓分档是否采纳为合同验收标准；瓷砖泡水规则按吸水率区分的具体写法；美缝晾干天数与清缝打样是否写进合同；油漆兑水比例、同批次大样、雨天停工与养护是否进入合同
    options:
      - 空鼓按「墙面应无空鼓、地面边角 ≤5%」分档
      - 空鼓按现行「单片 <15%、整面墙 <5%」
      - 美缝贴砖后至少晾 7 天
      - 基层干透经验 7–10 天
    status: open
    blocks:
      - check_tile_hollow
      - check_tile_grout_dry
    blocked_effect: 空鼓分档与美缝天数未写进合同前两项不得判 passed；现行数值只是仓内旧口径，不是合同判据。

  - id: D15
    topic: 石膏板与辅材档位
    scope: acceptance
    question: 石膏板取 9.5mm 还是 12mm、耐潮还是耐水；铝扣板厚度、边框、烤漆覆膜、收边含不含报价；JS 涂料报 2009 版还是 2025 版；PPR S 系列是否写进合同
    options:
      - 石膏板 9.5mm
      - 石膏板 12mm
      - 背板 ≥9mm（现行 check_carp_board 口径）
    status: open
    blocks:
      - check_carp_board
    blocked_effect: 报告口径「条件不满足，回退到不下单」；厚度档位未定前 check_carp_board 不得判 passed；铝扣板与 JS 涂料仓内无验收项，属覆盖缺口。

  - id: D16

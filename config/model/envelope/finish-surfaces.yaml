# envelope/finish-surfaces.yaml：面层配方【过渡文件】（issue #98 第三阶段 S1 自 config/layout/overlay.yaml 原样搬迁）。
# wall_region 18 + paint_region 31 + skirting_region 24 + sill_region 20 + paint_sill_region 8
# + paint_ceiling_region 8 = 109 个面层配方，id 零重编号。
# skirting 的 &skirting_height / &skirting_color 锚点随首段条目同文件迁入（YAML 锚点不能跨文件），
# 其余 23 段的 * 引用保持有效——改高度/颜色仍只改首段锚点值。
# **本文件的退场路径**：S4 把面层配方下沉为墙/构件/房间的特征（wall.finish.* / sill.finish.* /
# room.ceiling_finish）并解散本文件；S5 再删 24 段 skirting 声明改派生。在那之前这里是唯一声明源。
# 合并读取入口：server/overlay-merge.ts parseOverlayFiles()。
elements:
  # === 贴砖检视态（DEC-2026-10-07-R05/R06/R11；D1=A 档：厨房 0.90m / 湿区淋浴 1.80m / 其余 0.30m）===
  # 独立子系统：inspection-only 叠加层，仅在 HouseScene.setWallTileInspectionVisible(true) 时显示，
  # 与 HVAC 协调态 / 管井检视态 / MEP 总览完全隔离（层标签 'wall-tile'，互不遍历）。
  # 可贴实体墙长由 tmp/verify-wall-tile.ts 的 L2 交叉层从 model-geometry 独立复算校验：
  #   - 引用的墙必须存在且未被 suppress（主卫北墙 suppress_north_recess、西墙 suppress_west_wall
  #     均为玻璃幕墙，故主卫仅 4.36m 而非 6.12m）
  #   - along 区间必须落在该墙长度内；同一墙段不得重叠声明（防双计）
  # along 自该墙 from 端沿墙累计。zone 字段保留 schema 兼容（缺省 visible）；**杂砖概念已废止
  # （2026-10-08 C18，业主裁定）**：全库无杂砖单价、遮蔽面省钱为 0，且"东墙整段记杂砖"会让
  # 吊柜以上可见面被标杂砖——原 zone=covered 声明全部改回 visible，所有贴砖按正砖采购。
  # height 为贴砖带【顶标高】（不是带高），bottom 缺省 0；同一面墙可上下堆叠多段（如灶台挡水条
  # 叠在东墙 0.90m 杂砖带之上），二维不重叠即可。
  # room（2026-10-07 R11 补，对齐 paint_region）：声明贴砖面归属房间——共墙（w_balc_south 客卫/阳台、
  # w_balc_east 厨房/阳台）两侧各贴各的，预算与审计按 (wall, room) 脸去重，不再按 id 前缀猜房间。
  # 渲染仍走墙中心线 + 检视态 depthTest=false 真透视，不加侧向偏移（D5 只补账面/审计语义）。
  # 高度与 zone 均为 D1/D7 裁定前的建议基线，业主终裁后只改 height/zone 数值并重跑脚本。

  # ── 厨房 4.80m（北墙 w_kit_north 3.60m 为 suppress_kitchen_north 玻璃幕墙不可贴；
  #    z=2.40 的 3.60m 是四联动推拉门开口而非墙，均不在此列）──
  # 2026-10-07 E2 落地（DEC-2026-10-07-C15）：三面可贴墙贴满至吊顶完成面 2.65（透过推拉门形成连续砖面），
  # 由 D1=A 建议基线 0.90m 升高；w_balc_east 阳台门段不在 E2 贴满范围（门洞占大半），维持 0.90m 防溅带。
  # 柜后遮蔽/可见的段内细分（吊柜包络）仍待 D7 橱柜布局收口，当前按整段口径记账。
  - id: walltile_kitchen_ent_west
    type: wall_region
    wall: w_ent_west
    room: kitchen
    along: [0.60, 3.00]      # z[2.40, 0.00] 段 = 2.40m（东墙，与入户门厅共墙；2026-10-25 DEC-2026-10-25-R01（本体标定重算）：v_ent_sw 移至 3.00，along 自新南端起算 3.00−z）
    bottom: 0.00
    height: 2.65
    zone: visible
    reason: 厨房东墙 E2 贴满至 2.65（当前灶台/烟机柜墙，C18 废止杂砖后整段正砖，吊柜以上不再有口径分歧；DEC-2026-10-14 fridge trial 把冰箱移出本墙，瓷砖范围不随此3D候选改变；门厅 0.50m 过渡段收口待门厅终裁）
  # R11 补（业主 2026-10-07 裁定 D2=补贴）：灶台/烟机后挡水墙。0.90m 杂砖带止于台面完成面 0.89m，
  # 而台面以上至烟机底（模型 range_hood 底缘 y=1.35，取整贴到 1.40 包住机身边）是油溅裸墙缺口。
  # 本段与下方杂砖带共用 along 区间 [1.27,2.17]（= 烟机宽 0.90m，z[0.73,1.63]），竖向 0.90→1.40 不重叠。
  - id: walltile_kitchen_vrv_east
    type: wall_region
    wall: w_vrv_east
    room: kitchen
    along: [0.00, 1.00]      # 1.00m
    bottom: 0.00
    height: 2.65
    zone: visible
    reason: 厨房西墙实墙段（与 VRV 设备间共墙），无橱柜遮蔽，E2 贴满至 2.65 正砖
  - id: walltile_kitchen_balc_east_west
    type: wall_region
    wall: w_balc_east
    room: kitchen
    along: [0.00, 0.20]      # 门洞 d_kit_balc [0.20,1.00] 西侧剩余段（DEC-2026-10-09-P11 拆分）
    bottom: 0.00
    height: 0.90
    zone: visible
    reason: "厨房西墙生活阳台门段西侧，辅助台面防溅带 0.90m 正砖；不在 E2 贴满范围。2026-10-09 由 walltile_kitchen_balc_east（整段 1.20m）拆分——门洞占中段 0.80m，瓷砖不扣洞（DEC-2026-10-09-P11）"
  - id: walltile_kitchen_balc_east_east
    type: wall_region
    wall: w_balc_east
    room: kitchen
    along: [1.00, 1.20]      # 门洞 d_kit_balc [0.20,1.00] 东侧剩余段（DEC-2026-10-09-P11 拆分）
    bottom: 0.00
    height: 0.90
    zone: visible
    reason: "厨房西墙生活阳台门段东侧，辅助台面防溅带 0.90m 正砖；不在 E2 贴满范围。2026-10-09 由 walltile_kitchen_balc_east（整段 1.20m）拆分——门洞占中段 0.80m，瓷砖不扣洞（DEC-2026-10-09-P11）"
  - id: walltile_kitchen_west_stub
    type: wall_region
    wall: w_kit_west
    room: kitchen
    along: [0.00, 0.20]      # 0.20m 残段
    bottom: 0.00
    height: 2.65
    zone: visible
    reason: 西墙南端 0.20m 残段，E2 贴满至 2.65 正砖；“冰箱位背墙/高柜包络”仅为历史备注，DEC-2026-10-14试案将冰箱置于客餐厅，不能据此推断当前位置或柜体。

  # ── 生活阳台（R11 新增；业主 2026-10-07 裁定 D3=B）──
  # 湿区口径 0.30m：洗衣机/烘干机贴 w_balc_west（给水 faucet_balcony_washer / 墙排 drain_balcony_washer
  # 均在这面墙），湿溅面必须贴；w_balc_south 贴阳台侧（客卫花洒侧另段见下，两侧各贴各的脸）。
  # 门洞墙 w_balc_east 的【阳台侧】不贴：厨房侧杂砖带已覆盖门垛，阳台侧只剩 0.2m×2 门垛，D3-B 不收。
  - id: walltile_balc_west_washer
    type: wall_region
    wall: w_balc_west
    room: balcony
    along: [0.00, 1.20]      # z[1.00, 2.20] 段 = 1.20m（整墙，洗衣机/烘干机背墙）
    bottom: 0.00
    height: 0.30
    zone: visible
    reason: 生活阳台西墙洗衣机/烘干机背墙，湿区 0.30m 防水口径
  - id: walltile_balc_south
    type: wall_region
    wall: w_balc_south
    room: balcony
    along: [0.00, 1.60]      # x[5.60, 7.20] 段 = 1.60m（与客卫北墙共墙，本段为阳台侧脸；2026-10-23 DEC-2026-10-23-R04 随墙长 1.50→1.60）
    bottom: 0.00
    height: 0.30
    zone: visible
    reason: 生活阳台南墙阳台侧，湿区 0.30m 防水口径（客卫淋浴侧见 walltile_gbath_north_shower）

  # ── 客厅落地幕墙根部防水台（R11 D4=L 型终裁：竖面 + 水平台面都贴、做出檐收口）──
  # 几何 = living_south_waterproof_ledge（bay_sill，150 高 × 150 出檐，业界常规口径待量房）。
  # front = 竖面（玻璃线处竖直面，沿墙 6.20m × 0.15m）；top = 水平台面（墙线向室内伸 0.15m）。
  # 两段复用 'wall-tile' 层标签与开关（贴砖区显示中时与墙砖同屏），与 wall_region 平级互不引用。
  - id: silltile_living_south_front
    type: sill_region
    element: living_south_waterproof_ledge
    face: front
    zone: visible
    room: living_dining
    reason: 客厅落地幕墙防水台竖面，L 型贴砖的竖直面（D4 终裁）
  - id: silltile_living_south_top
    type: sill_region
    element: living_south_waterproof_ledge
    face: top
    zone: visible
    room: living_dining
    reason: 客厅落地幕墙防水台水平台面，L 型贴砖的出檐收口面（D4 终裁）

  # ── 主卫湿区防水台贴砖（C17）：两座 bay_sill 的 front+top 共 4 段，3.36m × 0.30 = 1.008㎡ 正砖 ──
  - id: silltile_mbath_west_lower_front
    type: sill_region
    element: mbath_west_lower_waterproof_ledge
    face: front
    zone: visible
    room: master_bath
    reason: 主卫西墙淋浴段防水台竖面贴砖
  - id: silltile_mbath_west_lower_top
    type: sill_region
    element: mbath_west_lower_waterproof_ledge
    face: top
    zone: visible
    room: master_bath
    reason: 主卫西墙淋浴段防水台台面贴砖
  - id: silltile_mbath_north_front
    type: sill_region
    element: mbath_north_waterproof_ledge
    face: front
    zone: visible
    room: master_bath
    reason: 主卫北墙防水台竖面贴砖（西段在淋浴湿区内）
  - id: silltile_mbath_north_top
    type: sill_region
    element: mbath_north_waterproof_ledge
    face: top
    zone: visible
    room: master_bath
    reason: 主卫北墙防水台台面贴砖

  # ── 主卫 4.36m（西淋浴湿区 x[0,1.2]、东马桶；北墙与西墙均为玻璃幕墙不可贴）──
  - id: walltile_mbath_east
    type: wall_region
    wall: w_mbath_east
    room: master_bath
    along: [0.00, 1.76]      # z[1.10, 2.86] 段 = 1.76m
    bottom: 0.00
    height: 0.30
    zone: visible
    reason: 主卫东墙，马桶区非淋浴，按防水口径其他≥0.3m
  - id: walltile_mbath_south_shower
    type: wall_region
    wall: w_mbath_south
    room: master_bath
    along: [0.00, 1.15]      # x[0, 1.15] 段 = 1.15m，淋浴湿区；2026-10-09 由 1.20 收至 1.15——门洞 d_mbath 自沿墙 1.15 起，瓷砖不扣洞（DEC-2026-10-09-P11）
    bottom: 0.00
    height: 2.65
    zone: visible
    reason: 主卫南墙西段，西淋浴湿区 x[0,1.2]，砖到顶 2.65（业主 2026-10-07 终裁 C16，与客卫 C14 同口径；西墙为玻璃幕墙不贴，砖面止于玻璃碰接）
  - id: walltile_mbath_south_dry
    type: wall_region
    wall: w_mbath_south
    room: master_bath
    along: [1.95, 2.60]      # x[1.95, 2.60] 段 = 0.65m；2026-10-09 由 1.20 推至 1.95——门洞 d_mbath 至沿墙 1.95 止，瓷砖不扣洞（DEC-2026-10-09-P11）
    bottom: 0.00
    height: 0.30
    zone: visible
    reason: 主卫南墙东段，非淋浴区

  # ── 客卫 6.45m（北端淋浴 z≈2.30~2.75 贴东墙；南侧 z=3.55~4.30 为开放洗漱区）──
  # 2026-10-07 业主终裁（饰面"带+漆"，前置北墙外窗已定）：淋浴区砖到顶（吊顶完成面 2.65），
  # 马桶区/开放洗漱区 0.30m 砖带 + 上部乳胶漆，台盆后新增 0.77→1.10 防溅带；
  # 北墙窗洞的砖面扣减待量房开窗后按实计。
  - id: walltile_gbath_north_shower
    type: wall_region
    wall: w_balc_south
    room: guest_bath
    along: [0.00, 1.60]      # 1.60m，客卫北墙（2026-10-23 DEC-2026-10-23-R04：东墙线 7.20 后北墙长 1.50→1.60，砖面随墙贴满）
    bottom: 0.00
    height: 2.65
    zone: visible
    reason: 客卫北墙，淋浴区砖到顶（业主 2026-10-07 终裁，吊顶完成面 2.65；北墙窗洞扣减量房后计）
  - id: walltile_gbath_east_shower_kitseg
    type: wall_region
    wall: w_kit_west
    room: guest_bath
    along: [0.00, 0.20]      # z[2.20, 2.40] 段：2026-10-23 DEC-2026-10-23-R04 墙线拉直后该段由 w_kit_west 承载，西脸属客卫淋浴区
    bottom: 0.00
    height: 2.65
    zone: visible
    reason: 客卫东墙最北段（与 w_gbath_east 淋浴段同面连续），淋浴区砖到顶（业主 2026-10-07 终裁）
  - id: walltile_gbath_east_shower
    type: wall_region
    wall: w_gbath_east
    room: guest_bath
    along: [0.00, 0.35]      # z[2.40, 2.75] 段（R04 前为沿旧墙 [0.00,0.55]=z[2.20,2.75]，北段 0.20 已分出 kitseg）
    bottom: 0.00
    height: 2.65
    zone: visible
    reason: 客卫东墙北段，花洒贴此墙挂载，淋浴区砖到顶（业主 2026-10-07 终裁）
  - id: walltile_gbath_east_rest
    type: wall_region
    wall: w_gbath_east
    room: guest_bath
    along: [0.35, 1.15]      # z[2.75, 3.55] 段 = 0.80m（R04 随墙起点南移沿墙坐标 −0.20）
    bottom: 0.00
    height: 0.30
    zone: visible
    reason: 客卫东墙南段（马桶区），0.30m 砖带 + 上部乳胶漆
  - id: walltile_gbath_east_open_vanity
    type: wall_region
    wall: w_gbath_east_open_vanity
    room: guest_bath
    along: [0.00, 0.75]      # 0.75m
    bottom: 0.00
    height: 0.30
    zone: visible
    reason: 客卫东侧开放洗漱区，悬浮台盆柜后 0.30m 防溅带正砖（柜体包络待与 JX YJCC034 实机同图会审，基站 410×433×280mm，柜体底缘 0.30 不动；C18 废止杂砖）
  - id: walltile_gbath_east_vanity_splash
    type: wall_region
    wall: w_gbath_east_open_vanity
    room: guest_bath
    along: [0.00, 0.75]      # 0.75m，与下方柜后杂砖段同沿墙区间、竖向堆叠不重叠
    bottom: 0.77
    height: 1.10
    zone: visible
    reason: 台盆后防溅带（业主 2026-10-07 终裁）：台上盆+壁挂龙头（底座 0.84）溅水面，0.77 台面 → 1.10 镜柜下沿，材质与台面同材或 300×600 正砖
  - id: walltile_gbath_west
    type: wall_region
    wall: w_gbath_west
    room: guest_bath
    along: [0.00, 1.35]      # 1.35m
    bottom: 0.00
    height: 0.30
    zone: visible
    reason: 客卫西墙，非淋浴
  - id: walltile_gbath_west_open_vanity
    type: wall_region
    wall: w_gbath_west_open_vanity
    room: guest_bath
    along: [0.00, 0.75]      # 0.75m
    bottom: 0.00
    height: 0.30
    zone: visible
    reason: 客卫西侧开放洗漱区，可见面走正砖（正对洗漱位侧视墙，无柜体遮蔽；2026-10-07 业主纠错：原 covered 系建档时自东墙柜后段误复制）

  # === 涂漆检视态（墙顶面涂装 PKG-080；与贴砖检视态平级且互不引用）===
  # 独立子系统：inspection-only 叠加层，仅在 HouseScene.setPaintInspectionVisible(true) 时显示，
  # 与 HVAC 协调态 / 管井检视态 / MEP 总览 / 贴砖检视态完全隔离（层标签 'wall-paint'，互不遍历）。
  # room 声明漆面归属房间：平面沿墙法线朝该房间侧外偏移，避免与同墙的贴砖面、或共墙另一侧
  #   涂漆面共面 z-fighting（w_mb_east / w_st_east / w_be_west / w_nw_south / w_mbath_east /
  #   w_ent_west / w_ent_south_w 均为双面涂漆，两个房间各声明一段）。
  # along 自该墙 from 端沿墙累计；height 缺省取墙高；面积 = (along[1]-along[0]) × (height-bottom)。
  # 涂装范围由 house.yaml 的 room.wall_finish='paint' 决定（house.yaml 是房间 Finish 意图源）。
  # 2026-10-08（DEC-2026-10-08-C06）：入户花园出范围——开发商已做好墙面，收房后视情况再定
  # （可能二期），故 house.yaml 给它的 wall_finish 改为 unpainted，本处 4 段声明随之删除，剩 22 段。
  # 声明由 tmp/gen-paint-regions.ts 生成；tests/server/paint-scope.test.ts 用同款几何交叉
  # 算法独立复算，逐房间对账（毛墙面 155.65㎡ / 门洞占位 13.23㎡ / 净墙面 142.42㎡ / 顶面 103.22㎡）。
  # 门洞按实扣除：每段声明的平面在洞口处拆成左条+右条+门楣条，3D 高亮与面积同时变净
  # （shared/paint-scope.ts 是唯一算法源）。窗洞当前为 0——全部 8 樘窗都在 suppress 的
  # 玻璃幕墙/飘窗让路墙上（bay_sill 引用的墙无一在涂装声明里），本就不该计涂装。
  # 顶面涂装只在成本口径里单列（config/paint-comparison.yaml），不在本 3D 层显示。

  # ── 西北次卧 9.40m / 26.32㎡ ──
  - id: paint_bedroom_nw_w_balc_west
    type: paint_region
    wall: w_balc_west
    room: bedroom_nw
    along: [0.10, 1.20]
    height: 2.80
    reason: "西北次卧墙面涂装（w_balc_west，与客卫/阳台共墙）"
  - id: paint_bedroom_nw_w_gbath_west
    type: paint_region

# envelope/finish-surfaces.yaml：面层配方【仅剩踢脚线，过渡文件】（issue #98 第三阶段）。
# 历史：S1 自 config/layout/overlay.yaml 原样搬迁 109 条面层配方；
#      S4（2026-11-07）把其中 85 条下沉为宿主对象特征后解散大半——
#        wall_region 18  → config/layout/model-geometry.yaml 墙条目 finish.tile_bands[]
#        paint_region 31 → 同上 finish.paint_bands[]
#        sill_region 20 + paint_sill_region 8 → config/model/envelope/openings.yaml
#          bay_sill 条目 finish.tile[] / finish.paint[]
#        paint_ceiling_region 8 → config/layout/model-geometry.yaml 房间条目 ceiling_finish
#      本文件只剩 skirting_region 24 条；S5 把它们改为由 paint_bands 派生后本文件退场。
# 合并读取入口：server/overlay-merge.ts parseOverlayFiles()。
elements:
  # ── 踢脚线常显条带（DEC-2026-10-28-R01/R02）──
  # 口径：24 段 = 非卫浴漆面 paint_region 逐段跟随（墙/房间/沿墙区间与漆面声明一致，
  # 两卫漆面段不在此列：卫内墙脚是贴砖到地/0.30m 砖带，DEC-2026-10-28-R01 明确不重复贴）。
  # 高度可调、不要写死：首段 height 定义锚点 &skirting_height，其余段用 *skirting_height 引用；
  # 改高度只改首段锚点值（当前 0.08m = 业主 2026-10-28 定 80mm），不得改渲染代码默认值
  # （代码与 schema 均无高度默认值，读不到合法高度即 fail-closed）。颜色同理用 &skirting_color 锚点，
  # 当前 '#e5e2db' 仅为暖白占位、随墙砖终选走，不等于墙砖 SKU 已锁。门洞处渲染时由
  # splitSegmentByOpenings 实扣断开，声明沿墙区间本身不预扣洞。
  - id: skirt_bedroom_nw_w_balc_west
    type: skirting_region
    wall: w_balc_west
    room: bedroom_nw
    along: [0.10, 1.20]
    bottom: 0
    height: &skirting_height 0.08
    color: &skirting_color '#e5e2db'
    reason: "踢脚线常显条带，跟随 paint_bedroom_nw_w_balc_west 的漆面墙脚（DEC-2026-10-28-R02）；高度由锚点统一，见本节首段注释"

# envelope/finish-defaults.yaml：面层派生默认值（issue #98 第三阶段 S5，2026-11-07）。
#
# 历史：skirting_region 的 24 段声明连同两个 YAML 锚点（&skirting_height 0.08 /
#      &skirting_color '#e5e2db'）在 S1 随 overlay 拆份进 finish-surfaces.yaml；S5 用
#      (wall, room, along) 四元组对全部 paint × skirting 配对证实 24/24 命中、缺的 7 段
#      正是两卫湿区后，删除全部 24 段声明，改由墙特征 finish.paint_bands[] 派生
#      （派生器 shared/skirting-derivation.ts，装配点 server/overlay-merge.ts 的
#      loadOverlayDoc），锚点值落到本文件；原 finish-surfaces.yaml 随之退场（其 85 条
#      其余面层配方已于 S4 下沉为墙/构件/房间特征）。
# DEC 引用登记（issue #98 第三阶段 S6，只登记不改）：本文件 reason/note 含 **3 处 DEC 引用**
# （湿区不生成、80mm 高度、颜色占位三条裁决），与 openings 29 + floor-zones 4 + ceiling 44
# 同属阶段 C「DEC 退役 → intent/evidence」的输入清单（详见 openings.yaml 头注的落点登记）。
skirting:
  # 踢脚带高度（米）。业主 2026-10-28 定 80mm（DEC-2026-10-28-R01）。可调数据只在此改：
  # 渲染代码与 schema 均无默认值，读不到合法高度即 fail-closed（旧声明时代码同款）。
  height: 0.08
  # 踢脚带颜色：'#e5e2db' 暖白占位、随墙砖终选走，不等于墙砖 SKU 已锁（DEC-2026-10-28-R02）。
  # YAML 铁律：值内含 #（十六进制色值）必须加引号，否则 # 后内容整段被吞成注释。
  color: '#e5e2db'
  # 湿区房间不生成踢脚带（DEC-2026-10-28-R01）：卫内墙脚贴砖到地/0.30m 砖带，明确不重复贴。
  # 房间干湿分类唯一源是 config/tile-comparison.yaml 的 wet_room_ids（design-rules.yaml:111
  # 亦指向该表；该文件自声明为 dryRoomIds/wetRoomIds 唯一源、禁止另列房间表）——这里不复制
  # 房间清单，派生时直读；表缺失或取不到即抛错，不静默按「全非湿区」放行。

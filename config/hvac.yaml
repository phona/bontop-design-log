      note: "DEC-2026-10-03-R6：外机定标 20kW，配 6 台内机 21.6kW，连接率 1.08。⚠️外廓 0.99×0.40×0.81m 为 7HP 常见规格 **estimated**，200W 级实测尺寸、平台散热（百叶有效通风面积/进排风净距/检修距离/热短路）与 1.6×1.55m 西平台的适配均 site_pending。**供电制式已由业主 2026-10-04 确认为 220V（DEC-2026-10-04-R1），本条待核项已收窄一项**，参照领航者三代 180W 约 951×383×1333mm。历史：DEC-2026-09-07-055 的 7HP/21.4kW/138% 出局结论保留追溯"
    load_design:
      status: confirmed
      basis: "DEC-2026-10-03-R6（supersedes DEC-2026-10-03-R5）：业主定标美的领航者Ⅳ MJV-200W-E01-LHIV，外机 20kW，6 台内机合计 21.6kW，连接率 1.08。面积口径：客餐厅 living_dining 实际 44.58㎡（polygon 实测；bbox 45.88㎡ 含 1.3㎡ 凹口），不得再写「客厅 45.88㎡ + 餐厅 14㎡」（重复计量）。按气流覆盖拆两个热区：客厅区约 31㎡ → 71 级 7.1kW（229W/㎡）、餐区约 14㎡ → 28 级 2.8kW（200W/㎡），两区合计 9.9kW ÷ 44.58㎡ ≈ 222W/㎡。同小区参考方案（邦泰璟和 110，2026-04-27）口径为「负荷估 230W/㎡、设备选 145W/㎡」，本方案取负荷口径，须经销商冷负荷计算书背书，不得反推为项目设计错误。设计参数（经销商报价单，南宁，GB 50736 口径）：夏季室外干球 34.2℃、湿球 27.5℃、最热月平均相对湿度 82%；室内 24–28℃、相对湿度 40–65%、风速 ≤0.3m/s；冬季室外干球 7℃、最冷月平均相对湿度 75%。6 台内机表：客厅区 MJV-71T2 7.1kW（既有 ac_living，机位 10.30/4.75）、餐区 MJV-28T2 2.8kW（新增 ac_dining，机位 8.00/4.75，藏于既有 ceiling_living 北缘边吊 x[7.20,13.40]×z[4.30,5.20]）、主卧 MJV-45T2 4.5kW（既有门头盒内，须带冷凝提升泵）、父母房 MJV-28T2 2.8kW、儿童房 MJV-22T2 2.2kW、书房 MJV-22T2 2.2kW。状态三段：owner_selected（2026-10-03 业主定标）/ vendor_verification_pending（第二家分项报价、厂家冷负荷计算书、外机平台散热核算、正式配电图、供电制式）/ construction_not_frozen（量房与水电交底前不施工冻结）。降额为方案级估算（无厂家修正曲线作证，待厂家曲线与配管资料核实）：设计工况 34.2℃ 下降额有限；38–40℃ 极端天约 -8~12%；最远内机约 15m 正交 + 2.5m 高差的长配管再打折。不得写成设备确定性能。外机大小主要买「同时满载总量余量」；单间能力上限由该内机额定值决定，但更大外机会改善多房同时运行能力与部分工况效率。外机平台硬门槛：西平台 1.6×1.55m 处于玻璃幕墙体系，须核算百叶有效通风面积、进排风净距、检修距离与热短路；参照领航者三代 180W 外机约 951×383×1333mm，200W 级更大。厨房空调不计入（开门借餐厅冷气+循环扇），新风另案 ‖ **采购成交（DEC-2026-10-04-R1，2026-10-04 定标）**：成交方南宁长旺建材家居市场美的中央空调智慧空气馆长旺家中店，合同附件（第十二条）分项报价——外机 MJV-200W-E01-LHIV 20kW 14,124 元、安装 1,400 元/台×6=8,400 元、**合计 36,000 元（含辅材、含复合风管，风口尺寸见合同附件）**；内机全部改为**双出风内机 MJV-…/P-SS（6 台全带冷凝提升泵）**，型号判读为 71+42+56+28×3=25.3kW（连接率 1.27）——**该容量表为照片判读，房间映射与逐台型号以合同附图为准，核对后回写本 rooms 表**；供电 220V 已确认。与 R6 设计口径（21.6kW/1.08、超薄轻音Pro）的差异：①系列升级为双出风（全带泵、解决直吹，省 3D 面板）②容量表偏大 3.7kW，餐区 56 级 5.6kW 对 14㎡ 餐区约 400 W/㎡、儿童房/书房 28 级对 8.4/8.3㎡ 约 334 W/㎡；**业主 2026-10-04 决定保留现配置**：换机无金钱动机（报价单 56T2 2,131 vs 28T2 2,050–2,493，整包含价）且 56T2 机身 900mm 大于 28T2 的 700mm，换机需重做餐区风管，故不返工；改以三件免费手段管理——交底书面锁定风口位置与百叶沿顶、**餐区设定 26℃（27℃ 会削弱除湿）**、平时只开 71T2 而把 56T2 当聚会模式。选型与商务至此闭环。状态：contract_decided / vendor_verification_pending（外机尺寸与平台散热、合并供电配电图、风口加长是否已含）/ construction_not_frozen"
      indoor_nominal_kw_total: 21.6
      outdoor_nominal_kw: 20.0
      connection_ratio: "1.08（21.6÷20）"
      diversity_note: "DEC-2026-10-03-R6 更新：外机 20kW / 内机 21.6kW / 连接率 1.08。夜间典型开 2-3 卧室约 4.4-8.9kW；全夜四卧同开 11.4kW < 20kW 不超载；白天客餐厅两区同开 9.9kW < 20kW 独立运行无压力。全屋同时峰值估计约 17kW，20kW 外机在常规分区同开下裕度充足；极端六机同时满负荷仍受外机总能力、室外温度与配管修正影响（降额为方案级估算，待厂家曲线）"
      budget_impact: "历史（2026-09，7HP 一拖五全包参考）：美的 2.8-3.4 万、格力 3.2-3.8 万、海尔居中、大金/日立 6 万+（超预算不推荐）、小米 6匹 1.6-2.3 万（连接率不合规仅对照）。**现行预算口径见 schedule/procurement.md（暖通执行池 ¥36,000，2026-10-03 上调；一期上限 ¥206,000）**；本方案目标总价 33,000–37,000 为 R6 期询价目标区间，留档；已成交 36,000（DEC-2026-10-04-R1）"

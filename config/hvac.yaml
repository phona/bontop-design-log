      model: "美的领航者Ⅳ MJV-200W-E01-LHIV（成交配置 DEC-2026-10-04-R1，20kW / 大7匹；领航者Ⅳ系列，区别于三代 MJV-200W-E01-LHⅢ）"
      note: "成交配置 DEC-2026-10-04-R1：20kW 外机配六台双出风内机，额定能力合计 25.3kW，名义连接率 1.265（约 1.27）。⚠️外廓 0.99×0.40×0.81m 为 7HP 常见规格 **estimated**，200W 级实测尺寸、平台散热（百叶有效通风面积/进排风净距/检修距离/热短路）与 1.6×1.00m 西平台（bbox 口径；含 r=1.0 西北圆角后可用约 1.39㎡，依据 model-geometry.yaml platform.boundary + overlay.yaml north_platform_floor）的适配均 site_pending。**供电制式已由业主 2026-10-04 确认为 220V（DEC-2026-10-04-R1），本条待核项已收窄一项**，2026-10-06 业主补图证实三代 MJV-200W-E01-LHⅢ 参数列外形 951×1333×382（原图未标单位）、制冷额定 5.9kW/27A、最大输入 8.56kW/39A；同代际对照仅供识别旧占位外廓不可信，不能证明合同四代 MJV-200W-E01-LHIV 尺寸与配电；原图及去重哈希见 docs/design-iterations/hvac-resix-20261003/evidence/evidence-notes.md。历史：DEC-2026-09-07-055 的 7HP/21.4kW/138% 出局结论保留追溯 ‖ DEC-2026-10-04-R2：外机供电已单独成路（第 20 路 hvac_power_outdoor_a2，C32A+漏保 / 4.0mm²(φ20) proposed，待厂家配电图）；点位 sock_vrf_outdoor_a2 @(7.20,0.50,1.60)（外机本体 @(6.40,0.50)；取电点按预案挂平台东界墙 w_vrv_east 厨房侧脸，落位说明见 config/electrical.yaml）；输入功率估 ≈6kW（20kW 制冷量 / 估 EER≈3.5）；实际接线（专用插座 vs 硬接线）与平台防水/开孔待厂家图与物业核定。⚠️ 外廓 0.99×0.40×0.81m 仍为 estimated；其 0.81m 高与业主补图所列三代 200W 的 1.333m 参考高度相差 0.523m。旧占位值无厂家依据，不能据此判定合同四代机型能否容纳；须厂家提供 LHIV 对应外形、安装净距与平台通风图。"
    load_design:
      status: confirmed
      basis: "DEC-2026-10-03-R6 为设计负荷与室内机分级依据；原设计机型合计 21.6kW 不代表成交设备额定值。面积口径：客餐厅 living_dining 实际 44.58㎡（polygon 实测；bbox 45.88㎡ 含 1.3㎡ 凹口）。按气流覆盖拆两个热区：客厅区约 31㎡，设计负荷估算 7.1kW（229W/㎡）；餐区约 14㎡，设计负荷估算 2.8kW（200W/㎡）；两区设计负荷估算合计 9.9kW ÷ 44.58㎡ ≈ 222W/㎡。同小区参考方案（邦泰璟和 110，2026-04-27）口径为「负荷估 230W/㎡、设备选 145W/㎡」；分房间冷负荷计算书仍待经销商提供，不把估算当作已核算负荷。设计参数（经销商报价单，南宁，GB 50736 口径）：夏季室外干球 34.2℃、湿球 27.5℃、最热月平均相对湿度 82%；室内 24–28℃、相对湿度 40–65%、风速 ≤0.3m/s；冬季室外干球 7℃、最冷月平均相对湿度 75%。DEC-2026-10-04-R1 成交内机映射（业主确认）：客厅 MJV-71T2/P-SS 7.1kW（ac_living）；餐厅 MJV-42T2/P-SS 4.2kW（ac_dining）；主卧 MJV-56T2/P-SS 5.6kW（ac_master，中心 x=3.70）；书房、儿童房、客房各 MJV-28T2/P-SS 2.8kW（ac_parent/ac_child/ac_study；2026-10-05 功能互换后房间功能名，机位/型号不变）。六台均为双出风并带冷凝提升泵。成交内机额定能力合计 25.3kW，外机名义额定制冷量 20.0kW，连接率 25.3÷20.0=1.265（约 1.27）。下方每房 load_kw 与 basis 保留原设计估算口径，和成交设备型号/额定能力分开记录。原有平面机位和风口均为方案协调信息；成交容量变化后的机位、风口、吊顶净空、冷媒与冷凝水路径，待量房和厂家深化后复核，不作为施工冻结图。降额、组合运行能力及长配管修正须以厂家曲线与配管资料核实，不将方案估计写成设备性能。外机平台待核：西平台 1.6×1.00m（bbox 口径，含 r=1.0 西北圆角后可用约 1.39㎡），处于玻璃幕墙体系，须核算百叶有效通风面积、进排风净距、检修距离与热短路；三代 200W 参数图已由业主提供并归档（外形 951×1333×382，图未标单位）；它与成交四代 LHIV 型号不同，成交外机实际尺寸、最大电流仍待厂家对应型号资料确认。厨房空调不计入（开门借餐厅冷气+循环扇），新风另案 ‖ **采购成交（DEC-2026-10-04-R1，2026-10-04 定标）**：成交方南宁长旺建材家居市场美的中央空调智慧空气馆长旺家中店，合同附件（第十二条）分项报价——外机 MJV-200W-E01-LHIV 20kW 14,124 元、安装 1,400 元/台×6=8,400 元、**合计 36,000 元（含辅材；不含复合风管与风口加长（加长 100 元/米另计）、不含税）**；风口尺寸见合同附件（回风 1000×300 / 1300×300，出风 750×150 / 1000×150）。房间映射已由业主确认并写入；剩余待核：①外机实测尺寸与西平台散热核算；②厂家多台内机合并供电与外机正式配电图；③风口加长计价与分房间冷负荷计算书。状态：contract_decided / vendor_verification_pending / construction_not_frozen；外机供电已按 GB 55038 7.4.4 单独成路、回路总数 19→20（DEC-2026-10-04-R2）。"
      indoor_nominal_kw_total: 25.3
      outdoor_nominal_kw: 20.0
      connection_ratio: "1.265（25.3÷20；约 1.27）"
      diversity_note: "仅按成交内机铭牌额定值作加总：客厅+餐厅 7.1+4.2=11.3kW；四卧 5.6+2.8×3=14.0kW；六台合计 25.3kW，高于外机名义 20.0kW。前两组加总低于外机名义值不等于实测同时输出保证；同时制冷能力、组合修正与配管降额待厂家性能表及配管资料核实。"
      budget_impact: "历史（2026-09，7HP 一拖五全包参考）：美的 2.8-3.4 万、格力 3.2-3.8 万、海尔居中、大金/日立 6 万+（超预算不推荐）、小米 6匹 1.6-2.3 万（连接率不合规仅对照）。**现行预算口径见 schedule/procurement.md（暖通执行池 ¥36,000，2026-10-03 上调；一期上限 ¥206,000）**；33,000–37,000 为 R6 期历史询价目标区间，仅留档；⚠️ 该 36,000 不含税、不含复合风管与风口加长（加长 100 元/米另计），非最终落地价，证据见 docs/design-iterations/hvac-resix-20261003/evidence/；已成交 36,000（DEC-2026-10-04-R1）"

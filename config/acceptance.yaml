phases:
  - phase: demolition
    name: "拆改验收"
    items:
      - id: check_demo_wall
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-020]
        item: "拆除范围核对"
        method: |
          对照拆墙图，用卷尺量拆除边界。
          重点检查：是否多拆了不该拆的墙，尤其是承重墙。
        standard: "拆除范围与图纸一致，误差 < 5cm"
        severity: critical
        knowledge: |
          怎么判断是不是承重墙：
          1. 看图纸——粗实线标注的墙不能动
          2. 敲一下——承重墙声音沉闷厚实
          3. 看厚度——承重墙一般 > 20cm
          4. 钢筋外露——如果看到钢筋，立刻停止

      - id: check_demo_structure
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-020]
        item: "梁柱状况检查"
        method: "拆完后检查裸露的梁、柱、楼板是否有裂缝或损伤"
        standard: "无结构性裂缝，钢筋无锈蚀"
        severity: critical

  - phase: waterproofing
    name: "防水施工+闭水试验"
    items:
      # DEC-2026-10-22-R02：淋浴区防水高度 1.8m 作废，改 ≥2.00m 且不低于喷淋口高度（GB 55038-2025）；
      # 仅 supersede D1=A 的防水高度部分，贴砖高度口径不变（防水与贴砖自此分开登记）。
      - id: check_wp_base_clean
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-050]
        item: "防水前基层清理检查"
        when: before_waterproofing
        method: |
          1. 防水范围（两卫、厨房、北阳台）地面与墙面基层先清扫、再用工业吸尘器吸净浮灰浮沙，不得只扫一遍；松散水泥、起砂层、油污、脱模剂须铲除或清理干净，裂缝与孔洞先修补。
          2. 管根、阴阳角、门槛、墙地交界、地漏周边重点清理，不得留灰堆、渣子。
          3. 清理后手摸或白手套擦拭无明显浮灰；基层按所用防水产品说明处理湿度，不得带明水、不得带浮灰刷防水。
          4. 清理完成到涂刷防水之间不得再落灰、踩脏；涂刷前复核一次，返灰返脏须重清并重新拍照。
        standard: "基层坚实、无浮灰、无松散层、无油污；管根、阴阳角、门槛、墙地交界清理到位；手摸无明显浮灰；无明水、无积水"
        severity: critical
        rooms: [master_bath, guest_bath, kitchen, balcony]
        evidence:
          - "基层清理后照片（两卫、厨房、北阳台各一套：全景 + 管根、阴阳角、门槛特写）"
          - "清理日期与涂刷日期记录（清理后、涂刷前）"
        knowledge: |
          浮灰是一层隔离层：防水涂料刷在浮灰上等于刷在灰上，粘不牢，闭水当时可能过，贴砖或使用后空鼓、起皮、渗漏，返工须砸砖。
          本条只管防水区基层，不含全屋地面清扫；贴砖前地面清理另由 PKG-060 找平与铺贴工序承接。

      - id: check_wp_coats
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-050]
        item: "涂刷遍数检查"
        method: |
          墙面防水：淋浴区刷到不低于 2.00m、且不低于喷淋口高度，地面满刷。
          每一遍干透后再刷下一遍，至少 2 遍。
        standard: "涂刷均匀，无漏刷、无堆积；淋浴区墙面防水高度 ≥2.00m 且不低于喷淋口高度"
        severity: critical

      - id: check_wp_flood
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-050]
        item: "闭水试验"
        method: |
          1. 堵住所有地漏，放水 3~5cm 深
          2. 标记水位线
          3. 等待 48 小时
          4. 去楼下邻居家看天花板有无渗水
        standard: "48h 后水位无明显下降，楼下无渗水"
        severity: critical
        knowledge: |
          常见坑：
          - 闭水前一定要通知楼下邻居，留联系方式
          - 48h 内不要放水
          - 如果发现渗水，补刷后重新做 48h 闭水

      - id: check_wp_dry_gate
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-050]
        item: "闭水前干透门禁 + 淋浴区防水宽度 + 楼下复查"
        when: before_covering
        method: |
          1. 防水刷完先干透再闭水：常温通风至少 24-48 小时，阴雨天和冬天延长到 48-72 小时，手摸干爽不粘手才算干透；未干透就放水属于无效测试，不得闭水。
          2. 淋浴区防水宽度：从花洒往两边各扩 80cm，不得只做 1 米宽；宽度未做足，闭水合格也不算该项通过。
          3. 闭水后去楼下看对应天花无渗水、无湿痕，并留照片；楼下复查未做，不得进入下一工序。
        standard: "防水干透（手摸干爽不粘手）；淋浴区从花洒往两边各扩 80cm；楼下天花无渗水、无湿痕"
        severity: critical
        rooms: [master_bath, guest_bath]
        evidence:
          - "防水干透确认记录（刷完日期与闭水日期）"
          - "淋浴区防水宽度照片（花洒两边各扩 80cm 可辨）"
          - "楼下天花无渗漏照片"
        knowledge: |
          本条只管干透、宽度、楼下复查三道门，不锁定闭水蓄水时长与蓄水深度档位；闭水时长与深度档位待 D5 拍板，不得用本条擅自改写 check_wp_flood 的既有口径。

      # === DEC-2026-10-06-R1 施工范围收口：A5/A6 给排水硬要求落成可验收项 ===
      # 新增字段口径（本轮统一，供交底单/照片逐条打勾）：
      #   when       验收时点；单值或列表，取值：before_covering（封墙/回填/封板前）/
      #              before_waterproofing（防水层施工前）/ at_delivery（设备或柜体安装后复核）
      #   evidence   必须留存的照片/记录清单，缺一项即不得进入下一工序
      #   standard_ref 该条依据的 DEC 全引或规范条款（可多条）
      # DEC-2026-10-22-R02 拆分：本条只管排水通畅性（找坡/通球）与回填材料；沉箱蓄水（防水层完整性）
      # 单独立条 check_plumb_master_bath_box_flood，两类测试分开记录、分开留证。
      - id: check_plumb_master_bath_secondary_drain
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-050]
        item: "主卫沉箱二次排水 DN50（最低处）+ 1% 找坡 + 轻质回填 + 回填前通球"
        when: before_covering
        method: |
          1. 同层排水沉箱内最低处设 DN50 二次排水口，与马桶排污口、地漏支管各自独立，不得并入地漏或马桶排污。
          2. 沉箱底向二次排水口找坡 1%：泼水试验水应全部流向二次排水口，不得积在角落。
          3. 回填前做通球试验（球能顺利通过支管进入立管）。
          4. 回填只用轻质材料（陶粒/泡沫混凝土等），严禁建筑垃圾、砖渣回填。
          5. 坡度/通球/回填材料三类工序证据齐了、且沉箱蓄水试验（下条）通过后才能回填；回填后本项不得补做。
        standard: "二次排水口在沉箱最低处；坡度 ≥1%；通球顺畅；轻质回填、无建渣"
        severity: critical
        rooms: [master_bath]
        evidence:
          - "泼水找坡照片（含二次排水口位置）"
          - "通球过程照片"
          - "回填材料照片（可见轻质材料）"
        standard_ref:
          - "DEC-2026-10-06-R1"
          - "DEC-2026-10-22-R02"
          - "GB 50242"
        knowledge: |
          同层排水沉箱回填并贴砖后，二次排水失效只能打凿返工；建渣回填还会压坏管道与防水层。

      # DEC-2026-10-23-R03（PR #17 评审 P2）：蓄水试验补「封堵二次排水口 → 试后拆堵恢复 → 注水复核畅通」三步；
      # 主卫存量同缺口随本批一并修，与客卫保持对等。
      - id: check_plumb_master_bath_box_flood
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-050]
        item: "主卫沉箱蓄水试验（回填前 24h）"
        when: before_covering
        method: |
          1. 蓄水前先封堵沉箱内全部排水口——含二次排水口、地漏支管口与马桶排污预留口，逐口查封堵严密；二次排水口不封堵，蓄水会经二次排水支管流失，试验无效。
          2. 向沉箱注水做 24h 蓄水试验，标记起始水位线。
          3. 24h 后查水位无明显下降，并到楼下看对应天花无渗漏、无湿痕。
          4. 试后放水，拆除全部封堵、恢复二次排水口，向二次排水口注水复核其畅通（顺畅流入、无返溢）；封堵未拆净或复核不畅通，不得回填。
          5. 不合格先查漏整改，复验重新计时；记录追加，不覆盖前次结果。
          本条与上一条的通球/找坡（排水通畅性）分开记录、分开留证，不得互相替代。
        standard: "蓄水 24h 水位无明显下降；楼下天花无渗漏、无湿痕；试后封堵全拆、二次排水口恢复畅通"
        severity: critical
        rooms: [master_bath]
        evidence:
          - "封堵口全景/逐口照片（二次排水口、地漏支管口、马桶排污预留口全部封堵口可见）"
          - "起始水位线照片"
          - "24h 水位线照片"
          - "楼下天花无渗漏照片"
          - "试后拆堵恢复与二次排水畅通复核照片"
        standard_ref:
          - "DEC-2026-10-23-R03"
          - "DEC-2026-10-22-R02"
          - "GB 55030"
        knowledge: |
          蓄水验的是沉箱底防水层完整性，通球验的是排水通畅性；两类测试混在一条记录里，任一项不合格都说不清是哪类问题。二次排水口是本试验的封堵对象、也是试后必须恢复复核的对象：漏封则试验无效，漏拆则二次排水等于没做。

      # DEC-2026-10-23-R03：客卫沉箱二次排水与主卫对等落地（业主确认有沉箱、开发商未设、须自做，
      # DEC-2026-10-22-R02 裁定④冻结解除）。与主卫同口径拆分：本条只管找坡/通球/回填材料，
      # 蓄水单独立条 check_plumb_guest_bath_box_flood，两类测试分开记录、分开留证。
      - id: check_plumb_guest_bath_secondary_drain
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-050]
        item: "客卫沉箱二次排水 DN50（最低处）+ 1% 找坡 + 轻质回填 + 回填前通球"
        when: before_covering
        method: |
          1. 同层排水沉箱内最低处设 DN50 二次排水口，与马桶排污口、地漏支管各自独立，不得并入地漏或马桶排污。
          2. 沉箱底向二次排水口找坡 1%：泼水试验水应全部流向二次排水口，不得积在角落。
          3. 回填前做通球试验（球能顺利通过支管进入立管）。
          4. 回填只用轻质材料（陶粒/泡沫混凝土等），严禁建筑垃圾、砖渣回填。
          5. 坡度/通球/回填材料三类工序证据齐了、且沉箱蓄水试验（下条）通过后才能回填；回填后本项不得补做。
        standard: "二次排水口在沉箱最低处；坡度 ≥1%；通球顺畅；轻质回填、无建渣"
        severity: critical
        rooms: [guest_bath]
        evidence:
          - "泼水找坡照片（含二次排水口位置）"
          - "通球过程照片"
          - "回填材料照片（可见轻质材料）"
        standard_ref:
          - "DEC-2026-10-23-R03"
          - "DEC-2026-10-06-R1"
          - "GB 50242"
        knowledge: |
          同层排水沉箱回填并贴砖后，二次排水失效只能打凿返工；建渣回填还会压坏管道与防水层。客卫二次排水口位以量房实测定最低点为准（pending #74 剩余项），不得照搬主卫坐标。

      # PR #17 评审 P2：蓄水前封堵二次排水口、试后拆堵恢复并注水复核畅通（与主卫同修）。
      - id: check_plumb_guest_bath_box_flood
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-050]
        item: "客卫沉箱蓄水试验（回填前 24h）"
        when: before_covering
        method: |
          1. 蓄水前先封堵沉箱内全部排水口——含二次排水口、地漏支管口与马桶排污预留口，逐口查封堵严密；二次排水口不封堵，蓄水会经二次排水支管流失，试验无效。
          2. 向沉箱注水做 24h 蓄水试验，标记起始水位线。
          3. 24h 后查水位无明显下降，并到楼下看对应天花无渗漏、无湿痕。
          4. 试后放水，拆除全部封堵、恢复二次排水口，向二次排水口注水复核其畅通（顺畅流入、无返溢）；封堵未拆净或复核不畅通，不得回填。
          5. 不合格先查漏整改，复验重新计时；记录追加，不覆盖前次结果。
          本条与上一条的通球/找坡（排水通畅性）分开记录、分开留证，不得互相替代。
        standard: "蓄水 24h 水位无明显下降；楼下天花无渗漏、无湿痕；试后封堵全拆、二次排水口恢复畅通"
        severity: critical
        rooms: [guest_bath]
        evidence:
          - "封堵口全景/逐口照片（二次排水口、地漏支管口、马桶排污预留口全部封堵口可见）"
          - "起始水位线照片"
          - "24h 水位线照片"
          - "楼下天花无渗漏照片"
          - "试后拆堵恢复与二次排水畅通复核照片"
        standard_ref:
          - "DEC-2026-10-23-R03"
          - "DEC-2026-10-22-R02"
          - "GB 55030"
        knowledge: |
          蓄水验的是沉箱底防水层完整性，通球验的是排水通畅性；两类测试混在一条记录里，任一项不合格都说不清是哪类问题。客卫沉箱底防水为开发商现状（pending #74 未核），蓄水不合格先修底防水再谈二次排水口；二次排水口漏封则试验无效、漏拆则二次排水失效。

      - id: check_covering_gate_secondary_drain
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-050]
        item: "封回填门禁：两卫坡度、通球、回填材料证据齐 + 蓄水通过，缺一不得回填"
        when: before_covering
        method: |
          1. 封回填前逐卫核对三类证据齐了：泼水找坡照片、通球过程照片、回填材料照片；缺一类，不得回填。
          2. 同卫沉箱蓄水试验通过后才能回填；回填后本项不得补做，失效只能打凿返工。
          3. 客卫构造核实（pending #74 剩余项）未完成前，不得照搬主卫坐标施工；本条不改变客卫口位以量房实测定最低点为准的口径。
        standard: "两卫坡度、通球、回填材料三类证据齐；同卫蓄水通过；缺一不得回填"
        severity: critical
        rooms: [master_bath, guest_bath]
        evidence:
          - "两卫封回填前证据清单打勾记录（坡度、通球、回填材料、蓄水四项）"
        knowledge: |
          本条是门禁 linkage，不重复改写主卫、客卫已有的二次排水与蓄水测试项；测试内容以既有项为准，本条只拦“证据不齐就回填”。

      # DEC-2026-10-22-R02：台盆后墙面（洗面器溅水区）防水高度改 ≥1.20m（GB 55038-2025），其余墙面维持 0.3–0.5m。
      - id: check_plumb_external_vanity_waterproof
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-050]
        item: "两处外移位（主卧条带 mb.washbasin_cabinet + 客卫开放洗漱区 gbath.vanity）防水连体 + 柜内防漏水托盘 + 基站柜格溢水报警"
        when: [before_waterproofing, at_delivery]
        method: |
          1. 两处外移位台盆后墙面防水刷到不低于 1.20m 高，其余墙面 0.3–0.5m（含柜体背板与台面以下墙体）；地面做防水挡水坎，与卫内防水连成整体，不得在两套防水之间留施工缝。
          2. 柜内设不锈钢或 PP 防漏水托盘，托盘带导流嘴，把意外溢水导向可见处或排水点，不是让水泡柜底板。
          3. 客卫开放洗漱区下方扫地机基站柜格设溢水报警，探头放在柜底最低处。托盘厚度计入基站上方空高。J65 官方手册证实超薄版尘袋/清洁液在基站**前面板**后取放（无顶部开盖机构），上方空高改按两项验收：① 台盆排水过管走廊（下水器仓内转 90° 向北穿 w_gbath_south，DEC-2026-09-09-R6 + DEC-2026-11-05-R5）；② 整台基站断管后水平前拉检修余量。仓门开启态下基站前面板可完整拆装、整台可前拉——两项未经安装现场预演前本项不得判通过。
          4. 防水施工前先拍挡水坎与泛水收头；柜体与基站安装后复核托盘就位、报警器可触发。
        standard: "两处外移区台盆后墙面防水 ≥1.20m、其余墙面 0.3–0.5m；挡水坎与卫内防水连续无断点；托盘带导流嘴且就位；基站柜格溢水报警可触发；托盘就位后基站上方空高满足排水过管走廊与整台前拉检修（顶余以对象 gbath.vanity 的 vanity_layout 为准，为过管走廊而非开盖净空；前面板取袋口径据 J65 官方手册，2026-11-05）"
        severity: critical
        rooms: [master_bath, guest_bath]
        evidence:
          - "防水施工前的挡水坎与泛水收头照片（两处各一套）"
          - "柜内防漏水托盘就位照片（导流嘴可辨）"
          - "基站柜格溢水报警探头位置与触发测试照片"
          - "基站前面板拆装操作空间照片（仓门开启态）"
          - "整台基站断管后水平前拉路径照片（安装现场预演）"
        standard_ref:
          - "DEC-2026-10-06-R1"
          - "DEC-2026-10-03-R1"
          - "DEC-2026-10-22-R02"
          - "GB 55038"

      # DEC-2026-10-22-R02 新增：饰面层第二次闭水。第一次闭水（防水层后 check_wp_flood，PKG-050）验的是
      # 防水层本身；本条验贴砖/美缝/地漏安装之后的饰面层整体，时点在美缝后、洁具安装前，由 PKG-065 挂接放行（DEC-2026-10-22-R03 拆包后自 PKG-130 迁入）。
      - id: check_wp_finish_flood
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-065]
        item: "饰面层闭水试验（美缝后、洁具安装前，两卫分别记录）"
        method: |
          1. 美缝完成且养护满后、洁具安装前进行；主卫、客卫分别堵地漏蓄水并分别记录，不得合并成一条。
          2. 蓄水 3–5cm，标记水位线，等待 48 小时。
          3. 查水位无明显下降，去楼下看对应天花无渗水、无湿痕。
          4. 发现渗漏先定位整改（砖缝、地漏周边、管根优先），整改后重新蓄水 48h 复验，记录追加不覆盖。
        standard: "48h 后水位无明显下降，楼下无渗水"
        severity: critical
        rooms: [master_bath, guest_bath]
        evidence:
          - "蓄水起始水位线照片（两卫各一套）"
          - "48h 水位线照片（两卫各一套）"
          - "楼下天花无渗漏照片（两卫各一套）"
        standard_ref:
          - "DEC-2026-10-22-R02"
          - "GB 55030"
        knowledge: |
          防水层闭水合格不等于饰面层不漏：贴砖、美缝、地漏与玻璃屏安装都可能扰动防水层或在管根留缝；洁具装上后再发现渗漏只能拆装返工。

  - phase: tile_installation
    name: "瓷砖铺贴验收"
    items:
      # 2026-11-11 先定门再贴砖门禁（用户批准；来源：小红书「贤的装修日记」干湿区
      # 两种地砖接缝藏门下视频）：客卫门外开放洗漱区木纹砖与内卫小花砖的分界线
      # 正是门洞墙线 z=3.55（DEC-2026-10-18-TILE-02），主卫门外条带木纹砖与卫内
      # 防滑砖的分界线同样在门洞处；接缝位置由门定，不由瓦工现场定。
      - id: check_tile_door_gate
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-060]
        item: "贴砖前先定门门禁：两卫门洞实测 + 门厚/包套定档 + 干湿接缝落门下，缺一不得贴砖"
        method: |
          1. 量房实测两卫门洞宽、高与墙厚，逐扇登记实测值；不得用模型推断值或候选门标称尺寸施工。客卫模型洞宽 0.70m 与候选卫生间门 2100×800mm 对不上，先核实再定门，不得静默改洞宽或改门宽。
          2. 定门：门扇尺寸、门套形式（单包/双包）、门套厚度与外凸量，由卖门商家书面确认；视频作者的 4cm 双包套与外凸 0.5–1cm 是他家那扇门的数，不得直接抄，本户按实测门套定。
          3. 排版：干湿接缝落在门扇/门套正下方，排版图或现场放样记录须标出接缝与门的位置关系；接缝未落门下，不得贴砖。
        standard: "两卫门洞实测值已登记；门扇尺寸、门套形式与外凸量已书面定档；干湿接缝落门下"
        severity: critical
        # 预演项（2026-11-12 Codex 三审开工就绪缺口修复）：本条是贴砖前置验证，必须在
        # PKG-060 仍被 BLK-DOOR-BEFORE-TILE 阻塞时就能判 passed，否则门禁自身会被
        # 第五道卡点挡住、永远过不了；通过它不放行施工（does_not_release_construction），
        # 开工仍须等阻塞项本身凭证据关闭，readiness 保持 blocked。
        can_run_while_blocked: true
        does_not_release_construction: true
        rooms: [master_bath, guest_bath]
        evidence:
          - "两卫门洞宽、高与墙厚实测记录（逐扇）"
          - "卖门商家书面确认（门扇尺寸、门套形式、门套厚度与外凸量）"
          - "干湿接缝与门位置关系的排版图或现场放样照片"
        knowledge: |
          本条是贴砖前置门禁；门厚、包套形式与外凸量档位待 D20 拍板，拍板前本项不得判 passed。先贴砖再选门只能按砖选门，很被动；接缝一旦贴错位置，门装上也盖不住，只能返工重贴。门安装后的关门复核不在本项，见 check_tile_door_seam_closed（PKG-090 装门阶段）。

      - id: check_tile_hollow
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-060]
        item: "空鼓检查"
        method: "用空鼓锤轻敲每块砖的四角+中心"
        standard: "单片空鼓率 < 15%，整面墙 < 5%"
        severity: critical

      - id: check_tile_gap
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-060]
        item: "缝隙均匀"
        method: "用塞尺测量相邻砖缝"
        standard: "2mm ± 0.5mm"
        severity: major

      - id: check_tile_flatness
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-060]
        item: "平整度"
        method: "2m靠尺贴墙面，测量最大空隙"
        standard: "< 2mm"
        severity: major

      - id: check_tile_slope
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-060]
        item: "坡度检查"
        method: "倒水测试是否流向地漏"
        standard: "不积水"
        severity: critical
        rooms: [master_bath, guest_bath, balcony]

      - id: check_tile_slope_same_day
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-060]
        item: "贴砖当天倒水测坡：半盆水 10 秒内全部流向地漏"
        when: before_covering
        method: |
          1. 贴砖当天倒半盆水，看水是不是顺畅流向地漏，10 秒内全部流向地漏、地面没有明显积水才算通过。
          2. 水积在某一块不走，说明那块地面比地漏高、坡度做反；水流得很慢，说明坡度不够；两种情况都要当天返工重找坡。
          3. 美缝后再发现坡度问题，返工成本翻倍；不得以“等美缝后再看”为由放过当天项。
        standard: "贴砖当天倒半盆水，10 秒内全部流向地漏，地面无明显积水"
        severity: critical
        rooms: [master_bath, guest_bath, balcony]
        evidence:
          - "贴砖当天倒水测坡照片或视频截图（水流向地漏可辨）"
        knowledge: |
          本条是当天返工线，不替代 check_tile_slope 的通用坡度检查；10 秒是重构报告引用的作者经验口径，不是国标条文，档位最终以合同为准。

      # DEC-2026-10-22-R02 新增：美缝前置条件。此前美缝只有包级完工检查、无干燥门槛，
      # 湿缝施工是美缝发黑/脱落的主因；本条挂 PKG-065 与 PKG-130 两包作为各自开工前置（DEC-2026-10-22-R03）。
      - id: check_tile_grout_dry
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-065, PKG-130]
        item: "美缝前砖缝干燥确认"
        method: |
          1. 贴砖完成且粘结层养护期满（按所用粘结材料说明，不早于铺贴后 7 天）后方可确认。
          2. 逐区查砖缝：缝内干燥、无明水、无返潮发暗；卫生间坡度倒水试验后至少晾置 48h 再复查。
          3. 确认后至美缝完成期间，卫生间不得淋水、不得用水冲洗地面；其他区域同此口径。
        standard: "缝内干燥无明水，粘结层养护期满，有确认日期记录"
        severity: major
        evidence:
          - "砖缝干燥近照（两卫各一套）"
          - "铺贴完成日期与确认日期记录"
        standard_ref:
          - "DEC-2026-10-22-R02"

      - id: check_sill_tile
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-060]
        item: "窗台/防水台面砖检查"
        method: "逐个落地窗核对防水台 L 型两段——客厅、主卫、主卧、书房、西北次卧、东南客房的矮台竖面与水平台面是否都贴砖/窗台石、是否出檐收口、打胶是否连续；倒水试验窗框下沿不渗漏"
        standard: "声明范围内的防水台竖面与水平台面全段贴砖或窗台石；出檐/打胶收口连续，窗框下沿倒水不渗。当前卧室/书房估算150×150mm，量房后复核"
        severity: major
        rooms: [living_dining, master_bath, master_bedroom, study, bedroom_nw, bedroom_se]
        evidence:
          - "客厅/主卫/主卧/书房/西北次卧/东南客房落地窗根部防水台竖面与台面铺贴照片"
          - "窗框下沿倒水试验照片"

  - phase: painting
    name: "油漆验收"
    items:
      - id: check_paint_surface
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-080]
        item: "漆膜质量检查"
        method: |
          用侧光（手机手电筒贴墙斜照）检查墙面与顶面。
          看是否有：刷痕、流挂、起泡、颗粒、色差、斑驳。
          顶面加查：开上照灯（漫反射灯）复查一遍，灯光斜射会放大漆面不平。
        standard: "侧光 45° 下无明显瑕疵，颜色均匀；顶面在上照灯开启下无明显斑驳"
        severity: major
        knowledge: |
          为什么顶面要开灯复查：
          - 上照灯（漫反射灯）光线斜射顶面，会放大漆面不平与斑驳，关灯侧光查过也可能漏网
          - 实例：小红书 2026-11-15 笔记《仇人看了也释怀了》（作者七七，6af97261000000002303ce3a）：家具进场、开灯后顶面乳胶漆斑驳才显形

      - id: check_paint_env
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-080]
        item: "施工环境记录"
        method: |
          刷漆时记录室内温湿度。
          低于 5°C 或湿度 > 85% 不宜施工。
        standard: "施工期间温度 ≥ 5°C，湿度 ≤ 85%"
        severity: warning
        knowledge: |
          为什么重要：
          - 低温：漆膜干燥慢，容易流挂
          - 高湿：漆膜发白、起泡
          - 南宁回南天绝对不能刷漆

      - id: check_paint_reserve
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-080]
        item: "留罐记录"
        method: "留半罐调好的漆，用保鲜膜封口盖紧，标注色号和涂刷位置"
        standard: "每个颜色留 0.5L 以上，标注色号+房间"
        severity: info
        knowledge: |
          为什么要留：
          - 入住后磕碰补漆，机器调色和原漆有色差
          - 留原漆最准

  - phase: carpentry
    name: "木工验收（吊顶+柜体）"
    items:
      - id: check_carp_keel
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-070]
        item: "吊顶副龙骨间距"
        method: "测量副龙骨间距，检查吊杆是否牢固"
        standard: "副龙骨间距 ≤400mm，吊杆无松动；以上均为 D9 门禁下的工作数，待 D9 拍板，不是验收线"
        severity: critical
        knowledge: |
          常见偷工：
          - 副龙骨间距过大（应 ≤400mm）→ 石膏板易开裂下坠
          - 吊杆太少或膨胀螺栓没打牢
          副龙骨档位（300mm 还是 400mm）属 D9 待拍板事项；档位未写进合同前本项不得判 passed。

      - id: check_carp_board
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-070]
        item: "石膏板拼接"
        method: "检查板间是否留缝、转角是否整板"
        standard: "板间留 V 型缝，转角用整板（7字角），背板 ≥ 9mm"
        severity: major
        knowledge: |
          为什么留 V 缝：
          - 热胀冷缩需要缝隙缓冲，否则接缝处必裂
          - 转角整板（7字型）比拼接抗裂

      # 2026-11-25 吊顶最佳实践落仓（GB 50210-2018 + 厂家做法 + 施工实操翻坑）：
      # 骨架/板缝/螺钉/圆弧/风口检修口/封板前隐蔽/成品七条，只补吊顶验收，
      # 不动吊顶几何、不动价格、不改现有 check。主龙骨与吊杆档位属 D9 待拍板，
      # check_carp_frame 与 check_carp_concealed 已挂进 D9 blocks，拍板前不得判 passed。
      # 2026-11-25 混合方案最终范围（用户裁定）：蜂窝板覆盖龙脊（主走廊 + 客厅北缘带，1.25m 深）
      # 与四条卧室空调带（主卧假梁、客房北带、儿童房南带、书房北带）；石膏部位只剩餐厅带、门厅、
      # 窗帘盒与晾衣架吊顶（板种待 D15 拍板），其中七项新验收只覆盖餐厅带与门厅，窗帘盒与晾衣架
      # 吊顶仍是石膏 drop，由 check_carp_board / check_carp_keel 覆盖，不在七项适用范围内；
      # 蜂窝板六条 check_honeycomb_panel / _edge / _corner / _joint / _removable / _opening，
      # 只挂 PKG-070（其中 panel/edge/joint/removable/opening 挂 D21，corner 挂 D22）。
      - id: check_carp_frame
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-070]
        item: "吊顶骨架：主龙骨、吊杆、起拱与边龙骨（餐厅带与门厅）"
        when: before_covering
        method: |
          1. 主龙骨间距实测 ≤1200mm，副龙骨间距见 check_carp_keel。
          2. 吊杆间距实测 ≤1200mm，吊杆用 φ8mm 以上镀锌吊杆，必须吃进混凝土结构层，不得固定在轻质砖上；吊杆长度 >1500mm 时设反支撑。
          3. 主龙骨按房间短向跨度 1‰–3‰ 起拱。
          4. 边龙骨沿墙固定，膨胀螺栓打牢；螺栓间距档位未核实（400mm/600mm 两种说法），本条不写数字、不判间距。
        standard: "主龙骨间距 ≤1200mm；吊杆间距 ≤1200mm，φ8mm 以上镀锌吊杆吃进混凝土；主龙骨起拱 1‰–3‰；边龙骨固定牢固（螺栓间距档位未核实，不判数字）。以上间距、φ8 吊杆与起拱均为 D9 门禁下的工作数，待 D9 拍板，不是 GB 50210 验收线"
        severity: critical
        evidence:
          - "骨架间距实测记录（主龙骨、吊杆间距可辨；边龙骨安装照片仅作记录，不判间距）"
          - "吊杆固定点照片（吃进混凝土可辨）"
        standard_ref:
          - "D9 门禁下的工作数（decision-gates.yaml D9），不是 GB 50210 验收线"
        knowledge: |
          适用范围：本条覆盖餐厅带与门厅；窗帘盒与晾衣架吊顶仍是石膏 drop，不在蜂窝五条适用范围内，本条不覆盖（仍由 check_carp_board / check_carp_keel 覆盖）；龙脊与四条卧室空调带走铝蜂窝板，龙骨按蜂窝板厂家系统验收，不适用本条，见 check_honeycomb_panel。
          主龙骨 1000mm 还是 1200mm、吊杆与端头距离、φ8 吊杆规格与起拱 1‰–3‰，属 D9 待拍板事项；档位待 D9 拍板，拍板前本项不得判 passed，档位写进合同后才升级为判据。1200mm 仅见于算量规范区间 800–1200mm，不是验收线；φ8 吊杆与起拱 1‰–3‰ 同为 D9 门禁下的工作数。吊杆端头距离档位同属 D9，本条不写死数字。
          边龙骨间距有 400mm 与 600mm 两种说法，未核实，本条不写间距数字、不判该数字；档位确认后以合同为准。
          副龙骨间距（300mm 还是 400mm）同属 D9，见 check_carp_keel，不在本条重复定档。

      - id: check_carp_joint
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-070]
        item: "石膏板板缝与接缝处理（餐厅带与门厅）"
        method: |
          1. 板缝留 3–5mm，板边开 V 型槽（深约板厚 2/3），填弹性嵌缝膏，再贴 ≥50mm 接缝带（牛皮纸带或网格带）；不许硬拼、不许只抹腻子。
          2. 错缝安装，禁十字通缝；若双层板，上下层接缝错开 ≥300mm（300mm 未核实，施工指南参考值，以合同/厂家为准）。
          3. 转角处用整板裁 L 型套割，每边从转角起延伸 ≥300mm（300mm 未核实，施工指南参考值，以合同/厂家为准），转角处不许有接缝。
        standard: "板缝 3–5mm，V 型槽深约板厚 2/3，弹性嵌缝膏 + ≥50mm 接缝带；错缝、无十字通缝；转角 L 型整板套割、每边延伸 ≥300mm。以上毫米数未核实原文、可耐福官方安装手册原文未取得，以合同或厂家为准；待 D15 拍板"
        severity: critical
        evidence:
          - "板缝与接缝处理照片（V 型槽、接缝带、转角 L 型整板可辨）"
        standard_ref:
          - "GB 50210-2018"
        knowledge: |
          板缝硬拼或只抹腻子不贴带，接缝处应力无处释放，半年内必裂；转角对接拼缝应力集中，补十遍裂十一遍。
          板材口径（纠正 2026-11-25 简报“绿板全屋用属于超配”的错误说法）：全屋用绿板（耐水石膏板）是常见做法，不算错，价差小；空调带建议用绿板（冷凝风险），其余干区普通板即可，全屋绿板也可以；决定开不开裂的是接缝与龙骨，不是板色。板材档位（耐潮/耐水、9.5mm/12mm）待 D15 拍板，见 check_carp_board。
          分区范围（2026-11-25 用户裁定）：石膏为餐厅带、门厅、窗帘盒与晾衣架吊顶；龙脊与四条卧室空调带走铝蜂窝板。板种（普通/耐潮/耐水）待 D15 拍板：餐厅西带藏冷媒主管，无内机不等于无结露来源，本条不得先下普通板结论。
          适用范围：本条覆盖餐厅带与门厅；窗帘盒与晾衣架吊顶仍是石膏 drop，不在蜂窝五条适用范围内，本条不覆盖（仍由 check_carp_board / check_carp_keel 覆盖）；龙脊与四条卧室空调带走铝蜂窝板，不适用本条。
          可耐福官方安装手册原文未取得，接缝纸带与网格带的厂家取向按行业通用做法写，未得可耐福原文背书。板缝毫米数（3–5mm、V 型槽深约板厚 2/3、≥50mm 接缝带、转角延伸 ≥300mm）未核实原文，待 D15 拍板，拍板前本项不得判 passed。

      - id: check_carp_screw
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-070]
        item: "石膏板自攻螺钉固定（餐厅带与门厅）"
        method: |
          1. 自攻螺钉板边钉距 150–170mm，板中钉距 ≤200mm；距板边纸包边 10–15mm、切割边 15–20mm。
          2. 钉头沉入板面 0.5–1mm 且不破纸面，钉眼做防锈处理；固定顺序从板中间向四周。
        standard: "板边钉距 150–170mm，板中钉距 ≤200mm；钉头沉入板面 0.5–1mm 不破纸面；钉眼防锈。以上钉距、边距与沉入深度未核实原文（GB 50210-2018 第 7.2 节未给钉距），以合同或厂家为准；待 D15 拍板"
        severity: major
        evidence:
          - "螺钉间距与钉头沉入照片（钉距与钉头可辨）"
        standard_ref:
          - "GB 50210-2018"
        knowledge: |
          适用范围：本条覆盖餐厅带与门厅；窗帘盒与晾衣架吊顶仍是石膏 drop，不在蜂窝五条适用范围内，本条不覆盖（仍由 check_carp_board / check_carp_keel 覆盖）；龙脊与四条卧室空调带走铝蜂窝板（卡扣/挂件固定，不打自攻螺钉），不适用本条。
          钉距毫米数（板边 150–170mm、板中 ≤200mm、纸包边 10–15mm、切割边 15–20mm、钉头沉入 0.5–1mm）未核实原文，GB 50210-2018 第 7.2 节不给出这些钉距和沉入深度；待 D15 拍板，拍板前本项不得判 passed。

      - id: check_carp_arc
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-070]
        item: "吊顶圆弧（R150 餐厅带）"
        method: |
          1. 石膏板不得直接硬弯做 R150 圆弧：走背面刻痕板条弯弧，或用柔性石膏板（可弯曲板）；板厚（9.5mm/12mm）待 D15 拍板，刻痕/柔性做法按拍板后的板厚执行。
          2. 弧段龙骨加密，弧线连续无折点；弧面与平面交接处贴防裂带加强。
          3. 弧段先做一段样板，验收圆顺度后再批量做；样板未验收不得批量施工。
        standard: "R150 圆弧用刻痕板条或柔性板，不硬弯标准板；弧段龙骨加密、弧线连续无折点；样板段圆顺度验收通过后才批量做"
        severity: major
        evidence:
          - "圆弧样板段照片（弧线圆顺、无折点可辨）"
          - "弧段龙骨加密照片"
        knowledge: |
          适用范围：只覆盖餐厅带 R150 一圈圆；门厅无圆弧。龙脊东侧两个外露角（ne/se，原 R100）改直角或收边条处理，方案待 D22 拍板，见 check_honeycomb_corner。板厚待 D15 拍板，本条已挂进 D15 blocks，拍板前不得判 passed。注意：模型 ceiling.yaml 上客厅北缘带 corner_radius 0.10 声明尚未同步最终范围，待 D22 拍板后同步，本 PR 不动几何。
          刻痕过深会断板、刻痕间距过大弧面会呈多边形折点；刻痕间距具体毫米数未核实，以现场样板段定，不写死数字。
          柔性板最小半径须按厂家参数核对 R150 是否够，未核实；9.5mm 板干弯最小半径存在冲突说法（厂家表为米级，某 vendor 文称 300mm），以后者存疑处理，未采用。

      - id: check_carp_vent_access
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-070]
        item: "风口与检修口：尺寸、加固与定位（餐厅带与门厅）"
        when: before_covering
        method: |
          1. 先定检修口再排风口：本条只覆盖餐厅带与门厅的风口；石膏部位已无内机，内机检修口见 check_honeycomb_opening；分歧区 branch_dining 的检修口在客厅北缘边吊、属蜂窝板龙脊，由 check_honeycomb_opening 验收，不由本条认领；D10 的 350mm 建议下限不进验收项，由厂家图跟踪。
          2. 本条覆盖的石膏带风口（餐厅带与门厅）开槽四周用木方/欧松板做木基层加固，风口框固定在木基层上；开孔边缘用收边条；开孔避开龙骨；封板前弹线定位、按线开孔。
          3. 出风与回风不短路（仅当餐厅带/门厅设有送回风口时适用）：侧出风 + 下回风，或下出风 + 侧回风；出风避开床头与沙发位直吹；风口不紧贴墙边；风口内侧做保温防结露。
        standard: "餐厅带与门厅风口开槽木基层加固（仅本条覆盖的石膏带风口）、封板前弹线定位；出风回风不短路（仅当设有送回风口时适用）"
        severity: critical
        evidence:
          - "风口与检修口排版图（检修口、风口、灯具、窗帘盒同图）"
          - "风口开槽木基层与弹线定位照片"
        knowledge: |
          与 check_hvac_access_coordination_before_ceiling 的分工：那条管吊顶/空调/定制三方封板前对接定位，本条管检修口尺寸、风口开槽加固与定位；两条都过才算风口检修口闭环。
          石膏部位已无内机：六台内机（龙脊 71T2/42T2、四条卧室带 56T2/28T2×3）全部走蜂窝板，内机检修口与送回风见 check_honeycomb_opening；本条只管餐厅带与门厅的风口与检修口，餐厅带与门厅模型无灯槽，本条不验收灯槽。方法第 3 条送回风不短路仅当餐厅带/门厅设有送回风口时适用。内机机身尺寸与电气盒朝向待厂家图 #39，检修口最终位置按 #39 定。分歧区 branch_dining 的检修口属蜂窝板龙脊，见 check_honeycomb_opening，不由本条认领。
          柜体做到顶的位置不能压住回风口和检修口；风口、检修口、灯具、窗帘盒、到顶柜体须放同一张图核对。

      - id: check_carp_concealed
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-070]
        item: "封板前隐蔽验收：骨架复核与管线留档（餐厅带与门厅）"
        when: before_covering
        method: |
          1. 吊杆间距实测 ≤1200mm，手晃骨架无松动、无异响；龙骨间距已由 check_carp_frame 与 check_carp_keel 覆盖，本条复核吊杆与整体牢固。
          2. 水电管线、空调铜管、冷凝水管、风口定位线已完成并拍照留档；隐蔽影像缺失不得封板。
          3. 转角 L 型整板、风口木基层、检修口位置已按排版图落实。
        standard: "吊杆间距 ≤1200mm、手晃骨架无松动；水电管线/铜管/冷凝水管/风口定位线拍照留档；转角整板、风口木基层、检修口位置按排版图落实"
        severity: critical
        evidence:
          - "封板前骨架复核照片（吊杆间距、手晃检查记录）"
          - "封板前隐蔽影像（水电管线、铜管、冷凝水管、风口定位线各一套）"
        knowledge: |
          适用范围：本条覆盖餐厅带与门厅；窗帘盒与晾衣架吊顶仍是石膏 drop，不在蜂窝五条适用范围内，本条不覆盖（仍由 check_carp_board / check_carp_keel 覆盖）；龙脊与四条卧室空调带封板前隐蔽复核见 check_honeycomb_opening。
          吊杆间距档位属 D9 待拍板事项；档位未写进合同前本项不得判 passed。
          与 SCH-070-01 封板联合验收的分工：本条是吊顶侧封板前复核，空调保压与冷凝水测试另见 PKG-030 相关项；封完看不见，隐蔽验收是最后一次机会。

      - id: check_carp_finish
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-070]
        item: "吊顶成品验收（GB 50210-2018，餐厅带与门厅）"
        method: |
          1. 表面平整度 ≤3mm（2m 靠尺 + 塞尺）。
          2. 接缝直线度 ≤3mm（拉 5m 线，不足 5m 拉通线，钢直尺）。
          3. 接缝高低差 ≤1mm（钢直尺 + 塞尺）。
          4. 目视：无裂缝、无锈点、无波浪起伏；灯具、风口、检修口收口整齐、无下坠晃动。
        standard: "平整度 ≤3mm；接缝直线度 ≤3mm；接缝高低差 ≤1mm；目视无裂缝、无锈点、无波浪起伏，收口整齐"
        severity: major
        evidence:
          - "成品平整度与接缝实测记录（靠尺、塞尺读数可辨）"
        standard_ref:
          - "GB 50210-2018"
        knowledge: |
          适用范围：本条覆盖餐厅带与门厅；窗帘盒与晾衣架吊顶仍是石膏 drop，不在蜂窝五条适用范围内，本条不覆盖（仍由 check_carp_board / check_carp_keel 覆盖）；龙脊与四条卧室空调带蜂窝板成品验收见 check_honeycomb_panel。
          标高允许偏差未核实，未写入本条；吊顶标高档位待量房实测后定，不得用本条擅自定标高线。

      # 2026-11-25 混合方案最终范围（用户裁定）：蜂窝板覆盖龙脊（主走廊 + 客厅北缘带，1.25m 深）
      # 与四条卧室空调带（主卧假梁、客房北带、儿童房南带、书房北带），石膏只剩餐厅带、门厅、
      # 窗帘盒与晾衣架吊顶（板种待 D15 拍板）。
      # 金属板行允许偏差按 GB 50210-2018 表 7.3.10 核对：平整度 2mm、接缝直线度 2mm、
      # 接缝高低差 1mm（2026-11-25 复核原文表，修正原 2.5mm/0.5mm 误写）。
      # 待跟进（模型/算量与蜂窝板验收的对账缺口，本 PR 不静默留白）：
      # ceiling.yaml 上龙脊与四条卧室带仍是 type: drop（客厅北缘带 note 仍写石膏板可视面，
      # corner_radii 仍是 ne/se R100），config/ceiling-material-cost.yaml 的 area_basis 仍是
      # gypsum_board；蜂窝板验收要求铝蜂窝板，模型与算量须另行改到蜂窝板口径后才闭环。
      # 本 PR 不动几何、不动算量，该缺口由量房/深化时跟进；五条蜂窝检查（panel/edge/joint/
      # removable/opening）已挂进 D21 blocks，模型与算量未同步前不得判 passed（待 D21 拍板）；
      # 外露角单列 check_honeycomb_corner，挂 D22。
      - id: check_honeycomb_panel
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-070]
        item: "蜂窝板：板面平整与板缝排版"
        method: |
          1. 安装前复核龙脊与四条卧室带龙骨与吊杆：按蜂窝板厂家系统验收（间距、吊点、调平以厂家手册为准），吊杆吃进混凝土结构层。
          2. 板面平整度 ≤2mm（2m 靠尺 + 塞尺）；接缝直线度 ≤2mm（拉 5m 线，不足 5m 拉通线，钢直尺）；接缝高低差 ≤1mm（钢直尺 + 塞尺）。
          3. 板缝排版：缝宽均匀、横平竖直；非整板布置在次要位置，接缝避开风口、检修口与结构变形缝；目视无波浪、无下坠、无色差、无划伤。
        standard: "板面平整度 ≤2mm；接缝直线度 ≤2mm；接缝高低差 ≤1mm；板缝均匀、排版对齐，无波浪下坠；模型与算量未按蜂窝板方案同步前不得判 passed（待 D21 拍板）"
        severity: major
        evidence:
          - "蜂窝板成品平整度与接缝实测记录（靠尺、塞尺读数可辨）"
          - "板缝排版照片（缝宽均匀、非整板位置可辨）"
        standard_ref:
          - "GB 50210-2018"
        knowledge: |
          金属板行允许偏差按 GB 50210-2018 表 7.3.10 核对：平整度 2mm、接缝直线度 2mm、接缝高低差 1mm；2026-11-25 复核原文表后修正（原 2.5mm/0.5mm 为转引施工方案文的误写，不采用）。
          适用范围：龙脊（主走廊 + 客厅北缘带，1.25m 深）与四条卧室空调带（主卧假梁 4.2×0.5m 藏 56T2、客房北带 2.4×0.6m 带拐角藏 28T2、儿童房南带 3.0×0.6m 藏 28T2、书房北带 3.0×0.9m 藏 28T2）；石膏部位不适用本条。
          蜂窝板龙骨间距与吊杆档位无独立验收数字，按厂家系统手册验收，厂家手册原文未核实。

      - id: check_honeycomb_edge
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-070]
        item: "蜂窝板：切口与风口开孔封边"
        method: |
          1. 板材切割断面封边严密，无裸露蜂窝芯、无毛刺、无崩边；切口封边条与板面同色、粘贴牢固。
          2. 风口、灯孔、检修口开孔边缘加封边/收边条，开孔避开龙骨与吊杆；开孔尺寸按风口与灯具实物复核。
        standard: "切口与开孔边缘封边严密、无裸露蜂窝芯、无毛刺崩边；模型与算量未按蜂窝板方案同步前不得判 passed（待 D21 拍板）"
        severity: major
        evidence:
          - "切口与开孔封边照片（封边严密、芯材不裸露可辨）"
        knowledge: |
          适用范围：龙脊与四条卧室空调带。
          蜂窝板切口不封边会进潮、露芯，风口开孔不收边会积灰、刮手；封边工艺按厂家手册，厂家手册原文未核实。

      # 2026-11-26 第二轮 Grok 审修复：原 check_honeycomb_edge 同时背两个门禁（模型同步 D21
      # 与外露角方案 D22），一验收项不得被两个决策阻塞（shared/decision-gates.ts
      # check_blocked_by_multiple_decisions），故把外露角拆出单独立项；原 edge 只留切口与开孔封边。
      - id: check_honeycomb_corner
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-070]
        item: "蜂窝板：龙脊东侧外露角处理（ne/se，原 R100）"
        method: |
          1. 龙脊东侧两个外露角（ne/se，原 R100 位置）按拍板后的方案处理：直角、收边条，或维持现行 R100；方案待 D22 拍板，拍板前不得放行，不得按任一方案验收。
          2. 方案拍板并写入施工交底后按方案验收；若走收边条，阳角收边条平直严密、无翘曲；若维持现行 R100，按模型 corner_radii ne/se 0.10 验收，模型无需改动。
        standard: "龙脊东侧两个外露角（ne/se，原 R100）处理方案待定（直角、收边条或维持现行 R100），待 D22 拍板；拍板并写入施工交底后才按方案验收，拍板前不得放行"
        severity: major
        evidence:
          - "龙脊东侧外露角处理照片（直角、收边条或现行 R100 按方案完工可辨）"
        knowledge: |
          适用范围：龙脊东侧两个外露角（ne/se，原 R100）。模型 ceiling.yaml 上客厅北缘带 corner_radius 仍是 ne/se 0.10，待 D22 拍板后同步模型。
          直角、收边条与维持现行 R100 三选一，拍板前不得按任一方案验收，也不得以验收文字搁置模型里已有的 R100；维持现行 R100 是合法的拍板结果，拍板后模型 corner_radii 已是该值、无需同步。

      - id: check_honeycomb_joint
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-070]
        item: "蜂窝板与石膏交界收边"
        method: |
          1. 蜂窝板与石膏板交界处用收口条/压条收边，收边条平直、严密、无翘曲、无裂缝。
          2. 两种面材完成面齐平，无明显错台（交界高差验收数未核实，以施工交底为准）；交界处留伸缩缝时按厂家与施工方商定做法封盖，不得留明缝积灰。
          3. 交界收边在石膏批腻子刷漆前完成，收边条不受腻子污染。
        standard: "交界收口条平直严密、无翘曲无裂缝；两种面材完成面齐平、无明显错台；模型与算量未按蜂窝板方案同步前不得判 passed（待 D21 拍板）"
        severity: major
        evidence:
          - "蜂窝板与石膏交界收边照片（收口条平直、完成面齐平可辨）"
        knowledge: |
          适用范围：蜂窝板与相邻石膏吊顶的交界（主要在龙脊与餐厅带、门厅交接处）；交界伸缩做法与高差验收数未核实，按厂家与施工方商定，须写入施工交底。

      - id: check_honeycomb_removable
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-070]
        item: "蜂窝板：可拆卸挂装，不胶粘"
        method: |
          1. 蜂窝板用挂件/卡扣干挂，可单块拆卸，不得胶粘固定；板背与龙骨间不得打胶。
          2. 单块板拆下后能原位复装，复装后平整度与接缝与相邻板一致，无需破坏相邻板。
          3. 拆装演示：验收时现场拆一块板再复装，检查挂件无变形、板边无损伤。
        standard: "挂件/卡扣干挂、可单块拆卸复装；不得胶粘；模型与算量未按蜂窝板方案同步前不得判 passed（待 D21 拍板）"
        severity: major
        evidence:
          - "单块板拆卸复装演示照片（挂件、板边完好可辨）"
        knowledge: |
          适用范围：龙脊与四条卧室空调带。胶粘固定拆不下来，等于丢了蜂窝板可维护的优点；挂装可拆是本次选蜂窝板的理由之一，须写进施工交底。
          检修口即一块可拆板，见 check_honeycomb_opening；本条是挂装方式的验收，那条是检修口位置与开槽的验收。

      - id: check_honeycomb_opening
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-070]
        item: "蜂窝板：检修口与风口开槽"
        when: before_covering
        method: |
          1. 检修口分两种实现：access_dining / access_study / access_child 三处按 hvac.yaml 已有口位 600×600（只许放大不许缩小）各设一块可拆板，不另开固定检修口框（其中 access_child 底口待确认：机身 x=4.4 正处衣柜东缘，若实机压在衣柜上方则底口改侧口或移位，按厂家图 #39 定）；return_living / return_master / return_parent 三处为回检一体（铰接回风格栅兼检修口），不另设面板；可拆板与回风格栅的位置在排版图上标明，拆下/打开后能站在梯子上直接操作电气盒与阀门。分歧区 branch_dining (8.0, 4.3) 的检修口也在本条验收：位置在客厅北缘边吊北缘，分歧器、尺寸与位置待深化、按厂家图 #39 定，施工未冻结；位置在排版图上标明。
          2. 封板前弹线定位、按线开孔；开孔四周加固（木方/欧松板或厂家配套框），风口框固定在加固基层上；开孔避开龙骨与吊杆。
          3. 封板前隐蔽复核：龙脊与四条卧室带龙骨/吊杆间距、手晃骨架，水电管线、空调铜管、冷凝水管、风口定位线拍照留档；隐蔽影像缺失不得封板。
          4. 出风与回风不短路：侧出风 + 下回风，或下出风 + 侧回风；出风避开床头与沙发位直吹；风口不紧贴墙边；风口内侧做保温防结露。
        standard: "检修口按 hvac.yaml 已有口位：三处 600×600（只许放大不许缩小）各一块可拆板实现（其中 access_child 底口待确认：机身 x=4.4 正处衣柜东缘，若实机压在衣柜上方则改侧口或移位，按厂家图 #39 定），三处回检一体不另设面板；分歧区 branch_dining (8.0, 4.3) 检修口待深化、按厂家图 #39 定，由本条验收；风口开槽加固、封板前弹线定位；封板前隐蔽拍照留档；出风回风不短路；模型与算量未按蜂窝板方案同步前不得判 passed（待 D21 拍板）"
        severity: critical
        evidence:
          - "龙脊与卧室带风口与检修口排版图（可拆板位置、风口、灯具同图）"
          - "风口开槽加固与弹线定位照片"
          - "龙脊与卧室带封板前隐蔽影像（龙骨/吊杆、铜管、冷凝水管、风口定位线各一套）"
        knowledge: |
          适用范围：龙脊与四条卧室空调带，共六台内机（71T2/42T2/56T2/28T2×3）；石膏部位的检修口与风口见 check_carp_vent_access。
          可拆板是检修口的实现方式，不推翻 hvac.yaml 已有口位：三处独立检修口（access_dining/access_study/access_child）开口 600×600（只许放大不许缩小），板格小于 600mm 时须拼板或定制大板，不得以板格尺寸缩小检修口；三处回检一体（return_living/return_master/return_parent）不另设面板，铰接回风格栅即检修口；可拆板须与内机电气盒、阀门位置对上，挂装方式见 check_honeycomb_removable。access_child 保留：机身 x=4.4 正处衣柜东缘，若实机压在衣柜上方则底口改侧口或移位，待确认、不静默定案，最终位置按厂家图 #39 定。可拆板的现场拆装演示见 check_honeycomb_removable，本条封板前只验收位置与排版。分歧区 branch_dining (8.0, 4.3) 在客厅北缘边吊北缘、属蜂窝板龙脊，其检修口由本条验收（原 check_carp_vent_access 认领，已改归本条）；分歧器、尺寸与位置待深化、按厂家图 #39 定，施工未冻结。
          北缘带 1.25m 深藏两台内机，可拆板开在带底面会与下出风口抢位置，排版时先定可拆板再排风口；内机机身尺寸与电气盒朝向待厂家图 #39，可拆板最终位置按 #39 定。
          与 check_hvac_access_coordination_before_ceiling 的分工：那条管吊顶/空调/定制三方封板前对接定位，本条管蜂窝板检修口位置、风口开槽加固与定位；两条都过才算风口检修口闭环。
          柜体做到顶的位置不能压住回风口和检修口；风口、检修口、灯具、到顶柜体须放同一张图核对。

      - id: check_carp_cabinet
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-110, PKG-150]
        item: "柜门开关与缝隙"
        method: "逐个柜门开关测试，测门缝均匀度"
        standard: "开关顺畅无异响，门缝均匀 ≤ 2mm，五金阻尼正常"
        severity: major

  - phase: doors_windows_install
    name: "门窗安装验收"
    items:
      - id: check_dw_swing
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-090]
        item: "门开关与门框"
        method: "逐个门开关测试，检查门框灌浆"
        standard: "开关顺畅无异响，门框灌浆密实，合页螺丝全打"
        severity: major

      - id: check_dw_seal
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-090]
        item: "密封胶检查"
        method: "检查门套/窗框密封胶打设"
        standard: "密封胶均匀连续无断点，门吸避开踢脚线"
        severity: major

      # 2026-11-11 先定门再贴砖门禁的后半段（Codex 一审 blocking 拆分）：
      # 关门复核不能留在 PKG-060，否则铺贴包要等装门照片才能通过，而装门包
      # PKG-090 又依赖 PKG-060，形成闭环。本项挂 PKG-090 装门阶段。
      - id: check_tile_door_seam_closed
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-090]
        item: "门安装后关门复核：干湿接缝不可见"
        method: |
          1. 门安装完成后逐卫关门检查：干湿接缝落在门扇/门套正下方，关门后不可见，并留照片。
          2. 复核不通过，返工责任按合同执行，不得以“已贴完”放行；返工涉及重贴时，复核须待重贴后重新做。
        standard: "关门后干湿接缝不可见"
        severity: critical
        rooms: [master_bath, guest_bath]
        evidence:
          - "门安装后关门状态接缝不可见照片（两卫各一套）"
        knowledge: |
          本项是 check_tile_door_gate（PKG-060 贴砖前置门禁）的后半段；接缝位置贴砖前已定，门装上后只复核不重定。档位待 D20 拍板，拍板前本项不得判 passed。

      - id: check_dw_drain
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-100]
        item: "下水通畅"
        method: "各下水口冲水/倒水测试"
        standard: "下水通畅无堵塞、无返水"
        severity: critical

  - phase: plumbing_pressure
    name: "水路打压验收"
    items:
      - id: check_plumb_pressure
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-040]
        item: "水管打压试验"
        method: |
          1. 堵住所有出水口，接打压泵
          2. 加压至 0.8MPa
          3. 保压 30 分钟，观察压力表
        standard: "0.8MPa 保压 30min，压降 ≤ 0.05MPa，接头无渗漏"
        severity: critical
        knowledge: |
          常见坑：
          - 打压前确认所有接头已拧紧
          - 保压期间逐个接头目测有无渗水
          - PPR 管热熔接头是渗漏高发点

      - id: check_plumb_pressure_gate
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-040]
        item: "打压封槽门禁：合同写明档位 + 冷热水串联全屋 + 热熔满 24 小时 + 接头纸巾擦"
        when: before_covering
        method: |
          1. 封槽前先核对合同已写明打压压力与保压时长档位；合同未写明档位，不得封槽。
          2. 冷热水管必须串联，用软管把冷热水管连通、整体加压验收；只打一路、只打厨卫主管道、跳过阳台与备用管路，等于一半管路没验收。
          3. 热熔完满 24 小时再打压；刚熔的接头没完全固化就打压，会损伤熔接层、测不准真实质量。
          4. 保压过程中用纸巾擦一遍所有接头、弯头、阀门、冷热水口，看有没有水印；只看压力表不查接头，不算通过。
        standard: "合同已写明打压档位；冷热水串联全屋加压；热熔满 24 小时；接头纸巾擦无水印"
        severity: critical
        evidence:
          - "合同打压档位页照片或截图"
          - "冷热水串联加压照片"
          - "接头纸巾擦查记录照片"
        knowledge: |
          本条是门禁，不锁定打压档位数值：打压压力与保压时长档位待 D5 拍板，不得用本条擅自改写 check_plumb_pressure 的既有口径；合同档位写明后，验收记录必须与合同档位一致。

      - id: check_plumb_drain
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-040, PKG-100]
        item: "排水坡度与存水弯"
        method: |
          1. 检查排水管坡度、地漏/下水存水弯。
          2. 按 docs/mep-construction-guidance.md 地漏防臭落地方案逐点核对密封类型：湿区淋浴地漏为深水封（双水封核查优先：管下已有存水弯时改用仅机械密封），干区地漏与生活阳台地面泄水地漏为机械自封为主，洗衣机专用墙排不共用地面泄水地漏。
          3. 逐支路核查不得双水封：管下已有存水弯的支路，地漏不得再加深水封。
          4. 干区机械封做干态闭合试验（芯子到货后、贴砖前）：注水排空后检查密封件回位闭合（翻板回位 / 磁吸吸合 / T 型弹簧回位）、无可见缝隙；芯子须可拆洗。
        standard: "排水坡度 ≥ 1%；用水封的点位水封 ≥ 50mm；干区机械封干态闭合；同一支路无双水封；芯子可拆洗"
        severity: critical
        evidence:
          - "逐点密封类型照片（湿区深水封 / 干区机械自封）"
          - "干区机械封干态闭合照片"
          - "芯子可拆洗照片"

      # === DEC-2026-10-06-R1 施工范围收口：入户阀件/软水预留/角阀与硬接 ===
      - id: check_plumb_prefilter_and_prv
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-040]
        item: "入户总阀 DN20 + 可调减压阀 0.25MPa + 反冲洗前置过滤器位（带排污与旁通三通）"
        when: before_covering
        method: |
          1. 给水入户点之后按「总阀 → 减压阀 → 前置过滤器位」顺序安装；总阀通径 DN20 全径，不得缩径。
          2. 减压阀设定 0.25MPa 后锁紧调节螺母，拍照记录表盘读数。
          3. 前置过滤器位带专用排污口与旁通三通：即使本期不装机，三通与排污管也必须埋到位，保证后期可在线拆洗、不必断全屋水。
          4. 卷尺复量阀件间距与柜内/管井检修净空，确认拆芯、换滤芯不必拆相邻设备。
        standard: "DN20 全径总阀；减压阀可调并设定 0.25MPa；前置位有排污与旁通三通，具备在线拆洗条件"
        severity: major
        evidence:
          - "入户阀件安装位全景照片（阀件顺序可辨）"
          - "减压阀设定值表盘照片"
          - "前置位旁通三通与排污口特写照片"
        standard_ref:
          - "DEC-2026-10-06-R1"
          - "GB 50242"
        knowledge: |
          入户水压超压或压力不稳时，角阀软管、龙头阀芯与净水器接头是全屋漏水高发点；
          前置位不留排污与旁通，后期装过滤器只能停水砍管。

      - id: check_plumb_softener_reserved
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-040]
        item: "软水机柜格预留：≥400×500mm + 排污管 + 旁通三通（不装机也埋三通）"
        when: before_covering
        method: |
          1. 在前置过滤器位邻侧留一个 ≥400×500mm（宽×深）的软水机柜格，柜内预埋进出水三通并带旁通三通。
          2. 柜内同时预埋一根排污管，接下水或专用排水点，不得用盆接。
          3. 按"本期不装机也埋到位"验收：后期加装软水机不得破柜、破墙、破台面。
          4. 卷尺复量柜格净空，须扣掉柜门开度、踢脚线、后背板与相邻阀件占用后的净尺寸。
        standard: "柜格净空 ≥400×500mm；旁通三通与排污管预埋到位；后期加装不破坏柜体与墙地面"
        severity: major
        evidence:
          - "柜格净空测量照片（卷尺入镜，含净尺寸读数）"
          - "三通与排污管预埋特写照片"
        standard_ref:
          - "DEC-2026-10-06-R1"

      - id: check_plumb_valve_per_point
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-040]
        item: "每个用水点一只全铜角阀（含洗衣机快接、洗碗机/净水器三通）+ 硬接编织管"
        when: before_covering
        method: |
          1. 按用水点清单逐个核对：每个冷/热出水点配一只全铜角阀，一处不许缺。
          2. 洗衣机位用专用快接角阀；洗碗机、净水器进水用三通角阀；智能马桶位角阀与同柱插座按既定分层口径错开。
          3. 角阀到龙头/设备一律硬接编织管（螺纹加橡胶垫压紧）；严禁普通软管直接插接进水口。
          4. 手扳每处接头检查螺纹扣数，查看编织管端口金属丝未被剪断、管身无折扁。
        standard: "用水点角阀一只不少且为全铜；洗衣机/洗碗机/净水器用对应专用角阀；连接为硬接编织管，无软管直插"
        severity: major
        evidence:
          - "按房间编号的每个用水点角阀特写照片"
          - "编织管接头特写照片（可见压紧螺纹）"
        standard_ref:
          - "DEC-2026-10-06-R1"

  - phase: hvac_installation
    name: "中央空调验收"
    items:
      - id: check_hvac_weld
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-030]
        item: "铜管焊接质量"
        method: "检查焊接处有无氧化、砂眼"
        standard: "充氮焊接，无氧化皮"
        severity: critical

      - id: check_hvac_pipe_size
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-030]
        item: "分歧器至内机铜管管径核对"
        when: before_covering
        method: |
          1. 厂家深化图须列出每台内机（客厅 71T2、餐厅 42T2、主卧 56T2、书房/儿童房/客房 28T2）的气管/液管管径与分歧器型号对应表；无表不得开工。
          2. 安装时按表逐台核对分歧器出口到六台内机的气管、液管外径（卡尺实测或管体标识），与表不符不得焊接。
          3. 分歧器方向按厂家图核对，以厂家要求为准；图未标明方向则本项保持 pending，不得凭管径记录勾过。
        standard: "六台内机气管/液管外径与厂家配管表逐台一致；分歧器方向符合厂家要求"
        severity: critical
        evidence:
          - "厂家配管表照片或截图（每台内机气管/液管管径可辨）"
          - "逐台管径核对记录（气管/液管外径可辨）"
          - "厂家图中分歧器方向要求可辨（以厂家图为准；图未标明方向则本项保持 pending，不得凭管径记录勾过）"
        knowledge: |
          来源：小红书 2026-11-23 09:57 轮新发现（倍莱冷暖《三分产品七分安装，铜管配错损坏压缩机》）：分歧器到内机铜管尺寸配错 → 冷媒流量不足、制热差，久之损坏压缩机。
          合同辅材表已有冷媒铜管 φ6.4×0.8 至 φ28.6×1.00，对象是专用分歧器 FQGBJ-01（docs/design-iterations/hvac-resix-20261003/evidence/evidence-notes.md 辅材一览）。config/mep-hvac-coordination.yaml 里 refrigerant-master、refrigerant-parent、refrigerant-study、refrigerant-child、refrigerant-dining 的 diameter 都是 0.019，refrigerant-trunk 是 0.032。
          二者都不是逐台气管/液管外径的施工冻结值：支路 0.019 是这些支路共用的示意值，不是六台内机逐台气管/液管外径；reason 还写管径待厂家深化（refrigerant-trunk：「管径、分歧、套管待厂家深化」；refrigerant-dining：「分歧器、管径、套管与吊顶净高待深化」；其余支路 reason 写分歧器、套管或接管待深化，未给逐台外径）。hvac.yaml 冷媒支路 reason 仍写「分歧、管径、套管待量房及厂家深化」，那是待深化说明，不是逐台外径。不得把这些数抄进本条验收标准；逐台气管/液管外径与分歧器方向以厂家图为准，图未标明则本项保持 pending。

      - id: check_hvac_pressure_hold
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-030]
        item: "冷媒管氮气保压检漏"
        when: before_covering
        method: |
          1. 按厂家安装手册的保压压力与保压时长，向冷媒管路充氮保压；保压前记录压力表读数与环境温度。
          2. 保压结束复核压力（须按温度修正读数），压降超过厂家允许值或发现泄漏点，不得抽真空，查漏修复后重新保压。
          3. 保压记录须写明起止时间、压力、温度，由安装方、业主、美的厂家代表三方签认。
        standard: "保压压力与时长符合厂家手册；修正后压降在厂家允许范围内，无泄漏"
        severity: critical
        evidence:
          - "保压记录照片（压力表读数、起止时间可辨）"
          - "由安装方、业主、美的厂家代表三方签认的保压记录"
          - "厂家安装手册保压页照片或截图（保压压力、时长、允许压降可辨）"
        knowledge: |
          仓内此前只有抽真空项，保压只存在于水路打压；只抽真空不保压，慢漏查不出，冷媒渐漏致制冷差、压缩机损坏。保压压力与时长数值不写死在仓里，以厂家安装手册为准。

      - id: check_hvac_insulation
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-030]
        item: "冷媒铜管保温"
        when: before_covering
        method: |
          1. 按厂家/合同约定的保温厚度与做法逐段核查：气管、液管分别保温，不得共用一根保温套管。
          2. 接头、弯头、阀门、分歧管处包严，无裸露铜管；保温层无破损、无脱落、无缝隙。
          3. 保温厚度以合同 p2 转录厚度为准（铜管保温膜 φ6.4~19.1mm ≥15mm、φ19.1~31.8mm ≥10mm，转录级，#39 ⑥ 待原件核验），厂家/经销商书面确认有更严要求时从严；无厚度依据不得封板。
        standard: "气管、液管分别保温；接头处包严无裸露；保温层完整无破损；保温厚度符合合同 p2（φ6.4~19.1mm ≥15mm、φ19.1~31.8mm ≥10mm，转录级）"
        severity: major
        evidence:
          - "封板前保温照片（接头、分歧管处可辨）"
          - "保温厚度实测记录或合同 p2 对照记录"
        knowledge: |
          仓内此前无冷媒管保温验收项；冷凝水管保温归空调包 COST-030-02，但冷媒管保温厚度/接头包严无人验。保温不到位会结露滴水进吊顶、冷量损失。

      - id: check_hvac_wall_thickness
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-030]
        item: "冷媒铜管壁厚核对"
        when: before_covering
        method: |
          1. 先按合同 p2 辅材表核对，厂家配管表有更严要求时从严；两者缺一不可、无表不得开工。
          2. 到货与安装时抽查：卡尺实测管端壁厚，或查管材厂家证明/管体标识；低于合同 p2 或厂家要求（取严者）不得使用。
        standard: "各管径壁厚符合合同 p2 辅材表（转录级，#39 ⑥ 待原件核验），厂家配管表有更严要求时从严；管材证明或管体标识可查"
        severity: critical
        evidence:
          - "壁厚抽查记录（管径与壁厚实测值可辨）"
          - "管材厂家证明或管体标识照片"
          - "合同 p2 辅材表对照记录（转录级）"
        knowledge: |
          合同 p2 辅材表已有分管径壁厚 φ6.4×0.8 / φ9.5×0.8 / φ12.7×0.8 / φ15.9×1.00 / φ19.1×1.00 / φ22.2×1.00 / φ25.4×1.00 / φ28.6×1.00，来源 docs/design-iterations/hvac-resix-20261003/evidence/evidence-notes.md 辅材一览表（转录自合同附件 p2，原件 contracts/2026-10-03/QR-2026-10-03-24_中央空调_合同附件p2_20261004.jpg；证据等级为转录级，原件核验待办 #39 ⑥，见 docs/pending-site-data.md）。R410A 高压，薄壁铜管承压不足有爆管、冷媒泄漏风险。

      - id: check_hvac_vacuum
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-140]
        item: "抽真空时间"
        method: "看真空泵运行记录"
        standard: "≥ 15min，保持 -756mmHg"
        severity: critical

      - id: check_hvac_refrigerant_charge
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-140]
        item: "追加冷媒量核对"
        method: |
          1. 厂家深化须列出每路配管长度与追加冷媒量计算表；无表不得充注。
          2. 充注时按表追加并称重记录，追加量与计算表一致；降额按厂家曲线确认；能力核对以经销商分房间冷负荷计算书到手后为准，计算书未到前不得用 7.1/2.8kW 估算判通过。
          3. 充注后开机实测制冷/制热效果，与 check_hvac_cooling 一并验收。
        standard: "追加量与厂家计算表一致（称重记录可查）；超长配管降额经厂家曲线确认"
        severity: critical
        evidence:
          - "追加冷媒计算表与称重记录照片"
          - "开机实测记录"
        knowledge: |
          hvac.yaml 只写“降额、组合运行能力及长配管修正须以厂家曲线与配管资料核实”，仓内此前无验收项核对追加量；追加不对会致制冷制热差、压缩机损坏。追加量数值不写死在仓里，以厂家计算表为准。

      - id: check_hvac_drain
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-030]
        item: "冷凝水排水"
        method: "内机注水测试"
        standard: "排水通畅无积水"
        severity: critical

      - id: check_hvac_condensate_before_ceiling
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-030]
        item: "封板前冷凝水测试：满水或通水 + 关机回流观察 + 接水盘不积水"
        when: before_covering
        method: |
          1. 封板前做冷凝水满水或通水测试：倒水看坡度方向对不对、排气口通不通、倒水后排不排。
          2. 关机静置后观察是否回流、接水盘是否积水；回流或积水，不得封板。
          3. 没过先整改坡度或加装单向阀，再复测；不得先封吊顶、后补冷凝水。
        standard: "倒水顺畅排出；关机静置后不回流；接水盘不积水"
        severity: critical
        evidence:
          - "封板前冷凝水测试照片（倒水与排水可辨）"
          - "关机静置后接水盘照片"

      - id: check_hvac_access_coordination_before_ceiling
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-070]
        item: "封板前三方对接：检修口对准电控盒、回风密封、风口不被遮挡"
        when: before_covering
        method: |
          1. 吊顶、空调、全屋定制三方在封板前对接定位：检修口对准电控盒、能伸头检修，不得被衣柜、灯具、窗帘盒挡住。
          2. 回风口与吊顶之间缝隙要密封，不得留大缝吸吊顶内灰尘；密封后回风口滤网清洗频率要写进交接记录。
          3. 送回风口与吊顶风口对齐、无遮挡；对不齐或被挡住，不得封板。
        standard: "检修口对准电控盒且不被遮挡；回风缝隙密封；风口对齐无遮挡"
        severity: critical
        evidence:
          - "封板前三方对接定位照片（检修口、电控盒、回风口位置可辨）"
        knowledge: |
          书房旧侧口 600x250 已被酒店布局删除，不得套到新布局；本条只管封板前定位门禁，不改变已定书房回风底面铰接格栅兼检修口口径。

      - id: check_hvac_level
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-030]
        item: "内机水平度"
        method: "水平尺测量四角"
        standard: "误差 < 2mm"
        severity: major

      - id: check_hvac_vent
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-140]
        item: "风口尺寸"
        method: "测量风口开孔 vs 内机接口"
        standard: "对齐无缝隙"
        severity: major

      - id: check_hvac_cooling
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-140]
        item: "制冷测试"
        method: "开机 30min 测出风口温度"
        standard: "出风口 6-12°C（与环境温差）"
        severity: critical

      - id: check_hvac_outdoor
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-030, PKG-140]
        item: "外机散热"
        method: "测量外机位通风尺寸"
        standard: "百叶通风面积 ≥ 80%"
        severity: major

      # === DEC-2026-10-06-R1 施工范围收口：两卫浴霸排风出外墙口径 ===
      - id: check_hvac_exhaust_outlet
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-030]
        item: "两卫浴霸排风管出外墙 φ100 防火止回阀，禁接公共烟道与排水立管"
        when: before_covering
        method: |
          1. 两卫浴霸换气模块排风管各自由最短路径出外墙，外墙孔处装 φ100 防火止回阀（带逆止叶片）。
          2. 排风管严禁接入公共烟道与排水立管：接排水立管会返臭串气，接公共烟道会倒灌并与油烟互相串味。
          3. 外墙开孔须留物业/外立面审批记录（孔位、孔径、恢复与配色方案），未取得审批不得开孔。
          4. 管路过墙处套管、坡度向外；软管与阀体连接处抱箍锁紧，不得折扁，不得在内墙折 90° 死弯。
        standard: "两处 φ100 防火止回阀安装到位；无接入公共烟道与排水立管；外墙开孔有审批记录"
        severity: major
        rooms: [master_bath, guest_bath]
        evidence:
          - "排风管路径照片（吊顶内段 + 出墙段）"
          - "外墙防火止回阀安装照片（含外立面）"
          - "物业/外立面审批记录扫描件"
        standard_ref:
          - "DEC-2026-10-06-R1"
          - "DEC-2026-10-05-R3"
        knowledge: |
          换气模块只承担排风，不进公共烟道也不进排水立管；排水立管没有止回，
          接上去等于把下水道气味接进浴室。

  - phase: electrical_check
    name: "电路验收"
    items:
      - id: check_elec_continuity
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-040, PKG-120, PKG-125]
        item: "通断测试"
        method: "用测电笔逐个插座测试"
        standard: "全部通电，零火线正确"
        severity: critical

      - id: check_elec_switch
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-040, PKG-120, PKG-125]
        item: "开关功能"
        method: "逐个开关测试"
        standard: "双控/单控功能正常"
        severity: major

      # === DEC-2026-10-03-R1 新增：从"通断+开关"扩到可施工冻结的安全验收 ===
      - id: check_elec_pe_polarity
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-040]
        item: "PE 接地连续性与相/零/地极性"
        method: |
          1. 用验电插座或万用表逐个点位核对 L/N/PE 极性（左零右火上地）。
          2. 抽查 PE 干线连续性：配电箱 PE 汇流排 → 各插座 PE 端子，应导通。
          3. 重点抽测五处：电视墙高位、厨房台面两个取电区、主卫/客卫智能马桶位、阳台洗烘位。
        standard: "极性全部正确；PE 连续性导通，无断零、无 PE 借用"
        severity: critical
        knowledge: |
          为什么和"通断"分开列：测电笔只能证明有电，无法暴露"零地接反/PE 断线"。
          PE 断线平时不烧电器，但一旦漏电就是外壳带电，是触电致死的主因。
          GB 55038-2025 7.4.5 还要求插座全部采用安全型插座（带保护门）。

      - id: check_elec_insulation
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-040]
        item: "绝缘电阻测试"
        method: |
          1. 断电，拆下灯具/电器负载，兆欧表 500V 档逐回路测 L-L、L-PE、N-PE。
          2. 记录每条回路的读数并贴回路编号。
          3. 发现读数偏低的回路分段排查接头与破损点。
        standard: "各回路绝缘电阻 ≥ 0.5MΩ（潮湿区域不应明显低于此值），记录留档"
        severity: critical
        knowledge: |
          为什么必须做：通断测试无法发现绝缘层破损、接头松动、套管进水。
          这是水电隐蔽工程唯一能在封墙前留下证据的"体质报告"，建议拍照存档。
          暗敷管路内严禁有接头 —— 如果工人中间接的线，全部作废重做。

      - id: check_elec_rcd_30ma
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-040]
        item: "30mA 漏电保护动作测试"
        method: |
          1. 用剩余电流动作测试仪（或漏电保护测试仪）逐回路测试，不只看箱内"试验按钮"。
          2. 记录 IΔn（额定动作电流）与实际动作值/时间。
          3. 逐回路按"该回路任一插座动作、其余回路不受影响"验证选择性与分区。
        standard: "每个电源插座回路动作电流 ≤ 30mA，动作可靠、能正确复位"
        severity: critical
        knowledge: |
          依据 GB 55038-2025 7.4.3-1：电源插座回路均应加设剩余电流动作值 ≤30mA 的保护电器。
          本户 20 条回路里的每一条含 type: socket 的回路都必须有漏保（含冰箱、6 台内机并为 2 路（hvac_power_living / hvac_power_bedrooms）+ 外机专用 hvac_power_outdoor_a2 + 浴霸每卫一路（DEC-2026-10-05-R3 拆出））。
          中央空调若厂家要求硬接线不设漏保，须提供厂家正式配电图，不得口头免除。
          按钮自检只能验机构，验不了动作电流值。

      - id: check_elec_leb
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-040]
        item: "卫生间局部等电位联结"
        method: |
          1. 检查两卫是否设局部等电位端子箱（LEB）。
          2. 抽查联结：花洒、龙头、毛巾架、洗衣机金属外壳、给排水金属件与 LEB 端子用 6mm² 黄绿线联通。
          3. 测导通电阻并拍照。
        standard: "端子箱存在；抽查点全部导通；标识清晰"
        severity: critical
        knowledge: |
          依据 GB 55038-2025 7.4.7：装有固定浴盆或淋浴器的卫生间应设等电位联结作为附加防护。
          这是最容易在装修里被工人整段漏掉的一项，封墙后无法补 —— 必须在水电阶段验。
          等电位线不得与平时提到的"地线"互相替代，两者作用不同、都要做。

      - id: check_elec_splash_socket
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-125]
        item: "卫生间/厨房插座防溅与安全型插座"
        method: "逐点检查两卫与厨房台面插座是否防溅盒、面板是否为安全型（带保护门）插座，目视 + 拍照"
        standard: "两卫与厨房操作面插座全部带防溅盒；全屋插座采用安全型插座"
        severity: major
        rooms: [master_bath, guest_bath, kitchen]
        knowledge: |
          GB 55038-2025 7.4.5：住宅电源插座均应采用安全型插座；卫生间设置的电源插座尚应加设防溅措施。
          本户需重点核对：sock_mbath_toilet / sock_gbath_toilet（智能马桶位）、两个客卫台盆位、客卫毛巾架位、客卫台盆下扫地机基站位。

      - id: check_elec_strong_weak_separation
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-040]
        item: "强弱电分管、间距与管内填充率"
        method: |
          1. 检查强电与弱电（网线/电视线）是否分管敷设，交叉是否成直角。
          2. 检查管内导线总截面不超过管内截面 40%（同回路导线同管）。
          3. 抽查电视墙高位到电视柜的独立穿线管是否单独一管。
        standard: "强弱电分管；平行间距按交底口径执行；填充率 ≤40%"
        severity: major
        knowledge: |
          依据 GB 50303 / GB 50327；线径与填充率口径见 docs/mep-construction-guidance.md §3.1。
          "一根大管什么都塞"是弱电衰减和强电干扰的高发原因；网线一根管单独走最省事。
          暗敷禁止接头；管内不得有超过允许数量的 90° 弯。

      - id: check_elec_panel_labeling
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-040]
        item: "配电箱标识、进线开关与安装高度"
        method: |
          1. 开箱核对箱内每条断路器与回路标签一一对应，贴回路图（须含中央空调外机专用回路）。
          2. 确认有能同时断开相线和中性线、具隔离功能的进线开关，以及短路/过负荷保护。
          3. 复量箱体安装高度与单/双排布置。
          4. 核对进线铜芯截面。
        standard: "标签与图纸一致；有进线开关与保护；单排布置底边 ≥1.80m、双排 ≥1.60m；进线 ≥10mm² 铜芯（本户 20 路，含中央空调外机专用回路）"
        severity: major
        knowledge: |
          GB 55038-2025 7.4.3：家居配电箱应设同时断开相线与中性线且具隔离功能的进线开关；电源插座回路均加 ≤30mA 保护；
          单排箱底边距地 ≥1.80m、双排 ≥1.60m；进出线用铜导体、电源进线截面 ≥10mm²。
          本户 20 路（含中央空调外机专用回路）对 390mm 箱体需双排；若现场为单排箱，须换箱或上移箱体，否则位数与安装高度均不达标。

      - id: check_elec_point_reachability
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-125]
        item: "点位可及性抽检（防设备/柜体封死）"
        method: "模拟日常：插拔智能马桶、冰箱、油烟机、洗衣机、烘干机插座，确认不必挪动机器或拆柜体即可操作"
        standard: "上述点位全部可徒手插拔，或已有明确检修口/检修位"
        severity: major
        knowledge: |
          本户这 5 类点位在家具/设备落位后容易被封死：
          主卫/客卫智能马桶位（与给水同柱）、冰箱专用回路旧点位（原东墙高柜内；DEC-2026-10-14 3D trial 已将冰箱候选移到客餐厅，旧点位不代表新机已接通）、
          油烟机位（灶台上方）、洗烘位（阳台仅 1.60×1.20m，叠放后插座在机器体内）。
          封墙前把"怎么拿出来"问清楚，比入住后拆柜子便宜得多。

      - id: check_elec_circuit_separation
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-040]
        item: "分路合规核对（GB 55038 7.4.4）"
        method: |
          按配电箱回路标签逐条核对五类回路是否分别设置：照明 / 空调电源插座 / 电热水器等 2kW 及以上
          用电设备 / 厨房内电源插座 / 其他功能用房电源插座。本户 20 路重点核对：中央空调外机专用回路
          （hvac_power_outdoor_a2）是否单独成路、洗碗机/冰洗/卫浴是否各自独立、厨房与客餐厅/卧室是否
          未跨类混接、以及每条回路标签是否与 config/electrical-topology.yaml 一致。
        standard: "五类回路分别设置、无跨类混接；回路标签与 config/electrical-topology.yaml（20 路）一致"
        severity: major
        knowledge: |
          为什么单列：此前该项目只靠拓扑配置和箱体标签间接覆盖分路合规，验收单上抓不到"分错误路"。
          GB 55038-2025 7.4.4 是类型级分别设置（不要求每房每灯独立），合并合法但类别不能混。

      - id: check_elec_gas_alarm
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-040]
        item: "燃气报警器位置与联动切断"
        method: |
          1. 复量探测器安装高度与水平位置。
          2. 联动测试：触发报警，确认紧急切断阀动作。
          3. 与燃气公司验收记录比对。
        standard: "天然气近顶安装（顶棚或距顶棚 ≤0.3m）；距灶具与排风口 >0.5m；不在灶具正上方；联动切断可靠"
        severity: major
        rooms: [kitchen]
        knowledge: |
          依据 CJJ/T 146-2011：探测器距灶具及排风口水平距离均应 >0.5m；使用天然气等密度小于 1 的燃气时，
          探测器应设在顶棚或距顶棚 <0.3m 的墙上（液化石油气相反，应贴地 ≤0.3m）。
          本户最终点位以燃气公司报警器 + 切断阀方案为准，电气只负责提前布好合规电源。

      # === DEC-2026-10-06-R2 施工范围收口：全盒零线 / LEB 联结清单 / 微蒸烤可插拔 / 内机检修断电位 ===
      - id: check_elec_zero_line_all_switches
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-040]
        item: "全盒零线：每个开关底盒 3 根 1.5mm²（L/N/灯控）"
        when: before_covering
        method: |
          1. 封槽前逐个开关底盒开盖核线：全屋每一个开关底盒内穿 3 根 1.5mm²（L / N / 灯控），缺零线的底盒当场补穿，不得封墙后再说。
          2. 筒灯、灯带、浴霸线控面板同样留零线（线控面板从 N 取电，不借用灯具线）。
          3. 万用表复测：盒内 N 与同回路 N 导通，L-N 间不短路，并核对线色与线径。
          4. 按 DEC-2026-10-06-R2 登记的开关/面板点位清单逐点勾选，漏一处即不合格。
        standard: "全部开关底盒与灯控面板含零线；零线导通、无借用、无短路"
        severity: major
        evidence:
          - "逐个底盒开盖照片（可见 3 根线）"
          - "万用表导通/不短路读数照片"
          - "开关与面板点位清单逐点勾选记录（水电交底单）"
        standard_ref:
          - "DEC-2026-10-06-R2"
        knowledge: |
          单火智能开关在 LED 灯/起夜灯负载下"鬼火微亮"近乎必然；预埋零线成本接近 0，
          封墙后补穿等于把电全部重做一次。

      - id: check_elec_leb_bonding_list
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-040]
        item: "两卫 LEB 端子箱 + BV-6mm² 黄绿联结干线 + 待联结金属构件清单（防水层施工前完成）"
        when: before_waterproofing
        method: |
          1. 两卫各设局部等电位端子箱（LEB），位置避开柜门开启区与贴砖完成面，位置口径见 原量房台账 #43（已退场，未决项现由对象 blocker 承载）。
          2. 联结干线用 BV-6mm² 黄绿线；逐件联结用 BVR-2.5~4mm² 沿墙脚暗敷，联结点去漆压接。
          3. 按清单逐件核：给水管角阀与软管金属段、金属地漏篦子与排水口、花洒金属杆与软管、龙头、毛巾架、浴霸金属外壳、金属镜柜。
          4. 入户给水管/燃气管若为金属材质，须与接地装置联结（GB 55038-2025 7.4.7）。
          5. 全部联结与导通测试在防水层施工前完成并拍照；封墙、贴砖后不得补埋。
        standard: "端子箱存在；清单内金属构件全部联结；导通合格；防水层施工前完成并有工序交接照片"
        severity: critical
        rooms: [master_bath, guest_bath]
        evidence:
          - "LEB 端子箱位置照片（两卫各一张）"
          - "联结干线沿墙脚敷设照片"
          - "清单内每一类金属构件的联结点特写"
          - "导通测试读数记录"
          - "防水施工前后工序交接照片"
        standard_ref:
          - "GB 55038-2025 7.4.7"
          - "DEC-2026-10-06-R1"
        knowledge: |
          既有 check_elec_leb 只验"端子箱存在 + 抽查导通"；本项把口径扩到"清单逐件 + 防水前完成"。
          等电位联结属隐蔽工程，防水层一上就无法补埋，是水电阶段最容易被整段漏掉的一项。

      - id: check_elec_micro_oven_reserved
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-110]
        item: "微蒸烤预留点位 sock_kitchen_oven 落位必须在柜外/开放格可徒手插拔处"
        when: [before_covering, at_delivery]
        method: |
          1. 预留点位随橱柜 600 宽高柜段冻结落位：点位落在柜外壁或开放格内，禁止藏在机器背后（机身贴背板时，背装插座等于永久封死）。
          2. 按微蒸烤嵌入口径（深向 595 级）做插拔演练：站在柜门前能捏住插头并完成插拔，不必移机、不必拆层板。
          3. 预留回路与底盒位置在水电交底单上与橱柜冻结排版图叠合核对；设备到货安装后再复核一次插拔可及性。
        standard: "预留点位在柜外或开放格；不拆柜、不移机可徒手插拔；与橱柜冻结排版图一致"
        severity: major
        rooms: [kitchen]
        evidence:
          - "预留点位与橱柜排版图叠合照片"
          - "徒手插拔演练照片（封槽前模拟 + 设备到货后复核）"
        standard_ref:
          - "DEC-2026-10-06-R2"
          - "DEC-2026-10-05-R4"
        knowledge: |
          DEC-2026-10-06-R2 明确微蒸烤"只做预留接口、不落设备锚点"，position_status 随橱柜冻结落位；
          预留位一旦错到机器背后，后期只能拆柜或加排插。

      - id: check_elec_ac_service_access
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-030]
        item: "六台内机供电硬接线或下引带盖 86 盒（回风检修格栅旁）+ 检修断电位"
        when: before_covering
        method: |
          1. 六台内机供电改为硬接线，或从接线位下引至吊顶完成面以下 0.3–0.5m，装带盖 86 盒。
          2. 86 盒紧邻回风检修格栅，不得在吊顶空腔内盲插，不得被出风口、灯带或柜体遮挡。
          3. 每台内机就近设检修断电位（与 86 盒同区或与线控面板同侧），断电后能从格栅处伸手触及。
          4. 吊顶封板前逐台拍照，记录盒位与回风格栅的相对位置；逐台回路编号写入配电箱回路标签。
        standard: "六台内机无吊顶空腔内盲插；86 盒在完成面下 0.3–0.5m 且带盖；每台有可及的检修断电位"
        severity: major
        rooms: [living_dining, master_bedroom, study, bedroom_nw, bedroom_se]
        evidence:
          - "每台内机供电 86 盒与回风格栅相对位置照片（逐台六张）"
          - "检修断电位照片"
          - "配电箱回路标签与点位对照照片"
        standard_ref:
          - "DEC-2026-10-06-R3"
          - "DEC-2026-10-04-R2"
        knowledge: |
          吊顶封板后，盲插位等于报废：要么拆板，要么从别处拉明线。
          内机供电分组本身按厂家配电图定（合并或逐台），不影响本项——本项只验"接电点可及"。


  - phase: occupancy
    name: "入住前检测"
    items:
      - id: check_occ_formaldehyde
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-170]
        item: "甲醛检测"
        method: |
          建议找 CMA 资质机构上门检测。
          检测前封闭门窗 12 小时（关闭新风）。
          每个房间设一个检测点（中央位置，离地 1m）。
        standard: "甲醛 < 0.08mg/m³（国标 GB/T 18883）"
        severity: critical
        knowledge: |
          什么时候测：
          - 完工后夏季通风 1~2 个月
          - 冬季可能需要 3~6 个月
          - 有小孩/老人建议更严格标准 < 0.05mg/m³
          - 通风是最有效的方法，活性炭/绿植辅助

  - phase: developer_window_handover
    name: "开发商窗交房验收（只验开发商已封好的窗，不涉及用户自己买窗）"
    items:
      - id: check_window_paper_per_window
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-000]
        item: "每扇窗纸片法：A4 纸夹缝关窗后抽，抽不动过、很容易抽出来不过"
        method: |
          1. 每扇窗逐扇做：把 A4 纸夹在窗扇与框的缝里，关窗锁紧后抽纸。
          2. 抽不动为过；很容易抽出来为不过，记下哪扇窗、哪个边不过。
          3. 手感冷风、纸巾飘动、关窗听风声、夜里看缝隙透光只能作辅助感觉，不能单独判过或不过。
        standard: "每扇窗 A4 纸夹缝关窗后抽不动；很容易抽出来者记为不过并书面报修"
        severity: major
        evidence:
          - "每扇窗纸片法照片（纸夹缝位置可辨）"
          - "不过的窗扇与边位清单"

      - id: check_window_gasket_sealant
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-000]
        item: "胶条与密封胶：胶条整根连续无断开卷边脱落发硬，框墙缝与框接缝密封胶打满连续无断点开裂"
        method: |
          1. 目视加手摸逐扇查胶条：整根连续、无断开、无卷边、无脱落、无发硬。
          2. 查框墙缝与框接缝密封胶：打满、连续、无断点、无开裂；发泡胶填满。
          3. 推玻璃不晃、开关顺畅、锁点顺畅扣合；锁点没压紧、胶条老化、合页轻微松动是漏风先查的三点，先清灰再慢关窗，手柄明显变紧不要硬掰。
        standard: "胶条整根连续无断开卷边脱落发硬；密封胶打满连续无断点开裂；推玻璃不晃、开关与锁点顺畅"
        severity: major
        evidence:
          - "胶条与密封胶特写照片（断点、卷边、开裂处可辨）"
          - "推玻璃与开关锁点检查记录"

      - id: check_window_drain_hole
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-000]
        item: "排水孔：室内轨道倒少量水看排水孔是否顺畅排出、不往室内漫"
        method: |
          1. 只在室内轨道倒少量水，看排水孔是否顺畅排出、不往室内漫。
          2. 不往窗外倒水，不探身窗外。
        standard: "室内轨道少量水经排水孔顺畅排出，不往室内漫"
        severity: major
        evidence:
          - "排水孔排水照片（轨道水位与排水口可辨）"

      - id: check_window_lowe_doc
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-000]
        item: "Low-E 验收：看纸 + 打火机法 + 外观密封 + 安装"
        method: |
          1. 看纸：型号、厚度、中空层、单双银、U 值、SHGC 与检测报告、钢化 3C 对得上；型号、单双银、膜面位置、检测报告等细节未核实前不得记为已证实。
          2. 打火机法：4 个倒影中异色者为膜面；南方第 2 个对，第 1、第 4 个为膜外露错；打火机须远离窗帘等易燃物。
          3. 外观密封与安装：外观无破损、密封完好、安装牢固。
        standard: "纸面参数与检测报告、钢化 3C 对得上；膜面在第 2 面；外观密封与安装无缺陷"
        severity: major
        evidence:
          - "Low-E 检测报告与钢化 3C 照片"
          - "打火机法倒影照片（异色倒影位置可辨）"

      - id: check_window_rain_recheck
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-000]
        item: "雨后复查：雨天绕窗看渗漏、水渍"
        method: |
          1. 雨后绕每扇窗看渗漏、水渍，记下哪扇窗、哪个部位。
          2. 有渗漏先拍照留证，再走书面报修，不自行探身窗外补胶。
        standard: "雨后每扇窗无渗漏、无水渍；有渗漏者拍照留证并书面报修"
        severity: major
        evidence:
          - "雨后绕窗复查照片（渗漏与水渍部位可辨）"

      - id: check_window_external_issue_report
        # 对象集（issue #191）= 引用本条的工作包 targets 并集；from_packages 记录派生来源，
        # config/facts.yaml 的 c.acceptance_objects 契约断言它与工作包的 acceptance_refs 一致。
        objects:
          from_packages: [PKG-000]
        item: "外侧问题书面报开发商或物业，不探身窗外"
        method: |
          1. 外侧项（外侧防水胶打满、隔热条标记等）只作记录，不得探身窗外补胶、不得往窗外倒水。
          2. 外侧问题书面报开发商或物业，留书面回复；口头承诺不算证据。
          3. 隔热条 PA66GF25 标记只作单篇记录，不能当所有窗通用要求。
        standard: "外侧问题均有书面报修记录与书面回复；无探身窗外作业"
        severity: major
        evidence:
          - "外侧问题书面报修单与书面回复"
        knowledge: |
          本阶段只验开发商已封好的全屋窗，不涉及用户自己买窗；京品、富轩等比价款不作本户采购依据。

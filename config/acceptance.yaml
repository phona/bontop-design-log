phases:
  - phase: demolition
    name: "拆改验收"
    items:
      - id: check_demo_wall
        item: "拆除范围核对"
        method: |
          对照拆墙图，用卷尺量拆除边界。
          重点检查：是否多拆了不该拆的墙，尤其是承重墙。
        standard: "拆除范围与图纸一致，误差 < 5cm"
        severity: critical
        knowledge: |
          怎么判断是不是承重墙：
          1. 看图纸——粗实线标注的墙不能动
          2. 敲一下——承重墙声音沉闷厚实
          3. 看厚度——承重墙一般 > 20cm
          4. 钢筋外露——如果看到钢筋，立刻停止

      - id: check_demo_structure
        item: "梁柱状况检查"
        method: "拆完后检查裸露的梁、柱、楼板是否有裂缝或损伤"
        standard: "无结构性裂缝，钢筋无锈蚀"
        severity: critical

  - phase: waterproofing
    name: "防水施工+闭水试验"
    items:
      - id: check_wp_coats
        item: "涂刷遍数检查"
        method: |
          墙面刷到 1.8m 高（淋浴区），地面满刷。
          每一遍干透后再刷下一遍，至少 2 遍。
        standard: "涂刷均匀，无漏刷、无堆积"
        severity: critical

      - id: check_wp_flood
        item: "闭水试验"
        method: |
          1. 堵住所有地漏，放水 3~5cm 深
          2. 标记水位线
          3. 等待 48 小时
          4. 去楼下邻居家看天花板有无渗水
        standard: "48h 后水位无明显下降，楼下无渗水"
        severity: critical
        knowledge: |
          常见坑：
          - 闭水前一定要通知楼下邻居，留联系方式
          - 48h 内不要放水
          - 如果发现渗水，补刷后重新做 48h 闭水

      # === DEC-2026-10-06-R1 施工范围收口：A5/A6 给排水硬要求落成可验收项 ===
      # 新增字段口径（本轮统一，供交底单/照片逐条打勾）：
      #   when       验收时点；单值或列表，取值：before_covering（封墙/回填/封板前）/
      #              before_waterproofing（防水层施工前）/ at_delivery（设备或柜体安装后复核）
      #   evidence   必须留存的照片/记录清单，缺一项即不得进入下一工序
      #   standard_ref 该条依据的 DEC 全引或规范条款（可多条）
      - id: check_plumb_master_bath_secondary_drain
        item: "主卫沉箱二次排水 DN50（最低处）+ 1% 找坡 + 轻质回填 + 回填前通球与 24h 闭水"
        when: before_covering
        method: |
          1. 同层排水沉箱内最低处设 DN50 二次排水口，与马桶排污口、地漏支管各自独立，不得并入地漏或马桶排污。
          2. 沉箱底向二次排水口找坡 1%：泼水试验水应全部流向二次排水口，不得积在角落。
          3. 回填只用轻质材料（陶粒/泡沫混凝土等），严禁建筑垃圾、砖渣回填。
          4. 回填前做通球试验（球能顺利通过支管进入立管），并向二次排水口注水做 24h 闭水，同时到楼下看天花。
          5. 坡度/通球/闭水水位/回填材料四类工序证据齐了才能回填；回填后本项不得补做。
        standard: "二次排水口在沉箱最低处；坡度 ≥1%；通球顺畅；24h 闭水无渗漏（含楼下天花无湿痕）；轻质回填、无建渣"
        severity: critical
        rooms: [master_bath]
        evidence:
          - "泼水找坡照片（含二次排水口位置）"
          - "通球过程照片"
          - "24h 闭水水位线照片"
          - "楼下天花无渗漏照片"
          - "回填材料照片（可见轻质材料）"
        standard_ref:
          - "DEC-2026-10-06-R1"
          - "GB 50242"
        knowledge: |
          同层排水沉箱回填并贴砖后，二次排水失效只能打凿返工；建渣回填还会压坏管道与防水层。

      - id: check_plumb_external_vanity_waterproof
        item: "两处外移位（主卧条带 + 客卫开放洗漱区）防水连体 + 柜内防漏水托盘 + 基站柜格溢水报警"
        when: [before_waterproofing, at_delivery]
        method: |
          1. 两处外移位墙面防水刷到 0.3–0.5m 高（含柜体背板与台面以下墙体）；地面做防水挡水坎，与卫内防水连成整体，不得在两套防水之间留施工缝。
          2. 柜内设不锈钢或 PP 防漏水托盘，托盘带导流嘴，把意外溢水导向可见处或排水点，不是让水泡柜底板。
          3. 客卫开放洗漱区下方扫地机基站柜格设溢水报警，探头放在柜底最低处。
          4. 防水施工前先拍挡水坎与泛水收头；柜体与基站安装后复核托盘就位、报警器可触发。
        standard: "两处外移区墙面防水 0.3–0.5m；挡水坎与卫内防水连续无断点；托盘带导流嘴且就位；基站柜格溢水报警可触发"
        severity: critical
        rooms: [master_bath, guest_bath]
        evidence:
          - "防水施工前的挡水坎与泛水收头照片（两处各一套）"
          - "柜内防漏水托盘就位照片（导流嘴可辨）"
          - "基站柜格溢水报警探头位置与触发测试照片"
        standard_ref:
          - "DEC-2026-10-06-R1"
          - "DEC-2026-10-03-R1"

  - phase: tile_installation
    name: "瓷砖铺贴验收"
    items:
      - id: check_tile_hollow
        item: "空鼓检查"
        method: "用空鼓锤轻敲每块砖的四角+中心"
        standard: "单片空鼓率 < 15%，整面墙 < 5%"
        severity: critical

      - id: check_tile_gap
        item: "缝隙均匀"
        method: "用塞尺测量相邻砖缝"
        standard: "2mm ± 0.5mm"
        severity: major

      - id: check_tile_flatness
        item: "平整度"
        method: "2m靠尺贴墙面，测量最大空隙"
        standard: "< 2mm"
        severity: major

      - id: check_tile_slope
        item: "坡度检查"
        method: "倒水测试是否流向地漏"
        standard: "不积水"
        severity: critical
        rooms: [master_bath, guest_bath, balcony]

      - id: check_sill_tile
        item: "窗台/防水台面砖检查"
        method: "逐个落地窗核对防水台 L 型两段——矮台竖面与水平台面是否都贴砖/窗台石、是否出檐收口、打胶是否连续；倒水试验窗框下沿不渗漏"
        standard: "防水台竖面与水平台面全段贴砖或窗台石，出檐/打胶收口连续，窗框下沿倒水不渗"
        severity: major
        rooms: [living_dining]
        evidence:
          - "客厅落地幕墙根部防水台竖面与台面铺贴照片"
          - "窗框下沿倒水试验照片"

  - phase: painting
    name: "油漆验收"
    items:
      - id: check_paint_surface
        item: "漆膜质量检查"
        method: |
          用侧光（手机手电筒贴墙斜照）检查墙面。
          看是否有：刷痕、流挂、起泡、颗粒、色差。
        standard: "侧光 45° 下无明显瑕疵，颜色均匀"
        severity: major

      - id: check_paint_env
        item: "施工环境记录"
        method: |
          刷漆时记录室内温湿度。
          低于 5°C 或湿度 > 85% 不宜施工。
        standard: "施工期间温度 ≥ 5°C，湿度 ≤ 85%"
        severity: warning
        knowledge: |
          为什么重要：
          - 低温：漆膜干燥慢，容易流挂
          - 高湿：漆膜发白、起泡
          - 南宁回南天绝对不能刷漆

      - id: check_paint_reserve
        item: "留罐记录"
        method: "留半罐调好的漆，用保鲜膜封口盖紧，标注色号和涂刷位置"
        standard: "每个颜色留 0.5L 以上，标注色号+房间"
        severity: info
        knowledge: |
          为什么要留：
          - 入住后磕碰补漆，机器调色和原漆有色差
          - 留原漆最准

  - phase: carpentry
    name: "木工验收（吊顶+柜体）"
    items:
      - id: check_carp_keel
        item: "吊顶龙骨间距"
        method: "测量主龙骨间距，检查吊杆是否牢固"
        standard: "龙骨间距 ≤ 400mm，吊杆无松动"
        severity: critical
        knowledge: |
          常见偷工：
          - 龙骨间距过大（应 ≤400mm）→ 石膏板易开裂下坠
          - 吊杆太少或膨胀螺栓没打牢

      - id: check_carp_board
        item: "石膏板拼接"
        method: "检查板间是否留缝、转角是否整板"
        standard: "板间留 V 型缝，转角用整板（7字角），背板 ≥ 9mm"
        severity: major
        knowledge: |
          为什么留 V 缝：
          - 热胀冷缩需要缝隙缓冲，否则接缝处必裂
          - 转角整板（7字型）比拼接抗裂

      - id: check_carp_cabinet
        item: "柜门开关与缝隙"
        method: "逐个柜门开关测试，测门缝均匀度"
        standard: "开关顺畅无异响，门缝均匀 ≤ 2mm，五金阻尼正常"
        severity: major

  - phase: doors_windows_install
    name: "门窗安装验收"
    items:
      - id: check_dw_swing
        item: "门开关与门框"
        method: "逐个门开关测试，检查门框灌浆"
        standard: "开关顺畅无异响，门框灌浆密实，合页螺丝全打"
        severity: major

      - id: check_dw_seal
        item: "密封胶检查"
        method: "检查门套/窗框密封胶打设"
        standard: "密封胶均匀连续无断点，门吸避开踢脚线"
        severity: major

      - id: check_dw_drain
        item: "下水通畅"
        method: "各下水口冲水/倒水测试"
        standard: "下水通畅无堵塞、无返水"
        severity: critical

  - phase: plumbing_pressure
    name: "水路打压验收"
    items:
      - id: check_plumb_pressure
        item: "水管打压试验"
        method: |
          1. 堵住所有出水口，接打压泵
          2. 加压至 0.8MPa
          3. 保压 30 分钟，观察压力表
        standard: "0.8MPa 保压 30min，压降 ≤ 0.05MPa，接头无渗漏"
        severity: critical
        knowledge: |
          常见坑：
          - 打压前确认所有接头已拧紧
          - 保压期间逐个接头目测有无渗水
          - PPR 管热熔接头是渗漏高发点

      - id: check_plumb_drain
        item: "排水坡度与存水弯"
        method: "检查排水管坡度、地漏/下水存水弯"
        standard: "排水坡度 ≥ 1%，地漏/下水有存水弯防臭"
        severity: critical

      # === DEC-2026-10-06-R1 施工范围收口：入户阀件/软水预留/角阀与硬接 ===
      - id: check_plumb_prefilter_and_prv
        item: "入户总阀 DN20 + 可调减压阀 0.25MPa + 反冲洗前置过滤器位（带排污与旁通三通）"
        when: before_covering
        method: |
          1. 给水入户点之后按「总阀 → 减压阀 → 前置过滤器位」顺序安装；总阀通径 DN20 全径，不得缩径。
          2. 减压阀设定 0.25MPa 后锁紧调节螺母，拍照记录表盘读数。
          3. 前置过滤器位带专用排污口与旁通三通：即使本期不装机，三通与排污管也必须埋到位，保证后期可在线拆洗、不必断全屋水。
          4. 卷尺复量阀件间距与柜内/管井检修净空，确认拆芯、换滤芯不必拆相邻设备。
        standard: "DN20 全径总阀；减压阀可调并设定 0.25MPa；前置位有排污与旁通三通，具备在线拆洗条件"
        severity: major
        evidence:
          - "入户阀件安装位全景照片（阀件顺序可辨）"
          - "减压阀设定值表盘照片"
          - "前置位旁通三通与排污口特写照片"
        standard_ref:
          - "DEC-2026-10-06-R1"
          - "GB 50242"
        knowledge: |
          入户水压超压或压力不稳时，角阀软管、龙头阀芯与净水器接头是全屋漏水高发点；
          前置位不留排污与旁通，后期装过滤器只能停水砍管。

      - id: check_plumb_softener_reserved
        item: "软水机柜格预留：≥400×500mm + 排污管 + 旁通三通（不装机也埋三通）"
        when: before_covering
        method: |
          1. 在前置过滤器位邻侧留一个 ≥400×500mm（宽×深）的软水机柜格，柜内预埋进出水三通并带旁通三通。
          2. 柜内同时预埋一根排污管，接下水或专用排水点，不得用盆接。
          3. 按"本期不装机也埋到位"验收：后期加装软水机不得破柜、破墙、破台面。
          4. 卷尺复量柜格净空，须扣掉柜门开度、踢脚线、后背板与相邻阀件占用后的净尺寸。
        standard: "柜格净空 ≥400×500mm；旁通三通与排污管预埋到位；后期加装不破坏柜体与墙地面"
        severity: major
        evidence:
          - "柜格净空测量照片（卷尺入镜，含净尺寸读数）"
          - "三通与排污管预埋特写照片"
        standard_ref:
          - "DEC-2026-10-06-R1"

      - id: check_plumb_valve_per_point
        item: "每个用水点一只全铜角阀（含洗衣机快接、洗碗机/净水器三通）+ 硬接编织管"
        when: before_covering
        method: |
          1. 按用水点清单逐个核对：每个冷/热出水点配一只全铜角阀，一处不许缺。
          2. 洗衣机位用专用快接角阀；洗碗机、净水器进水用三通角阀；智能马桶位角阀与同柱插座按既定分层口径错开。
          3. 角阀到龙头/设备一律硬接编织管（螺纹加橡胶垫压紧）；严禁普通软管直接插接进水口。
          4. 手扳每处接头检查螺纹扣数，查看编织管端口金属丝未被剪断、管身无折扁。
        standard: "用水点角阀一只不少且为全铜；洗衣机/洗碗机/净水器用对应专用角阀；连接为硬接编织管，无软管直插"
        severity: major
        evidence:
          - "按房间编号的每个用水点角阀特写照片"
          - "编织管接头特写照片（可见压紧螺纹）"
        standard_ref:
          - "DEC-2026-10-06-R1"

  - phase: hvac_installation
    name: "中央空调验收"
    items:
      - id: check_hvac_weld
        item: "铜管焊接质量"
        method: "检查焊接处有无氧化、砂眼"
        standard: "充氮焊接，无氧化皮"
        severity: critical

      - id: check_hvac_vacuum
        item: "抽真空时间"
        method: "看真空泵运行记录"
        standard: "≥ 15min，保持 -756mmHg"
        severity: critical

      - id: check_hvac_drain
        item: "冷凝水排水"
        method: "内机注水测试"
        standard: "排水通畅无积水"
        severity: critical

      - id: check_hvac_level
        item: "内机水平度"
        method: "水平尺测量四角"
        standard: "误差 < 2mm"
        severity: major

      - id: check_hvac_vent
        item: "风口尺寸"
        method: "测量风口开孔 vs 内机接口"
        standard: "对齐无缝隙"
        severity: major

      - id: check_hvac_cooling
        item: "制冷测试"
        method: "开机 30min 测出风口温度"
        standard: "出风口 6-12°C（与环境温差）"
        severity: critical

      - id: check_hvac_outdoor
        item: "外机散热"
        method: "测量外机位通风尺寸"
        standard: "百叶通风面积 ≥ 80%"
        severity: major

      # === DEC-2026-10-06-R1 施工范围收口：两卫浴霸排风出外墙口径 ===
      - id: check_hvac_exhaust_outlet
        item: "两卫浴霸排风管出外墙 φ100 防火止回阀，禁接公共烟道与排水立管"
        when: before_covering
        method: |
          1. 两卫浴霸换气模块排风管各自由最短路径出外墙，外墙孔处装 φ100 防火止回阀（带逆止叶片）。
          2. 排风管严禁接入公共烟道与排水立管：接排水立管会返臭串气，接公共烟道会倒灌并与油烟互相串味。
          3. 外墙开孔须留物业/外立面审批记录（孔位、孔径、恢复与配色方案），未取得审批不得开孔。
          4. 管路过墙处套管、坡度向外；软管与阀体连接处抱箍锁紧，不得折扁，不得在内墙折 90° 死弯。
        standard: "两处 φ100 防火止回阀安装到位；无接入公共烟道与排水立管；外墙开孔有审批记录"
        severity: major
        rooms: [master_bath, guest_bath]
        evidence:
          - "排风管路径照片（吊顶内段 + 出墙段）"
          - "外墙防火止回阀安装照片（含外立面）"
          - "物业/外立面审批记录扫描件"
        standard_ref:
          - "DEC-2026-10-06-R1"
          - "DEC-2026-10-05-R3"
        knowledge: |
          换气模块只承担排风，不进公共烟道也不进排水立管；排水立管没有止回，
          接上去等于把下水道气味接进浴室。

  - phase: electrical_check
    name: "电路验收"
    items:
      - id: check_elec_continuity
        item: "通断测试"
        method: "用测电笔逐个插座测试"
        standard: "全部通电，零火线正确"
        severity: critical

      - id: check_elec_switch
        item: "开关功能"
        method: "逐个开关测试"
        standard: "双控/单控功能正常"
        severity: major

      # === DEC-2026-10-03-R1 新增：从"通断+开关"扩到可施工冻结的安全验收 ===
      - id: check_elec_pe_polarity
        item: "PE 接地连续性与相/零/地极性"
        method: |
          1. 用验电插座或万用表逐个点位核对 L/N/PE 极性（左零右火上地）。
          2. 抽查 PE 干线连续性：配电箱 PE 汇流排 → 各插座 PE 端子，应导通。
          3. 重点抽测五处：电视墙高位、厨房台面两个取电区、主卫/客卫智能马桶位、阳台洗烘位。
        standard: "极性全部正确；PE 连续性导通，无断零、无 PE 借用"
        severity: critical
        knowledge: |
          为什么和"通断"分开列：测电笔只能证明有电，无法暴露"零地接反/PE 断线"。
          PE 断线平时不烧电器，但一旦漏电就是外壳带电，是触电致死的主因。
          GB 55038-2025 7.4.5 还要求插座全部采用安全型插座（带保护门）。

      - id: check_elec_insulation
        item: "绝缘电阻测试"
        method: |
          1. 断电，拆下灯具/电器负载，兆欧表 500V 档逐回路测 L-L、L-PE、N-PE。
          2. 记录每条回路的读数并贴回路编号。
          3. 发现读数偏低的回路分段排查接头与破损点。
        standard: "各回路绝缘电阻 ≥ 0.5MΩ（潮湿区域不应明显低于此值），记录留档"
        severity: critical
        knowledge: |
          为什么必须做：通断测试无法发现绝缘层破损、接头松动、套管进水。
          这是水电隐蔽工程唯一能在封墙前留下证据的"体质报告"，建议拍照存档。
          暗敷管路内严禁有接头 —— 如果工人中间接的线，全部作废重做。

      - id: check_elec_rcd_30ma
        item: "30mA 漏电保护动作测试"
        method: |
          1. 用剩余电流动作测试仪（或漏电保护测试仪）逐回路测试，不只看箱内"试验按钮"。
          2. 记录 IΔn（额定动作电流）与实际动作值/时间。
          3. 逐回路按"该回路任一插座动作、其余回路不受影响"验证选择性与分区。
        standard: "每个电源插座回路动作电流 ≤ 30mA，动作可靠、能正确复位"
        severity: critical
        knowledge: |
          依据 GB 55038-2025 7.4.3-1：电源插座回路均应加设剩余电流动作值 ≤30mA 的保护电器。
          本户 21 条回路里的每一条含 type: socket 的回路都必须有漏保（含冰箱、6 台内机并为 2 路（hvac_power_living / hvac_power_bedrooms）+ 外机专用 hvac_power_outdoor_a2 + 浴霸每卫一路（DEC-2026-10-05-R3 拆出））。
          中央空调若厂家要求硬接线不设漏保，须提供厂家正式配电图，不得口头免除。
          按钮自检只能验机构，验不了动作电流值。

      - id: check_elec_leb
        item: "卫生间局部等电位联结"
        method: |
          1. 检查两卫是否设局部等电位端子箱（LEB）。
          2. 抽查联结：花洒、龙头、毛巾架、洗衣机金属外壳、给排水金属件与 LEB 端子用 6mm² 黄绿线联通。
          3. 测导通电阻并拍照。
        standard: "端子箱存在；抽查点全部导通；标识清晰"
        severity: critical
        knowledge: |
          依据 GB 55038-2025 7.4.7：装有固定浴盆或淋浴器的卫生间应设等电位联结作为附加防护。
          这是最容易在装修里被工人整段漏掉的一项，封墙后无法补 —— 必须在水电阶段验。
          等电位线不得与平时提到的"地线"互相替代，两者作用不同、都要做。

      - id: check_elec_splash_socket
        item: "卫生间/厨房插座防溅与安全型插座"
        method: "逐点检查两卫与厨房台面插座是否防溅盒、面板是否为安全型（带保护门）插座，目视 + 拍照"
        standard: "两卫与厨房操作面插座全部带防溅盒；全屋插座采用安全型插座"
        severity: major
        rooms: [master_bath, guest_bath, kitchen]
        knowledge: |
          GB 55038-2025 7.4.5：住宅电源插座均应采用安全型插座；卫生间设置的电源插座尚应加设防溅措施。
          本户需重点核对：sock_mbath_toilet / sock_gbath_toilet（智能马桶位）、两个客卫台盆位、客卫毛巾架位、客卫台盆下扫地机基站位。

      - id: check_elec_strong_weak_separation
        item: "强弱电分管、间距与管内填充率"
        method: |
          1. 检查强电与弱电（网线/电视线）是否分管敷设，交叉是否成直角。
          2. 检查管内导线总截面不超过管内截面 40%（同回路导线同管）。
          3. 抽查电视墙高位到电视柜的独立穿线管是否单独一管。
        standard: "强弱电分管；平行间距按交底口径执行；填充率 ≤40%"
        severity: major
        knowledge: |
          依据 GB 50303 / GB 50327；线径与填充率口径见 docs/mep-construction-guidance.md §3.1。
          "一根大管什么都塞"是弱电衰减和强电干扰的高发原因；网线一根管单独走最省事。
          暗敷禁止接头；管内不得有超过允许数量的 90° 弯。

      - id: check_elec_panel_labeling
        item: "配电箱标识、进线开关与安装高度"
        method: |
          1. 开箱核对箱内每条断路器与回路标签一一对应，贴回路图（须含中央空调外机专用回路）。
          2. 确认有能同时断开相线和中性线、具隔离功能的进线开关，以及短路/过负荷保护。
          3. 复量箱体安装高度与单/双排布置。
          4. 核对进线铜芯截面。
        standard: "标签与图纸一致；有进线开关与保护；单排布置底边 ≥1.80m、双排 ≥1.60m；进线 ≥10mm² 铜芯（本户 21 路，含中央空调外机专用回路）"
        severity: major
        knowledge: |
          GB 55038-2025 7.4.3：家居配电箱应设同时断开相线与中性线且具隔离功能的进线开关；电源插座回路均加 ≤30mA 保护；
          单排箱底边距地 ≥1.80m、双排 ≥1.60m；进出线用铜导体、电源进线截面 ≥10mm²。
          本户 21 路（含中央空调外机专用回路）对 390mm 箱体需双排；若现场为单排箱，须换箱或上移箱体，否则位数与安装高度均不达标。

      - id: check_elec_point_reachability
        item: "点位可及性抽检（防设备/柜体封死）"
        method: "模拟日常：插拔智能马桶、冰箱、油烟机、洗衣机、烘干机插座，确认不必挪动机器或拆柜体即可操作"
        standard: "上述点位全部可徒手插拔，或已有明确检修口/检修位"
        severity: major
        knowledge: |
          本户这 5 类点位在家具/设备落位后容易被封死：
          主卫/客卫智能马桶位（与给水同柱）、冰箱位（东墙通顶高柜内）、
          油烟机位（灶台上方）、洗烘位（阳台仅 1.60×1.20m，叠放后插座在机器体内）。
          封墙前把"怎么拿出来"问清楚，比入住后拆柜子便宜得多。

      - id: check_elec_circuit_separation
        item: "分路合规核对（GB 55038 7.4.4）"
        method: |
          按配电箱回路标签逐条核对五类回路是否分别设置：照明 / 空调电源插座 / 电热水器等 2kW 及以上
          用电设备 / 厨房内电源插座 / 其他功能用房电源插座。本户 21 路重点核对：中央空调外机专用回路
          （hvac_power_outdoor_a2）是否单独成路、洗碗机/冰洗/卫浴是否各自独立、厨房与客餐厅/卧室是否
          未跨类混接、以及每条回路标签是否与 config/electrical-topology.yaml 一致。
        standard: "五类回路分别设置、无跨类混接；回路标签与 config/electrical-topology.yaml（21 路）一致"
        severity: major
        knowledge: |
          为什么单列：此前该项目只靠拓扑配置和箱体标签间接覆盖分路合规，验收单上抓不到"分错误路"。
          GB 55038-2025 7.4.4 是类型级分别设置（不要求每房每灯独立），合并合法但类别不能混。

      - id: check_elec_gas_alarm
        item: "燃气报警器位置与联动切断"
        method: |
          1. 复量探测器安装高度与水平位置。
          2. 联动测试：触发报警，确认紧急切断阀动作。
          3. 与燃气公司验收记录比对。
        standard: "天然气近顶安装（顶棚或距顶棚 ≤0.3m）；距灶具与排风口 >0.5m；不在灶具正上方；联动切断可靠"
        severity: major
        rooms: [kitchen]
        knowledge: |
          依据 CJJ/T 146-2011：探测器距灶具及排风口水平距离均应 >0.5m；使用天然气等密度小于 1 的燃气时，
          探测器应设在顶棚或距顶棚 <0.3m 的墙上（液化石油气相反，应贴地 ≤0.3m）。
          本户最终点位以燃气公司报警器 + 切断阀方案为准，电气只负责提前布好合规电源。

      # === DEC-2026-10-06-R2 施工范围收口：全盒零线 / LEB 联结清单 / 微蒸烤可插拔 / 内机检修断电位 ===
      - id: check_elec_zero_line_all_switches
        item: "全盒零线：每个开关底盒 3 根 1.5mm²（L/N/灯控）"
        when: before_covering
        method: |
          1. 封槽前逐个开关底盒开盖核线：全屋每一个开关底盒内穿 3 根 1.5mm²（L / N / 灯控），缺零线的底盒当场补穿，不得封墙后再说。
          2. 筒灯、灯带、浴霸线控面板同样留零线（线控面板从 N 取电，不借用灯具线）。
          3. 万用表复测：盒内 N 与同回路 N 导通，L-N 间不短路，并核对线色与线径。
          4. 按 DEC-2026-10-06-R2 登记的开关/面板点位清单逐点勾选，漏一处即不合格。
        standard: "全部开关底盒与灯控面板含零线；零线导通、无借用、无短路"
        severity: major
        evidence:
          - "逐个底盒开盖照片（可见 3 根线）"
          - "万用表导通/不短路读数照片"
          - "开关与面板点位清单逐点勾选记录（水电交底单）"
        standard_ref:
          - "DEC-2026-10-06-R2"
        knowledge: |
          单火智能开关在 LED 灯/起夜灯负载下"鬼火微亮"近乎必然；预埋零线成本接近 0，
          封墙后补穿等于把电全部重做一次。

      - id: check_elec_leb_bonding_list
        item: "两卫 LEB 端子箱 + BV-6mm² 黄绿联结干线 + 待联结金属构件清单（防水层施工前完成）"
        when: before_waterproofing
        method: |
          1. 两卫各设局部等电位端子箱（LEB），位置避开柜门开启区与贴砖完成面，位置口径见 docs/pending-site-data.md #43。
          2. 联结干线用 BV-6mm² 黄绿线；逐件联结用 BVR-2.5~4mm² 沿墙脚暗敷，联结点去漆压接。
          3. 按清单逐件核：给水管角阀与软管金属段、金属地漏篦子与排水口、花洒金属杆与软管、龙头、毛巾架、浴霸金属外壳、金属镜柜。
          4. 入户给水管/燃气管若为金属材质，须与接地装置联结（GB 55038-2025 7.4.7）。
          5. 全部联结与导通测试在防水层施工前完成并拍照；封墙、贴砖后不得补埋。
        standard: "端子箱存在；清单内金属构件全部联结；导通合格；防水层施工前完成并有工序交接照片"
        severity: critical
        rooms: [master_bath, guest_bath]
        evidence:
          - "LEB 端子箱位置照片（两卫各一张）"
          - "联结干线沿墙脚敷设照片"
          - "清单内每一类金属构件的联结点特写"
          - "导通测试读数记录"
          - "防水施工前后工序交接照片"
        standard_ref:
          - "GB 55038-2025 7.4.7"
          - "DEC-2026-10-06-R1"
        knowledge: |
          既有 check_elec_leb 只验"端子箱存在 + 抽查导通"；本项把口径扩到"清单逐件 + 防水前完成"。
          等电位联结属隐蔽工程，防水层一上就无法补埋，是水电阶段最容易被整段漏掉的一项。

      - id: check_elec_micro_oven_reserved
        item: "微蒸烤预留点位 sock_kitchen_oven 落位必须在柜外/开放格可徒手插拔处"
        when: [before_covering, at_delivery]
        method: |
          1. 预留点位随橱柜 600 宽高柜段冻结落位：点位落在柜外壁或开放格内，禁止藏在机器背后（机身贴背板时，背装插座等于永久封死）。
          2. 按微蒸烤嵌入口径（深向 595 级）做插拔演练：站在柜门前能捏住插头并完成插拔，不必移机、不必拆层板。
          3. 预留回路与底盒位置在水电交底单上与橱柜冻结排版图叠合核对；设备到货安装后再复核一次插拔可及性。
        standard: "预留点位在柜外或开放格；不拆柜、不移机可徒手插拔；与橱柜冻结排版图一致"
        severity: major
        rooms: [kitchen]
        evidence:
          - "预留点位与橱柜排版图叠合照片"
          - "徒手插拔演练照片（封槽前模拟 + 设备到货后复核）"
        standard_ref:
          - "DEC-2026-10-06-R2"
          - "DEC-2026-10-05-R4"
        knowledge: |
          DEC-2026-10-06-R2 明确微蒸烤"只做预留接口、不落设备锚点"，position_status 随橱柜冻结落位；
          预留位一旦错到机器背后，后期只能拆柜或加排插。

      - id: check_elec_ac_service_access
        item: "六台内机供电硬接线或下引带盖 86 盒（回风检修格栅旁）+ 检修断电位"
        when: before_covering
        method: |
          1. 六台内机供电改为硬接线，或从接线位下引至吊顶完成面以下 0.3–0.5m，装带盖 86 盒。
          2. 86 盒紧邻回风检修格栅，不得在吊顶空腔内盲插，不得被出风口、灯带或柜体遮挡。
          3. 每台内机就近设检修断电位（与 86 盒同区或与线控面板同侧），断电后能从格栅处伸手触及。
          4. 吊顶封板前逐台拍照，记录盒位与回风格栅的相对位置；逐台回路编号写入配电箱回路标签。
        standard: "六台内机无吊顶空腔内盲插；86 盒在完成面下 0.3–0.5m 且带盖；每台有可及的检修断电位"
        severity: major
        rooms: [living_dining, master_bedroom, study, bedroom_nw, bedroom_se]
        evidence:
          - "每台内机供电 86 盒与回风格栅相对位置照片（逐台六张）"
          - "检修断电位照片"
          - "配电箱回路标签与点位对照照片"
        standard_ref:
          - "DEC-2026-10-06-R3"
          - "DEC-2026-10-04-R2"
        knowledge: |
          吊顶封板后，盲插位等于报废：要么拆板，要么从别处拉明线。
          内机供电分组本身按厂家配电图定（合并或逐台），不影响本项——本项只验"接电点可及"。


  - phase: occupancy
    name: "入住前检测"
    items:
      - id: check_occ_formaldehyde
        item: "甲醛检测"
        method: |
          建议找 CMA 资质机构上门检测。
          检测前封闭门窗 12 小时（关闭新风）。
          每个房间设一个检测点（中央位置，离地 1m）。
        standard: "甲醛 < 0.08mg/m³（国标 GB/T 18883）"
        severity: critical
        knowledge: |
          什么时候测：
          - 完工后夏季通风 1~2 个月
          - 冬季可能需要 3~6 个月
          - 有小孩/老人建议更严格标准 < 0.05mg/m³
          - 通风是最有效的方法，活性炭/绿植辅助

# 面层范围核查（finish-scope）配置。
#
# 这一层补的洞：漆/砖/防水台/吊顶都是「面层声明」，各自圈一片墙或一片顶。
# 声明互相压时**面积数字不报错、3D 里也看不出来**——漆是 inspection-only 半透明
# 叠加层，要开开关转视角，而且「压了 0.3㎡」肉眼判不了。所以专职一层核查。
#
# 铁律（与 config/anti-penetration.yaml 一致）：
# - severity 是**下限**，只许加严不许放宽；规则内部可自行降级。
# - 豁免必须带 reason/owner/expires；到期自动复活为 error。
# - 覆盖矩阵：代码实现与配置申报互为镜像，缺一方即报错。
version: 1

rules:
  - id: finish.wall_overlap
    codes: [finish.wall_finish_overlap]
    kinds: paint_region vs walltile(wall_region)
    severity: error
    enabled: true
    note: >
      同一面墙、同一房间（=同一侧）、水平与竖向区间都相交 → 该面被计两次。
      跨房间（双面涂漆）合法不报。业主 2026-10-09 裁定「砖跟漆互斥」→ 本规则为
      error：一片墙 either 刷漆 or 贴砖，不存在「按桶吸收」的中间态。同一墙上的
      多段瓷砖声明竖向堆叠不重叠是合法的（见 F01 的 along+竖向双重判定）。
  - id: finish.sill_duplicate
    codes: [finish.sill_finish_duplicate]
    kinds: paint_sill_region vs sill_region
    severity: error
    enabled: true
    note: 同一 bay 元素的同一个面被漆与砖同时声明。
  - id: finish.paint_duplicate_same_side
    codes: [finish.paint_duplicate_same_side]
    kinds: paint_region vs paint_region
    severity: error
    enabled: true
    note: 同一面墙同一房间同侧两段涂漆声明 along 相交 → 纯计量重复。
  - id: finish.paint_room_binding
    codes:
      - finish.paint_outside_room
      - finish.paint_on_suppressed_wall
      - finish.paint_room_unresolvable
      - finish.paint_span_unresolvable
    kinds: paint_region vs room boundary
    severity: error
    enabled: true
    note: >
      along 端点须落在声明房间的 boundary 多边形上（用多边形不用包围盒——
      本户型主卧×西北次卧、客餐厅×入户花园两对房间包围盒相交而多边形不重叠）。
      这正是「漆面悬在过道上」的几何判据。
  - id: finish.buckle_zone_bounds
    codes: [finish.buckle_zone_outside_room, finish.buckle_zone_room_unknown]
    kinds: aluminum_buckle zone vs room rect
    severity: error
    enabled: true
    note: >
      铝扣板矩形须整块落在声明房间内。computePaintScope 用「zone ∩ 房间矩形」扣减
      顶面漆面积，zone 越界时扣减口径就错——多扣（扣到邻居头上）或少扣。
  - id: finish.tile_over_opening
    codes: [finish.tile_over_opening]
    kinds: walltile(wall_region) vs door/window opening
    severity: error
    enabled: true
    note: >
      业主 2026-10-09 裁定「限制住不该刷漆贴砖的地方不要做」。瓷砖声明盖住门/窗洞 →
      error：shared/paint-scope.ts 的 splitRectByGaps 只服务漆（computePaintScope 与
      SceneBuilder 的 paint_region 分支都走它），wall_region 分支是单张 PlaneGeometry
      不拆洞、瓷砖算量按 len × band 不扣洞——砖声明盖住洞就是实打实多算，且物理上
      不能贴砖过门洞。上线时真实命中 3 条砖声明共 1.05㎡。
  - id: finish.paint_over_opening
    codes: [finish.paint_over_opening]
    kinds: paint_region vs door/window opening
    severity: info
    enabled: true
    note: >
      漆声明跨洞 → info。跨洞正是漆的声明机制：声明整面墙，由 splitRectByGaps 拆成
      左条+右条+门楃条，面积与 3D 网眼都实扣。这里只登记「这段声明跨了洞、扣减正在
      发生」，供核对，不判错。业主若要升为 warning/error，直接改这条 severity。
  - id: finish.declaration_attached
    codes: [finish.declaration_unattached]
    kinds: finish declaration vs buildScene meshes
    severity: error
    enabled: true
    note: >
      业主 2026-10-09 提出「linter 可以校验漆面是不是附着在物体上，而不是离大谱的飘在
      空中」。每个面层声明必须在 buildScene 的产出里找到自己——objectId 直接命中，或命中
      门洞拆分的 id:sN。声明落空**不会报错**：computePaintScope 照样按声明算面积进预算，
      而 3D 里那块什么都没有，结果是「预算算了钱、现场找不到活儿干」。SceneBuilder 的
      report.unsupported 只覆盖引用不存在/区间越界，且只有测试在断言它为空；本规则把
      「声明 → 场景实体」提升为门禁级。paint_ceiling_region 本身不产网格，改判「声明顶面漆
      的房间有无 ceiling 几何」——没有就是飘在 2.80m 高度上。
  - id: finish.mesh_unattached
    codes:
      - finish.mesh_unattached
      - finish.mesh_unattached_unknown_anchor
    kinds: buildScene finish mesh vs wall polyline / bay footprint
    severity: error
    enabled: true
    note: >
      业主 2026-10-09 追问「瓷砖呢？有没有悬空」。F08 只查「声明的 id 在不在 buildScene
      的产出里」，查不出**网格存在但位置错了**：SceneBuilder 用 mid = 起终点弦中点定位，
      直墙上弦就是墙、成立，弧墙（圆角）上弦不是墙——挂在 w_bath_north 的防水台弦中点
      被算到离真实墙面 0.50m 处，整块砖面悬在卫生间中间，而 F08 一声不响。本条逐块判
      「这块网格有没有贴在它该贴的几何上」：墙类（wall_region / paint_region /
      sill-front）比中心到墙折线的最近距离；sill 类（sill-top / sill-underside /
      paint_sill_region）比中心到 bay footprint 边界的距离，或中心在 footprint 内。
      **必须用距离法，不许用射线法 inPoly**：前缘面（front）与两端面的中心本身就落在
      footprint 边界上，inPoly 对边界点不稳定（半开区间比较让同一点随机判内/外），
      此前的一次性探针正是因此把 16 块几何正确的网格误报成飘空。反过来若只用到边界距离，
      台面/底面中心合法地落在 depth/2 处，又会被全量误报——两支合起来才是完整判据。
      拿不到 wallId / elementId / 对应几何时报 finish.mesh_unattached_unknown_anchor，
      不静默跳过（fail-closed）。容差 0.12m：不是本配置的 tolerance（0.01 是重叠容差），
      漆面合法外偏移 PAINT_FACE_OFFSET = 0.068m，用 0.01 会把每块漆面都判成飘空。
      逐块判与网格总数无关——wall_region/paint_region 改逐段出网后数量会变，本条不受影响。

# 判定容差（米）：水平/竖向重叠小于此值不算压。
tolerance: 0.01

# 豁免登记册。当前为空——2.868㎡ 的漆压砖是已知项但尚未经业主书面确认，
# 所以先让 warning 显形，不预设豁免。确认后按此处格式补 pair + reason/owner/expires。
waivers: []

note: >
  verify:finish-scope 与 verify:spatial / verify:penetration 的分工：本层只判
  面层声明之间的关系（压/重复/挂错房），不做声明完整性、墙线拓扑、运行时权威性
  （那些归 verify:spatial），也不判实体互撞（归 verify:penetration）。

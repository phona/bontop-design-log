constraints:
  load_bearing_walls:
    - "所有承重墙、梁位以物业竣工图或现场量房为准"
    - "主卧与次卧之间隔墙、客厅与厨房之间隔墙是否为承重墙待确认"
  exterior:
    - "外围为开发商玻璃幕墙（三层 Low-E 中空玻璃），不得拆改外立面"
    - "入户花园（开敞外廊）含消防通道，不能全部封闭或改变动线"
    - "南向大阳台、入户花园已由开发商用玻璃幕墙封闭，无需自行封窗"
    - "三层 Low-E 中空玻璃隔热性能良好（U≈1.5-2.0，SHGC≈0.3-0.5），无需额外贴隔热膜；窗帘功能定位为遮光+防眩光+隐私，非隔热"
    - "入户花园地面、墙面、天花及入户门已由开发商完成，装修阶段无需施工；一梯一户，入户门无需更换"
    - "玻璃幕墙四面均有推拉窗（约 1m 宽，常见尺寸），可开启通风"
  pipes:
    - "厨房下水位置：待现场确认"
    - "客卫下水位置：待现场确认"
    - "主卫下水位置：待现场确认"
    - "燃气管道位置：待现场确认"
  compliance:
    - "任何外立面改动需物业/设计院审批"
    - "开敞外廊消防通道必须保持畅通"
  notes:
    - "套内 94.76㎡ + 赠送面积约 27.5㎡（入户花园 11.06㎡、南向大阳台 13.95㎡、西设备平台 2.48㎡）≈ 预测建面 119.38㎡"
    - "结构层高 3.0m，室内净高 2.8m，吊顶和柜体设计按 2.8m 净高"
    - "核心设计点：入户花园作为玄关过渡区，兼顾消防通道"
    - "HVAC：仅西设备平台可用，面积约 2.48㎡，分体机外机难以全部安置，建议中央空调/多联机方案"
    - "窗帘为刚需：全屋玻璃幕墙（三层 Low-E 中空，隔热已满足），窗帘主功能为遮光+防眩光+隐私；主卧/次卧/父母房/书房/客厅均需窗帘，主卧/客厅/父母房/书房预留电动窗帘电源"
    - "预算目标：四池口径 192k（硬装 118k + 暖通 29k + 家具软装 35k + 家电 10k），ceiling 190k，务实档"

circulation:
  main_entry: "入户花园 → 客餐厅"
  kitchen_to_dining: "厨房直接连接客餐厅"
  master_suite_path: "客餐厅 → 过道 → 主卧 → 主卫"
  public_bath_path: "客餐厅 → 过道 → 客卫"
  fire_access: "入户花园内保留消防通道，不得封闭"

design_rationale:
  - "四房两厅两卫，目前两人居住，父母房预留未来改书房/客房的可能"
  - "客餐厅合并，南向采光面大，电视墙方案"
  - "开放式厨房，增强客餐厅通透感，配大功率侧吸油烟机；厨房与客餐厅之间加三联动长虹玻璃吊轨推拉门（平时全开，爆炒关闭）"
  - "厨房布局：东墙（灶台+烟机+冰箱），北墙（水槽+切配，面对玻璃窗），西墙（阳台门+辅助台面）；北墙上下水走地面"
  - "入户花园作为进出门过渡区：东侧放可移动鞋柜+自立洞洞板；门内右手以 1.5m 定制半高柜衔接客厅，玄关侧随手收纳、餐厅侧餐边收纳，柜顶保留视线"
  - "主卧带独立卫生间，形成主卧套房；飘窗保留"
  - "主卫（2026-08-25 台盆外移版，待量房确认）：隔墙再北移 z=2.86（进深 1.76m），台盆外移至套间条带做干湿分离（洗漱+梳妆一体台贴新隔墙南脸、门洞西侧），卫内只留马桶+淋浴（西侧玻璃隔断湿区），不泡浴缸；条带其余归主卧存储区"
  - "全屋衣柜统一推拉门（主卧/父母房/儿童房），节省过道空间"

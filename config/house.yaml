      - room: "主卧"
        type: "遮光帘 + 纱帘"
      - room: "父母房"
        type: "遮光帘 + 纱帘"
      - room: "西北次卧"
        type: "遮光帘 + 纱帘"
      - room: "书房"
        type: "半遮光帘 + 纱帘"
      - room: "厨房/卫生间"
        type: "防水卷帘或百叶"


design_rationale:
  - "四房两厅两卫，目前两人居住；2026-10-05 功能互换后：东南客房供父母/客人（与主人区隔客餐厅+主走廊、不共墙），西侧中间房为书房"
  - "客餐厅合并，南向采光面大，电视墙方案"
  - "开放式厨房，增强客餐厅通透感，配大功率侧吸油烟机；厨房与客餐厅之间加三联动长虹玻璃吊轨推拉门（平时全开，爆炒关闭）"
  - "厨房布局试案：东墙连续操作柜承载灶台+烟机；冰箱 HR-518WUFIPZ 暂候选在长虹门南侧、入户门西侧 (10.94,3.48)；北墙（水槽+切配，面对玻璃窗），西墙（阳台门+辅助台面）；北墙上下水走地面"
  - "入户花园作为进出门过渡区：东侧放可移动鞋柜+自立洞洞板；门内右手以 1.5m 定制半高柜衔接客厅，玄关侧随手收纳、餐厅侧餐边收纳，柜顶保留视线"

  data_source: "装修图纸.dxf（套内布局） + 合同分户图（结构及赠送面积）"
  accuracy_warning: "房间尺寸与面积来自 CAD 设计图；承重墙、梁位、管道、门窗口位置以合同图及现场量房为准"
  # 数据置信度（P2 决策闭环）：精度等级 inferred（推断）/ estimated（估算）/ measured（现场量房）
  # 量房完成后逐项升级为 measured；AI 据此判断输出基于估算还是实测
  data_precision:
    geometry: inferred        # 房间尺寸/面积：CAD 设计图，未现场量房
    structure: inferred       # 梁位/承重墙/净高：推断（见 pending-site-data.md）
    mep: inferred             # 强电箱/排水立管/燃气表/排烟道：推断
    materials: candidate      # 材料报价：到店未确认（见 materials.yaml status）
    survey_completed: false   # 现场量房是否完成
    source_doc: "docs/pending-site-data.md"  # 14 项量房待填清单

  floor_analysis:
    floor_level: "中低层"
    elevator_dependency: "低"
    lighting: "中等偏上"
    ventilation: "优秀"
    privacy: "中等"
    mosquito_risk: "中等"
    water_pressure: "良好"

  corrections:
    - date: "2026-07-02"
      item: "套内面积"
      from: "估算 95㎡"
      to: "确认 94.76㎡"
    - date: "2026-07-02"
      item: "楼层与建筑类型"
      from: "未知"
      to: "7 楼，板楼，西户"
    - date: "2026-07-05"
      item: "建筑面积与层高"
      from: "建面约 140-150㎡、层高 2.8m"
      to: "预测建面 119.38㎡、套内 94.76㎡、结构层高 3.0m、室内净高 2.8m"
    - date: "2026-08-02"
      item: "外立面玻璃规格"
      from: "玻璃幕墙（规格未知）"
      to: "三层 Low-E 中空玻璃（开发商已装），隔热性能良好，无需额外贴膜；窗帘功能定位为遮光+防眩光+隐私"
    - date: "2026-08-02"
      item: "入户花园及入户门"
      from: "入户花园地面/墙面/天花/入户门待施工"
      to: "开发商已完成入户花园地面、墙面、天花及入户门，装修阶段无需施工；一梯一户，入户门无需更换"
    - date: "2026-08-02"
      item: "主卫方案"
      from: "主卫含浴缸方案"
      to: "不泡浴缸；主卫方案 A+C（洗手台外移干湿分离 + 过道段薄柜储物）"
    - date: "2026-08-02"
      item: "新风系统"
      from: "未定"
      to: "不装新风；防尘靠密封缝隙+净化器+扫地机器人+减少开放搁板，入住后按需追加"
    - date: "2026-08-02"
      item: "厨房布局"
      from: "灶台/水槽在西墙"
      to: "东墙（灶台+烟机+冰箱），北墙（水槽+切配，上下水走地面），西墙（阳台门+辅助台面）"


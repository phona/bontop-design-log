      - room: "书房"
        type: "风管机或壁挂机（视预算）"
    notes:
      - "因仅有一个 2.48㎡ 设备平台，分体机外机位不足"
      - "卧室若预算紧张可用壁挂机，但需确认外机布置可行性"

  hot_water:
    system: "燃气热水器"
    location: "厨房或入户花园（待设计师确定）"
    notes:
      - "是否做零冷水循环待业主和设计师确认"
      - "燃气管道位置需现场确认"
      - "electrical.yaml sock_balcony_waterheater 为阳台暂定电位，位置定案前不作为施工依据（见 pending-site-data.md #26）"
      - "生活阳台已被开发商玻璃幕封闭：若最终挂阳台，排烟出幕墙与燃气路由需物业/燃气公司确认（CO 安全红线）"

  electrical:
    power:
      - "强电箱位置、容量、回路数待现场确认"
      - "客厅、主卧、父母房、书房预留网线（AP/Mesh）"
      - "客厅电视墙预留 4–5 个插座"
      - "厨房预留 6–8 个插座（含洗碗机、净水器、垃圾处理器）"
      - "卫生间预留智能马桶、电热毛巾架电源"
    smart_home:
      level: "B"
      description: "智能开关零线 + 网关位 + 电动窗帘电源 + 人体传感器位"
      notes:
        - "全屋玻璃幕墙，窗帘为刚需，主卧/客厅/父母房/书房预留电动窗帘电源"
        - "不上全屋调光和自动化，控制成本"

  plumbing:
    - "厨房下水、卫生间下水位置待现场确认"
    - "洗碗机/净水器上下水预留（可先不装设备，留好点位）"


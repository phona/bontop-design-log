mechanical_electrical_plumbing:
  hvac:
    system: "中央空调 / 多联机（一拖五/六）"
    outdoor_unit_location: "西设备平台"
    indoor_units:
      - room: "客餐厅"
        type: "风管机 / 薄型天花机"
        note: "藏入局部吊顶"
      - room: "主卧"
        type: "风管机或壁挂机（视预算）"
      - room: "父母房"
        type: "风管机或壁挂机（视预算）"
      - room: "西北次卧"
        type: "风管机或壁挂机（视预算）"
      - room: "书房"
        type: "风管机或壁挂机（视预算）"
    notes:
      - "因仅有一个 2.48㎡ 设备平台，分体机外机位不足"
      - "卧室若预算紧张可用壁挂机，但需确认外机布置可行性"

  hot_water:
    system: "燃气热水器"
    location: "厨房或入户花园（待设计师确定）"
    notes:
      - "是否做零冷水循环待业主和设计师确认"
      - "燃气管道位置需现场确认"

  electrical:
    power:
      - "强电箱位置、容量、回路数待现场确认"
      - "客厅、主卧、父母房、书房预留网线（AP/Mesh）"
      - "客厅电视墙预留 4–5 个插座"
      - "厨房预留 6–8 个插座（含洗碗机、净水器、垃圾处理器）"
      - "卫生间预留智能马桶、电热毛巾架电源"
    smart_home:
      level: "B"
      description: "智能开关零线 + 网关位 + 电动窗帘电源 + 人体传感器位"
      notes:
        - "全屋玻璃幕墙，窗帘为刚需，主卧/客厅/父母房/书房预留电动窗帘电源"
        - "不上全屋调光和自动化，控制成本"

  plumbing:
    - "厨房下水、卫生间下水位置待现场确认"
    - "洗碗机/净水器上下水预留（可先不装设备，留好点位）"

  curtains:
    requirement: "全屋玻璃幕墙（三层 Low-E 中空），隔热已由玻璃满足；窗帘主功能为遮光+防眩光+隐私"
    rooms:
      - room: "客餐厅"
        type: "纱帘 + 遮光帘（可考虑电动）"
      - room: "主卧"
        type: "遮光帘 + 纱帘"
      - room: "父母房"
        type: "遮光帘 + 纱帘"
      - room: "西北次卧"
        type: "遮光帘 + 纱帘"
      - room: "书房"
        type: "半遮光帘 + 纱帘"
      - room: "厨房/卫生间"
        type: "防水卷帘或百叶"

mep_strategy:
  - "中央空调 / 多联机一拖五/六，外机放西设备平台"
  - "燃气热水器供热水，位置待设计师确定"
  - "智能预留 B 级：智能开关零线 + 网关 + 电动窗帘电源（主卧/客厅/父母房/书房） + 传感器位"
  - "全屋窗帘：遮光帘 + 纱帘，厨卫用防水卷帘/百叶"

furnishings:
  # 坐标为 model-geometry 局部坐标系（米）；有 x/z 的为 placed 实例（渲染），无 x/z 的为 count-only（只喂预算/库存）
  master_bedroom:
    # 房间 x∈[0,4.20] z∈[5.55,9.80]；条带东延至 x=4.2，d_mb @(4.2,5.10)（靠北偏置 0.45 朝西进）
    # 动线：走廊→d_mb（朝西进）→左手衣柜背右手浴墙→西端0.85m口→右转主卫/左转寝区
    - { type: bed_180, x: 3.20, z: 7.875, rotation: 270 }     # 床靠东墙，朝西看幕墙
    - { type: wardrobe_240, x: 3.00, z: 5.85, rotation: 0 }    # 条带南缘隔断柜（延伸到门口，背对玄关）
    - { type: mattress_180 }
    - { type: curtain_set }
    - { type: ceiling_light }
  bedroom_nw:
    # 房间 x∈[2.60,5.60] z∈[1.10,4.30]，南门 d_bnw @(5.0,4.30) swing x∈[4.55,5.45] z∈[3.40,4.30]
    - { type: bed_150, x: 4.60, z: 2.30, rotation: 270 }       # 床头靠东墙，1.5m床改善通道（DEC-013）
    - { type: wardrobe_180, x: 2.90, z: 2.70, rotation: 90 }   # 1.8m衣柜沿西墙飘窗下（sill 2.55 不挡窗）；推拉门（DEC-013）
    - { type: mattress_150 }
    - { type: curtain_set }
    - { type: ceiling_light }
  bedroom_se:
    # 房间 x∈[13.40,16.40] z∈[5.55,9.80]，西门 d_bese @(13.4,7.6) swing x∈[13.40,14.30] z∈[7.15,8.05]
    # 书桌靠西墙（x=13.4），西墙已有桌面插座 z=6.5 h=0.3 ×3
    - { type: desk, x: 13.70, z: 6.30, rotation: 90 }      # 靠西墙，面向东
    - { type: chair, x: 14.30, z: 6.30, rotation: 270 }
    - { type: bookshelf, x: 15.50, z: 5.70, rotation: 0 }   # 沿北墙
    - { type: curtain_set }
    - { type: ceiling_light }
  study:
    # 房间 x∈[4.20,7.20] z∈[5.55,9.80]，北门 d_study @(6.6,5.55) swing x∈[6.15,7.05] z∈[5.55,6.45]
    # 床头靠西墙（x=4.2），东墙已有床头插座 z=7.0/8.5 h=0.7
    - { type: bed_150, x: 5.20, z: 7.75, rotation: 90 }     # 床头靠西墙
    - { type: wardrobe_180, x: 5.10, z: 5.85, rotation: 0 } # 沿北墙，避开门扇(x<6.15)
    - { type: mattress_150 }
    - { type: curtain_set }
    - { type: ceiling_light }
  living_dining:
    # 房间 x∈[7.20,13.40] z∈[4.30,9.80]，开放连通走廊，无门 swing
    # 电视在西墙（x=7.2，唯一实体墙），沙发朝西；南墙为玻璃幕不能挂电视
    - { type: tv_stand, x: 7.40, z: 7.00, rotation: 90 }     # 靠西墙居中
    - { type: sofa_3seat, x: 11.00, z: 7.00, rotation: 270 } # 面朝西看电视
    - { type: dining_table, x: 9.00, z: 5.30, rotation: 0 }  # 餐厅区（北侧靠厨房）
    - { type: dining_chair, x: 9.00, z: 4.65, rotation: 0 }
    - { type: dining_chair, x: 9.00, z: 5.95, rotation: 180 }
    - { type: dining_chair, x: 8.00, z: 5.30, rotation: 90 }
    - { type: dining_chair, x: 10.00, z: 5.30, rotation: 270 }
    - { type: curtain_set, count: 2 }
    - { type: ceiling_light, count: 2 }
  kitchen:
    - { type: cabinet_base, count: 5.0 }      # DEC-014 北墙3.6+东墙2.2 L型
    - { type: cabinet_wall, count: 2.0 }
    - { type: countertop_quartz, count: 5.0 } # DEC-014 同地柜
    - { type: fridge }                        # DEC-014 东墙南端高柜位 0.7×0.7
    - { type: sink }
    - { type: range_hood }
    - { type: gas_stove }
    - { type: ceiling_light }
  master_bath:
    - { type: toilet }
    - { type: shower_set }
    - { type: vanity }
    - { type: faucet }
    - { type: ceiling_light }
    - { type: exhaust_fan }
  guest_bath:

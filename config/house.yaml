    - "开敞外廊消防通道必须保持畅通"
  notes:
    - "套内 94.76㎡（合同净口径）+ 赠送约 28.90㎡（模型 bbox 口径：入户花园 13.041㎡、南向大阳台 13.95㎡、西设备平台 2.7331㎡）与预测建面 119.38㎡ **不可直接相加**：94.76 + 28.90 = 123.66 ≠ 119.38，三者分属净口径/毛口径/赠送计入规则三套规则，加法口径的对齐需合同分户图裁定，见 原量房台账 #40（已退场，未决项现由对象 blocker 承载）"
    - "原顶（结构板底）约 2.8m，室内净高 2.8m，吊顶和柜体设计按 2.8m 净高"
    - "核心设计点：入户花园作为玄关过渡区，兼顾消防通道"
    - "HVAC：仅西设备平台可用，面积约 2.7331㎡（2026-11-26 量房 bbox；旧 1.60㎡ / r=1.0 圆角可用约 1.39㎡ 作废），分体机外机难以全部安置，建议中央空调/多联机方案"

  hvac:
    system: "中央空调 / 多联机（一拖五/六）"
    outdoor_unit_location: "西设备平台"
    indoor_units:
      - room: "客餐厅"
        type: "风管机 / 薄型天花机"
        note: "藏入局部吊顶"
      - room: "主卧"
        type: "风管机或壁挂机（视预算）"
      - room: "书房"
        type: "风管机或壁挂机（视预算）"
      - room: "西北次卧"
        type: "风管机或壁挂机（视预算）"
      - room: "东南次卧"
        type: "风管机或壁挂机（视预算）"
    notes:
      - "因仅有一个 2.48㎡ 设备平台，分体机外机位不足"
      - "卧室若预算紧张可用壁挂机，但需确认外机布置可行性"

  hot_water:
    system: "燃气热水器"
    location: "厨房或入户花园（待设计师确定）"
    notes:
      - "是否做零冷水循环待业主和设计师确认"
      - "燃气管道位置需现场确认"

  electrical:
    power:
      - "强电箱位置、容量、回路数待现场确认"
      - "客厅、主卧、书房预留网线（AP/Mesh）"
      - "客厅电视墙预留 4–5 个插座"
      - "厨房预留 6–8 个插座（含洗碗机、净水器、垃圾处理器）"
      - "卫生间预留智能马桶、电热毛巾架电源"
    smart_home:
      level: "B"
      description: "智能开关零线 + 网关位 + 电动窗帘电源 + 人体传感器位"
      notes:
        - "全屋玻璃幕墙，窗帘为刚需，主卧/客厅/书房预留电动窗帘电源"
        - "不上全屋调光和自动化，控制成本"

  plumbing:
    - "厨房下水、卫生间下水位置待现场确认"
    - "洗碗机/净水器上下水预留（可先不装设备，留好点位）"

  curtains:
    requirement: "全屋玻璃幕墙，窗帘为遮阳隔热 + 隐私刚需"
    rooms:
      - room: "客餐厅"
        type: "纱帘 + 遮光帘（可考虑电动）"
      - room: "主卧"
        type: "遮光帘 + 纱帘"
      - room: "书房"
        type: "半遮光帘 + 纱帘"
      - room: "西北次卧"
        type: "遮光帘 + 纱帘"
      - room: "东南次卧"
        type: "遮光帘 + 纱帘"
      - room: "厨房/卫生间"
        type: "防水卷帘或百叶"

mep_strategy:
  - "中央空调 / 多联机一拖五/六，外机放西设备平台"
  - "燃气热水器供热水，位置待设计师确定"
  - "智能预留 B 级：智能开关零线 + 网关 + 电动窗帘电源 + 传感器位"
  - "全屋窗帘：遮光帘 + 纱帘，厨卫用防水卷帘/百叶"

furnishings:
  # 坐标为 model-geometry 局部坐标系（米）；有 x/z 的为 placed 实例（渲染），无 x/z 的为 count-only（只喂预算/库存）
  master_bedroom:
    # 房间 x∈[0,4.20] z∈[5.55,9.80]，套间动线：走廊→入口 d_mb（条带东墙 @(2.6,4.925) swing z∈[4.475,5.375] x∈[1.7,2.6]）→过道衣帽间→全开放进主卧；主卫门 d_mbath @(0.9,4.30)
    - { type: bed_180, x: 2.10, z: 8.65, rotation: 180 }      # 床头靠南墙居中
    - { type: wardrobe_240, x: 0.30, z: 7.55, rotation: 90 }   # 沿西墙，让开 d_mb_bath 摆门区 z[5.55,6.35]
    - { type: mattress_180 }
    - { type: curtain_set }
    - { type: ceiling_light }
  bedroom_nw:
    # 房间 x∈[2.60,5.60] z∈[1.10,4.30]，南门 d_bnw @(4.1,4.30) swing x∈[3.65,4.55] z∈[3.40,4.30]
    - { type: bed_180, x: 3.55, z: 2.15, rotation: 0 }         # 床头靠北墙
    - { type: wardrobe_240, x: 5.30, z: 2.70, rotation: 270 }  # 沿东墙
    - { type: mattress_180 }
    - { type: curtain_set }
    - { type: ceiling_light }
  bedroom_se:
    # 房间 x∈[13.40,16.40] z∈[5.55,9.80]，西门 d_bese @(13.4,7.6) swing x∈[13.40,14.30] z∈[7.15,8.05]
    - { type: bed_180, x: 15.35, z: 8.65, rotation: 270 }      # 床头靠东墙
    - { type: wardrobe_240, x: 14.60, z: 5.85, rotation: 0 }   # 沿北墙
    - { type: mattress_180 }
    - { type: curtain_set }
    - { type: ceiling_light }
  study:
    # 房间 x∈[4.20,7.20] z∈[5.55,9.80]，北门 d_study @(5.7,5.55) swing x∈[5.25,6.15] z∈[5.55,6.45]
    - { type: desk, x: 5.70, z: 9.45, rotation: 0 }            # 靠南墙
    - { type: chair }
    - { type: bookshelf }
    - { type: curtain_set }
    - { type: ceiling_light }
  living_dining:
    # 房间 x∈[7.20,13.40] z∈[4.30,9.80]，开放连通走廊，无门 swing
    - { type: sofa_3seat, x: 11.70, z: 5.20, rotation: 0 }     # 靠背朝北，面向电视
    - { type: tv_stand, x: 11.60, z: 9.60, rotation: 180 }     # 靠南墙
    - { type: dining_table, x: 8.80, z: 7.10, rotation: 0 }    # 用餐区居中（西侧）
    - { type: dining_chair, x: 8.80, z: 6.35, rotation: 0 }
    - { type: dining_chair, x: 8.80, z: 7.85, rotation: 180 }
    - { type: dining_chair, x: 7.60, z: 7.10, rotation: 90 }
    - { type: dining_chair, x: 10.00, z: 7.10, rotation: 270 }
    - { type: curtain_set, count: 2 }
    - { type: ceiling_light, count: 2 }
  kitchen:
    - { type: cabinet_base, count: 3.5 }
    - { type: cabinet_wall, count: 2.0 }
    - { type: countertop_quartz, count: 3.5 }
    - { type: sink }
    - { type: range_hood }
    - { type: gas_stove }
    - { type: ceiling_light }
  master_bath:
    - { type: toilet }
    - { type: shower_set }
    - { type: vanity }
    - { type: faucet }
    - { type: ceiling_light }
    - { type: exhaust_fan }
  guest_bath:
    - { type: toilet }
    - { type: shower_set }
    - { type: vanity }
    - { type: faucet }
    - { type: ceiling_light }
    - { type: exhaust_fan }
  balcony:
    - { type: ceiling_light }
  entry_garden:
    - { type: shoe_cabinet }
    - { type: ceiling_light }
  south_balcony:
    - { type: ceiling_light }


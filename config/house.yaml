    orientation: "北"
    notes: "合同图北面开敞外廊，赠送面积，开发商已用玻璃幕墙封闭；内含电梯厅及消防通道，实际可入户使用面积约 11㎡，不得完全封闭"
    windows: []
    doors:
      - width: 0.90
        position: "入户门"
    furniture_concept:
      - "玄关柜"
      - "换鞋凳"

  - name: "南向大阳台"
    id: "south_balcony"
    type: "public"
    width: 6.40
    length: 2.18
    height: 3.0
    area: 13.95
    status: "design"
    orientation: "南"
    notes: "合同图南面大阳台，赠送面积，开发商已用玻璃幕墙封闭；西户专属，东侧阳台属隔壁户"
    windows: []
    doors:
      - width: 2.00
        position: "连接客厅"
    furniture_concept:
      - "休闲区"
      - "绿植"

  - name: "西设备平台"
    id: "west_platform"
    type: "service"
    width: 1.60
    length: 1.55
    height: 3.0
    area: 2.48
    status: "design"
    orientation: "西"
    notes: "701 唯一可用设备平台，赠送面积，面积约 2.48㎡。因面积有限且西户专属，空调方案建议采用中央空调/多联机（一台外机），避免多台分体外机放不下。详见 docs/hvac_options_analysis.md"

mechanical_electrical_plumbing:
  hvac:
    system: "中央空调 / 多联机（一拖五/六）"
    outdoor_unit_location: "西设备平台"
    indoor_units:
      - room: "客餐厅"
        type: "风管机 / 薄型天花机"
        note: "藏入局部吊顶"
      - room: "主卧"
        type: "风管机或壁挂机（视预算）"
      - room: "书房"
        type: "风管机或壁挂机（视预算）"
      - room: "西北次卧"
        type: "风管机或壁挂机（视预算）"
      - room: "东南次卧"
        type: "风管机或壁挂机（视预算）"
    notes:
      - "因仅有一个 2.48㎡ 设备平台，分体机外机位不足"
      - "卧室若预算紧张可用壁挂机，但需确认外机布置可行性"

  hot_water:
    system: "燃气热水器"
    location: "厨房或入户花园（待设计师确定）"
    notes:
      - "是否做零冷水循环待业主和设计师确认"
      - "燃气管道位置需现场确认"

  electrical:
    power:
      - "强电箱位置、容量、回路数待现场确认"
      - "客厅、主卧、书房预留网线（AP/Mesh）"
      - "客厅电视墙预留 4–5 个插座"
      - "厨房预留 6–8 个插座（含洗碗机、净水器、垃圾处理器）"
      - "卫生间预留智能马桶、电热毛巾架电源"
    smart_home:
      level: "B"
      description: "智能开关零线 + 网关位 + 电动窗帘电源 + 人体传感器位"
      notes:
        - "全屋玻璃幕墙，窗帘为刚需，主卧/客厅/书房预留电动窗帘电源"
        - "不上全屋调光和自动化，控制成本"

  plumbing:
    - "厨房下水、卫生间下水位置待现场确认"
    - "洗碗机/净水器上下水预留（可先不装设备，留好点位）"

  curtains:
    requirement: "全屋玻璃幕墙，窗帘为遮阳隔热 + 隐私刚需"
    rooms:
      - room: "客餐厅"
        type: "纱帘 + 遮光帘（可考虑电动）"
      - room: "主卧"
        type: "遮光帘 + 纱帘"
      - room: "书房"
        type: "半遮光帘 + 纱帘"
      - room: "西北次卧"
        type: "遮光帘 + 纱帘"
      - room: "东南次卧"
        type: "遮光帘 + 纱帘"
      - room: "厨房/卫生间"
        type: "防水卷帘或百叶"

constraints:
  load_bearing_walls:
    - "所有承重墙、梁位以物业竣工图或现场量房为准"
    - "主卧与次卧之间隔墙、客厅与厨房之间隔墙是否为承重墙待确认"
  exterior:
    - "外围为开发商玻璃幕墙，不得拆改外立面"
    - "入户花园（开敞外廊）含消防通道，不能全部封闭或改变动线"
    - "南向大阳台、入户花园已由开发商用玻璃幕墙封闭，无需自行封窗"
  pipes:
    - "厨房下水位置：待现场确认"
    - "客卫下水位置：待现场确认"
    - "主卫下水位置：待现场确认"
    - "燃气管道位置：待现场确认"
  compliance:
    - "任何外立面改动需物业/设计院审批"
    - "开敞外廊消防通道必须保持畅通"
  notes:
    - "套内 94.76㎡ + 赠送面积约 27.5㎡（入户花园 11.06㎡、南向大阳台 13.95㎡、西设备平台 2.48㎡）≈ 预测建面 119.38㎡"
    - "层高 3.0m，比常规 2.8m 更高，吊顶和柜体设计需考虑净高"
    - "核心设计点：入户花园作为玄关过渡区，兼顾消防通道"
    - "HVAC：仅西设备平台可用，面积约 2.48㎡，分体机外机难以全部安置，建议中央空调/多联机方案"
    - "窗帘为刚需：全屋玻璃幕墙，主卧/次卧/书房/客厅均需窗帘，主卧/客厅/书房预留电动窗帘电源"
    - "预算目标：11 万务实档，非豪华装修，保证基础质量"

circulation:
  main_entry: "入户花园 → 客餐厅"
  kitchen_to_dining: "厨房直接连接客餐厅"
  master_suite_path: "客餐厅 → 过道 → 主卧 → 主卫"
  public_bath_path: "客餐厅 → 过道 → 客卫"
  fire_access: "入户花园内保留消防通道，不得封闭"

design_rationale:
  - "四房两厅两卫，目前两人居住，书房预留未来改客房/儿童房的可能"
  - "客餐厅合并，南向采光面大，电视墙方案"
  - "开放式厨房，增强客餐厅通透感，配大功率侧吸油烟机"
  - "入户花园作为玄关过渡区，兼顾消防通道"
  - "主卧带独立卫生间，形成主卧套房；飘窗保留"
  - "全屋玻璃幕墙，窗帘为遮阳隔热 + 隐私刚需，主卧/客厅/书房预留电动窗帘电源"
  - "仅西设备平台可用，中央空调/多联机为最优方案"
  - "预算目标 11 万，务实档，非豪华装修"

pending_verification:
  - "所有房间净尺寸需现场量房复核"
  - "承重墙、梁位需物业竣工图确认"
  - "玻璃幕墙分格及门窗口位置需设计院图纸确认"
  - "开放式厨房排烟效果需设计师复核"
  - "中央空调外机散热及检修空间需现场复核"

design_rationale:
  - "四房两厅两卫，目前两人居住，父母房预留未来改书房/客房的可能"
  - "客餐厅合并，南向采光面大，电视墙方案"
  - "开放式厨房，增强客餐厅通透感，配大功率侧吸油烟机；厨房与客餐厅之间加三联动长虹玻璃吊轨推拉门（平时全开，爆炒关闭）"
  - "厨房布局：东墙（灶台+烟机+冰箱），北墙（水槽+切配，面对玻璃窗），西墙（阳台门+辅助台面）；北墙上下水走地面"
  - "入户花园作为进出门过渡区：东侧放可移动鞋柜+自立洞洞板；门内右手以 1.5m 定制半高柜衔接客厅，玄关侧随手收纳、餐厅侧餐边收纳，柜顶保留视线"
  - "主卧带独立卫生间，形成主卧套房；飘窗保留"
  - "主卫（2026-09-01 纯洗手柜版，待量房确认）：隔墙 z=2.86 与外置台盆位置不动；套间条带 1.10×0.50m 柜体仅承担洗手与封闭收纳，取消梳妆膝位和椅子，盆心/龙头/墙排及屏风尽量不动；卫内只留马桶+淋浴，不泡浴缸"
  - "主卧南床头新增 0.85×0.40×0.75m 独立干式梳妆台与 0.42×0.40×0.45m 专用凳；床和北侧衣柜不动，桌面支撑镜与插接镜前灯不挂墙，复用南床头插座"
  - "全屋衣柜统一推拉门（主卧/父母房/儿童房），节省过道空间"
  - "父母房弹性设计：成品床（可搬走）、大白墙、衣柜可拆层板，硬装按未来书房标准做"
  - "儿童房（西北次卧）床改 1.5m，改善通道（0.3→0.6m）"
  - "主卧取消电视位，改 USB 充电插座；投影预留 A 方案（床尾一个插座，便携投影）"
  - "不装新风系统；防尘靠密封缝隙+净化器+扫地机器人+减少开放搁板"
  - "全屋玻璃幕墙（三层 Low-E 中空），窗帘主功能为遮光+防眩光+隐私，主卧/客厅/父母房/书房预留电动窗帘电源"
  - "仅西设备平台可用，中央空调/多联机为最优方案"
  - "预算目标：四池口径 192k（硬装 118k + 暖通 29k + 家具软装 35k + 家电 10k），ceiling 190k"


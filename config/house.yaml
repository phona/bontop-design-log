furnishings:
  # 坐标为 model-geometry 局部坐标系（米）；有 x/z 的为 placed 实例（渲染），无 x/z 的为 count-only（只喂预算/库存）
  master_bedroom:
    # 房间 x∈[0,4.20] z∈[5.55,9.80]；条带东延至 x=4.2，d_mb @(4.2,5.10)（靠北偏置 0.45 朝西进）
    # 动线：走廊→d_mb（朝西进）→西侧玻璃幕墙侧留空→右转主卫；东侧为北墙向南伸的平台+下柜
    - { type: bed_180, x: 3.20, z: 7.875, rotation: 270 }     # 床靠东墙，朝西看幕墙
    - { type: wardrobe_240_split, x: 3.00, z: 5.95, rotation: 0 } # DEC-023 条带隔断柜拆段；2026-08-26 空调定案 v2：西段被褥矮柜降 1.1m 且收窄 0.8m（x[1.8,2.6]，上方檐口朝南越顶送风），挂衣高柜西延至 1.6m（x[2.6,4.2]）保持 2.7m 通顶

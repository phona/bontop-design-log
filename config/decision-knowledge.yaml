    kind: gate_mechanism
    subject: "吊顶算量子系统独立：按分区实算替代房间面积近似（+ trade 工艺分类与一键高亮）"
    knowledge: >-
      吊顶算量按分区实算替代房间面积近似。trade 是**显式声明**的工艺/计价类别
      （gypsum_board / aluminum_buckle / curtain_box / drying_rack），算量与高亮分区都从它
      取口径，禁止任何模块靠 id 命名推断归类——命名推断会在新增分区时静默归错类。
    landing:
      - "gate:shared/ceiling-takeoff.ts"
      - "gate:config/model/envelope/ceiling.yaml"

  - id: "DEC-2026-10-07-M03"
    kind: gate_mechanism
    subject: "删掉 allowance 臆测数据：没有路由的点位不进采购量"
    knowledge: >-
      删掉 allowance 臆测数据：没有路由的点位不进采购量。臆测量的危险在于它**看起来是数**——
      采购量与预算都从它派生，错了没有任何门禁会报（它不在任何对账等式里）。
    landing:
      - "gate:shared/mep-takeoff.ts"

  - id: "DEC-2026-10-22-R02"
    kind: gate_mechanism
    subject: "卫生间施工与 QA 门禁收口（第一批）：防水高度改 2.00 + 双阶段闭水 + 主卫沉箱测试拆分"
    knowledge: >-
      防水高度改 2.00 + 双阶段闭水 + 主卫沉箱测试拆分。施工 QA 门禁化的口径：每条施工要求
      都要有一个可执行断言（高度值、闭水次数、测试分区），写不成断言的要求只在文档里等于
      没有要求。
    landing:
      - "gate:config/acceptance.yaml"
      - "gate:config/spatial-validation.yaml"

  - id: "DEC-2026-10-09-S01"
    kind: process
    subject: "决策日志按主题拆分：单文件 417 KB → docs/decisions/ 14 个主题文件 + README 索引"
    knowledge: >-
      单文件决策日志（2,505 行 / 427,082 B / 177 条 DEC）过大且时间序混乱，按主题拆成
      docs/decisions/ 14 个文件，README 承接入口职责；外部引用 10 个文件同步。检索主线是
      「一件事的来龙去脉」（主卫 6 轮、客卫 R1–R7、东南角弧面 6 轮评审），主题文件让一次
      回溯只读一个文件；月份拆会把连续轮次打散，现役/归档分离要反复重划边界。
      2026-11-08 业主裁定 DEC 退役，本拆分形态随 docs/decisions/ 删除而终局（墓碑见
      docs/README.md 退场墓碑表；编号可解析性由本文件 retired 段承接）。
    landing:
      - "agents"


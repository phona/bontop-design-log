  - id: "DEC-2026-10-04-R1"
    kind: contract
    subject: "中央空调定标成交：36,000 元（领航者 200 主机 + 6 台双出风内机）"
    knowledge: >-
      合同成交 36,000 元：外机 MJV-200W-E01-LHIV 20kW 14,124 元 + 安装 1,400 元/台×6 =
      8,400 元 + 其余分项，合计 36,000 元（含辅材；不含复合风管与风口加长——加长 100 元/米
      另计、不含税）。**证据等级 = 转录级**：合同附件共 8 页，已归档仅 p1/p2 两页，
      「含否口径」据 evidence-notes 对合同附件备注 2/5 的历史转录，备注页原件不在仓内，
      补归档前不得把转录当原件核验（待办挂 pending #39⑥）。
      本条同时是 AGENTS.md 决策铁律第 2 条的反例：当轮「我的技术意见」已指出直吹、除湿、
      同开总量三个问题与「装修期内换机只补差价」这个窗口，无 owner 无日期，七天无人接。
    landing:
      - "quote-card:config/hvac.yaml"
      - "quote-card:schedule/phase-1/control.yaml"
    owner: 业主
    fails_if: "补归档的备注页与转录不一致 → 含否口径（风口加长/税）重判，36,000 的成交语义可能变"


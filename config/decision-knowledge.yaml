      桶：量房前不升级为 error）。拆分理由：混在一个大门禁里，单类规则的增减会被总量掩盖
      ——「总数没变」曾被当成「没有新问题」的证据。
    landing:
      - "gate:config/anti-penetration.yaml"

  - id: "DEC-2026-10-09-G01"
    kind: gate_mechanism
    subject: "门禁编排器取代 `&&` 链：全跑 + 汇总退出码 + `--json` 信封，消灭单点红灯短路"
    knowledge: >-
      门禁编排器取代 `&&` 链：全跑 + 汇总退出码 + `--json` 信封。`&&` 链里前面的失败会让
      后面的门禁根本不跑，于是「红灯原因」被隐藏成「只跑了一半」——CI 基线纪律要求每次都
      看到完整失败集，编排器是它的前提。
    landing:
      - "gate:scripts/verify/verify-all.ts"


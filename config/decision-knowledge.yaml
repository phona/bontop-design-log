# ============================================================================
# config/decision-knowledge.yaml —— DEC 退役后**唯一保留的知识载体**（issue #98 第六阶段 S2）
#
# 业主 2026-11-08 裁定（七条）落地形态：DEC 体系退役，不建任何中央决策账。S1 建的 DEC 决策
# 登记簿（config 层单 YAML，292 条最小行，intent 总字符 94,635）是**原料**、拆完即删，本文件
# 是它拆完之后的残壳：意图/未决项/状态各归其位（对象 blocker / 报价卡 / 门禁 /
# AGENTS.md / pending 台账），只有「拆不出去的真·不可再生知识」留在这里。
#
# 本文件只有两段，职责不许混：
#
# ① entries —— **真·不可再生的知识**（竞品为何淘汰、合同成交语义、业主原话/口头规格/
#    实地断言、静默失效分析、证据等级限定）。每条带 `landing` 指向它同时落到的机读位置。
#    这段不承载状态、不承载未决项本体（未决项住 原量房台账（已于 S2-B 退场））、不承载几何。
#
# ② retired —— **墓碑一行 + git commit**。只登记 id / subject / status / superseded_by /
#    record（DEC 原文在 git 历史里的文件+行定位）/ landing（内容去了哪）。
#    **不搬正文、不搬 intent 摘要**——正文即 git 历史（AGENTS.md「一题一文档，退场不建
#    归档目录」）。它存在的机器理由是：全仓约 1,900 处 DEC 编号引用在 docs/decisions/
#    删除后仍需可解析（facts.yaml 的 c.dec_unique / c.dec_ref_resolvable 与
#    repair_channel.decision_ref 存在性校验都以本文件为 target）。
#
# 与 S1 登记簿的区别（为什么这不是换名的登记簿）：
#   登记簿 292 条 × intent 摘要（均长 324 字符）+ evidence 指针 + pending 指针 = 一份
#   中央决策账；本文件 entries 只收拆不出去的知识，retired 只留墓碑行。
#   status 不再由查表维护（业主裁定①）：构件的 confirmed/inferred/pending 是对象自己声明
#   的字段（config/state-model.yaml 优先级链只剩 [conflict, config_status, fallback]），
#   DEC 编号不再产生任何状态。
#
# YAML 铁律 7：值内含 `#`（编号 #39、色值 #c9c1b5 等）一律加引号或写进折叠块标量；
#   未加引号的裸 `#` 会被 js-yaml 静默吞掉半行——由 tests/server/decision-knowledge.test.ts
#   断言，与 scripts/verify/yaml/verify-inline-comments.ts（verify:yaml-hash）同口径。
#
# landing 词表（retired 段每条必填；路径型词元指向的文件必须真实存在，测试逐条断言）：
#   git                DEC 正文/论证/证据口径随 git 历史退场（record 给到文件+行）
#   object             本条建立的现行值已声明在 config 对象字段（note/status/blocker/结构化字段）
#   code               本条建立的现行行为已实现为代码机制
#   quote-card:<path>  预算/采购/合同语义落在报价卡或 control.yaml 合同块（L2 价层）
#   gate:<path>        失效条件已变成门禁断言（最好的归档形式：不需要任何人维护）
#   agents             纪律/流程落在 AGENTS.md
#   ledger:#N          未决项本体落在 原量房台账（已于 S2-B 退场） 第 N 条
#   knowledge:<id>      知识保留在本文件 entries 段
# ============================================================================

version: 1

entries:


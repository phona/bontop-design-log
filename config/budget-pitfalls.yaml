version: "1.0"

pitfalls:
  # === Budget Traps (type: budget) ===
  - id: waterproof_overshoot
    type: budget
    stage: waterproof
    category: waterproof
    trigger: always
    severity: high
    title: "防水常超 30%"
    description: "拆改后需修补防水层;老房水管老化易漏水,实际防水面积常比设计图大"
    mitigation: "预算上浮 30%;拆改前做闭水试验;确认防水范围含墙面 1.8m"

  - id: open_kitchen_hood
    type: budget
    stage: installation
    category: range_hood
    trigger: "selection.kitchen == 'open'"
    severity: high
    title: "开放厨房油烟机别省"
    description: "开放式厨房必须 ≥22m³/min 侧吸,否则全屋串味,窗帘家具沾油"
    mitigation: "选 22m³/min 以上;预算 2500+;侧吸比顶吸好"

  - id: curtain_hardcoded
    type: budget
    stage: installation
    category: curtains
    trigger: always
    severity: medium
    title: "玻璃幕窗帘是刚需"
    description: "全屋玻璃幕墙,窗帘不可省;纱帘+遮光帘;厨卫用防水卷帘/百叶"
    mitigation: "预算 4000+;主卧/客厅/父母房/书房预留电动窗帘电源"

  - id: smart_zero_line
    type: budget
    stage: water_electric
    category: smart_home
    trigger: always
    severity: medium
    title: "智能零线预留成本"
    description: "智能开关需零线,后期改造成本 10 倍(需拆墙走线)"
    mitigation: "水电阶段全屋预留零线;预算 2000;不上调光/自动化"

  - id: contingency_reserve
    type: budget
    stage: planning
    category: contingency
    trigger: always
    severity: high
    title: "不可预见费留 10%"
    description: "老房拆改常发现隐藏问题(承重墙位置/管道老化/梁位);10% 不可预见费是底线"
    mitigation: "totalBudget * 10% 作为 contingency;拆改前做全面检查"

  - id: demolition_unknown
    type: budget
    stage: demolition
    category: demolition
    trigger: always
    severity: medium
    title: "拆改范围不确定"
    description: "设计图标注的非承重墙需物业/设计院确认;承重墙绝对不能拆"
    mitigation: "拆改前获取竣工图;物业审批;预留拆改后的修补费用"

  - id: hvac_platform
    type: budget
    stage: installation
    category: hvac
    trigger: always
    severity: high
    title: "中央空调外机散热"
    description: "西设备平台仅 2.48㎡,外机叠放散热差、噪音大、维修难"
    mitigation: "优先多联机;外机不叠放;预留检修空间;确认平台承重"

  - id: tile_waste_rate
    type: budget
    stage: masonry
    category: masonry
    trigger: always
    severity: medium
    title: "瓷砖损耗率 5-8%"
    description: "异形房间(弧角/飘窗)瓷砖切割损耗大;大砖(800x800)比小砖损耗高"
    mitigation: "预算含 5-8% 损耗;弧角区域用小砖;连纹大砖损耗更高"

  - id: floor_vs_furniture_tradeoff
    type: budget
    stage: planning
    category: tradeoff
    trigger: manual
    severity: low
    title: "地板 vs 家具升级优先级"
    description: "地板每天踩,铺了难换(需砸砖);家具可后期逐步升级;硬装优先于软装"
    mitigation: "优先升级地板和硬装;家具先用基础款;沙发/床垫可后期换"

  # === Construction Shortcuts (type: construction) ===
  - id: waterproof_shortcut
    type: construction
    stage: waterproof
    category: waterproof
    trigger: always
    severity: high
    title: "防水偷工减料重灾区"
    description: "涂刷遍数不够(应 2-3 遍)、墙面高度不够(淋浴区应 1.8m)、防水层破损未修补、管根/阴角未做圆弧处理"
    mitigation: "要求施工队:遍数≥2遍;淋浴区墙面≥1.8m;管根/阴角做圆弧+网格布;涂刷后做保护层"

  - id: electric_shortcut
    type: construction
    stage: water_electric
    category: water_electric
    trigger: always
    severity: high
    title: "水电偷工减料重灾区"
    description: "线管质量差(应阻燃PVC)、单管穿线过多(不超过管径40%)、零线未预留(智能开关需要)、线管接头未用胶水、强弱电未分管"
    mitigation: "要求:阻燃PVC线管;单管穿线≤40%;全屋预留零线;强弱电分管间距≥30cm"

  - id: masonry_shortcut
    type: construction
    stage: masonry
    category: masonry
    trigger: always
    severity: high
    title: "泥瓦偷工减料重灾区"
    description: "找平层太薄(应≥2cm)、瓷砖背胶未刷/刷不够、留缝太小(应1.5-2mm)、空鼓(>15%不合格)、地漏处坡度不够"
    mitigation: "要求:找平≥2cm;大砖刷背胶;留缝1.5-2mm;铺贴后24h检查空鼓;卫生间坡度≥1%"

  - id: painting_shortcut
    type: construction
    stage: painting
    category: painting
    trigger: always
    severity: medium
    title: "油漆偷工减料重灾区"
    description: "腻子遍数不够(应2-3遍)、底漆不刷或兑水太多、阴阳角不直、接缝处不开裂处理"
    mitigation: "要求:腻子≥2遍;底漆必刷;阴阳角用PVC角条;接缝处贴网格布"

  - id: carpentry_shortcut
    type: construction
    stage: carpentry
    category: carpentry
    trigger: always
    severity: medium
    title: "木工偷工减料重灾区"
    description: "吊顶龙骨间距过大(应≤400mm)、石膏板拼接处未留缝、柜体背板太薄(应≥9mm)、五金件以次充好"
    mitigation: "要求:龙骨间距≤400mm;石膏板留V型缝;背板≥9mm;五金用品牌(海蒂诗/百隆)"

  - id: door_window_shortcut
    type: construction
    stage: installation
    category: doors_windows
    trigger: always
    severity: medium
    title: "门窗安装偷工减料重灾区"
    description: "门框灌浆不实、合页螺丝少打、密封胶打得不均匀、门吸位置不合理"
    mitigation: "要求:门框灌浆密实;合页螺丝全打;密封胶均匀无断点;门吸避开踢脚线"

  - id: cabinet_install_shortcut
    type: construction
    stage: installation
    category: kitchen_cabinet
    trigger: always
    severity: medium
    title: "橱柜安装偷工减料重灾区"
    description: "柜体不水平、台面拼接缝明显、五金件未调阻尼、下水管未做存水弯"
    mitigation: "要求:水平仪校正;台面拼接打磨;五金调阻尼;下水管做存水弯防臭"

  - id: sanitary_install_shortcut
    type: construction
    stage: installation
    category: sanitary
    trigger: always
    severity: medium
    title: "卫浴安装偷工减料重灾区"
    description: "马桶法兰圈未装/装歪、地漏未做存水弯、花洒混水阀高度不对、浴室柜未固定"
    mitigation: "要求:法兰圈正确安装;地漏存水弯;混水阀高度110cm;浴室柜膨胀螺丝固定"

  # === Appliance Installation Pitfalls (type: construction) ===
  - id: ac_weld_nitrogen
    type: construction
    stage: installation
    category: appliance_hvac
    trigger: always
    severity: high
    title: "铜管焊接未充氮保护"
    description: "铜管焊接不充氮保护，内壁氧化 → 堵塞系统 → 压缩机损坏"
    mitigation: "要求充氮焊接，写进合同"

  - id: ac_vacuum
    type: construction
    stage: installation
    category: appliance_hvac
    trigger: always
    severity: high
    title: "抽真空不足15分钟"
    description: "系统含水 → 制冷差、压缩机磨损"
    mitigation: "验收时要求看真空泵运行时间"

  - id: ac_drain_slope
    type: construction
    stage: installation
    category: appliance_hvac
    trigger: always
    severity: high
    title: "冷凝水管未做坡度"
    description: "漏水泡吊顶"
    mitigation: "吊顶前确认1%坡度"

  - id: ac_level
    type: construction
    stage: installation
    category: appliance_hvac
    trigger: always
    severity: medium
    title: "内机安装不水平"
    description: "漏水、异响"
    mitigation: "安装后用水平尺检查"

  - id: ac_vent_open
    type: construction
    stage: installation
    category: appliance_hvac
    trigger: always
    severity: high
    title: "风口尺寸与吊顶开口不对"
    description: "装不进去或漏缝难看"
    mitigation: "吊顶木工进场前，给木工风口尺寸图纸"

  - id: ac_heat_dissipation
    type: construction
    stage: installation
    category: appliance_hvac
    trigger: always
    severity: high
    title: "外机散热空间不足"
    description: "过热停机、费电"
    mitigation: "确认外机位百叶通风面积 ≥ 80%"

  - id: ac_access
    type: construction
    stage: installation
    category: appliance_hvac
    trigger: always
    severity: medium
    title: "没留检修口"
    description: "坏了要拆吊顶"
    mitigation: "检修口位置提前规划"

  - id: wh_exhaust_pipe
    type: construction
    stage: installation
    category: appliance_water_heater
    trigger: always
    severity: high
    title: "排烟管用铝箔管(应用不锈钢)"
    description: "高温烧穿 → CO泄漏"
    mitigation: "指定用不锈钢排烟管"

  - id: wh_exhaust_outdoor
    type: construction
    stage: installation
    category: appliance_water_heater
    trigger: always
    severity: high
    title: "排烟管未伸出室外"
    description: "CO中毒"
    mitigation: "装完检查排烟口伸出外墙 ≥ 30cm"

  - id: wh_gas_pipe
    type: construction
    stage: installation
    category: appliance_water_heater
    trigger: always
    severity: high
    title: "燃气管用软管(应用专用硬管)"
    description: "漏气爆炸"
    mitigation: "要求燃气管必须是燃气专用管"

  - id: wh_return_water
    type: construction
    stage: installation
    category: appliance_water_heater
    trigger: always
    severity: high
    title: "未预埋回水管"
    description: "零冷水装不了"
    mitigation: "水电阶段提前铺好回水管"

  - id: wh_gas_meter
    type: construction
    stage: installation
    category: appliance_water_heater
    trigger: always
    severity: medium
    title: "安装位置离燃气表太远"
    description: "改表费上千"
    mitigation: "热水器尽量靠近燃气表"

  - id: hood_duct
    type: construction
    stage: installation
    category: appliance_range_hood
    trigger: always
    severity: high
    title: "烟管未预埋到外墙"
    description: "油烟排不出去"
    mitigation: "贴砖前预埋烟管到外墙排烟口"

  - id: hood_check_valve
    type: construction
    stage: installation
    category: appliance_range_hood
    trigger: always
    severity: medium
    title: "止逆阀未装"
    description: "邻居油烟灌进你家"
    mitigation: "买烟机时一起买止逆阀"

  - id: hood_cutout
    type: construction
    stage: installation
    category: appliance_range_hood
    trigger: always
    severity: high
    title: "灶具开孔尺寸未给橱柜厂"
    description: "台面开错孔要重做"
    mitigation: "橱柜复尺前发灶具开孔图给厂家"

  - id: hood_height
    type: construction
    stage: installation
    category: appliance_range_hood
    trigger: always
    severity: medium
    title: "烟机高度未算对"
    description: "碰头或吸力不够"
    mitigation: "侧吸离灶台35-45cm，顶吸65-75cm"

  - id: purifier_outlet
    type: construction
    stage: installation
    category: appliance_water_purifier
    trigger: always
    severity: high
    title: "未预留插座"
    description: "净水器装不了"
    mitigation: "水电阶段在厨下留插座"

  - id: purifier_space
    type: construction
    stage: installation
    category: appliance_water_purifier
    trigger: always
    severity: medium
    title: "橱柜下空间不够"
    description: "净水器塞不进去"
    mitigation: "买之前量柜下高度（需 > 45cm）"

  - id: purifier_drain
    type: construction
    stage: installation
    category: appliance_water_purifier
    trigger: always
    severity: high
    title: "未留排污管(反渗透)"
    description: "废水没地方排"
    mitigation: "水电阶段厨下预留排水管"

  - id: purifier_prefilter
    type: construction
    stage: installation
    category: appliance_water_purifier
    trigger: always
    severity: medium
    title: "前置过滤器未装"
    description: "全屋用水无粗滤"
    mitigation: "进水总阀后装、需预留排水"

  - id: laundry_stack
    type: construction
    stage: installation
    category: appliance_laundry
    trigger: always
    severity: high
    title: "叠放未确认承重"
    description: "机器倾倒"
    mitigation: "买专用叠放支架，确认洗衣机承重 ≥ 120kg"

  - id: laundry_outlet
    type: construction
    stage: installation
    category: appliance_laundry
    trigger: always
    severity: medium
    title: "插座在机器正后方"
    description: "插头顶住推不进去"
    mitigation: "插座留在侧面柜体或离地30cm侧边"

  - id: laundry_drain
    type: construction
    stage: installation
    category: appliance_laundry
    trigger: always
    severity: high
    title: "排水管未做墙排"
    description: "地漏反水"
    mitigation: "预埋排水管到机器位，不走地漏"

  - id: smart_zero_line
    type: construction
    stage: installation
    category: appliance_smart_home
    trigger: always
    severity: high
    title: "开关未拉零线"
    description: "智能开关装不了"
    mitigation: "水电阶段跟电工说：所有开关盒拉零线"

  - id: smart_gateway
    type: construction
    stage: installation
    category: appliance_smart_home
    trigger: always
    severity: medium
    title: "未考虑网关位置"
    description: "信号覆盖不到"
    mitigation: "网关放房子中央（走廊/客厅），提前留插座"

  - id: smart_curtain
    type: construction
    stage: installation
    category: appliance_smart_home
    trigger: always
    severity: medium
    title: "窗帘电机未留电源"
    description: "电动窗帘装不了"
    mitigation: "窗帘盒旁边预留插座"

  # === Acceptance Checkpoints (type: acceptance) ===
  - id: waterproof_acceptance
    type: acceptance
    stage: waterproof
    category: waterproof
    trigger: always
    severity: high
    title: "防水验收要点"
    description: "闭水试验:蓄水深度≥2cm,持续24-48小时,楼下无渗漏;墙面防水高度:淋浴区≥1.8m,其他≥0.3m"
    mitigation: "工具:闭水试验;检查墙面高度;目测防水层无破损"
    checklist:
      - "闭水试验 24-48h 无渗漏"
      - "淋浴区墙面防水 ≥1.8m"
      - "管根/阴角做圆弧处理"
      - "防水层无破损/气泡"

  - id: electric_acceptance
    type: acceptance
    stage: water_electric
    category: water_electric
    trigger: always
    severity: high
    title: "水电验收要点"
    description: "水管打压:0.8MPa 保压30分钟无压降;电线绝缘测试;线管材质确认;穿线数量检查"
    mitigation: "工具:打压泵、绝缘摇表;检查线管阻燃标识;数穿线数量"
    checklist:
      - "水管打压 0.8MPa 30min 无压降"
      - "电线绝缘测试合格"
      - "线管阻燃PVC(看标识)"
      - "单管穿线 ≤40%管径"
      - "强弱电分管间距 ≥30cm"
      - "全屋零线预留"

  - id: masonry_acceptance
    type: acceptance
    stage: masonry
    category: masonry
    trigger: always
    severity: medium
    title: "泥瓦验收要点"
    description: "空鼓率<5%(空鼓锤)、平整度2m靠尺±2mm、阴阳角方正、卫生间坡度泼水试验、留缝均匀"
    mitigation: "工具:空鼓锤、2m靠尺、塞尺、水平仪"
    checklist:
      - "空鼓率 <5%(空鼓锤全敲)"
      - "平整度 2m靠尺 ±2mm"
      - "阴阳角方正(用角尺)"
      - "卫生间泼水试验无积水"
      - "留缝均匀 1.5-2mm"
      - "地漏处坡度正确"

  - id: painting_acceptance
    type: acceptance
    stage: painting
    category: painting
    trigger: always
    severity: low
    title: "油漆验收要点"
    description: "墙面无明显色差、无流坠、无砂眼、阴阳角顺直、收边整齐"
    mitigation: "工具:手电筒侧照、目测"
    checklist:
      - "无色差(自然光下)"
      - "无流坠/砂眼"
      - "阴阳角顺直"
      - "收边整齐"

  - id: carpentry_acceptance
    type: acceptance
    stage: carpentry
    category: carpentry
    trigger: always
    severity: medium
    title: "木工验收要点"
    description: "吊顶无开裂、柜门开关顺畅、缝隙均匀(≤2mm)、五金件功能正常"
    mitigation: "工具:目测、手感、开关门测试"
    checklist:
      - "吊顶无开裂(拼接缝处)"
      - "柜门开关顺畅无异响"
      - "柜门缝隙均匀 ≤2mm"
      - "五金件(铰链/滑轨)功能正常"

  - id: installation_acceptance
    type: acceptance
    stage: installation
    category: doors_windows
    trigger: always
    severity: medium
    title: "安装验收要点"
    description: "门开关无异响、密封胶均匀、洁具无划痕、下水通畅"
    mitigation: "工具:目测、手感、冲水测试"
    checklist:
      - "门开关无异响"
      - "密封胶均匀无断点"
      - "洁具无划痕/瑕疵"
      - "下水通畅(冲水/倒水测试)"


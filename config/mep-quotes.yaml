# 水电报价卡片（2026-10-07 迁移到 shared/quote-cards.ts 卡片模型，与吊顶报价同源语义）。
#
# 一张卡 = 一个可执行方案（品牌档位 + 人工口径）。**量不在这里**：工程量由
# shared/mep-takeoff.ts 从 config/electrical.yaml / plumbing.yaml / electrical-topology.yaml /
# mep-hvac-coordination.yaml 实算，报价方只报单价 + 含项范围，不允许自带米数/面积。
#
# 铁律：
#  1. `active:` 指向生效卡片；切换只改这一行（POST /api/mep/quotes/active 或 MCP set_mep_quote，
#     都会留 .bak、保留注释），Git diff 只有一行。
#  2. `per_unit: null` = 待报价：数量照样显形、金额不编，杜绝「换个报价把活儿变没」。
#  3. 未声明的行回落到 config/mep-labor.yaml（server/mep-quotes.ts 的 mepQuoteFallback() 读取），
#     并标 rate_source: mep-labor.yaml——回落必须看得见，不悄悄替换。人工五行的费率在那里维护。
#  4. `out_of_scope` = 这家不报这项（≠ 待报价）：总额照算，该行只显形。
#  5. 缺 scope_note 的报价行 → comparable:false（AGENTS.md：不同口径不可直接比较）。
#  6. **同品牌同规格不同系列价差可达 2~3 倍**（伟星 25×3.5：家装绿 ¥110/根 vs 工程灰 ¥42.10/根）。
#     系列/货号/压力等级必须写进采购单，不能只写「伟星25热水管」——本文件用卡片区分档位。
#  7. 页面按根(4m)/卷(100m)/箱(305m)计价时，各行 scope_note 都记录了「页面价 ÷ 包装」的换算。


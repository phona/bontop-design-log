tradeoffs:
  - topic: tile_installation
    label: "瓷砖铺贴"
    options:
      - label: "装修公司包工"
        cost: 4500
        risk: medium
        time_days: 3
        acceptance_items: ["空鼓率<5%", "缝隙2mm", "平整度2m靠尺<2mm"]
      - label: "自己找师傅"
        cost: 3000
        risk: high
        time_days: 4
        tips: "小区群里问邻居用过的师傅"
        acceptance_items: ["同上"]

  - topic: paint_brand
    label: "乳胶漆品牌"
    options:
      - label: "多乐士"
        cost: 1800
        risk: low
        note: "市场占有率最高，配色最准"
      - label: "立邦"
        cost: 1600
        risk: low
        note: "价格略低，颜色可选范围小"
      - label: "三棵树"
        cost: 1200
        risk: medium
        note: "最便宜，但调色偏差较大"

  - topic: procurement_mode
    label: "采购模式"
    options:
      - label: "装修公司代购"
        cost: 0
        risk: low
        note: "省心省力，统一进场"
      - label: "自己采购"
        cost: 0
        risk: medium
        note: "可对比价格，需自行协调物流"
      - label: "跟团购"
        cost: 0
        risk: high
        tips: "关注本地装修群、小区群开团信息"
        note: "价格最低，但发货周期不确定"

  - topic: hvac_brand
    label: "中央空调品牌（DEC-2026-09-07-055 深化：7HP 级一拖五，全包参考价）"
    options:
      - label: "A 美的 7匹（理想家IV/酷省电Pro）"
        cost: 31000
        risk: low
        note: "主推：全直流变频、内机厚约200mm易藏吊顶、南宁售后密；2.8-3.4万"
      - label: "B 格力 7匹档多联机"
        cost: 35000
        risk: low
        note: "稳妥耐用；3.2-3.8万"
      - label: "E 海尔智尊系列"
        cost: 28500
        risk: medium
        note: "居中档 2.5-3.2万；南宁网点弱于美的/格力"
      - label: "D 大金/日立（不推荐）"
        cost: 60000
        risk: medium
        note: "APF 5.5+ 但超预算；6万+"
      - label: "C 小米 6匹（有条件）"
        cost: 20000
        risk: high
        note: "1.6-2.3万+10年质保，但 6HP 对 21.4kW 内机连接率 138% 超上限；须商家书面确认内机 ≤20kW 配置单，否则不碰"

  - topic: floor_material
    label: "客餐厅地面材料"
    options:
      - label: "木纹砖通铺"
        cost: 5500
        risk: low
        note: "木纹颜值+瓷砖耐用，美缝做好像木地板"
      - label: "实木复合地板"
        cost: 7000
        risk: medium
        note: "脚感好但怕水怕刮，南宁回南天需注意"
      - label: "灰色柔光砖"
        cost: 4800
        risk: low
        note: "现代感强，耐脏，但不如木纹温馨"

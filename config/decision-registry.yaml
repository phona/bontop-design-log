# ============================================================================
# config/decision-registry.yaml —— DEC 决策登记簿（issue #98 第六阶段 S1「先立替代」）
#
# 作用：给 docs/decisions/ 的 DEC 编号一个机器可解析的新家（状态、取代边、intent 摘要、
#       证据与未决项指针）。S1 只立不删：docs/decisions/ 一字节未动，本簿是纯新增载体。
#
# 条目数：292 = docs/decisions/ 全部 `### DEC-` 标题实测数（含 -补/-补2/-补3/-补记三~六/.1/.2
#         补充号族；README 自述 278、docs/README 写 268 均为过期快照，一律以标题实测为准）。
#
# status 判定（设计文档 §5-S1；决策铁律第 4 条：量不到标待实测，不猜）
#   ① 机器抽取：标题级取代标记 + 正文「推翻/取代/覆盖/废止/supersedes/改判/重开」声明，
#      得 110 条候选取代边（含部分覆盖），逐条人工核对（05/06/08 三卷全量，其余卷按候选行全读）。
#   ② superseded = 后续 DEC 使本条**主裁定对象**不再现行（superseded_by 指名取代者）；
#      仅部分子结论被覆盖而整条仍现行的，写进 intent「部分覆盖」，status 仍为 active（设计 A4：不可整条删）。
#   ③ active = 在①的抽取 + 人工核对范围内未发现取代本条的声明；不等于逐条人工确认仍活跃。
#   ④ archived = 06-electrical-archive.md 归档分册（卷头「已被全量推翻」）；这 4 条的 superseded_by
#      指向主卷里实际执行取代的 DEC（若已判定）。
#   ⑤ 本版无 待实测 条目：所有机器抽取到的边都已人工判定为 superseded 或部分覆盖；
#      未被任何声明触及的条目按③记 active。S2/S3 若补充抽取发现漏判，以本簿 + git 历史回改。
#
# intent 最低内容要求（设计文档 §2.2-T1）：写清「裁定是什么 + 触发/失效反转条件 + 卡在谁」；
#   带 owner/trigger 的开放项在 intent 或 pending 显形；只写标题复述视为未迁移（测试断言 intent 长度）。
# evidence：仓内原件/配置路径；首条 `docs/decisions/<文件>#L<行>` 是 DEC 原文定位，S3 删档后由
#   git 历史 + retired_commit 承接（本版 retired_commit 全为 null——未删任何东西）。
# pending：只指向 docs/pending-site-data.md 真实存在的编号；未登记进台账的开放项只进 intent，不虚构编号。
#
# YAML 铁律 7：值内含 `#`（编号 #41、色值 #c9c1b5 等）一律加引号或写进折叠块标量；
#   未加引号的裸 `#` 会被 js-yaml 静默吞掉半行——由 tests/server/decision-registry.test.ts 断言，
#   与 scripts/verify/yaml/verify-inline-comments.ts（verify:yaml-hash）同口径。
# ============================================================================


    - "config/materials.yaml floor_tile_kt_200x1200_01.baseline_note"
  overturns:
    - id: "DEC-2026-08-01-040"
      was: "600×1200 木纹砖步步高错缝为全屋默认地面（推翻 DEC-024 人字拼）"
      why_reversible: "该结论只有 65 元/片≈102 元/㎡ 的估算价，从未取得门店报价单；KT 200×1200 有手写报价单原件归档（docs/design-iterations/tile-plank-comparison-20261006/evidence/kt-quote-original.jpg），且同口径落地价更低、业主判定效果更优。DEC-040 的渲染与历史保留追溯，不作废条目。"
  remaining_before_order:
    - "carton_size：KT 与金意陶均 unknown，箱规未知前不能按 516/970 片下单"
    - "KT 报价单分房墙砖量与模型不符（主卫超约25%、客卫超约14%、厨房少约5.52㎡），选 KT 须重算墙砖量"
    - "瓦工工费书面报价（费率卡为 preliminary），并明确按净面积还是实铺面积计价"
    - "历史候选对比：KT报价¥14,964仍非成交价；原PKG-060缺口¥14,296→约¥9,264口径已被DEC-2026-10-16-TILE-01当前墙砖范围推翻。现行资金口径以schedule/phase-1/control.yaml及其生成budget.md为准；不得沿用旧资金差额"
    - "卫生间地面 300 元/间「面积不计」两读未裁（config/masonry-labor.yaml 的 bathroom_floor_charge_interpretations）"


    - 转角统一做圆弧工艺不另外收费。
    - 密缝以及薄贴工艺单价另议。
    - 阳台贴墙砖另加5元/㎡。
    - 墙砖丈量方式：窗口面积不减；门口双包边减洞口面积，单包边不减面积。
    - 厨房大砖搭配杂砖铺贴时以大砖单价为准，具体可再议。
    - 常规地砖铺贴方式为半干水泥砂浆铺贴；本表为初步报价，特殊情况特殊报价。

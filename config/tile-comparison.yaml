grout_model:
  # 美缝叙事（公式、缝长 600×1200 279.7m / KT 652.5m / 约900×150 870.1m、¥20/㎡ 口述价
  # 与核价问法、行业耗量参考、¥8/米压力测试、定额拆分口径）唯一存放于 §09「美缝规格敏感性」。
  # 本节只保留 cost-summary.ts 的对账最小集：owner_target_cny 须与 QR-2026-10-03-07 的
  # owner_target_cny fail-closed 一致；computed_need_cny 供干区交叉核对。
  # docs/decisions/04-bathrooms.md 裁定④引用的干区缝长 652.5m 已随叙事迁至 §09。
  pkg130_reconciliation:
    pkg_id: "PKG-130"
    planned_cny: 4000
    owner_target_cny: 4500
    computed_need_cny: 2308
    headroom_cny: 1692
    note: "定额拆分（DEC-2026-10-22-R03）：全屋美缝定额 ¥4,500（DEC-2026-08-22「美缝环氧彩砂暂估 4.5k」与 QR-2026-10-03-07，暂估非算量）按砖缝长度估算拆为 PKG-065 卫生间 ¥500 + PKG-130 其余区域 ¥4,000。干区实算 ¥2,308 = 115.404㎡ × ¥20/㎡（业主 2026-10-12 口述包工包料，未确认是否覆盖 200×1200；干区面积 2026-10-23 DEC-2026-10-23-R04 后 111.864→115.404㎡、实算 2,237→2,308），属 PKG-130 范围，余量 1,692。湿区（PKG-065，缝长约 56m）按米成本无任何估值，不据此证明全屋 ≤ 定额；若门店价远高于 3.32 元/米缝（如 8 元/米以上），定额转紧。"


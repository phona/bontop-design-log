version: "1.0"

objectMapping:
  - pattern: "floor:*"
    topics: [floor]
  - pattern: "wall:*"
    topics: [wall, paint]
  - pattern: "ceiling:*"
    topics: [paint]
  - pattern: "hvac:*"
    topics: [hvac]
  - pattern: "platform_boundary"
    topics: [hvac]

budget:
  baseCategoriesFrom: config/budget/base.json
  topicCategories:
    floor: masonry
    wall: masonry
    paint: painting
    hvac: hvac
  lineItems:
    - topic: floor
      quantityField: floorArea
    - topic: wall
      quantityField: wetWallArea
    - topic: paint
      quantityField: paintWallArea
    - topic: hvac

risks: []
constraints: []

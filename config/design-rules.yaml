version: "1.0"

objectMapping:
  - pattern: "floor:*"
    topics: [floor]
  - pattern: "wall:*"
    topics: [wall, paint]
  - pattern: "ceiling:*"
    topics: [paint]
  - pattern: "hvac:*"
    topics: [hvac]
  - pattern: "platform_boundary"
    topics: [hvac]

budget:
  baseCategoriesFrom: config/budget/base.json
  topicCategories:
    floor: masonry
    wall: masonry
    paint: painting
    hvac: hvac
    cabinet: kitchen_cabinet
    countertop: kitchen_cabinet
    interior_door: doors_windows
    bathroom_door: doors_windows
    entry_door: doors_windows
    curtain: curtains
    toilet: sanitary
    shower: sanitary
    vanity: sanitary
    faucet: sanitary
    lighting: lighting
    switch_socket: water_electric
    range_hood: range_hood
    water_heater: water_electric
    smart_home: smart_home
    hardware: miscellaneous
    bed: furniture_soft
    mattress: furniture_soft
    wardrobe: furniture_soft
    sofa: furniture_soft
    dining_table: furniture_soft
    dining_chair: furniture_soft
    tv_stand: furniture_soft
    desk: furniture_soft
    chair: furniture_soft
    bookshelf: furniture_soft
    shoe_cabinet: furniture_soft
    coffee_table: furniture_soft
    gas_stove: appliances
    dishwasher: appliances
    water_purifier: appliances
    washer: appliances
    dryer: appliances
    shower_enclosure: appliances
  # 家具 furnishing type（house.yaml）→ 预算 topic 映射；
  # count 模式据此把 bed_180/bed_150 等归并到 bed topic 计价（修复 type≠topic 漏算）
  furnishingTypeToTopic:
    bed_180: bed
    bed_150: bed
    mattress_180: mattress
    mattress_150: mattress
    wardrobe_240: wardrobe
    wardrobe_240_split: wardrobe
    wardrobe_180: wardrobe
    mb_washbasin_cabinet: vanity
    master_dressing_table: vanity
    dressing_stool: chair
    mb_vanity_base_cabinet: wardrobe
    mb_vanity_lower_board: wardrobe
    mb_vanity_main_board: wardrobe
    mb_vanity_pvc_box: wardrobe
    sofa_3seat: sofa
    shoe_cabinet: shoe_cabinet
  # applyRooms：限定算量范围，避免材料满铺到不施工的房间（电梯井等）。
  # DEC-041：地砖统一为单一 floor topic + 分房覆盖（roomOverrides）。
  # floor=全屋铺地房间；入户花园 entry_garden 开发商已铺 → 移出算量（渲染仍可视化但不计费，见 DEC-041）。
  # 显式房间覆盖（roomOverrides）始终尊重并计费，applyRooms 仅约束 default 满铺。wall=仅湿区贴砖；cabinet/countertop=仅厨房。
  lineItems:
    - topic: floor
      quantityField: floorArea
      calcMode: area
      applyRooms: [master_bath, guest_bath, kitchen, balcony, living_dining, master_bedroom, study, bedroom_nw, bedroom_se]
    - topic: wall
      quantityField: wetWallArea
      calcMode: area
      applyRooms: [master_bath, guest_bath, kitchen, balcony]
    - topic: paint
      quantityField: paintWallArea
      calcMode: area
    - topic: hvac
      calcMode: fixed
    - topic: cabinet
      quantityField: linearKitchen
      calcMode: length
      applyRooms: [kitchen]
    - topic: countertop
      quantityField: linearKitchen
      calcMode: length
      applyRooms: [kitchen]
    - topic: interior_door
      quantityField: doorCount
      calcMode: count
    - topic: bathroom_door
      quantityField: doorCount
      calcMode: count
    - topic: entry_door
      quantityField: doorCount
      calcMode: count
    - topic: toilet
      quantityField: fixtureCount
      calcMode: count
    - topic: shower
      quantityField: fixtureCount
      calcMode: count
    - topic: vanity
      quantityField: fixtureCount
      calcMode: count
    - topic: faucet
      quantityField: fixtureCount
      calcMode: count
    - topic: lighting
      calcMode: fixed
    - topic: switch_socket
      calcMode: fixed
    - topic: range_hood
      calcMode: fixed
    - topic: water_heater
      calcMode: fixed
    - topic: smart_home
      calcMode: fixed
    - topic: hardware
      calcMode: fixed
    - topic: curtain
      calcMode: fixed
    - topic: bed
      calcMode: count
    - topic: mattress
      calcMode: count
    - topic: wardrobe
      calcMode: count
    - topic: sofa
      calcMode: count
    - topic: dining_table
      calcMode: count
    - topic: dining_chair
      calcMode: count
    - topic: tv_stand
      calcMode: count
    - topic: desk
      calcMode: count
    - topic: chair
      calcMode: count
    - topic: bookshelf
      calcMode: count
    - topic: shoe_cabinet
      calcMode: count
    - topic: coffee_table
      calcMode: count
    # 家电（appliances 池，各为独立 topic，fixed 单件整屋）
    - topic: gas_stove
      calcMode: fixed
    - topic: dishwasher
      calcMode: fixed
    - topic: water_purifier
      calcMode: fixed
    - topic: washer
      calcMode: fixed
    - topic: dryer
      calcMode: fixed
    - topic: shower_enclosure
      calcMode: fixed

risks:
  - id: "kitchen_hood_weak"
    severity: "high"
    when:
      topic: "range_hood"
      condition: "$option.airflow < 22"
    message: "开放式厨房必须配 ≥22m³/min 侧吸油烟机，当前油烟机风量不足"

  - id: "outdoor_unit_overflow"
    severity: "high"
    when:
      topic: "hvac"
      condition: "$selection.hvac == 'E1'"
    message: "叠叠乐方案外机过多，散热、噪音、维修风险高，不建议"

  - id: "garden_outdoor_warning"
    severity: "medium"
    when:
      topic: "hvac"
      condition: "$selection.hvac == 'F2'"
    message: "外机放入户花园存在噪音、热风及物业/消防风险，需现场确认"

  - id: "floor_tile_no_frost"
    severity: "medium"
    when:
      topic: "floor"
      condition: "$selection.floor == 'floor_tile_03'"
    message: "亮光砖反光较强，客厅大面积使用可能刺眼；建议搭配哑光家具和窗帘"

  - id: "dark_tile_small_room"
    severity: "low"
    when:
      topic: "wall"
      condition: "$selection.wall == 'wall_tile_03'"
    message: "灰色仿古砖在小卫生间使用可能显暗，建议搭配亮色灯光"

  - id: "wall_tile_cost_warning"
    severity: "low"
    when:
      topic: "wall"
      condition: "$selection.wall == 'wall_tile_02'"
    message: "柔光白瓷片价格 22 元/片，比标配贵 83%，全屋墙砖预算将明显增加"

constraints:
  - id: "open_kitchen_hood"
    when:
      topic: "kitchen"
      condition: "$selection.kitchen == 'open'"
    require:
      topic: "range_hood"
      minValue:
        field: "airflow"
        value: 22
    description: "开放式厨房必须选配 ≥22m³/min 油烟机"

  - id: "hvac_platform_check"
    when:
      topic: "hvac"
      condition: "$selection.hvac == 'E1'"
    require:
      topic: "hvac"
      fields: ["outdoor_width"]
    description: "E1 方案多台外机需确认西平台宽度是否足够"

  - id: "no_mount_on_curtain_wall"
    severity: "high"
    when:
      topic: "electrical"
      condition: "$item.wall in overlay.suppress.walls"
    description: "不能在玻璃幕墙（已 suppress 的墙）上安装插座/电视/挂件"

  - id: "tv_socket_near_tv_stand"
    severity: "medium"
    when:
      topic: "electrical"
      condition: "$item.id == 'sock_living_tv' && dist($item, furniture.tv_stand) > 1.5"
    description: "电视插座与电视柜距离超过 1.5m，请确认布局一致性"

  - id: "curtain_power_near_curtain_wall"
    severity: "medium"
    when:
      topic: "electrical"
      condition: "$item.note contains '窗帘' && dist_to_suppressed_wall($item) > 2.0"
    description: "电动窗帘电源应靠近对应玻璃幕墙（距离 ≤ 2m）"

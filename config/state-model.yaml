# 构件级工程状态派生模型（`npm run state:project`）
#
# 本文件只声明**规则顺序与状态词映射**，不复制任何坐标、面积或构件的状态值——
# 那些权威仍在 config/*.yaml、docs/pending-site-data.md、docs/decisions/ 与各 verifier。
# 派生不出来的状态是 `undeclared`：一种要显形的状态，不是「默认已确认」。

# 2026-11-07（issue #98 第三阶段 S6）删除的字段：原 `element_bearing_files`
# （`config/electrical.yaml: electrical` 等三行，file → objectId 前缀表）。它与
# shared/pending-ledger.ts 的 ELEMENT_BEARING_FILES 是同一张表的两份登记，S1 把
# config/ceiling.yaml 搬进 config/model/envelope/ 后两边都要改——「文件路径构成身份」
# 的典型形态。现单一真相在 shared/envelope-sources.ts 的来源注册表（源名 → 权威文件 →
# objectId 前缀），台账腐烂核对改读注册表；本文件不再登记任何配置路径。

version: 1

# 优先级：从高到低，第一条命中的规则决定该构件的 status。
#   conflict       有 error 级 verifier issue 触及它      → conflicted
#   config_status  config 里有 status/position_status    → 按下面词汇表映射
#   ledger         命中 docs/pending-site-data.md 某条   → pending（附 #编号与「卡在谁」）
#   decision       声明 note 里有 DEC 引用               → confirmed
#   fallback        以上都不命中                         → undeclared（显形）
# 顺序可调，但删掉任何一条都会让对应实现变成「未申报规则」而告警——覆盖矩阵不许说谎。
priority: [conflict, config_status, ledger, decision, fallback]

# config 状态词 → 统一状态词。
#   likely → inferred：两者都未经现场核实，统一按「推断」处理；原值保留在 statusSource 里。
status_vocabulary:
  measured: measured
  likely: inferred
  inferred: inferred
  pending: pending
  confirmed: confirmed

# 派生时读取的 issue 来源（verifier 名，对应 scripts/verify/ 下的入口）。
# 只取**与构件绑定相关**的 verifier；全量门禁结论看 `npm run verify:all -- --json`。
issue_sources:
  - verify-spatial
  - verify-penetration
  - verify-electrical

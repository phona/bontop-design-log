  reason: "DEC-2026-10-13-R1：替换原 living_track_main 条目（明装轨道灯 anchorY_offset 0，理由是「贴安装完成面表现明装导轨」）。改吸顶灯后轨道不再存在，挂点改为灯罩下缘，故 offset 0→-0.25。"

# Render-only lighting anchors.
#
# 单一事实源约定（AGENTS.md 反双写铁律）
# ──────────────────────────────────────────────────────────────────
# `config/electrical.yaml` 的 `height` 是**施工安装完成面高度**（电气/施工口径，
# 决定底盒、吊顶开孔与人体可达性），本文件不再重复书写该绝对值，只登记
# `anchorY_offset`：**渲染挂点相对 electrical.height 的偏移**（米，正数更高）。
#
#   渲染锚点 anchorY = electrical.height + anchorY_offset
#
# 派生发生在 shared/project-render-facts-projection.ts（唯一计算处），
# 渲染端拿到的永远是派生后的绝对值，因此本文件不存在第二个高度事实。
#
# 每一条 offset 必须写 `basis`：说明为什么这个渲染挂点不等于安装完成面
# （灯罩厚度、吊顶完成面、既有边吊嵌入、视觉校正等）。offset 的绝对值
# 由 config/facts.yaml `c.light_height_parity` 限定在 0.5m 以内。
#
# 历史留档：2026-10-04 之前本文件直接写 `anchorY: <绝对值>`，与 electrical.height
# 双写 8 处不一致（2.8 vs 2.55/2.3/2.5）。重构时逐条换算为相对偏移，
# 派生锚点与重构前完全一致（data/project-render-facts.json 零变化）。
- id: light_dining_pendant
  anchorY_offset: 0
  basis: "餐桌吊灯挂点即安装完成面（2.8m），无灯体下沉，渲染与施工同高"
  reason: "已审计 Blender 基线：餐桌吊灯的最终渲染锚点。"
  applies_to: [web, blender]

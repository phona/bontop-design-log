  anchorY_offset: 0
  basis: "餐桌吊灯挂点即安装完成面（2.8m），无灯体下沉，渲染与施工同高"
  reason: "已审计 Blender 基线：餐桌吊灯的最终渲染锚点。"
  applies_to: [web, blender]

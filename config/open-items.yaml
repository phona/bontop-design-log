# ============================================================================
# config/open-items.yaml —— 无属主对象可挂的未决项（issue #98 第六阶段收尾补建）
#
# 为什么需要这个文件：构件级未决项（电气/给排水/吊顶/HVAC）住各对象自己的
# status/blocker 字段，由 shared/element-blockers.ts 的 checkBlockers 门禁盯着。
# 但**家具对象、采购选型、设计裁定**这三类没有 status/blocker schema——它们的未决项
# 曾经住在量房待填手账里，那份手账已于 S2-B 整份退场。
#
# 本文件只收「真的没有对象可挂」的少数几条（AGENTS.md 决策铁律第 1 条指定的目的地）。
# 收录判据：owner 对象不是 electrical/plumbing/ceiling/hvac 四类构件（那四类有自己的
# blocker 字段，不该来这里）。**不许长成第二本手账**——新增条目必须能回答「为什么不能挂到
# 某个对象上」。
#
# 2026-11-09 建账时收录 14 条：原手账 #76/#77（客卫台盆柜出图基准 / 云鲸勘测）+
# #86–#97（docs/decisions/README.md「待决策事项」12 条，其原始载体与中间载体都已退场，
# 内容一度只剩 git 史——这正是停止条件第 1 条要防的「失去全部现存登记」）。
#
# YAML 铁律 7：值内含 `#`（编号 #76 等）一律加引号——js-yaml 会把未加引号的裸 `#`
# 后内容整段吞成注释，文件仍合法、门禁全绿，但数据少一半。
# ============================================================================

version: 1
# 受门禁管辖的未决项必须带齐四样：subject / owner / trigger / reversal。
# 前三样是结构化字段（机器可查），reversal 允许散文（工程判断字段化不了）。
required_fields: [subject, owner, trigger, reversal]


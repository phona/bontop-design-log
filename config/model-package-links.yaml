schema: project.model-package-links/v1

# 内部关系索引：把现有分期工作包连到模型中的系统/区域，供 AI、预算视图和 3D 预览查询。
# 不复制预算金额、成本项名称、坐标、尺寸或商品证据；分别以 phase control、几何/场景配置、采购入口为准。
# 粒度固定在工作包/阶段条目，不逐个辅材或网格拆分。selector 只声明过滤条件，代码不得按名称猜测。

authorities:
  phase_scope: schedule/phase-scope.yaml
  phase_1_budget: schedule/phase-1/control.yaml
  phase_2_scope: schedule/phase-2/control.yaml
  phase_3_scope: schedule/phase-3/control.yaml
  model_geometry: config/layout/model-geometry.yaml
  # issue #98 第三阶段 S1：overlay = envelope 文件合并——选择器校验走 server/model-package-links.ts
  # 的 loadOverlayDoc()（唯一合并点），指纹按下列文件全部计入。
  # S6（2026-11-07）：overlay / ceiling 两个 source 的 types 选择器全部改为 ids（对象 id 直选，
  # 迁移设计 §5.7）。types 靠 sceneElements 的 type 字段匹配，而 S4 起面层配方下沉为宿主对象
  # 特征、S5 起 skirting 改派生——「按 type 选」既选不到配方，也不再自说明选到了谁；换成
  # 宿主/构件 id 后与家具片 PR-4/PR-11 同一通道（正查高亮、反查归属、cost:by-object 三处同源）。
  # 两条 trade 选择器（curtain_box / drying_rack）**保留**：trade 是计价工艺类别、不是对象
  # 身份，用 id 清单表达会把「以后新增一个窗帘盒」静默漏在范围外；它们已收窄在 ceiling
  # source 上（PKG-145 / P2-090），不跨源。
  # S5：finish-surfaces.yaml（skirting_region 24 段声明）已删，skirting 改由 paint_bands 派生，
  # 锚点进 finish-defaults.yaml——它仍是「overlay 文档」的组成部分（派生在此装配），故列入。
  overlay:
    - config/model/envelope/openings.yaml
    - config/model/envelope/floor-zones.yaml
    - config/model/envelope/finish-defaults.yaml
  furnishings: config/house.yaml
  electrical: config/electrical.yaml
  plumbing: config/plumbing.yaml
  electrical_topology: config/electrical-topology.yaml
  mep_routes: config/mep-hvac-coordination.yaml
  hvac: config/hvac.yaml
  ceiling: config/model/envelope/ceiling.yaml

# source selectors use the declared source's existing IDs/fields. No amount, quantity, product detail or phase decision is authored here.
# mapping_status distinguishes full links from partial/unmodelled scopes; never invent a 3D type solely to satisfy a link.
links:
  - id: MODEL-PKG-000
    phase_id: phase_1_basic_occupancy
    budget_ref: {source: phase_1_budget, id: PKG-000}
    mapping_status: project_scope
    scope: [{source: model_geometry, select: {all: true}}]
  - id: MODEL-PKG-005
    phase_id: phase_1_basic_occupancy
    budget_ref: {source: phase_1_budget, id: PKG-005}
    mapping_status: project_scope
    scope: [{source: model_geometry, select: {all: true}}]
  - id: MODEL-PKG-010
    phase_id: phase_1_basic_occupancy
    budget_ref: {source: phase_1_budget, id: PKG-010}
    mapping_status: project_scope
    scope: [{source: model_geometry, select: {all: true}}]
  - id: MODEL-PKG-020
    phase_id: phase_1_basic_occupancy
    budget_ref: {source: phase_1_budget, id: PKG-020}
    mapping_status: mapped
    scope:
      - {source: model_geometry, select: {collections: [walls, openings]}}
  - id: MODEL-PKG-030
    phase_id: phase_1_basic_occupancy
    budget_ref: {source: phase_1_budget, id: PKG-030}
    mapping_status: partial
    scope:
      - {source: hvac, select: {plan_ids: [A2]}}
      - {source: mep_routes, select: {layers: [refrigerant, condensate, supply_air, return_air]}}
      - {source: electrical, select: {ids: [sock_living_ac, sock_dining_ac, sock_master_ac, sock_parent_ac, sock_child_ac, sock_study_ac, sock_vrf_outdoor_a2, ac_panel_living, ac_panel_dining, ac_panel_master, ac_panel_parent, ac_panel_child, ac_panel_study]}}
  - id: MODEL-PKG-040
    phase_id: phase_1_basic_occupancy
    budget_ref: {source: phase_1_budget, id: PKG-040}
    mapping_status: partial
    scope:
      - {source: electrical, select: {all: true}}
      - {source: plumbing, select: {all: true}}
      - {source: electrical_topology, select: {all: true}}
      - {source: mep_routes, select: {layers: [strong_power, weak_power, water_supply, drainage]}}
  - id: MODEL-PKG-050
    phase_id: phase_1_basic_occupancy
    budget_ref: {source: phase_1_budget, id: PKG-050}
    mapping_status: partial
    scope:
      # 2026-11-10（issue #191）：原 {room_ids: [master_bath, guest_bath, kitchen, balcony]} 改为
      # 房间对象 id 直选（room_ids 粗选择器退场）。四间房逐一登记，解析结果与原选择器一致；
      # 代价：以后新增同类型对象不会自动进 scope，须显式加 id（与 PR-4 的 vanity、S6 的
      # overlay/ceiling ids 同一方向，项目已裁定）。
      - {source: model_geometry, select: {ids: [master_bath, guest_bath, kitchen, balcony]}}
      # 同上：原 plumbing.room_ids 解析成这 29 个给排水点位 id（master_bath 7 +
      # guest_bath 8 + kitchen 10 + balcony 4），逐点登记；新增点位不再自动进 scope。
      - {source: plumbing, select: {ids: [shower_mbath, toilet_mbath, drain_mbath_toilet, drain_mbath_shower, drain_mbath_floor, faucet_gbath_vanity, drain_gbath_vanity, shower_gbath, toilet_gbath, drain_gbath_shower, drain_gbath_floor, faucet_kitchen_sink, faucet_kitchen_purifier, faucet_kitchen_dishwasher, drain_kitchen_sink, faucet_balcony_washer, drain_balcony_floor, drain_kitchen_dishwasher, drain_balcony_washer, drain_riser_master_bath, drain_riser_guest_bath, drain_riser_kitchen, gas_meter_kitchen, duct_kitchen_exhaust, duct_mbath_exhaust, duct_gbath_exhaust, water_entry, drain_riser_balcony, water_heater]}}
      # 面层配方下沉（2026-11-07 issue #98 第三阶段 S4）：wall_region 不再是 overlay 平级元素，
      # 工作包范围改按宿主对象稳定 id 表达（设计文档 §5.7「选择器 → ids」）。下面两组 id =
      # 「厨/卫/阳台四间房里带贴砖带的墙」+「同范围的防水台构件」，逐条对应原 wall_region 的
      # (wall, room) 声明；房间维度由上面的 model_geometry 房间对象 id 承担（原 overlay room_ids
      # 随元素一起退场——overlay 文档里已没有 room 字段可对）。
      # S6：地面 part 由 types:[floor_region] 改按 6 个 floor zone 对象 id 直选（等价——
      # 合并文档里 floor_region 元素恰好这 6 个，ids 与 type 匹配结果逐一相同）。
      - {source: overlay, select: {ids: [entry_garden_floor, entry_foyer_floor, corridor_floor, main_corridor_floor, guest_bath_open_vanity_floor, north_platform_floor]}}
      - {source: model_geometry, select: {ids: [w_balc_east, w_balc_south, w_balc_west, w_ent_west, w_gbath_east, w_gbath_east_open_vanity, w_gbath_west, w_gbath_west_open_vanity, w_kit_west, w_mbath_east, w_mbath_south, w_vrv_east]}}
      - {source: overlay, select: {ids: [kitchen_north_bay, mbath_north_waterproof_ledge, mbath_west_lower_waterproof_ledge]}}
      # 2026-11-10（issue #191 Codex blocking）：check_plumb_external_vanity_waterproof 的正文
      # 要求按 gbath.vanity 的 vanity_layout 验证托盘/排水走廊/整台基站前拉空间——被验柜体是
      # 本包验收的实际依赖，但它的施工归属在洁具包（PKG-100）。验收对象集按引用包 targets
      # 派生，若不把柜体纳入本链接 scope，柜内布局（depth 等）变化不会让本包摘要变化、旧通过
      # 记录也不会 stale。故按稳定 id 直选纳入（与 PKG-110 纳入被验插座同一处理）。
      # 同一条验收的正文还点名了主卧条带 mb.washbasin_cabinet（R4 blocking；全仓扫描确认这是
      # 「正文点名对象不在对象集」的唯一存量漏项）：它与 gbath.vanity 是同一条外移防水验的两
      # 个被验柜体，施工归属同样在 PKG-100，按同一处理一并纳入。
      - {source: furnishings, select: {ids: [gbath.vanity, mb.washbasin_cabinet]}}
  - id: MODEL-PKG-060
    phase_id: phase_1_basic_occupancy
    budget_ref: {source: phase_1_budget, id: PKG-060}
    mapping_status: mapped
    scope:
      - {source: model_geometry, select: {collections: [rooms]}}
      # S4：贴砖范围改按宿主对象 id（12 面带 tile_bands 的墙 + 10 个带 finish.tile 的
      # 防水台/上飘窗构件）——与原 types:[floor_region, wall_region, sill_region] 覆盖同一批
      # 面层，只是从「配方 id」换成「宿主对象 id」。S6：地面 part 也改 ids（6 个 floor zone）。
      - {source: overlay, select: {ids: [entry_garden_floor, entry_foyer_floor, corridor_floor, main_corridor_floor, guest_bath_open_vanity_floor, north_platform_floor]}}
      - {source: model_geometry, select: {ids: [w_balc_east, w_balc_south, w_balc_west, w_ent_west, w_gbath_east, w_gbath_east_open_vanity, w_gbath_west, w_gbath_west_open_vanity, w_kit_west, w_mbath_east, w_mbath_south, w_vrv_east]}}
      - {source: overlay, select: {ids: [bedroom_nw_north_waterproof_ledge, bedroom_se_south_waterproof_ledge, kitchen_north_bay, living_south_waterproof_ledge, master_bedroom_south_waterproof_ledge, master_bedroom_west_mid_waterproof_ledge, master_bedroom_west_upper_waterproof_ledge, mbath_north_waterproof_ledge, mbath_west_lower_waterproof_ledge, study_south_waterproof_ledge]}}
      # 2026-11-11（先定门再贴砖门禁，Codex 二审 blocking）：check_tile_door_gate 的正文
      # 要求按两卫门洞实测值（d_gbath / d_mbath）定门与排版——被验门洞是本项验收的实际
      # 依赖，但它的施工归属在装门包（PKG-090）。若不纳入本链接 scope，门洞尺寸/offset
      # 变化不会让本包摘要变化、旧通过记录也不会 stale。故按稳定 id 直选纳入
      # （与 MODEL-PKG-050 纳入被验柜体、PKG-110 纳入被验插座同一处理）。
      - {source: model_geometry, select: {ids: [d_gbath, d_mbath]}}
  - id: MODEL-PKG-065
    phase_id: phase_1_basic_occupancy
    budget_ref: {source: phase_1_budget, id: PKG-065}
    mapping_status: mapped
    scope:
      # S4：湿区两间房的贴砖范围 = 8 面墙 + 2 个防水台构件（原 types + room_ids 的并集，
      # 房间过滤由 id 清单逐条承担）。S6：地面 part 改 ids（6 个 floor zone）。
      - {source: overlay, select: {ids: [entry_garden_floor, entry_foyer_floor, corridor_floor, main_corridor_floor, guest_bath_open_vanity_floor, north_platform_floor]}}
      - {source: model_geometry, select: {ids: [w_balc_south, w_gbath_east, w_gbath_east_open_vanity, w_gbath_west, w_gbath_west_open_vanity, w_kit_west, w_mbath_east, w_mbath_south]}}
      - {source: overlay, select: {ids: [mbath_north_waterproof_ledge, mbath_west_lower_waterproof_ledge]}}
  - id: MODEL-PKG-070
    phase_id: phase_1_basic_occupancy
    budget_ref: {source: phase_1_budget, id: PKG-070}
    mapping_status: mapped
    scope: [{source: ceiling, select: {all: true}}]
  - id: MODEL-PKG-080
    phase_id: phase_1_basic_occupancy
    budget_ref: {source: phase_1_budget, id: PKG-080}
    mapping_status: mapped
    # S4：paint_region(31) 下沉为墙特征、paint_sill_region(8) 下沉为构件特征，范围改按
    # 宿主对象 id 表达：18 面带 paint_bands 的墙 + 8 个带 finish.paint 的飘窗构件。
    scope:
      - {source: model_geometry, select: {ids: [w_balc_west, w_be_north, w_be_west, w_cent_south, w_east_upper, w_ent_south_w, w_ent_west, w_gbath_east, w_gbath_east_open_vanity, w_gbath_west, w_gbath_west_open_vanity, w_mb_east, w_mbath_east, w_mbath_south, w_nw_south, w_st_east, w_st_north, w_strip_east]}}
      - {source: overlay, select: {ids: [bedroom_nw_north_bay, bedroom_se_south_bay, master_bath_west_bay, master_bath_west_lower_bay, master_bedroom_south_bay, master_bedroom_west_bay, master_bedroom_west_mid_bay, study_south_bay]}}
  - id: MODEL-PKG-090
    phase_id: phase_1_basic_occupancy
    budget_ref: {source: phase_1_budget, id: PKG-090}
    mapping_status: partial
    scope:
      - {source: model_geometry, select: {collections: [openings]}}
      # S6：types:[sliding_door_run] → ids（全册仅此一件推拉门对象，等价；它带开合态与
      # MEP 包络语义，是对象而不是面层配方）。
      - {source: overlay, select: {ids: [kitchen_dining_sliding_door]}}
  - id: MODEL-PKG-100
    phase_id: phase_1_basic_occupancy
    budget_ref: {source: phase_1_budget, id: PKG-100}
    mapping_status: partial
    scope:
      # 2026-11-06（issue #98 PR-4）：vanity 改按稳定 id 选（gbath.vanity，house.yaml 已声明）——
      # types 里已无 vanity（全仓仅此一条 type: vanity 记录，核实无误删），type 选择器随
      # 「删类型不同步本文件」失效模式（见 MODEL-PKG-120 注释）一并退场。
      # 2026-11-10（issue #191）：原 {room_ids: [master_bath, guest_bath, master_bedroom],
      # types: [toilet, shower_set, faucet, mb_washbasin_cabinet, mirror_cabinet_gbath,
      # exhaust_fan]} 按「房间 ∩ 类型」解析成这 6 个已建模家具对象 id。types 里的
      # shower_set / faucet 是 count-only 计价条目（无 runtime 对象），不以 id 表达——
      # 其金额仍由预算 counts 承担，对象 targets 只收有 runtime 身份的条目。
      - {source: furnishings, select: {ids: [mb.washbasin_cabinet, mbath.toilet, mbath.exhaust_fan, gbath.toilet, gbath.exhaust_fan, gbath.mirror_cabinet]}}
      - {source: furnishings, select: {ids: [gbath.vanity]}}
      # 同上：原 plumbing.room_ids 解析成这 17 条点位 id（master_bedroom 2 +
      # master_bath 7 + guest_bath 8）。
      - {source: plumbing, select: {ids: [faucet_mbath_vanity, drain_mbath_vanity, shower_mbath, toilet_mbath, drain_mbath_toilet, drain_mbath_shower, drain_mbath_floor, faucet_gbath_vanity, drain_gbath_vanity, shower_gbath, toilet_gbath, drain_gbath_shower, drain_gbath_floor, drain_riser_master_bath, drain_riser_guest_bath, duct_mbath_exhaust, duct_gbath_exhaust]}}
      # S6：types:[shower_screen] → ids（3 件玻璃隔断对象，等价；按 AGENTS.md 新类型评估
      # 不需碰撞。mesh objectId 是 `id:N` 分段形式，与改 ids 前 type 选择器产出的裸 id 同形，
      # 高亮命中面不改。）
      - {source: overlay, select: {ids: [shower_screen_mbath, shower_screen_gbath, vanity_screen_glass]}}
  - id: MODEL-PKG-110
    phase_id: phase_1_basic_occupancy
    budget_ref: {source: phase_1_budget, id: PKG-110}
    mapping_status: mapped
    # 2026-11-10（issue #191）：原 {room_ids: [kitchen], types: [kitchen_cabinet_run,
    # kitchen_countertop_bridge, cabinet_base, cabinet_wall, countertop_quartz, sink]} 按
    # 「房间 ∩ 类型」解析出 5 个已建模对象 id；cabinet_base / cabinet_wall /
    # countertop_quartz 是 count-only 计价条目（无 runtime 对象），不以 id 表达。
    # 2026-11-10（issue #191 Codex blocking）：微蒸烤预留点位 sock_kitchen_oven 是
    # check_elec_micro_oven_reserved 正文点名的被验对象（插拔可及性），施工归属在水电包；
    # 本包是这条验收记录的挂载包，验收对象集按引用包 targets 派生——若不把该点位纳入本链接
    # scope，插座改动不会让本包的对象摘要变化、旧通过记录也不会 stale。故按 id 直选纳入。
    scope:
      - {source: furnishings, select: {ids: [kitchen.cabinet_run_north_west, kitchen.countertop_bridge, kitchen.cabinet_run_north_east, kitchen.cabinet_run_east, kitchen.sink]}}
      # 2026-11-10（issue #191 Codex blocking 第 9 轮）：SCH-110-01「核对柜体、台面、烟机、
      # 灶具、水槽及预留电器的尺寸和水电接口」与 SCH-110-02「设备安装空间」实际验收的三件
      # 家电。它们施工归属在 PKG-160，本包是这两条 SCH 的挂载包；不纳入则移动 gas_stove
      # 不会让本包摘要变化、旧的接口冻结与安装空间通过记录继续有效。
      # 与 sock_kitchen_oven 同一处理（被验对象按 id 直选纳入挂载包 scope）。
      - {source: furnishings, select: {ids: [kitchen.gas_stove, kitchen.range_hood, kitchen.dishwasher]}}
      - {source: electrical, select: {ids: [sock_kitchen_oven]}}
  - id: MODEL-PKG-120
    phase_id: phase_1_basic_occupancy
    budget_ref: {source: phase_1_budget, id: PKG-120}
    mapping_status: mapped
    # 灯具词汇表以 config/electrical.yaml 的 type 为准（pendant吊灯/dome吸顶/
    # downlight筒灯/night_light夜灯）。
    # 2026-10-12 DEC-2026-10-12-R1 删主卧两盏明装床头壁灯后，config 内已无 wall_lamp
    # 类型点位，故从本 selector 移除（留着会让 assertSelector 拒掉、/api/project 500，
    # 与历史上写 ceiling_light 同一失效模式）。
    # 2026-10-13 DEC-2026-10-13-R1 删客厅明装轨道灯（living_track_main → light_living_dome，
    # type track_light → dome）后，config 内同样已无 track_light 类型点位，一并移除。
    # 2026-10-13 DEC-2026-10-13-R5 删电视墙灯带 light_tv_strip（config 内最后一个
    # led_strip 类型点位）后，led_strip 亦无在役点位，一并移除。
    # **这是同一失效模式的第三次复发**（wall_lamp → track_light → led_strip）：
    # 删点位类型不同步本文件 → assertSelector 抛错 → /api/project 500。
    # 三次都只靠 test:server 报 500 才发现，说明「删类型后 grep 本文件」这个人工步骤不可靠，
    # 已在 tests/server/model-package-links.test.ts 加断言锁死。
    # 2026-10-16 DEC-2026-10-16-R12：餐厅灯 light_dining_pendant 由 pendant 改
    # ceiling_light（半吸顶）后，config 内已无 pendant 类型点位——selector 同步换成
    # ceiling_light。这是同一失效模式第四次复发（wall_lamp → track_light → led_strip
    # → pendant）：删/改点位类型必须同步本文件，否则 assertSelector 抛错、/api/project 500。
    # 现在 ceiling_light 是在役类型（餐厅半吸顶）；dome 为客厅主灯与其余吸顶灯。
    # 2026-11-10（issue #191）：原灯具词汇表 types:[ceiling_light, dome, downlight,
    # night_light] 解析成这 17 个在役灯具点位 id（ceiling_light 1 + dome 6 +
    # downlight 4 + night_light 6）。以后新增灯具不再自动进 scope，须显式加 id。
    scope: [{source: electrical, select: {ids: [light_balcony_dome, light_dining_pendant, light_living_dome, light_master_dome, light_parent_dome, light_child_dome, light_study_dome, light_corridor_1, light_entry_down, light_entry_foyer, light_kitchen_panel, night_guest_bed_side, night_guest_head, night_guest_door, night_living_north, night_living_mid, night_corridor]}}]
  - id: MODEL-PKG-125
    phase_id: phase_1_basic_occupancy
    budget_ref: {source: phase_1_budget, id: PKG-125}
    mapping_status: mapped
    scope:
      # USB 不是独立 type：USB 插座是 socket 的模块特性
      # （appearance.module: five_hole_replaceable_usb_c），已由下面的 socket 覆盖。
      # 2026-11-10（issue #191）：原 types:[socket, switch, switch_2way, network,

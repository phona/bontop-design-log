# 防穿模（penetration）规则登记表。
#
# 本文件只声明**规则、严重级与豁免**；几何坐标一律来自 model-geometry/overlay/house，
# 容差一律来自 config/spatial-validation.yaml 的 tolerance_profiles——这里不复制任何
# 坐标或容差，禁止出现第二套数字。
#
# severity 语义：**该规则全部 code 的级别下限**。规则按几何量自判的级别若更严则保持
# （配置盖不住 error），若更松则被抬到下限——即配置只许加严，不许放宽。
# 因此同时产出 error 与 warning 两种 code 的规则，下限必须写 warning：
# 写成 error 会把「净距不足」这类本应只显形的问题抬成阻断级。
version: 1

# ── 规则登记表 ────────────────────────────────────────────────────────────
# id          稳定规则 id，进 Git diff 可评审
# codes       该规则产出的 issue code（豁免按 code 匹配）
# kinds       参与的物体对（人读用，不参与判定）
# severity    下限级别：error 阻断 verify:all，warning 只显形
# enabled     false 时该规则的结论降为 info 并在 message 标注，不静默消失
rules:
  - id: pen.furniture.wall
    codes: [furniture_wall_collision]
    kinds: furniture↔wall
    severity: error
    enabled: true
    note: "家具进入墙体实体（有限墙厚 slab 穿越，未过中心线也 fail-closed）"

  - id: pen.furniture.wall_clearance
    codes: [furniture_clearance_insufficient, furniture_endpoint_clearance_insufficient, furniture_host_unknown, furniture_host_runtime_missing]
    kinds: furniture↔host wall
    severity: error
    enabled: true
    note: "定制家具对宿主墙完成面的退让净距与端部收口；site_trim 现场裁切语义随 evidence 带出"

  - id: pen.furniture.glass
    codes: [furniture_glass_collision, furniture_glass_clearance_insufficient]
    kinds: furniture↔glass/curtain/railing
    # 下限必须是 warning：穿越是 error，净距不足按 curtain_wall profile 只显形。
    # 写成 error 会把当前 8 处已知净距不足抬成阻断级，属于放宽/加严口径错误。
    severity: warning
    enabled: true
    note: "家具穿越或贴近玻璃/窗帘/栏杆路径；净距不足按 curtain_wall profile（50mm）报 warning"

  - id: pen.furniture.ceiling
    codes: [furniture_ceiling_collision]
    kinds: furniture↔ceiling
    severity: error
    enabled: true
    note: "家具进入吊顶实体/降板"

  - id: pen.furniture.furniture
    codes: [furniture_furniture_collision, furniture_furniture_contact_tolerance]
    kinds: furniture↔furniture
    # 下限同样是 warning：规则内部对 ≤ collision_margin 的接触降级为 warning。
    severity: warning
    enabled: true
    note: "家具互撞；≤ collision_margin 的接触由规则内部降级为 warning，合法叠放/咬合/内含须在下方 waivers 绑定稳定 runtime id 并带 reason/owner/expires"

  - id: pen.glass.glass
    codes: [glass_runtime_collision]
    kinds: glass↔glass
    severity: error
    enabled: true
    note: "玻璃/栏杆 runtime mesh 无共同端点闭包即互撞；栏杆 handrail/bar 为内部构造件，不作为独立 pane"

  - id: pen.furniture.opening_blocked
    codes: [pen.furniture.opening_blocked]
    kinds: furniture↔door opening
    severity: error
    enabled: true
    note: "家具 footprint 压住门洞清宽（door/cased_opening/sliding_door；窗洞不挡通行，不在本规则内）"

# ── 兄弟 mesh 不变式 ──────────────────────────────────────────────────────
# 2026-10-09 实测：60 个 placed 家具 → 60 条采集记录，**零重复**。即当前
# FixtureFactory 每个 placed 家具只产出一条 runtime 记录，不存在复合家具子 mesh
# 互撞的假阳来源。因此不加「同实体豁免」这种推测性规则；改为用不变式测试兜底：
# 一旦将来某个 fixture 开始产出多条记录，测试先红，再决定是豁免还是修几何。
sibling_policy:
  one_entry_per_entity: true
  note: "同一 runtime 实体只应产生一条采集记录；违反时 tests/server/penetration.test.ts 的 sibling 不变式先红"

# ── 机电协调构件的参与策略 ────────────────────────────────────────────────
# config/spatial-validation.yaml 的 mep_coordination_types 目前被整体排除在
# 「家具互撞」之外（注释原意：管线/检视构件必须有尺寸，但不作为家具互撞对象，
# 穿墙由 MEP 专项校验负责）。
#
# 2026-10-09 实测：4 个 placed 机电件中，mb_vanity_pvc_service_chase 的包络是
# 0.94×2.59×2.15m 的**预留区**（按设计穿越 4 段墙、与 6 件家具重叠），不是实体管。
# 把它当实体判穿透会得到 10 处「穿模」，但那不是缺陷而是建模口径未裁定。
#
# 因此这里要求**逐类型显式申报**，未申报 → fail-closed（pen.mep_participation_undeclared）：
#   excluded  不作为实体参与互撞（当前口径）
#   solid     按实体参与墙穿透检查（需要业主/厂家确认该构件是实体后再改）
# 预留区与实体管的口径裁定、以及那 10 处重叠的定性，跟踪 docs/pending-site-data.md，
# 未裁定前不得为了绿灯改坐标或改口径。
mep_parts:
  participation:
    - types: [mb_vanity_pvc_box, mb_vanity_pvc_service_chase, mb_vanity_pvc_wardrobe_entry, condensate_pipe_ac_outlet]
      policy: excluded
      note: "预埋管/检视构件按预留区口径，穿墙由 verify:mep 专项负责；其中 mb_vanity_pvc_service_chase 的 4 处墙穿越 + 6 处家具重叠待口径裁定（见 docs/pending-site-data.md）"

# ── 豁免（waiver）────────────────────────────────────────────────────────
# 每条豁免必须带 reason / owner / expires。到期自动复活为 error 并带上豁免编号，
# 不存在「永久静默」。豁免按 rule + 实体对匹配（顺序无关），必须绑定稳定 runtime id，
# 禁止按家具类型全局放行。
#
# 2026-10-09：原 config/spatial-validation.yaml 的 13 条 relationships 白名单整体迁入
# 下方 waivers。它们原先同时承担「结构真相（声明一次不变）」与「工艺妥协（随采购变更
# 失效）」两种生命周期，且没有 reason/owner/expires，失效了也不会显形。迁入后统一走
# 保质期机制：kind 保留原 type 的语义（stacked 叠放 / attached 咬合依附 / contained
# 内含），判定仍只按 rule + 稳定 runtime id 对，与迁移前逐条一致。
#
# ⚠️ owner=业主 / expires=2027-06-30 是**待业主确认的占位值**：owner 取项目决策人，
# expires 与「量房/厂家确认后回写」节奏对齐。SKU 冻结或量房回来后必须逐条回写真实
# 责任人与复核日；在那之前，这些豁免的时效性未经业主签字确认。
waivers:
  # ── 阳台洗烘叠放 ──
  - id: laundry_stack
    rule: pen.furniture.furniture
    pair: [furniture:balcony:washer:0, furniture:balcony:dryer:1]
    kind: stacked
    reason: "10kg 滚筒洗衣机与 9kg 热泵烘干机按厂家叠放支架垂直堆叠（支架承重 ≥120kg，见 config/budget-pitfalls.yaml「叠放未确认承重」）；两者共用阳台西墙给水 faucet_balcony_washer / 墙排 drain_balcony_washer 与两条专用回路插座（DEC-2026-10-03-R1 按 GB 55038 7.4.4 拆分），且生活阳台面积极小、东墙又有门洞，无并排条件。SKU 冻结后须复核叠放支架承重、开门侧与检修带（docs/pending-site-data.md #33）"
    owner: 业主
    expires: 2027-06-30

  # ── 厨房地柜 / 台面 / 嵌入式设备 ──
  - id: countertop_run
    rule: pen.furniture.furniture
    pair: [furniture:kitchen:kitchen_cabinet_run:0, furniture:kitchen:kitchen_countertop_bridge:1]
    kind: stacked
    reason: "北墙地柜第一段与跨洗碗机位的桥台面同属一组台下柜：台面由柜体上口承托，两者在端部共面收口，是「柜体 + 台面」的一体构造，不是两件独立家具各占一地"
    owner: 业主
    expires: 2027-06-30

  - id: countertop_run_corner
    rule: pen.furniture.furniture
    pair: [furniture:kitchen:kitchen_countertop_bridge:1, furniture:kitchen:kitchen_cabinet_run:2]
    kind: stacked
    reason: "桥台面东端与水槽柜段端部共面收口：同一台面高度连续跨过洗碗机位后接上水槽柜，属同一组地柜的台面连续性接触，不是两台柜体互撞"
    owner: 业主
    expires: 2027-06-30

  - id: kitchen_cabinet_corner_join
    rule: pen.furniture.furniture
    pair: [furniture:kitchen:kitchen_cabinet_run:2, furniture:kitchen:kitchen_cabinet_run:4]
    kind: attached
    reason: "L 形厨房地柜：北墙水槽柜段与东墙灶台柜段在转角相交并共用转角柜体，是同一组地柜的两个分支，不是两个独立柜体压在同一块地上"
    owner: 业主
    expires: 2027-06-30

  - id: kitchen_dishwasher_under_counter
    rule: pen.furniture.furniture
    pair: [furniture:kitchen:kitchen_cabinet_run:0, furniture:kitchen:dishwasher:3]
    kind: attached
    reason: "嵌入式洗碗机整机收在北墙地柜台下（DEC-2026-08-02-013），门板与柜体齐平，属嵌入式安装而非独立占地；机位坐标仍待量房（config/house.yaml 原注），SKU 冻结后复核开门侧与检修带"
    owner: 业主
    expires: 2027-06-30

  - id: kitchen_dishwasher_under_counter_corner
    rule: pen.furniture.furniture
    pair: [furniture:kitchen:kitchen_cabinet_run:2, furniture:kitchen:dishwasher:3]
    kind: attached
    reason: "同一台洗碗机同时贴邻水槽柜段端部（DEC-2026-08-02-013「水槽柜西侧紧邻」），两侧柜体门板收口共面；与 kitchen_dishwasher_under_counter 是同一处嵌入关系在两个柜体段上的投影，不是两次独立占地"
    owner: 业主
    expires: 2027-06-30

  - id: kitchen_sink_cutout
    rule: pen.furniture.furniture
    pair: [furniture:kitchen:kitchen_cabinet_run:2, furniture:kitchen:sink:8]
    kind: attached
    reason: "水槽嵌入台面开孔：config/house.yaml 在该柜体段显式声明 cutouts {kind: sink, id: kitchen-sink}，开孔位置由既有水槽点位与柜体中心换算为 run-local offset，水槽是台面构件而非独立占地体"
    owner: 业主
    expires: 2027-06-30

  - id: kitchen_cooktop_cutout
    rule: pen.furniture.furniture
    pair: [furniture:kitchen:kitchen_cabinet_run:4, furniture:kitchen:gas_stove:6]
    kind: attached
    reason: "灶具嵌入台面开孔：config/house.yaml 在该柜体段显式声明 cutouts {kind: cooktop, id: kitchen-cooktop}，开孔由既有灶具点位经世界偏移再按柜体旋转换算为 run-local offset，属台面开孔安装"
    owner: 业主
    expires: 2027-06-30

  - id: kitchen_fridge_corner
    rule: pen.furniture.furniture
    pair: [furniture:kitchen:kitchen_cabinet_run:4, furniture:kitchen:fridge:5]
    kind: attached
    reason: "冰箱占东墙南端高柜位（DEC-021 厨房缩至南侧边界后定位），与东墙灶台柜段端部在转角收口并靠；冰箱实际位置与 SKU 仍 pending（docs/pending-site-data.md #22/#33），定位变更时本豁免随之失效并须重审"
    owner: 业主
    expires: 2027-06-30

  # ── 主卫浴室柜组 / 主卧梳妆位 / 通顶衣柜收口 ──
  - id: vanity_layers
    rule: pen.furniture.furniture
    pair: [furniture:master_bedroom:mb_vanity_base_cabinet:9, furniture:master_bedroom:mb_vanity_lower_board:10]
    kind: attached
    reason: "主卫浴室柜组的分层构造：下悬浮板与底柜同轴（同一 along / 宽 / 深，主体退让东墙完成面 15mm，端部由独立收口处理，见 config/house.yaml 原注），是同一组家具的上下构件，不是两台独立柜体"
    owner: 业主
    expires: 2027-06-30

  - id: vanity_layers_upper
    rule: pen.furniture.furniture
    pair: [furniture:master_bedroom:mb_vanity_lower_board:10, furniture:master_bedroom:mb_vanity_main_board:11]
    kind: attached
    reason: "主卫浴室柜组：上悬浮板与下悬浮板同轴叠置（同一 along / 宽 / 深，主体退让东墙完成面 15mm），三层柜体构件属同一组家具，板件之间的共面不是互撞"
    owner: 业主
    expires: 2027-06-30

  - id: dressing_stool_storage
    rule: pen.furniture.furniture
    pair: [furniture:master_bedroom:dressing_stool:7, furniture:master_bedroom:master_dressing_table:6]
    kind: contained
    reason: "梳妆凳收纳态完整收入梳妆桌 footprint 之内（config/house.yaml 原注「收纳态完整收入桌下，使用时向东拉出」），是「内含」关系而非互撞；拉出使用态属活动包络，本轮静态判定不覆盖"
    owner: 业主
    expires: 2027-06-30

  - id: wardrobe_top_pelmet
    rule: pen.furniture.furniture
    pair: [furniture:master_bedroom:master_north_wall_wardrobe_950:1, furniture:master_bedroom:master_wardrobe_top_pelmet:2]
    kind: attached
    reason: "通顶衣柜顶部薄收口件：config/house.yaml 原注「通顶柜顶部薄收口，主体固定门头已由衣柜对象表达；不承担 HVAC 责任」，与衣柜主体是同一通顶柜的上下构件，不是两件独立家具"
    owner: 业主
    expires: 2027-06-30

# 空间校验的通用参数与拓扑关系。几何坐标仍只来自 model-geometry/overlay/house。
# 本文件只声明规则、容差和合法关系，不复制房间或家具坐标。
version: 1

tolerance_profiles:
  default:
    survey_uncertainty: 0.010
    fabrication_tolerance: 0.003
    installation_tolerance: 0.005
    minimum_clearance: 0.002
    collision_margin: 0.005
  built_in_casework:
    survey_uncertainty: 0.010
    fabrication_tolerance: 0.003
    installation_tolerance: 0.005
    minimum_clearance: 0.002
    collision_margin: 0.005
    require_finish_face: true
    site_trim: true
  freestanding:
    survey_uncertainty: 0.005
    fabrication_tolerance: 0.003
    installation_tolerance: 0.005
    minimum_clearance: 0.010
    collision_margin: 0.005
  wall_lamp:
    survey_uncertainty: 0.005
    fabrication_tolerance: 0.002
    installation_tolerance: 0.005
    minimum_clearance: 0.002
    contact_tolerance: 0.005
    orientation_tolerance_deg: 5
  ceiling_fixture:
    survey_uncertainty: 0.005
    fabrication_tolerance: 0.002
    installation_tolerance: 0.005
    minimum_clearance: 0.002
    contact_tolerance: 0.005
  curtain_wall:
    survey_uncertainty: 0.010
    fabrication_tolerance: 0.003
    installation_tolerance: 0.005
    minimum_clearance: 0.050
    collision_margin: 0.010
    mounting_allowed: false
  ceiling_solid:
    survey_uncertainty: 0.010
    fabrication_tolerance: 0.003
    installation_tolerance: 0.005
    minimum_clearance: 0.020
    collision_margin: 0.005

# 只写类型角色；未列出的 placed 类型由校验器 fail-closed。
furniture_profiles:
  built_in_casework:
    role: rigid_casework
  freestanding:
    role: freestanding
  site_trim:
    role: site_trim
  mep_coordination:
    role: mep_coordination

furniture_profile_overrides:
  - types: [mb_vanity_base_cabinet, mb_vanity_lower_board, mb_vanity_main_board]
    profile: built_in_casework
    wall: w_mbath_east
    wall_side: west
    required_wall_clearance: 0.015
    site_trim: true
    note: "柜体主体退让东墙完成面 15mm；端部收口现场裁切"
  - types: [master_north_wall_wardrobe_950, master_wardrobe_top_pelmet, wardrobe_180, study_seasonal_wardrobe_wall]
    profile: built_in_casework
  - types: [mb_vanity_pvc_box, mb_vanity_pvc_wardrobe_entry, mb_vanity_pvc_service_chase, condensate_pipe_ac_outlet]
    profile: mep_coordination

# 管线/检视构件必须有尺寸，但不作为“家具互撞”对象；其穿墙由 MEP 专项校验负责。
mep_coordination_types: [mb_vanity_pvc_box, mb_vanity_pvc_wardrobe_entry, mb_vanity_pvc_service_chase, condensate_pipe_ac_outlet]

# 原始墙段端点落在另一墙段中部时，必须在此声明 T/L 接头；交叉线没有此声明会失败。
junctions:
  - { id: mbath_south_to_east, type: t, walls: [w_mbath_south, w_mbath_east], x: 2.60, z: 2.86 }
  - { id: nw_north_to_balc_west, type: t, walls: [w_nw_north, w_balc_west], x: 5.60, z: 1.10 }
  - { id: be_south_to_west, type: t, walls: [w_be_south, w_be_west], x: 13.40, z: 8.70 }
  - { id: foyer_outer_to_be_north, type: t, walls: [w_foyer_outer_east, w_be_north], x: 15.25, z: 5.55 }
  - { id: strip_east_to_nw_south, type: t, walls: [w_strip_east, w_nw_south], x: 4.20, z: 4.30 }
  - { id: vrv_gap_to_balc_west, type: t, walls: [w_vrv_nw_gap, w_balc_west], x: 5.60, z: 1.00 }

# 设备平台缺口与阳台西墙在量房线稿中保留 100mm 端部重合，作为一个
# 声明式 T 接头处理；超过此值仍按墙线重复/穿插报错。
allowed_collinear_overlaps:
  - { walls: [w_vrv_nw_gap, w_balc_west], max_overlap: 0.10, reason: "VRV 平台缺口与阳台西墙端部收口" }

# 玻璃/栏杆路径与仍保留的相邻墙只允许在已知量房线稿接头处接触。
# 这些声明不允许同一路径穿过任意实体墙；它们只消除三处结构性端部
# 连接（VRV 栏杆收口、北凹口幕墙收口、东南凹口南幕墙 T 接）。
allowed_overlay_wall_junctions:
  - { element: vrv_nw_railing, wall: w_balc_west, type: overlap, x: 5.60, z: 1.05, max_overlap: 0.10, reason: "VRV 平台缺口与阳台西墙端部收口" }
  - { element: north_recess_curtain, wall: w_balc_west, type: endpoint, x: 5.60, z: 1.10, reason: "北凹口幕墙与阳台西墙端部接头" }
  - { element: south_east_curtain, wall: w_be_west, type: t, x: 13.40, z: 8.70, reason: "东南书房凹口南幕墙与旧东侧墙线 T 接" }

# 显式允许的空间关系。相同平面 footprint 的叠放件必须在这里声明。
relationships:
  - id: laundry_stack
    type: stacked
    objects: [furniture:balcony:washer:0, furniture:balcony:dryer:1]
  - id: countertop_run
    type: stacked
    objects: [furniture:kitchen:kitchen_cabinet_run:0, furniture:kitchen:kitchen_countertop_bridge:1]
  - id: countertop_run_corner
    type: stacked
    objects: [furniture:kitchen:kitchen_countertop_bridge:1, furniture:kitchen:kitchen_cabinet_run:2]
  - id: vanity_layers
    type: attached
    objects: [furniture:master_bedroom:mb_vanity_base_cabinet:9, furniture:master_bedroom:mb_vanity_lower_board:10]
  - id: vanity_layers_upper
    type: attached
    objects: [furniture:master_bedroom:mb_vanity_lower_board:10, furniture:master_bedroom:mb_vanity_main_board:11]
  - id: dressing_stool_storage
    type: contained
    inner: furniture:master_bedroom:dressing_stool:7
    outer: furniture:master_bedroom:master_dressing_table:6
  # 厨房真实运行包络的声明式接口：L 形柜体在转角相交，桥台面跨
  # 洗碗机位，水槽/灶具嵌入台面，冰箱与东墙柜体在转角收口。它们是
  # 已冻结的 attached/cutout 关系，不是对任意家具重叠的宽泛豁免。
  - id: kitchen_cabinet_corner_join
    type: attached
    objects: [furniture:kitchen:kitchen_cabinet_run:2, furniture:kitchen:kitchen_cabinet_run:4]
  - id: kitchen_dishwasher_under_counter
    type: attached
    objects: [furniture:kitchen:kitchen_cabinet_run:0, furniture:kitchen:dishwasher:3]
  - id: kitchen_dishwasher_under_counter_corner
    type: attached
    objects: [furniture:kitchen:kitchen_cabinet_run:2, furniture:kitchen:dishwasher:3]
  - id: kitchen_sink_cutout
    type: attached
    objects: [furniture:kitchen:kitchen_cabinet_run:2, furniture:kitchen:sink:8]
  - id: kitchen_cooktop_cutout
    type: attached
    objects: [furniture:kitchen:kitchen_cabinet_run:4, furniture:kitchen:gas_stove:6]
  - id: kitchen_fridge_corner
    type: attached
    objects: [furniture:kitchen:kitchen_cabinet_run:4, furniture:kitchen:fridge:5]
  - id: wardrobe_top_pelmet
    type: attached
    objects: [furniture:master_bedroom:master_north_wall_wardrobe_950:1, furniture:master_bedroom:master_wardrobe_top_pelmet:2]

# 被 suppress 的实体墙必须由恰好一个围护替代物接管。
# curtain_run/railing_run 的 wall refs 来自 overlay，禁止在这里复制路径坐标。
# part 绑定到具体 overlay part（无 parts 的 element 使用 root）；join 只会
# 生成具体 path-pair closure，runtime 几何不满足时仍报 collision。
overlay_replacements:
  - { wall: w_west_top, replacement: west_curtain, kind: curtain_run, part: w_west_top, join: continuous }
  - { wall: w_west_ap, replacement: west_curtain, kind: curtain_run, part: w_west_ap, join: continuous }
  - { wall: w_west_lower, replacement: west_curtain, kind: curtain_run, part: w_west_lower, join: continuous }
  - { wall: w_west_mid, replacement: west_curtain, kind: curtain_run, part: w_west_mid, join: continuous }
  - { wall: w_west_upper, replacement: west_curtain, kind: curtain_run, part: w_west_upper, join: continuous }
  - { wall: w_mb_south, replacement: west_curtain, kind: curtain_run, part: w_mb_south, join: continuous }
  - { wall: w_st_south, replacement: west_curtain, kind: curtain_run, part: w_st_south, join: continuous }
  - { wall: w_liv_south, replacement: living_south_curtain, kind: curtain_run, part: root, join: butt }
  - { wall: w_be_south, replacement: south_east_curtain, kind: curtain_run, part: root, join: butt }
  - { wall: w_kit_north, replacement: kitchen_north_curtain, kind: curtain_run, part: root, join: butt }
  - { wall: w_bath_north, replacement: north_recess_curtain, kind: curtain_run, part: root, join: continuous }
  - { wall: w_nw_north, replacement: north_recess_curtain, kind: curtain_run, part: root, join: continuous }
  - { wall: w_vrv_nw_gap, replacement: vrv_nw_railing, kind: railing_run, part: root, join: continuous }
  - { wall: w_vrv_north, replacement: vrv_nw_railing, kind: railing_run, part: root, join: continuous }
  - { wall: w_ent_north_railing, replacement: entry_garden_north_railing, kind: railing_run, part: root, join: butt }

# electrical.yaml 的 wall_lamp 点位已显式声明 wall/wall_side；这里保留同值
# host override 作为校验侧兼容镜像，检查实体墙、房间侧向和开口，禁止落到玻璃幕墙。
# 实际灯具 mesh 法向/旋转本轮未覆盖；validateWallLampMount 的 normalDot
# 仅用于纯函数反例，不代表 CLI 已验证 runtime 朝向（仍 site_pending）。
lighting_host_overrides:
  - { id: light_master_wall_l, wall: w_mb_east, wall_side: west }
  - { id: light_master_wall_r, wall: w_mb_east, wall_side: west }

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>和萃 701 - 3D 装修设计</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app">
    <canvas id="gl"></canvas>

    <div id="scheme-panel" class="panel">
      <div class="panel-heading">
        <h3>方案</h3>
        <button id="scheme-panel-toggle" class="panel-collapse-toggle" type="button" aria-controls="scheme-panel-content" aria-expanded="false" aria-label="方案面板折叠" title="展开">+</button>
      </div>
      <div id="scheme-panel-content">
        <div id="topic-tabs"></div>
        <div id="topic-options"></div>
        <h3 id="scheme-name">请选择一个方案</h3>
        <p id="scheme-desc"></p>
        <ul id="scheme-pros"></ul>
        <ul id="scheme-cons"></ul>
        <div id="warnings"></div>
        <button id="export-glb-btn" title="导出 glb（云渲染用）">导出 glb</button>
      </div>
    </div>

    <div id="right-panel-stack">
      <div id="info-panel" class="panel">
        <div class="panel-heading" id="info-panel-heading">
          <span id="info-panel-title"></span>
          <button id="info-panel-toggle" class="panel-collapse-toggle" type="button" aria-controls="info-panel-content" aria-expanded="false" aria-label="对象信息面板折叠" title="展开">+</button>
        </div>
        <div id="info-panel-content">
          <div id="info-panel-header">
            <span id="info-panel-object-id"></span>
            <span id="info-panel-type"></span>
            <span id="info-panel-room"></span>
          </div>
          <div id="info-panel-topics"></div>
        </div>
      </div>
      <div id="mep-coordination-controls" class="mep-controls" hidden>
        <label><input id="mep-bends-toggle" type="checkbox" checked> 转折点/标高</label>
        <div id="mep-layer-toggles" class="mep-layer-toggles"></div>
      </div>
    </div>

    <div id="overview-menu" class="panel">
      <h3>总览</h3>
      <div id="overview-section-layout">
        <h4>布局切换</h4>
        <select id="layout-select"></select>
      </div>
      <div id="overview-section-scheme">
        <h4>当前方案</h4>
        <div id="overview-scheme"></div>
      </div>
      <div id="overview-section-curtains">
        <h4>全屋窗帘</h4>
        <div id="overview-curtains"></div>
      </div>
      <div id="overview-section-decisions">
        <h4>决策记录</h4>
        <div id="overview-decisions"></div>
      </div>
      <div id="overview-section-budget">
        <h4>预算</h4>
        <div id="overview-budget"></div>
      </div>
      <div id="overview-section-risks">
        <h4>风险提示</h4>
        <div id="overview-risks"></div>
      </div>
      <div id="overview-section-archives">
        <h4>归档方案</h4>
        <div id="archive-controls">
          <input id="archive-name-input" type="text" placeholder="方案名称" />
          <button id="archive-current-btn">归档当前方案</button>
        </div>
        <div id="overview-archives"></div>
      </div>
    </div>

    <div id="crosshair">+</div>
    <div id="hover-tooltip"></div>

    <div class="compass-label" id="compass-n" data-key="n">北</div>
    <div class="compass-label" id="compass-e" data-key="e">东</div>
    <div class="compass-label" id="compass-s" data-key="s">南</div>
    <div class="compass-label" id="compass-w" data-key="w">西</div>

    <div id="mode-indicator">轨道模式 · 按 V 切换第一人称 · 按 T 俯视</div>
    <button id="topdown-btn" title="切换俯视/3D (T)">俯视</button>
    <button id="hvac-coordination-btn" title="HVAC 设备与约束（不显示实体路线）" disabled>HVAC 设备/约束：加载中</button>
    <button id="mep-coordination-btn" title="MEP 实体水电 + HVAC 路线" disabled>MEP 实体路线：加载中</button>
    <button id="sunlight-btn" title="日照模拟">日照</button>
    <button id="humidity-btn" title="湿度风险">湿度</button>
    <div id="pointer-lock-toast" style="display:none">请允许鼠标锁定以使用第一人称</div>
    <div id="offline-indicator">后端连接断开</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
